<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HR Recruitment & Headcount Tracking Dashboard</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              200: '#bae0fd',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
              950: '#03192a',
            }
          },
          fontFamily: {
            sans: ['Inter', 'Sarabun', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sarabun:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      font-family: 'Inter', 'Sarabun', sans-serif;
      transition: background-color 0.25s ease, color 0.25s ease;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(156, 163, 175, 0.35);
      border-radius: 9999px;
    }
    .glass-effect {
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.98); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 h-full flex flex-col antialiased selection:bg-brand-500 selection:text-white">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    const GOOGLE_SHEET_DIRECTORY_CSV_URL = "https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/gviz/tq?tqx=out:csv&gid=1435033662";
    const GOOGLE_SHEET_CANDIDATES_CSV_URL = "https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/gviz/tq?tqx=out:csv&gid=546067727";
    const CANDIDATES_SHEET_EDIT_URL = "https://docs.google.com/spreadsheets/d/1RwhCPu0sdV2lpzea2-2BbDoc86nfplooShYIzTkMgrw/edit?gid=546067727#gid=546067727";
    const DEFAULT_APPS_SCRIPT_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwfVec2cbvcPNC2KbckL17lNy6x1KOnfQSUd1LpLK2TJMb9Udq18F_YdPcpNxoCQ4RP2w/exec";

    // Candidate status tags configuration - Prioritized Pending & Compare first right after ALL
    const CANDIDATE_STATUS_CONFIG = [
      { id: "Pending", label: "Pending", bg: "bg-[#F3E8FF] dark:bg-purple-950/80", text: "text-[#6B21A8] dark:text-purple-200", border: "border-[#E9D5FF] dark:border-purple-800", isInactive: false, hideMapping: false },
      { id: "Compare", label: "Compare", bg: "bg-[#E0F2FE] dark:bg-sky-950/80", text: "text-[#0369A1] dark:text-sky-200", border: "border-[#BAE6FD] dark:border-sky-800", isInactive: false, hideMapping: false },
      { id: "Hiring / Offer", label: "Hiring / Offer", bg: "bg-[#DCFCE7] dark:bg-emerald-950/80", text: "text-[#166534] dark:text-emerald-200", border: "border-[#BBF7D0] dark:border-emerald-800", isInactive: false, hideMapping: true },
      { id: "not suitable", label: "not suitable", bg: "bg-rose-100 dark:bg-rose-950/80", text: "text-rose-800 dark:text-rose-200", border: "border-rose-300 dark:border-rose-800", isInactive: true, hideMapping: true },
      { id: "cancel by candidate", label: "cancel by candidate", bg: "bg-rose-100 dark:bg-rose-950/80", text: "text-rose-800 dark:text-rose-200", border: "border-rose-300 dark:border-rose-800", isInactive: true, hideMapping: true }
    ];

    const REQUISITION_STATUSES = [
      { id: "PENDING_ADMIN", label: "⏳ รอแอดมินตรวจสอบ (PENDING_ADMIN)", badge: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-300 border-amber-300 dark:border-amber-700 font-bold" },
      { id: "PENDING_APPROVER", label: "📧 รอผู้อนุมัติยืนยัน (PENDING_APPROVER)", badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300 border-sky-300 dark:border-sky-700 font-bold" },
      { id: "PENDING_IT", label: "💻 รอ IT ยืนยันอุปกรณ์ (PENDING_IT)", badge: "bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 border-purple-300 dark:border-purple-700 font-bold" },
      { id: "READY_FOR_RECRUITMENT", label: "✅ พร้อมเริ่มสรรหา (READY_FOR_RECRUITMENT)", badge: "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300 border-emerald-400 font-extrabold ring-2 ring-emerald-500/20" },
      { id: "Recruiting", label: "Recruiting (อยู่ระหว่างดำเนินการสรรหา)", badge: "bg-blue-100 text-blue-800 dark:bg-blue-950 dark:text-blue-200 border-blue-300 dark:border-blue-800" },
      { id: "Closed", label: "Closed (ปิดการสรรหาแล้ว)", badge: "bg-slate-200 text-slate-800 dark:bg-slate-800 dark:text-slate-200 border-slate-300 dark:border-slate-700" },
      { id: "REJECTED_BY_ADMIN", label: "❌ ตีกลับ/ปฏิเสธ (REJECTED_BY_ADMIN)", badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800 font-bold" }
    ];

    const ONBOARDING_ARRIVAL_STATUSES = [
      { id: "pending_arrival", label: "⏳ รอถึงวันเริ่มงาน", badge: "bg-amber-50 text-amber-700 dark:bg-amber-950 dark:text-amber-300 border-amber-300" },
      { id: "arrived_reported", label: "✅ มาเริ่มงานเรียบร้อยแล้ว", badge: "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/80 dark:text-emerald-100 border-emerald-400 font-extrabold ring-2 ring-emerald-500/20" },
      { id: "declined_noshow", label: "❌ สละสิทธิ์ / ไม่มาเริ่มงาน", badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 font-extrabold ring-2 ring-rose-500/30" }
    ];

    // คำนวณ Priority อัตโนมัติตามระยะเวลา SLA / วันที่เป้าหมาย หรือการตั้งค่า
    const getPositionPriorityInfo = (slot) => {
      const explicit = slot.priority;
      const sla = getSLAInfo(slot.requestDate, slot.stage, slot.offerSentDate);

      // ถ้าเกิน SLA หรือเหลือน้อยกว่า 5 วันทำการ ให้ยกระดับเป็น URGENT อัตโนมัติ
      if (explicit === "URGENT" || sla.isOverdue || (!sla.isCompleted && sla.workingDaysRemaining <= 5)) {
        return {
          id: "URGENT",
          label: "ด่วนมาก",
          badge: "bg-rose-50 text-rose-700 border-rose-300 dark:bg-rose-950/80 dark:text-rose-300 dark:border-rose-800",
          dotBg: "bg-rose-500",
          ping: true,
          icon: "🔥"
        };
      }
      if (explicit === "HIGH" || (!sla.isCompleted && sla.workingDaysRemaining <= 12)) {
        return {
          id: "HIGH",
          label: "ด่วน",
          badge: "bg-amber-50 text-amber-700 border-amber-300 dark:bg-amber-950/80 dark:text-amber-300 dark:border-amber-800",
          dotBg: "bg-amber-500",
          ping: true,
          icon: "⚡"
        };
      }
      return {
        id: "NORMAL",
        label: "ปกติ",
        badge: "bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700",
        dotBg: "bg-emerald-500",
        ping: false,
        icon: "🟢"
      };
    };

    // Pipeline stages (Updated to support Approval Workflow & Automatic Transition)
    const STAGES = [
      { id: "received", label: "Request Received", desc: "คำขอรอการอนุมัติ (Pending Approval)" },
      { id: "manpower", label: "1. Manpower Request", desc: "พร้อมสรรหา (Ready for Recruitment)" },
      { id: "interview", label: "Interview Stage", desc: "นัดหมายและสัมภาษณ์ผู้สมัคร" },
      { id: "offer", label: "Offer Sent", desc: "ยื่นข้อเสนอจ้างงาน" },
      { id: "onboarded", label: "Onboarded / Filled", desc: "รับเข้าทำงานและเริ่มงานแล้ว" },
      { id: "cancelled", label: "Cancelled / Rejected", desc: "ยกเลิกคำขอ / ผู้สมัครสละสิทธิ์" }
    ];

    const EVALUATION_CRITERIA = [
      { id: "c1", label: "1. ความรู้ความสามารถและทักษะในสายงาน (Job Competency & Skills)", desc: "ความรู้ ความเชี่ยวชาญ และประสบการณ์ตรงตาม Requirement" },
      { id: "c2", label: "2. การคิดวิเคราะห์และการแก้ปัญหา (Problem Solving & Logic)", desc: "การคิดเป็นระบบ ตรรกะในการวิเคราะห์ และการแก้ไขปัญหาเฉพาะหน้า" },
      { id: "c3", label: "3. ทัศนคติและค่านิยมที่สอดคล้องกับองค์กร (Culture Fit & Values)", desc: "ทัศนคติเชิงบวก ความยืดหยุ่น ความพร้อมรับวัฒนธรรมองค์กร" },
      { id: "c4", label: "4. การสื่อสารและการทำงานร่วมกับผู้อื่น (Communication & Teamwork)", desc: "การสื่อสารกระชับ เข้าใจง่าย รับฟัง และมนุษยสัมพันธ์ในการทำงานร่วมกัน" },
      { id: "c5", label: "5. ความมุ่งมั่นในผลสัมฤทธิ์และการพัฒนาตนเอง (Drive & Adaptability)", desc: "ความกระตือรือร้น ความรับผิดชอบ และการเรียนรู้สิ่งใหม่ต่อเนื่อง" }
    ];

    const EVALUATOR_ROLES = [
      "Hiring Manager (ผู้บังคับบัญชาสายงาน)",
      "Committee Member (กรรมการสัมภาษณ์)",
      "Technical Specialist (ผู้เชี่ยวชาญเฉพาะทาง)",
      "HR Interviewer (ฝ่ายทรัพยากรบุคคล)",
      "Department Director (ผู้อำนวยการฝ่ายงาน)"
    ];

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    // คำนวณสถานะกำหนดการสัมภาษณ์เทียบกับวันปัจจุบัน (วันนี้, พรุ่งนี้, อีก 2-3 วันข้างหน้า)
    const getInterviewRelativeTimeInfo = (scheduleStr) => {
      if (!scheduleStr) return null;
      const match = String(scheduleStr).match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      const [_, y, m, d] = match;
      const interviewDate = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
      interviewDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffTime = interviewDate.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        const absDays = Math.abs(diffDays);
        return {
          text: absDays === 1 ? "ผ่านมาเมื่อวาน" : `ผ่านมา ${absDays} วันแล้ว`,
          badge: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-300 dark:border-slate-700",
          dotBg: "bg-slate-400",
          ping: false
        };
      } else if (diffDays === 0) {
        return {
          text: "⚡ วันนี้ (Today)",
          badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-700 font-extrabold ring-1 ring-rose-500/30",
          dotBg: "bg-rose-500",
          ping: true
        };
      } else if (diffDays === 1) {
        return {
          text: "🔔 พรุ่งนี้ (Tomorrow)",
          badge: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-700 font-bold",
          dotBg: "bg-amber-500",
          ping: true
        };
      } else if (diffDays === 2) {
        return {
          text: "🗓️ อีก 2 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays === 3) {
        return {
          text: "🗓️ อีก 3 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays <= 7) {
        return {
          text: `🗓️ อีก ${diffDays} วันข้างหน้า`,
          badge: "bg-blue-50 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 border-blue-200 dark:border-blue-800 font-semibold",
          dotBg: "bg-blue-500",
          ping: false
        };
      } else {
        return {
          text: `🗓️ อีก ${diffDays} วัน`,
          badge: "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700 font-medium",
          dotBg: "bg-slate-400",
          ping: false
        };
      }
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }
    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${

      const [personnelList, setPersonnelList] = useState(() => {

      });

      const [candidatePool, setCandidatePool] = useState(() => {
        const saved = localStorage.getItem("hr_candidates_v62");
        return saved ? JSON.parse(saved) : INITIAL_CANDIDATE_POOL;
      });

      const [googleScriptUrl, setGoogleScriptUrl] = useState(() => {
        const targetUrl = "https://script.google.com/macros/s/AKfycbwfVec2cbvcPNC2KbckL17lNy6x1KOnfQSUd1LpLK2TJMb9Udq18F_YdPcpNxoCQ4RP2w/exec";
        const saved = localStorage.getItem("hr_apps_script_url_v62");
        if (!saved || saved.includes("AKfycbwfdg3PLNPbtKDaWEZ7aeU9MRur3jr7AeJ8wc")) {
          localStorage.setItem("hr_apps_script_url_v62", targetUrl);
          return targetUrl;
        }
        return saved;
      });

      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem("theme_mode") === "dark" || 
               (!('theme_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      });

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem("theme_mode", "dark");
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem("theme_mode", "light");
        }
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem("hr_requests_v62", JSON.stringify(requests));
      }, [requests]);

      useEffect(() => {
        localStorage.setItem("hr_candidates_v62", JSON.stringify(candidatePool));
      }, [candidatePool]);

      // 🔄 Real-time Background Polling & Manual Sync Function
      const syncWorkflowStatus = async (silent = true) => {
        if (!googleScriptUrl) {
          if (!silent) triggerToast("⚠️ กรุณาระบุ Google Apps Script Web App URL ก่อนซิงค์");
          return;
        }

        try {
          const res = await fetch(`${googleScriptUrl}?action=getWorkflowStatuses&_t=${Date.now()}`, {
            cache: "no-store",
            headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
          });
          const resJson = await res.json();

          if (resJson && resJson.status === "success") {
            const serverStatuses = resJson.data || {};
            const itConfirmedSlots = resJson.itConfirmedSlots || {};

            setRequests(prevRequests => {
              return prevRequests.map(r => {
                const mainId = r.id;
                const cleanId = String(mainId).replace(/-\d+$/, "");
                const remoteItem = serverStatuses[mainId] || serverStatuses[cleanId];

                const updatedSlots = (r.slots || []).map(s => {
                  const itAckFromRemote = Boolean(itConfirmedSlots[s.slotId] || itConfirmedSlots[mainId]);
                  const newWfStatus = remoteItem?.status || s.workflowStatus;
                  const isItConfirmed = itAckFromRemote || s.itEquipmentConfirmed || newWfStatus === "READY_FOR_RECRUITMENT" || newWfStatus === "Recruiting" || newWfStatus === "Closed";

                  return {
                    ...s,
                    workflowStatus: newWfStatus || s.workflowStatus,

      // All position slots with individual slotStatus (Recruiting vs Closed)

                                      currentWorkflowStatus === "PENDING_APPROVER" || 
                                      currentWorkflowStatus === "PENDING_IT";

            // Stage auto-transition logic:
            // 1. Pending approvals are held in "received" (Request Received)
            // 2. When READY_FOR_RECRUITMENT or Recruiting, if stage was "received", automatically transition to "manpower"
            let initialStage = slot.stage || r.stage || "received";
            let effectiveStage = initialStage;
            if (isPendingApproval) {
              effectiveStage = "received";
            } else if ((currentWorkflowStatus === "READY_FOR_RECRUITMENT" || currentWorkflowStatus === "Recruiting") && initialStage === "received") {
              effectiveStage = "manpower";
            }

            // Individual slot status: "Closed" if slotStatus is Closed, or slot stage is onboarded/cancelled
            const slotEffectiveStatus = (slot.slotStatus === "Closed" || effectiveStage === "onboarded" || effectiveStage === "cancelled")

              : (slot.slotStatus || r.requestStatus || "Recruiting");

            return {

          const reqDate = new Date(s.requestDate);
          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchesMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchesYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

            statsMap[dept].total += 1;

              statsMap[dept].cancelled += 1;

              statsMap[dept].open += 1;

          "Recruiting": 5,

            r.requesterName?.toLowerCase().includes(query) ||
            r.department?.toLowerCase().includes(query) ||

          const statusA = a.requestStatus || a.workflowStatus || "PENDING_ADMIN";
          const statusB = b.requestStatus || b.workflowStatus || "PENDING_ADMIN";
          const weightA = priorityWeight[statusA] || 99;

      const handleSendITNotification = async (slotItem) => {
        if (!slotItem) return;

          c.assignedSlotId === slotItem.slotId || 
          (slotItem.candidateName && c.fullName === slotItem.candidateName)
        );

        const candidateName = slotItem.candidateName || cand?.fullName || "พนักงานใหม่";
        const hireDate = slotItem.hireDate || cand?.hireDate || new Date().toISOString().split('T')[0];
        const branch = cand?.branch || slotItem.branch || "Central Park Offices";

          triggerToast(`⏳ กำลังส่งอีเมลแจ้งทีม IT (people@valuesourcing.co) สำหรับ K. ${candidateName}...`);

          await fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "sendITNotificationEmail",
              reqId: slotItem.parentRequestId || slotItem.id,
              slotId: slotItem.slotId,
              jobTitle: slotItem.jobTitle,
              department: slotItem.department,
              candidateName: candidateName,
              branch: branch,
              workLocation: branch,
              hireDate: hireDate,
              appUrl: appBaseUrl,
              itLaptop: slotItem.itLaptop || "ต้องการ",
              itEmail: slotItem.itEmail || "ต้องการ",
              itSimCard: slotItem.itSimCard || "ไม่ต้องการ",
              itNetsuite: slotItem.itNetsuite || "ไม่ต้องการ"
            })
          });

          // อัปเดต state บันทึกสถานะว่าส่งแจ้ง IT ให้ Slot นี้แล้ว
          setRequests(prev => prev.map(r => {
            if (!r.slots) return r;

            if (r.id === targetId || r.slots.some(s => s.slotId === slotItem.slotId)) {
              const updatedSlots = r.slots.map(s => {
                if (s.slotId === slotItem.slotId) {
                  return { ...s, isItNotified: true };

                return s;
              });
              return { ...r, slots: updatedSlots };
            }
            return r;
          }));

          // อัปเดต Modal Detail ทันทีหากกำลังเปิดดูอยู่
          setSelectedDetailSlot(prev => (prev && prev.slotId === slotItem.slotId ? { ...prev, isItNotified: true } : prev));

          triggerToast(`📧 ส่งข้อมูลแจ้งทีม IT สำเร็จแล้ว! พร้อมแนบปุ่มให้ IT กดยืนยันรับทราบ`);
        } catch (err) {
          triggerToast(`❌ ส่งอีเมลไม่สำเร็จ: ${err.message || err}`);
        }
      };

      const handleUnassignCandidate = (targetSlotId, candidateFullName = "") => {
        setCandidatePool(prev => prev.map(c => {
          if (c.assignedSlotId === targetSlotId || (candidateFullName && c.fullName === candidateFullName)) {
            return { ...c, assignedSlotId: "" };
          }
          return c;
        }));

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === targetSlotId) {
              return {
                ...s,
                candidateName: "",
                candidatePhone: "",
                candidateNickname: "",
                resumeUrl: "",
                stage: "received",
                interviewSchedule: "",
                interviewScore: 0,
                interviewScorePercent: 0,
                interviewResult: "",
                evaluations: []
              };
            }
            return s;
          });
          return { ...r, slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        }));

        setUnassignConfirmTarget(null);
        triggerToast(`ถอดรายชื่อผู้สมัครออกจาก Slot #${targetSlotId} เรียบร้อยแล้ว`);
      };

      // Handler to delete candidate with slot detachment
      const handleConfirmDeleteCandidate = () => {
        if (!candidateToDelete) return;
        const targetId = candidateToDelete.candidateId;
        const targetName = candidateToDelete.fullName;
        const linkedSlotId = candidateToDelete.assignedSlotId;

        // If candidate was assigned to a slot, detach from that slot
        if (linkedSlotId) {
          setRequests(prev => prev.map(r => {
            if (!r.slots) return r;
            const slots = r.slots.map(s => {
              if (s.slotId === linkedSlotId) {
                return {
                  ...s,
                  candidateName: "",
                  candidatePhone: "",
                  candidateNickname: "",
                  resumeUrl: "",
                  interviewSchedule: "",
                  evaluations: []
                };
              }
              return s;
            });
            return { ...r, slots };
          }));
        }

        setCandidatePool(prev => prev.filter(c => c.candidateId !== targetId));
        triggerToast(`ลบข้อมูลคุณ ${targetName} ออกจากระบบเรียบร้อย`);
        setCandidateToDelete(null);
      };

      const handleOpenBlindEvaluationModal = (slot) => {
        setBlindEvalModalSlot(slot);
        setBlindEvalForm({
          evaluatorName: "",
          evaluatorRole: EVALUATOR_ROLES[0],
          date: new Date().toISOString().split('T')[0],
          scores: { c1: 4, c2: 4, c3: 4, c4: 4, c5: 4 },
          strengths: "",
          improvements: "",
          recommendation: "Recommend to Hire"
        });
      };

      const handleSaveBlindEvaluation = (e) => {
        e.preventDefault();
        if (!blindEvalModalSlot) return;
        if (!blindEvalForm.evaluatorName.trim()) {
          triggerToast("⚠️ กรุณาระบุชื่อผู้ประเมิน");
          return;
        }

        const sc = blindEvalForm.scores;
        const total = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
        const avg = parseFloat((total / 5).toFixed(1));
        const pct = Math.round((total / 25) * 100);

        const newSubmission = {
          id: `eval-${Date.now()}`,
          evaluatorName: blindEvalForm.evaluatorName.trim(),
          evaluatorRole: blindEvalForm.evaluatorRole,
          date: blindEvalForm.date,
          scores: { ...sc },
          total,
          avg,
          pct,
          strengths: blindEvalForm.strengths,
          improvements: blindEvalForm.improvements,
          recommendation: blindEvalForm.recommendation
        };

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === blindEvalModalSlot.slotId) {
              const updatedEvals = [...(s.evaluations || []), newSubmission];
              const overall = calculateOverallScore(updatedEvals);
              return {
                ...s,
                interviewScore: overall.combinedAvg,
                interviewScorePercent: overall.combinedPct,
                interviewResult: overall.result,
                evaluations: updatedEvals
              };
            }
            return s;
          });
          return { ...r, slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
        }));

        setBlindEvalModalSlot(null);
        triggerToast(`บันทึกผลการประเมินของคุณ ${newSubmission.evaluatorName} สำเร็จ!`);
      };

      // ฟังก์ชันยืนยันความพร้อมอุปกรณ์ IT ในสเตจ Onboarded
      const handleToggleITEquipmentConfirmed = (slotId) => {
        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              const nextState = !s.itEquipmentConfirmed;
              return { ...s, itEquipmentConfirmed: nextState };
            }
            return s;
          });
          return { ...r, slots };
        }));

        setSelectedDetailSlot(prev => {
          if (!prev || prev.slotId !== slotId) return prev;
          return { ...prev, itEquipmentConfirmed: !prev.itEquipmentConfirmed };
        });

        triggerToast("💻 อัปเดตสถานะความพร้อมอุปกรณ์ IT เรียบร้อยแล้ว");
      };

      // ฟังก์ชันยืนยันพนักงานมาเริ่มงาน / เข้าอบรมวันแรก พร้อมปรับสถานะเป็น Closed (ปิดการสรรหา) ทันทีอัตโนมัติ
      const handleConfirmFirstDayTraining = (slotId) => {
        const targetSlot = allPositionSlots.find(s => s.slotId === slotId);
        const duration = targetSlot ? getRecruitmentDurationInfo(targetSlot.requestDate, targetSlot.hireDate, targetSlot.lastUpdated) : { totalDays: 0 };

        // 🔄 ซิงค์บันทึกข้อมูลเข้า Sheet "Closed" (GID 396528947) อัตโนมัติ
        if (googleScriptUrl && targetSlot) {
          fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "archiveClosedSlot",
              sheetGid: "396528947",
              slotId: targetSlot.slotId,
              reqId: targetSlot.parentRequestId || targetSlot.id,
              requestDate: targetSlot.requestDate,
              hireDate: targetSlot.hireDate || new Date().toISOString().split('T')[0],
              totalDays: duration.totalDays,
              jobTitle: targetSlot.jobTitle,
              department: targetSlot.department,
              candidateName: targetSlot.candidateName,
              candidatePhone: targetSlot.candidatePhone,
              workLocation: targetSlot.branch || "Central Park Offices",
              arrivalStatus: "arrived_reported",
              interviewScore: targetSlot.interviewScore,
              interviewScorePercent: targetSlot.interviewScorePercent,
              interviewResult: targetSlot.interviewResult,
              requesterName: targetSlot.requesterName,
              remark: targetSlot.rejectionReason || "เข้าอบรมวันแรกเรียบร้อยแล้ว"
            })
          }).catch(err => console.error("Error archiving to closed sheet:", err));
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          let hasSlot = false;
          const slots = r.slots.map(s => {
            if (s.slotId === slotId) {
              hasSlot = true;
              return {
                ...s,
                hasAttendedFirstDayTraining: true,
                onboardingArrivalStatus: "arrived_reported",
                slotStatus: "Closed" // ปรับสถานะ Slot เป็น Closed ทันที
              };
            }
            return s;
          });
          if (!hasSlot) return r;

          // หากทุก Slot ในคำขอนี้ปิดจบครบแล้ว ให้ปรับภาพรวมคำขอเป็น Closed ด้วย
          const allClosed = slots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
          return {
            ...r,
            requestStatus: allClosed ? "Closed" : r.requestStatus,
            slots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        setSelectedDetailSlot(prev => {
          if (!prev || prev.slotId !== slotId) return prev;
          return {
            ...prev,
            hasAttendedFirstDayTraining: true,
            onboardingArrivalStatus: "arrived_reported",
            slotStatus: "Closed"
          };
        });

        triggerToast("🎉 ยืนยันพนักงานมาเริ่มงานเรียบร้อยแล้ว & บันทึกลง Sheet Closed (GID 396528947) สำเร็จ");
      };

      // อัปเดต Priority ของ Slot แบบระบุเองได้
      const handleUpdateSlotPriority = (slotId, newPriority) => {
        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const slots = r.slots.map(s => s.slotId === slotId ? { ...s, priority: newPriority } : s);
          return { ...r, slots };
        }));
        setSelectedDetailSlot(prev => prev?.slotId === slotId ? { ...prev, priority: newPriority } : prev);
        triggerToast(`ปรับระดับความสำคัญเป็น: ${newPriority}`);
      };

      // Individual Slot Status Update with Strict Training Attendance Gatekeeper
      const handleUpdateSlotStatus = (slotId, newStatus) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);

        // 🔒 เงื่อนไขสำคัญ: ถ้าจะปรับเป็น Closed แต่ผู้สมัครยังไม่ได้ติ๊กยืนยันว่ามาเริ่มงาน/อบรมวันแรก ให้บล็อกไว้ทันที
        if (newStatus === "Closed" && slotItem?.stage === "onboarded") {
          if (!slotItem.hasAttendedFirstDayTraining && slotItem.onboardingArrivalStatus !== "arrived_reported") {
            triggerToast("⚠️ ไม่สามารถปิดจบได้: ต้องติ๊กยืนยันว่าผู้สมัครมาเริ่มงาน/เข้าอบรมวันแรกเรียบร้อยก่อน");
            return;
          }
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          let hasSlot = false;
          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              hasSlot = true;
              return { ...s, slotStatus: newStatus };
            }
            return s;
          });

          if (!hasSlot) return r;

          // If all slots in this request are Closed, close the parent request
          const allClosed = updatedSlots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
          return {
            ...r,
            requestStatus: allClosed ? "Closed" : "Recruiting",
            slots: updatedSlots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        triggerToast(`อัปเดต Slot #${slotId} เป็น ${newStatus}`);
      };

      // Handling Onboarding Arrival Status Change with Locking
      const handleUpdateOnboardingArrivalStatus = (slotId, newArrivalStatus) => {
        const slotItem = allPositionSlots.find(s => s.slotId === slotId);
        
        // Once locked as declined_noshow, prevent change
        if (slotItem?.onboardingArrivalStatus === "declined_noshow") {
          triggerToast("🔒 สถานะนี้ถูกล็อกเป็น 'สละสิทธิ์ / ไม่มาเริ่มงาน' แล้ว ไม่สามารถเปลี่ยนกลับได้");
          return;
        }

        // If user selects declined_noshow, trigger mandatory reason modal
        if (newArrivalStatus === "declined_noshow") {
          setRejectionModalData({ slotId, slotItem, isArrivalDecline: true });
          setRejectionReasonInput(slotItem?.rejectionReason || "");
          return;
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return { ...s, onboardingArrivalStatus: newArrivalStatus };
            }
            return s;
          });
          return { ...r, slots: updatedSlots };
        }));

        if (selectedDetailSlot && selectedDetailSlot.slotId === slotId) {
          setSelectedDetailSlot(prev => ({ ...prev, onboardingArrivalStatus: newArrivalStatus }));
        }

        const label = ONBOARDING_ARRIVAL_STATUSES.find(o => o.id === newArrivalStatus)?.label || newArrivalStatus;
        triggerToast(`อัปเดตสถานะการมารายงานตัว: ${label}`);
      };
      const handleInitiateStageChange = (targetSlotId, targetStage) => {
        const slotItem = allPositionSlots.find(s => s.slotId === targetSlotId);

        // Guard: Prevent dragging unapproved requests out of "Request Received"
        const wfStatus = slotItem?.workflowStatus || slotItem?.slotStatus || "PENDING_ADMIN";
        const isStillPending = wfStatus === "PENDING_ADMIN" || wfStatus === "PENDING_APPROVER" || wfStatus === "PENDING_IT";
        if (isStillPending && targetStage !== "received") {
          const statusLabels = {
            "PENDING_ADMIN": "รอ Admin ตรวจสอบ",
            "PENDING_APPROVER": "รอผู้อนุมัติยืนยัน",
            "PENDING_IT": "รอ IT จัดเตรียมอุปกรณ์"
          };
          triggerToast(`⚠️ คำขอนี้ยังอยู่ระหว่าง${statusLabels[wfStatus] || wfStatus} กรุณาดำเนินการอนุมัติให้เป็น READY_FOR_RECRUITMENT ก่อนย้ายสเตจ`);
          return;
        }

        // Requirement: Candidate Check for Interview Stage
        if (targetStage === "interview" && (!slotItem?.candidateName || !slotItem.candidateName.trim())) {
          setUnassignedInterviewSlotModal(slotItem);
          return;
        }

        if (targetStage === "onboarded") {
          const defaultDate = slotItem?.hireDate || new Date().toISOString().split('T')[0];
          setOnboardModalData({ slotId: targetSlotId, slotItem });
          setOnboardHireDateInput(defaultDate);
          return;
        }

        if (targetStage === "cancelled") {
          setRejectionModalData({ slotId: targetSlotId, slotItem, isArrivalDecline: false });
          setRejectionReasonInput(slotItem?.rejectionReason || "");
          return;
        }

        updateSlotStageDirectly(targetSlotId, targetStage);
      };

      // Individual Slot Onboard Confirmation
      const handleConfirmOnboardAndClose = (e) => {
        e.preventDefault();
        if (!onboardModalData) return;
        const { slotId, slotItem } = onboardModalData;
        const hireDate = onboardHireDateInput || new Date().toISOString().split('T')[0];

        // 1. Update Candidate Pool
        setCandidatePool(prev => prev.map(c => {
          if (c.assignedSlotId === slotId || (slotItem?.candidateName && c.fullName === slotItem.candidateName)) {
            return {
              ...c,
              hireDate: hireDate,
              status: "Hiring / Offer"
            };
          }
          return c;
        }));

        // 2. Update Specific Slot to Closed and Onboarded
        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const targetSlot = r.slots.find(s => s.slotId === slotId);
          if (!targetSlot) return r;

          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return {
                ...s,
                stage: "onboarded",
                slotStatus: "Closed", // Individual slot closed
                hireDate: hireDate,
                onboardingArrivalStatus: s.onboardingArrivalStatus || "pending_arrival"
              };
            }
            return s;
          });

          // Check if all slots are closed
          const allSlotsClosed = updatedSlots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");

          return {
            ...r,
            stage: allSlotsClosed ? "onboarded" : r.stage,
            requestStatus: allSlotsClosed ? "Closed" : "Recruiting",
            slots: updatedSlots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        setOnboardModalData(null);
        triggerToast(`🎉 รับเข้าทำงาน Slot #${slotId} เรียบร้อย! ย้าย Slot นี้ไป "Closed" และปรับสถานะผู้สมัครเป็น "Hiring / Offer" อัตโนมัติ`);
      };

      // Individual Slot Rejection & Decline Confirmation (Mandatory Reason + Locked Status)
      const handleConfirmRejectionAndSave = (e) => {
        e.preventDefault();
        if (!rejectionModalData) return;
        const { slotId, isArrivalDecline } = rejectionModalData;
        const reason = rejectionReasonInput.trim();
        if (!reason) {
          triggerToast("⚠️ กรุณาระบุเหตุผลในการสละสิทธิ์ / ยกเลิกตำแหน่ง");
          return;
        }

        setRequests(prev => prev.map(r => {
          if (!r.slots) return r;
          const targetSlot = r.slots.find(s => s.slotId === slotId);
          if (!targetSlot) return r;

          const updatedSlots = r.slots.map(s => {
            if (s.slotId === slotId) {
              return {
                ...s,
                stage: isArrivalDecline ? s.stage : "cancelled",
                slotStatus: "Closed", // Individual slot closed!
                onboardingArrivalStatus: "declined_noshow", // Locked declined
                rejectionReason: reason
              };
            }
            return s;
          });

          const allSlotsClosed = updatedSlots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");

          return {
            ...r,
            stage: allSlotsClosed ? "cancelled" : r.stage,
            requestStatus: allSlotsClosed ? "Closed" : "Recruiting",
            slots: updatedSlots,
            lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
          };
        }));

        if (selectedDetailSlot && selectedDetailSlot.slotId === slotId) {
          setSelectedDetailSlot(prev => ({ 
            ...prev, 
            onboardingArrivalStatus: "declined_noshow", 
            rejectionReason: reason,
            slotStatus: "Closed"
          }));
        }

        setRejectionModalData(null);
        triggerToast(`บันทึกเหตุผลเรียบร้อย! ล็อกสถานะเป็น "❌ สละสิทธิ์ / ไม่มาเริ่มงาน" สีแดง และปิด Slot #${slotId}`);
      };

      // Direct Stage Update
      const updateSlotStageDirectly = (targetSlotId, targetStage) => {
        const todayStr = new Date().toISOString().split('T')[0];

        setRequests(prev => prev.map(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          let slots = r.slots && r.slots.length === headcount ? [...r.slots] : Array.from({ length: headcount }, (_, i) => ({
            slotId: `${r.id}-${i + 1}`,
            slotIndex: i + 1,
            slotStatus: r.requestStatus || "Recruiting",
            candidateName: "",
            stage: r.stage || "received",
            offerSentDate: "",
            interviewScore: 0,
            interviewScorePercent: 0,
            interviewResult: "",
            onboardingArrivalStatus: "pending_arrival",
            rejectionReason: "",
            evaluations: []
          }));

          let slotUpdated = false;
          slots = slots.map(s => {
            if (s.slotId === targetSlotId) {
              slotUpdated = true;
              const isNowOffer = targetStage === "offer";
              const isNowCancelled = targetStage === "cancelled";
              return {
                ...s,
                stage: targetStage,
                slotStatus: isNowCancelled ? "Closed" : s.slotStatus,
                offerSentDate: isNowOffer ? (s.offerSentDate || todayStr) : s.offerSentDate,
                onboardingArrivalStatus: isNowCancelled ? "declined_noshow" : s.onboardingArrivalStatus
              };
            }
            return s;
          });

          if (slotUpdated) {
            const allSlotsClosed = slots.every(s => s.slotStatus === "Closed" || s.stage === "onboarded" || s.stage === "cancelled");
            return {
              ...r,
              requestStatus: allSlotsClosed ? "Closed" : "Recruiting",
              offerSentDate: targetStage === "offer" ? (r.offerSentDate || todayStr) : r.offerSentDate,
              slots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        triggerToast(`อัปเดต Slot #${targetSlotId} เป็น ${targetStage}`);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (formInput.positionType === "Replacement" && !formInput.replacedEmployeeName.trim()) {
          triggerToast("⚠️ กรุณาระบุชื่อพนักงานที่ลาออก / ถูกทดแทน");
          return;
        }

        // Open Confirmation Preview Modal instead of instant submit
        setPendingConfirmationForm({ ...formInput });
        setShowConfirmModal(true);
      };

      const handleConfirmFinalSubmit = () => {
        if (!pendingConfirmationForm) return;

        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().split(' ')[0];
        const newId = `REQ-${now.getFullYear()}-${String(requests.length + 1).padStart(3, '0')}`;
        const headcount = Math.max(1, Number(pendingConfirmationForm.headcountRequired) || 1);

        const newSlots = Array.from({ length: headcount }, (_, i) => ({
          slotId: `${newId}-${i + 1}`,
          slotIndex: i + 1,
          slotStatus: "PENDING_ADMIN",
          candidateName: "",
          candidatePhone: "",
          candidateNickname: "",
          resumeUrl: "",
          stage: "received",
          offerSentDate: "",
          hireDate: "",
          interviewScore: 0,
          interviewScorePercent: 0,
          interviewResult: "",
          onboardingArrivalStatus: "pending_arrival",
          rejectionReason: "",
          evaluations: []
        }));

        const newReq = {
          ...pendingConfirmationForm,
          id: newId,
          headcountRequired: headcount,
          requestDate: dateStr,
          lastUpdated: `${dateStr} ${timeStr}`,
          stage: "received",
          offerSentDate: "",
          requestStatus: "PENDING_ADMIN",
          workflowStatus: "PENDING_ADMIN",
          onboardingArrivalStatus: "pending_arrival",
          rejectionReason: "",
          slots: newSlots
        };

        // 🔄 ส่งข้อมูลคำขอไปยัง Google Sheet "แบบขอกำลังคน" (GID 1528284561)
        if (googleScriptUrl) {
          fetch(googleScriptUrl, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify({
              action: "createRequisition",
              sheetGid: "1528284561",
              ...newReq
            })
          }).catch(err => console.error("Error creating requisition in sheet:", err));
        }

        setRequests([newReq, ...requests]);
        setShowConfirmModal(false);
        setShowRequestModal(false);
        setPendingConfirmationForm(null);
        setFormInput(initialForm);
        triggerToast("🎉 ส่งคำขอกำลังคนสำเร็จ & บันทึกลง Sheet แบบขอกำลังคน (GID 1528284561) เรียบร้อย!");
      };

      // Admin Review: Transition immediately to READY_FOR_RECRUITMENT and move to manpower stage (No email)
      const handleAdminApproveAndMoveToManpower = async (reqOrSlot) => {
        const parentReqId = reqOrSlot.parentRequestId || reqOrSlot.id;
        const targetReq = requests.find(r => r.id === parentReqId) || reqOrSlot;

        try {
          setIsApprovingEmailSending(true);
          triggerToast(`⏳ กำลังอนุมัติคำขอ ${parentReqId} และเริ่มกระบวนการสรรหา...`);

          const nowStr = new Date().toISOString().replace('T', ' ').substring(0, 19);

          // Update state of requests to READY_FOR_RECRUITMENT and stage to manpower
          setRequests(prev => prev.map(r => {
            if (r.id === parentReqId) {
              const updatedSlots = (r.slots || []).map(s => ({
                ...s,
                slotStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower"
              }));
              return {
                ...r,
                requestStatus: "READY_FOR_RECRUITMENT",
                workflowStatus: "READY_FOR_RECRUITMENT",
                stage: "manpower",
                slots: updatedSlots,
                lastUpdated: nowStr
              };
            }
            return r;
          }));

          // Background sync to Google Sheet if configured (without sending email)
          if (googleScriptUrl) {
            fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify({
                action: "confirmITReady",
                reqId: parentReqId
              })
            }).catch(() => {});
          }

          setShowAdminReviewModal(false);
          setSelectedAdminReviewSlot(null);
          if (selectedRequisitionDetail && selectedRequisitionDetail.id === parentReqId) {
            setSelectedRequisitionDetail(prev => ({
              ...prev,
              requestStatus: "READY_FOR_RECRUITMENT",
              workflowStatus: "READY_FOR_RECRUITMENT",
              stage: "manpower"
            }));
          }
          triggerToast(`✅ ยืนยันรับข้อมูลเรียบร้อย! ปรับสถานะเป็น READY_FOR_RECRUITMENT และย้ายคำขอเข้าสู่ 1. Manpower Request บน Kanban ทันที`);
        } catch (err) {
          triggerToast("บันทึกสถานะเป็น READY_FOR_RECRUITMENT เรียบร้อยแล้ว");
        } finally {
          setIsApprovingEmailSending(false);
        }
      };

      // Admin Action: Reject Requisition with Reason
      const handleAdminRejectRequisition = (reqId) => {
        if (!rejectionNoteInput.trim()) {
          triggerToast("⚠️ กรุณาระบุเหตุผลการตีกลับหรือปฏิเสธคำขอ");
          return;
        }

        const reason = rejectionNoteInput.trim();
        setRequests(prev => prev.map(r => {
          if (r.id === reqId) {
            const updatedSlots = (r.slots || []).map(s => ({
              ...s,
              slotStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason
            }));
            return {
              ...r,
              requestStatus: "REJECTED_BY_ADMIN",
              workflowStatus: "REJECTED_BY_ADMIN",
              stage: "cancelled",
              rejectionReason: reason,
              slots: updatedSlots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        if (selectedRequisitionDetail && selectedRequisitionDetail.id === reqId) {
          setSelectedRequisitionDetail(prev => ({
            ...prev,
            requestStatus: "REJECTED_BY_ADMIN",
            workflowStatus: "REJECTED_BY_ADMIN",
            rejectionReason: reason
          }));
        }

        setShowRejectModal(false);
        setRejectionNoteInput("");
        triggerToast(`❌ ตีกลับคำขอ ${reqId} เรียบร้อยแล้ว`);
      };

      const handleCopyShareLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const textArea = document.createElement("textarea");
        textArea.value = baseUrl;
        document.body.appendChild(textArea);
        textArea.select();
        document.execCommand('copy');
        document.body.removeChild(textArea);
        triggerToast("คัดลอกลิงก์สำเร็จ! 🔗");
      };

      const exportToCSV = () => {
        const headers = [
          "Slot ID", "Request ID", "Date", "Slot Status", "Job Title", "Position Type", "Replaced Name",
          "Department", "Stage", "Working Days Elapsed", "Total Recruitment Days", "Candidate", "Interview Schedule",
          "Evaluations Count", "Combined Score (1-5)", "Score %", "Result", "Hire Date", "Arrival Status", "Rejection Reason"
        ];
        const rows = allPositionSlots.map(s => {
          const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
          const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
          return [
            s.slotId, s.id, s.requestDate, s.slotStatus, `"${s.jobTitle}"`, s.positionType,
            `"${s.replacedEmployeeName || ''}"`, `"${s.department}"`, s.stage,
            sla.offerLeadTimeWorkingDays !== null ? sla.offerLeadTimeWorkingDays : sla.workingDaysElapsed,
            duration.totalDays,
            `"${s.candidateName || ''}"`, `"${s.interviewSchedule || ''}"`,
            s.evaluationsCount || 0,
            s.interviewScore || "", s.interviewScorePercent ? `${s.interviewScorePercent}%` : "", s.interviewResult || "",
            `"${s.hireDate || ''}"`, `"${s.onboardingArrivalStatus || ''}"`, `"${s.rejectionReason || ''}"`
          ];
        });
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Manpower_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };
      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          {/* Header */}
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {
                        if (isAdminAuthenticated) setCurrentView("admin");
                        else setShowLoginModal(true);
                      }}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Admin Portal</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setCurrentView("public")}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition"
                      >
                        <Icon name="grid" className="w-3.5 h-3.5" />
                        <span>Public View</span>
                      </button>
                      <button
                        onClick={() => {
                          setIsAdminAuthenticated(false);
                          setCurrentView("public");
                          triggerToast("ออกจากระบบ Admin เรียบร้อย");
                        }}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 transition"
                      >
                        <span>Logout</span>
                      </button>
                    </div>
                  )}

                  <button
                    onClick={() => setShowRequestModal(true)}
                    className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition"
                  >
                    <Icon name="plus" className="w-4 h-4 text-white" />
                    <span>+ ขอกำลังคน</span>
                  </button>

                  <button
                    onClick={handleCopyShareLink}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                    title="คัดลอกลิงก์"
                  >
                    <Icon name="link" className="w-4 h-4" />
                  </button>
                </div>

              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* KPI Cards */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">อัตราทั้งหมด</p>
                  <p className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{allPositionSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">กำลังดำเนินการ</p>
                  <p className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{inProcessSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ปิดการสรรหาแล้ว</p>
                  <p className="text-xl sm:text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{closedSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ผู้สมัครในคลัง</p>
                  <p className="text-xl sm:text-2xl font-bold text-sky-600 dark:text-sky-400 mt-1">{candidatePool.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-950 text-sky-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                </div>
              </div>
            </div>

            {currentView === "public" && (
              <div className="space-y-8">
                
                {/* 1. Stage Tracker */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="grid" className="w-5 h-5 text-amber-600" />
                        Recruitment Stage Tracker
                      </h2>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        placeholder="ค้นหาตำแหน่ง, รหัส, ฝ่ายงาน, ผู้สมัคร..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = allPositionSlots.filter(s => {
                        const matchesQuery = !searchQuery.trim() || 
                          s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                        return s.stage === stage.id && !s.isArchivedFromKanban && matchesQuery;
                      });

                      return (
                        <div key={stage.id} className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border border-slate-200/60 dark:border-slate-800">
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{stage.label}</span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px]">
                            {stageItems.map(item => {
                              const sla = getSLAInfo(item.requestDate, item.stage, item.offerSentDate);
                              const priorityInfo = getPositionPriorityInfo(item);
                              const hasEvaluation = item.evaluationsCount > 0;
                              const isPassingScore = item.interviewScorePercent >= 70;
                              const isArrived = item.stage === "onboarded" && (item.hasAttendedFirstDayTraining || item.onboardingArrivalStatus === "arrived_reported");
                              const isPendingArrival = item.stage === "onboarded" && !isArrived;

                              return (
                                <div 
                                  key={item.slotId} 
                                  className={`p-3.5 rounded-xl border shadow-xs transition group ${
                                    isArrived
                                      ? "bg-emerald-50/90 dark:bg-emerald-950/50 border-emerald-400 dark:border-emerald-600 ring-2 ring-emerald-500/25 shadow-emerald-500/10"
                                      : isPendingArrival
                                      ? "bg-amber-50/70 dark:bg-amber-950/30 border-amber-300 dark:border-amber-700 ring-1 ring-amber-400/30"
                                      : "bg-white dark:bg-slate-800 border-slate-200/80 dark:border-slate-700 hover:border-brand-500"
                                  }`}
                                >
                                  {/* Priority Header with Blinking Dot */}
                                  <div className="flex items-center justify-between text-[10px] mb-2 pb-1.5 border-b border-slate-100 dark:border-slate-700/60">
                                    <div className="flex items-center gap-1.5">
                                      <span className="relative flex h-2.5 w-2.5">
                                        {priorityInfo.ping && (
                                          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${priorityInfo.dotBg} opacity-75`}></span>
                                        )}
                                        <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${priorityInfo.dotBg}`}></span>
                                      </span>
                                      <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded border ${priorityInfo.badge}`}>
                                        {priorityInfo.icon} {priorityInfo.label}
                                      </span>
                                    </div>
                                    <span className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded-md">
                                      Slot #{item.slotIndex}/{item.totalSlots}
                                    </span>
                                  </div>

                                  <div className="flex items-center justify-between text-[10px] mb-1">
                                    <span className="font-mono text-slate-400">{item.slotId}</span>
                                    <span className="text-slate-400 text-[10px]">{item.requestDate}</span>
                                  </div>
                                  <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                    {item.jobTitle}
                                  </h4>
                                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 truncate">
                                    {item.department}
                                  </p>

                                  {/* Sub-status Badges for Approval Workflow */}
                                  {item.stage === "received" && (
                                    <div className="mt-2">
                                      {item.workflowStatus === "PENDING_ADMIN" && (
                                        <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-700">
                                          <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
                                          ⏳ รอ Admin ตรวจสอบ
                                        </span>
                                      )}
                                      {item.workflowStatus === "PENDING_APPROVER" && (
                                        <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-orange-100 text-orange-800 dark:bg-orange-950/80 dark:text-orange-300 border border-orange-300 dark:border-orange-700">
                                          📧 รอผู้อนุมัติยืนยัน
                                        </span>
                                      )}
                                      {item.workflowStatus === "PENDING_IT" && (
                                        <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 dark:bg-sky-950/80 dark:text-sky-300 border border-sky-300 dark:border-sky-700">
                                          💻 รอ IT จัดเตรียมอุปกรณ์
                                        </span>
                                      )}
                                    </div>
                                  )}

                                  {/* Badge for 1. Manpower Request (Ready for Recruitment) */}
                                  {item.stage === "manpower" && (
                                    <div className="mt-2">
                                      <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-400 font-bold ring-1 ring-emerald-500/20">
                                        ✅ พร้อมสรรหา
                                      </span>
                                    </div>

                                    <div className={`mt-2 p-1.5 rounded-lg border text-[11px] font-semibold truncate ${

                                        : "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-100 dark:border-emerald-900/60 text-emerald-800 dark:text-emerald-300"
                                    }`}>
                                      👤 {item.candidateName}
                                    </div>
                                  )}

                                  {item.stage === "interview" && item.interviewSchedule && (() => {
                                    const relTime = getInterviewRelativeTimeInfo(item.interviewSchedule);
                                    return (
                                      <div className="mt-1.5 space-y-1">
                                        <div className="text-[10px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1">
                                          <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />

                                        </div>
                                        {relTime && (
                                          <div className="flex items-center gap-1.5">
                                            <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>
