                      }`}
                    >
                      <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-extrabold ${
                        formStep === 1 ? "bg-brand-600 text-white" : "bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                      }`}>1</span>
                      <span className="truncate">ผู้ขอ & ผู้อนุมัติ</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setFormStep(2)}
                      className={`px-3 py-2 rounded-2xl text-[11px] font-bold transition flex items-center justify-center gap-2 border ${
                        formStep === 2 
                          ? "bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-300 border-brand-300 dark:border-brand-700 shadow-xs ring-2 ring-brand-500/10" 
                          : "text-slate-500 dark:text-slate-400 border-transparent hover:bg-white/50 dark:hover:bg-slate-800/40"
                      }`}
                    >
                      <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-extrabold ${
                        formStep === 2 ? "bg-brand-600 text-white" : "bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                      }`}>2</span>
                      <span className="truncate">ตำแหน่ง & สถานะ</span>
                    </button>

                    <button
                      type="button"
                      onClick={() => setFormStep(3)}
                      className={`px-3 py-2 rounded-2xl text-[11px] font-bold transition flex items-center justify-center gap-2 border ${
                        formStep === 3 
                          ? "bg-white dark:bg-slate-800 text-brand-600 dark:text-brand-300 border-brand-300 dark:border-brand-700 shadow-xs ring-2 ring-brand-500/10" 
                          : "text-slate-500 dark:text-slate-400 border-transparent hover:bg-white/50 dark:hover:bg-slate-800/40"
                      }`}
                    >
                      <span className={`w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-extrabold ${
                        formStep === 3 ? "bg-brand-600 text-white" : "bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300"
                      }`}>3</span>
                      <span className="truncate">คุณสมบัติ & IT</span>
                    </button>
                  </div>
                </div>

                {/* Form Content Area */}
                <form onSubmit={handleFormSubmit} className="p-6 space-y-5 overflow-y-auto flex-1 text-xs">
                  
                  {/* STEP 1: ผู้ขอ & ผู้อนุมัติ */}
                  {formStep === 1 && (
                    <div className="space-y-4 animate-fadeIn">
                      
                      {/* Auto Info Banner */}
                      <div className="p-3 rounded-2xl bg-gradient-to-r from-brand-50/80 to-sky-50/50 dark:from-brand-950/40 dark:to-sky-950/20 border border-brand-200/70 dark:border-brand-900/60 flex items-center justify-between text-[11px]">
                        <div className="flex items-center gap-2 text-brand-900 dark:text-brand-200 font-medium">
                          <Icon name="clock" className="w-4 h-4 text-brand-600 shrink-0" />
                          <span>วันที่ขออัตโนมัติ: <strong className="font-bold">{new Date().toISOString().split('T')[0]}</strong></span>
                        </div>
                        <span className="text-slate-400 text-[10px] hidden sm:inline">ระบบจะอัปเดตวันเวลาแก้ไขให้อัตโนมัติเมื่อกดบันทึก</span>
                      </div>

                      {/* Requester Group Card */}
                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/60 pb-2">
                          <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5 text-xs">
                            <span className="w-2 h-2 rounded-full bg-brand-500"></span>
                            ข้อมูลผู้ยื่นคำขอ (Requester Details)
                          </h4>
                          <span className="text-[10px] text-slate-400 font-medium">* จำเป็นต้องกรอก</span>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <div className="flex items-center justify-between mb-1">
                              <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300">
                                ผู้ขอ (Requester Name) <span className="text-rose-500">*</span>
                              </label>
                              <button
                                type="button"
                                onClick={() => syncPersonnelFromGoogleSheet(true)}
                                disabled={isSyncingPersonnel}
                                className="text-[10px] font-semibold text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1"
                              >
                                <Icon name="refresh" className={`w-3 h-3 ${isSyncingPersonnel ? 'animate-spin' : ''}`} />
                                {isSyncingPersonnel ? "กำลังซิงค์..." : "ซิงค์จาก Sheet (gid=814265894)"}
                              </button>
                            </div>
                            <SearchableSelect
                              value={formInput.requesterName}
                              placeholder="-- พิมพ์เพื่อค้นหาหรือเลือกผู้ขอ --"
                              options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                              onChange={(selectedName) => {
                                const person = personnelList.find(p => p.name === selectedName);
                                setFormInput(prev => ({
                                  ...prev,
                                  requesterName: selectedName,
                                  requesterEmail: person ? person.email : prev.requesterEmail,
                                  requesterPosition: person && person.position ? person.position : prev.requesterPosition,
                                  department: person && person.department ? person.department : prev.department
                                }));
                              }}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              ตำแหน่งผู้ขอ <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="text"
                              required
                              placeholder="ตำแหน่งของผู้ขอ"
                              value={formInput.requesterPosition}
                              onChange={(e) => setFormInput({ ...formInput, requesterPosition: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              Email ผู้ขอ <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="email"
                              required
                              placeholder="email@valuesourcing.co"
                              value={formInput.requesterEmail}
                              onChange={(e) => setFormInput({ ...formInput, requesterEmail: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              สังกัดแผนก (Department) <span className="text-rose-500">*</span>
                            </label>
                            <SearchableSelect
                              value={formInput.department}
                              placeholder="-- พิมพ์เพื่อค้นหาแผนกสังกัด --"
                              options={DEPARTMENTS.map(d => ({ value: d, label: d }))}
                              onChange={(selectedDept) => setFormInput({ ...formInput, department: selectedDept })}
                            />
                          </div>
                        </div>
                      </div>

                      {/* Approver & Forwarding Group Card */}
                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/60 pb-2">
                          <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5 text-xs">
                            <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                            ผู้อนุมัติ & การส่งต่อเอกสาร (Approval & Forwarding)
                          </h4>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              รายชื่อผู้อนุมัติ <span className="text-rose-500">*</span>
                            </label>
                            <SearchableSelect
                              value={formInput.approverName}
                              placeholder="-- เลือกหรือพิมพ์รายชื่อผู้อนุมัติ --"
                              options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                              onChange={(selectedName) => {
                                const person = personnelList.find(p => p.name === selectedName);
                                setFormInput(prev => ({
                                  ...prev,
                                  approverName: selectedName,
                                  approverEmail: person ? person.email : prev.approverEmail
                                }));
                              }}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              Email ผู้อนุมัติ <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="email"
                              required
                              placeholder="approver@valuesourcing.co"
                              value={formInput.approverEmail}
                              onChange={(e) => setFormInput({ ...formInput, approverEmail: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ส่งต่อให้กับ</label>
                            <SearchableSelect
                              value={formInput.forwardTo}
                              placeholder="-- เลือกหรือพิมพ์ผู้รับส่งต่อ --"
                              options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                              onChange={(selectedName) => {
                                const person = personnelList.find(p => p.name === selectedName);
                                setFormInput(prev => ({
                                  ...prev,
                                  forwardTo: selectedName,
                                  forwardEmail: person ? person.email : prev.forwardEmail
                                }));
                              }}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Email ผู้รับส่งต่อ</label>
                            <input
                              type="email"
                              placeholder="forward@valuesourcing.co"
                              value={formInput.forwardEmail}
                              onChange={(e) => setFormInput({ ...formInput, forwardEmail: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ส่งต่อให้ People 🔒</label>
                            <input
                              type="text"
                              readOnly
                              value={formInput.forwardToPeopleDept}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 font-bold cursor-not-allowed"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Email People 🔒</label>
                            <input
                              type="email"
                              readOnly
                              value={formInput.peopleEmail}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-brand-600 dark:text-brand-400 font-bold cursor-not-allowed"
                            />
                          </div>
                        </div>
                      </div>

                    </div>
                  )}

                  {/* STEP 2: ตำแหน่งงาน & สถานะ */}
                  {formStep === 2 && (
                    <div className="space-y-4 animate-fadeIn">
                      
                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/60 pb-2">
                          <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5 text-xs">
                            <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                            รายละเอียดตำแหน่งงานที่เปิดรับ (Position Details)
                          </h4>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <div className="sm:col-span-2">
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              ชื่อตำแหน่งที่ต้องการรับ (Job Title) <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="text"
                              required
                              placeholder="e.g. Factory Housekeeper Staff"
                              value={formInput.jobTitle}
                              onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              อัตราที่ต้องการ (Headcount) <span className="text-rose-500">*</span>
                            </label>
                            <div className="flex items-center space-x-1.5">
                              <button
                                type="button"
                                onClick={() => setFormInput(prev => ({ ...prev, headcountRequired: Math.max(1, (Number(prev.headcountRequired) || 1) - 1) }))}
                                className="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-extrabold text-base flex items-center justify-center transition active:scale-95 shrink-0"
                              >
                                -
                              </button>
                              <input
                                type="number"
                                min="1"
                                max="100"
                                required
                                value={formInput.headcountRequired}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setFormInput(prev => ({
                                    ...prev,
                                    headcountRequired: val === "" ? "" : Math.max(1, parseInt(val) || 1)
                                  }));
                                }}
                                onBlur={() => {
                                  if (!formInput.headcountRequired || Number(formInput.headcountRequired) < 1) {
                                    setFormInput(prev => ({ ...prev, headcountRequired: 1 }));
                                  }
                                }}
                                className="w-full text-center px-3 py-2 text-xs sm:text-sm rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 font-bold text-brand-600 dark:text-brand-400"
                              />
                              <button
                                type="button"
                                onClick={() => setFormInput(prev => ({ ...prev, headcountRequired: (Number(prev.headcountRequired) || 1) + 1 }))}
                                className="w-10 h-10 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-extrabold text-base flex items-center justify-center transition active:scale-95 shrink-0 shadow-xs"
                              >
                                +
                              </button>
                            </div>
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              รายละเอียดตำแหน่ง <span className="text-rose-500">*</span>
                            </label>
                            <SearchableSelect
                              value={formInput.positionType}
                              options={[
                                { value: "Replacement", label: "ทดแทนตำแหน่งเดิม (Replacement)" },
                                { value: "New Headcount", label: "เปิดตำแหน่งใหม่ (New Headcount)" }
                              ]}
                              onChange={(selectedType) => setFormInput({ ...formInput, positionType: selectedType })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              ต้องการภายในวันที่ (Target Date) <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="date"
                              required
                              value={formInput.targetDate}
                              onChange={(e) => setFormInput({ ...formInput, targetDate: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              Buddy (พี่เลี้ยง)
                            </label>
                            <SearchableSelect
                              value={formInput.buddy}
                              placeholder="-- เลือกหรือพิมพ์ชื่อ Buddy --"
                              options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                              onChange={(selectedBuddy) => setFormInput({ ...formInput, buddy: selectedBuddy })}
                            />
                          </div>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            ลักษณะงานโดยย่อ <span className="text-rose-500">*</span>
                          </label>
                          <textarea
                            rows="3"
                            required
                            placeholder="สรุปหน้าที่ความรับผิดชอบหลักของตำแหน่งงาน..."
                            value={formInput.jobDescription}
                            onChange={(e) => setFormInput({ ...formInput, jobDescription: e.target.value })}
                            className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs"
                          ></textarea>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            รายละเอียดส่งให้ทีม People
                          </label>
                          <textarea
                            rows="2"
                            placeholder="ข้อมูลเพิ่มเติมเฉพาะสำหรับทีม People / HR..."
                            value={formInput.detailsForPeople}
                            onChange={(e) => setFormInput({ ...formInput, detailsForPeople: e.target.value })}
                            className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                          ></textarea>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                            หมายเหตุจากผู้อนุมัติ 1
                          </label>
                          <input
                            type="text"
                            placeholder="ข้อความหรือหมายเหตุเพิ่มเติม..."
                            value={formInput.approverNote1}
                            onChange={(e) => setFormInput({ ...formInput, approverNote1: e.target.value })}
                            className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                          />
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สถานะอนุมัติ L1</label>
                            <SearchableSelect
                              value={formInput.approvalStatusL1}
                              options={["Approved", "Pending", "Rejected"]}
                              onChange={(val) => setFormInput({ ...formInput, approvalStatusL1: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สถานะอนุมัติ L2</label>
                            <SearchableSelect
                              value={formInput.approvalStatusL2}
                              options={["Pending", "Approved", "Rejected"]}
                              onChange={(val) => setFormInput({ ...formInput, approvalStatusL2: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สถานะปัจจุบันของเอกสาร</label>
                            <SearchableSelect
                              value={formInput.docStatus}
                              options={["Pending", "Approved", "In Progress", "Cancelled"]}
                              onChange={(val) => setFormInput({ ...formInput, docStatus: val })}
                            />
                          </div>
                        </div>

                      </div>

                    </div>
                  )}

                  {/* STEP 3: คุณสมบัติ & IT Assets */}
                  {formStep === 3 && (
                    <div className="space-y-4 animate-fadeIn">
                      
                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/60 pb-2">
                          <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5 text-xs">
                            <span className="w-2 h-2 rounded-full bg-purple-500"></span>
                            คุณสมบัติผู้สมัครที่ต้องการ (Candidate Qualifications)
                          </h4>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">เพศ (Gender)</label>
                            <SearchableSelect
                              value={formInput.gender}
                              options={[
                                { value: "Any", label: "ไม่จำกัดเพศ (Any)" },
                                { value: "Male", label: "ชาย (Male)" },
                                { value: "Female", label: "หญิง (Female)" }
                              ]}
                              onChange={(val) => setFormInput({ ...formInput, gender: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ช่วงอายุ (Age)</label>
                            <SearchableSelect
                              value={formInput.age}
                              placeholder="-- เลือกช่วงอายุ --"
                              options={AGE_OPTIONS.map(a => ({ value: a, label: a }))}
                              onChange={(val) => setFormInput({ ...formInput, age: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              ระดับการศึกษา (Education)
                            </label>
                            <SearchableSelect
                              value={formInput.education}
                              placeholder="-- เลือกหรือพิมพ์ระดับการศึกษา --"
                              options={EDUCATION_OPTIONS.map(e => ({ value: e, label: e }))}
                              onChange={(val) => setFormInput({ ...formInput, education: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สาขาวิชา (Major)</label>
                            <input
                              type="text"
                              placeholder="e.g. วิทยาการคอมพิวเตอร์"
                              value={formInput.major}
                              onChange={(e) => setFormInput({ ...formInput, major: e.target.value })}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              ประสบการณ์ในการทำงาน (Experience)
                            </label>
                            <SearchableSelect
                              value={formInput.experience}
                              placeholder="-- เลือกหรือพิมพ์ประสบการณ์ทำงาน --"
                              options={EXPERIENCE_OPTIONS.map(exp => ({ value: exp, label: exp }))}
                              onChange={(val) => setFormInput({ ...formInput, experience: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">คุณสมบัติที่จำเป็น / ทักษะ</label>
                            <input
                              type="text"
                              placeholder="e.g. ใบรับรองคนพิการ, React, Excel"
                              value={formInput.requiredSkills}
                              onChange={(e) => setFormInput({ ...formInput, requiredSkills: e.target.value })}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            />
                          </div>
                        </div>
                      </div>

                      {/* IT Assets Checklist Card */}
                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/60 pb-2">
                          <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5 text-xs">
                            <span className="w-2 h-2 rounded-full bg-sky-500"></span>
                            อุปกรณ์ IT & สิทธิ์การใช้งานที่ต้องจัดเตรียม (Equipment Setup)
                          </h4>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                          {[
                            { key: 'laptop', label: 'Laptop / PC', desc: 'เครื่องคอมพิวเตอร์' },
                            { key: 'simCard', label: 'Sim Card', desc: 'ซิมการ์ดโทรศัพท์' },
                            { key: 'email', label: 'Email Account', desc: 'อีเมลองค์กร' },
                            { key: 'netsuite', label: 'ERP NetSuite', desc: 'สิทธิ์ระบบ ERP' }
                          ].map(item => (
                            <label
                              key={item.key}
                              className={`p-3 rounded-xl border transition cursor-pointer flex flex-col justify-between ${
                                formInput.equipment[item.key]
                                  ? "bg-brand-50/90 dark:bg-brand-950/60 border-brand-300 dark:border-brand-700 text-brand-900 dark:text-brand-200 shadow-2xs"
                                  : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300"
                              }`}
                            >
                              <div className="flex items-center justify-between mb-1">
                                <span className="font-bold text-xs">{item.label}</span>
                                <input
                                  type="checkbox"
                                  checked={formInput.equipment[item.key]}
                                  onChange={(e) => setFormInput({
                                    ...formInput,
                                    equipment: { ...formInput.equipment, [item.key]: e.target.checked }
                                  })}
                                  className="w-4 h-4 rounded-md text-brand-600 focus:ring-brand-500 border-slate-300"
                                />
                              </div>
                              <span className="text-[10px] text-slate-400">{item.desc}</span>
                            </label>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}

                </form>

                {/* Modal Footer Action Bar */}
                <div className="px-6 py-4 bg-slate-50/90 dark:bg-slate-800/80 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-between shrink-0">
                  {formStep > 1 ? (
                    <button
                      type="button"
                      onClick={() => setFormStep(formStep - 1)}
                      className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-2xs transition active:scale-95 flex items-center gap-1.5"
                    >
                      <span>← ย้อนกลับ (Previous)</span>
                    </button>
                  ) : <div />}

                  {formStep < 3 ? (
                    <button
                      type="button"
                      onClick={() => setFormStep(formStep + 1)}
                      className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition active:scale-95 flex items-center gap-1.5"
                    >
                      <span>ถัดไป (Next Step) →</span>
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleFormSubmit}
                      className="px-6 py-2.5 rounded-xl text-xs font-extrabold text-white bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 shadow-md shadow-emerald-600/20 transition active:scale-95 flex items-center gap-1.5"
                    >
                      <span>✨ บันทึกคำขอกำลังคน (Submit Requisition)</span>
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {/* Details Modal */}
          {selectedDetailRequest && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 my-8">
                <div className="flex items-start justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-300">
                      {selectedDetailRequest.id}
                    </span>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-1">
                      {selectedDetailRequest.jobTitle}
                    </h3>
                    <p className="text-xs text-slate-500">{selectedDetailRequest.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailRequest(null)} className="p-2 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-4 max-h-[60vh] overflow-y-auto text-xs">
                  {(() => {
                    const sla = getSLAInfo(selectedDetailRequest.requestDate, selectedDetailRequest.stage);
                    return (
                      <div className={`p-3 rounded-xl flex items-center justify-between text-xs font-semibold ${
                        sla.isCompleted 
                          ? "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                          : sla.isOverdue
                            ? "bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-900"
                            : "bg-sky-50 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300 border border-sky-200 dark:border-sky-900"
                      }`}>
                        <div className="flex items-center gap-2">
                          <Icon name="clock" className="w-4 h-4" />
                          <span>วันที่ขอ: {selectedDetailRequest.requestDate} ({sla.daysElapsed} days elapsed)</span>
                        </div>
                        <div>
                          {sla.isCompleted ? (
                            <span>Closed</span>
                          ) : sla.isOverdue ? (
                            <span className="font-bold text-rose-600 dark:text-rose-400">SLA Overdue</span>
                          ) : (
                            <span>{sla.daysRemaining} days remaining (30d SLA)</span>
                          )}
                        </div>
                      </div>
                    );
                  })()}

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                    <div>
                      <p className="text-[10px] text-slate-400">อัตราที่ต้องการ</p>
                      <p className="font-bold text-brand-600">{selectedDetailRequest.headcountRequired} คน</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">ต้องการภายในวันที่</p>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{selectedDetailRequest.targetDate}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">รายละเอียดตำแหน่ง</p>
                      <p className="font-bold text-emerald-600">{selectedDetailRequest.positionType}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">สถานะเอกสาร</p>
                      <p className="font-bold text-amber-600">{selectedDetailRequest.docStatus || 'Pending'}</p>
                    </div>
                  </div>

                  {/* CANDIDATE & CV SECTION (ADMIN ONLY) */}
                  {isAdminAuthenticated && (
                    <div className="p-4 rounded-2xl bg-brand-50/50 dark:bg-brand-950/30 border border-brand-200 dark:border-brand-900 space-y-3">
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-brand-900 dark:text-brand-200 flex items-center gap-1.5 text-xs">
                          <Icon name="users" className="w-4 h-4 text-brand-600" />
                          Candidate Info & CV / Resume (Google Drive Link)
                        </h4>
                        {!isEditingCandidate && (
                          <button
                            onClick={() => setIsEditingCandidate(true)}
                            className="px-2.5 py-1 rounded-lg bg-brand-600 text-white font-semibold text-[11px] hover:bg-brand-700 transition"
                          >
                            Edit CV / Candidate Link
                          </button>
                        )}
                      </div>

                      {isEditingCandidate ? (
                        <div className="space-y-3 pt-2">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Candidate Full Name</label>
                            <input
                              type="text"
                              placeholder="e.g. นาย สมศักดิ์ มีสุข"
                              value={candidateNameInput}
                              onChange={(e) => setCandidateNameInput(e.target.value)}
                              className="w-full p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Google Drive Resume / CV Link</label>
                            <input
                              type="url"
                              placeholder="https://drive.google.com/file/d/..."
                              value={resumeUrlInput}
                              onChange={(e) => setResumeUrlInput(e.target.value)}
                              className="w-full p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                            />
                          </div>
                          <div className="flex gap-2 justify-end pt-1">
                            <button
                              onClick={() => setIsEditingCandidate(false)}
                              className="px-3 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                            >
                              Cancel
                            </button>
                            <button
                              onClick={() => handleSaveCandidateInfo(selectedDetailRequest.id)}
                              className="px-3 py-1.5 rounded-lg text-[11px] font-semibold text-white bg-emerald-600 hover:bg-emerald-700"
                            >
                              Save Candidate CV Link
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="text-xs space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                              <span className="text-[11px] text-slate-500">Candidate Name: </span>
                              <span className="font-bold text-slate-900 dark:text-white">
                                {selectedDetailRequest.candidateName || "No candidate assigned yet"}
                              </span>
                            </div>
                            {selectedDetailRequest.resumeUrl ? (
                              <a
                                href={selectedDetailRequest.resumeUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-semibold text-[11px] hover:bg-emerald-700 shadow-xs transition shrink-0"
                              >
                                Open CV (Google Drive) <Icon name="externalLink" className="w-3.5 h-3.5 text-white" />
                              </a>
                            ) : (
                              <span className="text-[11px] italic text-slate-400">No CV Drive Link Attached</span>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  <div>
                    <h4 className="font-bold text-slate-900 dark:text-white mb-1">ลักษณะงานโดยย่อ</h4>
                    <p className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {selectedDetailRequest.jobDescription}
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                      <p className="font-bold text-slate-900 dark:text-white mb-1">ข้อมูลผู้ขอ (Requester)</p>
                      <p>{selectedDetailRequest.requesterName} ({selectedDetailRequest.requesterPosition})</p>
                      <p className="text-brand-600">{selectedDetailRequest.requesterEmail}</p>
                    </div>
                    <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                      <p className="font-bold text-slate-900 dark:text-white mb-1">ข้อมูลผู้อนุมัติ (Approver)</p>
                      <p>{selectedDetailRequest.approverName}</p>
                      <p className="text-brand-600">{selectedDetailRequest.approverEmail}</p>
                    </div>
                  </div>

                  <div className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200/80 dark:border-slate-700 space-y-1">
                    <p><strong>ระดับการศึกษา:</strong> {selectedDetailRequest.education || '-'}</p>
                    <p><strong>ประสบการณ์ทำงาน:</strong> {selectedDetailRequest.experience || '-'}</p>
                    <p><strong>ส่งต่อให้กับ:</strong> {selectedDetailRequest.forwardTo || '-'} ({selectedDetailRequest.forwardEmail || '-'})</p>
                    <p><strong>ส่งต่อให้ People:</strong> {selectedDetailRequest.forwardToPeopleDept || '-'} ({selectedDetailRequest.peopleEmail || '-'})</p>
                    <p><strong>Buddy (พี่เลี้ยง):</strong> {selectedDetailRequest.buddy || '-'}</p>
                    <p><strong>วันที่แก้ไขล่าสุด:</strong> {selectedDetailRequest.lastUpdated || '-'}</p>
                  </div>

                  {selectedDetailRequest.cancellationReason && (
                    <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-800 dark:text-rose-300">
                      <p className="font-bold">Cancellation / Rejection Reason:</p>
                      <p className="mt-1">{selectedDetailRequest.cancellationReason}</p>
                    </div>
                  )}
                </div>

                <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setSelectedDetailRequest(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Personnel Directory Admin Modal */}
          {showPersonnelModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 my-8">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <Icon name="users" className="w-5 h-5 text-purple-600" />
                    จัดการรายชื่อบุคลากรในระบบ (Manage Personnel Directory)
                  </h3>
                  <button onClick={() => setShowPersonnelModal(false)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-4 text-xs max-h-[60vh] overflow-y-auto pr-1">
                  
                  {/* Add New Personnel Form */}
                  <form onSubmit={handleAddPerson} className="p-3.5 rounded-2xl bg-purple-50/50 dark:bg-purple-950/30 border border-purple-200 dark:border-purple-900 space-y-3">
                    <h4 className="font-bold text-purple-900 dark:text-purple-300 text-xs">➕ เพิ่มรายชื่อบุคลากรใหม่</h4>
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <input
                        type="text"
                        required
                        placeholder="ชื่อ-นามสกุล (e.g. สมชาย ใจดี)"
                        value={newPersonName}
                        onChange={(e) => setNewPersonName(e.target.value)}
                        className="p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-purple-500"
                      />
                      <input
                        type="email"
                        required
                        placeholder="Email (e.g. somchai.ja@valuesourcing.co)"
                        value={newPersonEmail}
                        onChange={(e) => setNewPersonEmail(e.target.value)}
                        className="p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-purple-500"
                      />
                      <input
                        type="text"
                        placeholder="ตำแหน่ง (e.g. Operations Manager)"
                        value={newPersonPosition}
                        onChange={(e) => setNewPersonPosition(e.target.value)}
                        className="p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-purple-500"
                      />
                      <SearchableSelect
                        value={newPersonDept}
                        options={DEPARTMENTS.map(d => ({ value: d, label: d }))}
                        onChange={(val) => setNewPersonDept(val)}
                        placeholder="-- เลือกแผนกสังกัด --"
                      />
                    </div>
                    <div className="flex justify-end">
                      <button
                        type="submit"
                        className="px-4 py-1.5 rounded-xl text-xs font-semibold text-white bg-purple-600 hover:bg-purple-700 transition"
                      >
                        + เพิ่มรายชื่อ
                      </button>
                    </div>
                  </form>

                  {/* Personnel Directory List */}
                  <div className="space-y-2">
                    <div className="flex items-center justify-between">
                      <h4 className="font-bold text-slate-800 dark:text-slate-200 text-xs">
                        รายชื่อบุคลากรปัจจุบัน ({personnelList.length} รายชื่อ)
                      </h4>
                      <button
                        type="button"
                        onClick={() => syncPersonnelFromGoogleSheet(true)}
                        disabled={isSyncingPersonnel}
                        className="text-[11px] font-semibold text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1"
                      >
                        <Icon name="refresh" className={`w-3.5 h-3.5 ${isSyncingPersonnel ? 'animate-spin' : ''}`} />
                        ซิงค์ข้อมูลจาก Google Sheet (gid=814265894)
                      </button>
                    </div>

                    {personnelList.map((person, idx) => (
                      <div 
                        key={`person-${idx}`}
                        className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-2"
                      >
                        {editingPersonIndex === idx ? (
                          <div className="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-2 w-full">
                            <input
                              type="text"
                              value={editPersonName}
                              onChange={(e) => setEditPersonName(e.target.value)}
                              className="p-1.5 text-xs rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600"
                            />
                            <input
                              type="email"
                              value={editPersonEmail}
                              onChange={(e) => setEditPersonEmail(e.target.value)}
                              className="p-1.5 text-xs rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600"
                            />
                            <input
                              type="text"
                              value={editPersonPosition}
                              onChange={(e) => setEditPersonPosition(e.target.value)}
                              className="p-1.5 text-xs rounded-lg bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-600"
                            />
                            <SearchableSelect
                              value={editPersonDept}
                              options={DEPARTMENTS.map(d => ({ value: d, label: d }))}
                              onChange={(val) => setEditPersonDept(val)}
                              placeholder="-- เลือกแผนก --"
                            />
                          </div>
                        ) : (
                          <div className="flex-1">
                            <div className="font-bold text-slate-900 dark:text-white text-xs">{person.name}</div>
                            <div className="text-[11px] text-brand-600 dark:text-brand-400">{person.email || "No Email"}</div>
                            <div className="text-[10px] text-slate-400">{person.position || "Staff"} &bull; {person.department || "-"}</div>
                          </div>
                        )}

                        <div className="flex items-center gap-1 shrink-0">
                          {editingPersonIndex === idx ? (
                            <button
                              type="button"
                              onClick={() => handleSaveEditPerson(idx)}
                              className="px-2.5 py-1 rounded-lg text-[10px] font-bold text-white bg-emerald-600 hover:bg-emerald-700 transition"
                            >
                              บันทึก
                            </button>
                          ) : (
                            <button
                              type="button"
                              onClick={() => {
                                setEditingPersonIndex(idx);
                                setEditPersonName(person.name);
                                setEditPersonEmail(person.email);
                                setEditPersonPosition(person.position || "");
                                setEditPersonDept(person.department || "-");
                              }}
                              className="px-2 py-1 rounded-lg text-[10px] font-semibold bg-slate-200 text-slate-700 dark:bg-slate-700 dark:text-slate-200 hover:bg-slate-300 transition"
                            >
                              แก้ไข
                            </button>
                          )}
                          <button
                            type="button"
                            onClick={() => handleDeletePerson(idx)}
                            className="px-2 py-1 rounded-lg text-[10px] font-semibold text-rose-600 hover:bg-rose-50 dark:hover:bg-rose-950 transition"
                          >
                            ลบ
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>

                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setShowPersonnelModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Cancel Reason Modal */}
          {cancelModalItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6">
                <h3 className="text-base font-bold text-rose-600 dark:text-rose-400 mb-2">
                  Cancellation / Rejection Reason
                </h3>
                <p className="text-xs text-slate-500 mb-4">
                  Please specify why position ID <strong>{cancelModalItem.id}</strong> is being cancelled or rejected.
                </p>

                <textarea
                  rows="3"
                  autoFocus
                  placeholder="e.g. Budget revoked, Position on hold, Candidate declined..."
                  value={cancelReasonInput}
                  onChange={(e) => setCancelReasonInput(e.target.value)}
                  className="w-full p-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500 mb-4"
                ></textarea>

                <div className="flex gap-2 justify-end">
                  <button
                    onClick={() => setCancelModalItem(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      updateStageDirectly(cancelModalItem.id, cancelModalItem.targetStage, cancelReasonInput || "Cancelled by admin");
                      setCancelModalItem(null);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700"
                  >
                    Confirm Stage Change
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Sheets Config Modal */}
          {showSheetsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <Icon name="refresh" className="w-5 h-5 text-brand-600" />
                    Google Sheets Real-Time Sync Setup
                  </h3>
                  <button onClick={() => setShowSheetsModal(false)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Target Google Sheet Link:</label>
                    <a
                      href={GOOGLE_SHEET_URL}
                      target="_blank"
                      rel="noreferrer"
                      className="text-brand-600 font-medium hover:underline flex items-center gap-1"
                    >
                      {GOOGLE_SHEET_URL} <Icon name="externalLink" className="w-3.5 h-3.5" />
                    </a>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Google Apps Script Web App URL (for live POST sync):</label>
                    <input
                      type="url"
                      placeholder="https://script.google.com/macros/s/AKfycbx.../exec"
                      value={googleScriptUrl}
                      onChange={(e) => setGoogleScriptUrl(e.target.value)}
                      className="w-full p-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">Paste your deployed Apps Script Web App URL here to stream submissions live into Google Sheets.</p>
                  </div>
                </div>

                <div className="flex gap-2 justify-end pt-2 border-t border-slate-200 dark:border-slate-800">
                  <button
                    onClick={() => setShowSheetsModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white hover:bg-brand-700"
                  >
                    Save &amp; Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Admin Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <div className="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center mx-auto mb-3">
                  <Icon name="lock" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-900 dark:text-white">Admin Authentication</h3>
                <p className="text-xs text-slate-500 mt-1 mb-4">Enter passcode to access HR Admin Portal</p>

                <form onSubmit={handleAdminLoginSubmit} className="space-y-4">
                  <input
                    type="password"
                    autoFocus
                    placeholder="Enter passcode (admin123)"
                    value={adminPasscode}
                    onChange={(e) => setAdminPasscode(e.target.value)}
                    className="w-full p-2.5 text-sm text-center tracking-widest rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                  />
                  {loginError && <p className="text-[11px] text-rose-500 font-medium">{loginError}</p>}

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowLoginModal(false)}
                      className="w-1/2 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 rounded-xl text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700"
                    >
                      Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
