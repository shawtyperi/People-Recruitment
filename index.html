    /* CSV Parser Helper for Google Sheet Direct Export */
    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ value, onChange, options, placeholder = "-- Select / เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      const normalizedOptions = useMemo(() => {
        return options.map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์ (No matching options)</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    function App() {
      const [requests, setRequests] = useState(() => {
        const saved = localStorage.getItem("hr_headcount_requests_v10");
        return saved ? JSON.parse(saved) : INITIAL_RECRUITMENT_DATA;
      });

      const [personnelList, setPersonnelList] = useState(() => {
        const saved = localStorage.getItem("hr_personnel_list_v10");
        return saved ? JSON.parse(saved) : INITIAL_PERSONNEL_LIST;
      });

      const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfdg3PLNPbtKDaWEZ7aeU9MRur3jr7AeJ8wc/exec";

      const [googleScriptUrl, setGoogleScriptUrl] = useState(() => {
        return localStorage.getItem("hr_google_script_url") || DEFAULT_SCRIPT_URL;
      });

      const [isSyncingPersonnel, setIsSyncingPersonnel] = useState(false);

      const syncPersonnelFromGoogleSheet = async (showToast = false) => {
        setIsSyncingPersonnel(true);
        try {
          const res = await fetch(GOOGLE_SHEET_DIRECTORY_CSV_URL);
          if (!res.ok) throw new Error("Network response was not ok");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const headers = rows[0].map(h => h.toLowerCase().trim());
            
            let posColIdx = -1;
            let emailColIdx = -1;
            let deptColIdx = -1;

            headers.forEach((h, idx) => {
              if (idx !== 2 && idx !== 3) {
                if (h.includes("email") || h.includes("อีเมล") || h.includes("mail")) emailColIdx = idx;
                if (h.includes("ตำแหน่ง") || h.includes("position") || h.includes("title")) posColIdx = idx;
                if (h.includes("แผนก") || h.includes("department") || h.includes("dept") || h.includes("สังกัด") || h.includes("ฝ่าย")) deptColIdx = idx;
              }
            });

            const loadedList = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length <= 2) continue;
              
              const nameVal = r[2]?.trim();
              if (!nameVal || nameVal.toLowerCase().includes("ชื่อ") || nameVal.toLowerCase().includes("name") || nameVal === "C") continue;

              let deptVal = r[3]?.trim();
              if (!deptVal && deptColIdx !== -1) {
                deptVal = r[deptColIdx]?.trim();
              }

              let emailVal = emailColIdx !== -1 ? r[emailColIdx]?.trim() : "";
              let posVal = posColIdx !== -1 ? r[posColIdx]?.trim() : "";

              if (!emailVal) {
                const found = r.find(c => c && c.includes("@"));
                if (found) emailVal = found.trim();
              }

              loadedList.push({
                name: nameVal,
                email: emailVal || "",
                position: posVal || "Staff",
                department: deptVal || "-"
              });
            }

            if (loadedList.length > 0) {
              setPersonnelList(loadedList);
              localStorage.setItem("hr_personnel_list_v10", JSON.stringify(loadedList));
              if (showToast) triggerToast(`ซิงค์รายชื่อผู้ขอ (คอลัมน์ C:C) และฝ่ายงาน (คอลัมน์ D:D) สำเร็จ! (${loadedList.length} รายชื่อ)`);
            }
          }
        } catch (err) {
          console.warn("Could not fetch live sheet CSV, using cached personnel data.", err);
          if (showToast) triggerToast("ไม่สามารถดึงข้อมูลจาก Google Sheet ได้โดยตรง (ใช้ออฟไลน์ข้อมูลแคชเดิม)");
        } finally {
          setIsSyncingPersonnel(false);
        }
      };

      useEffect(() => {
        syncPersonnelFromGoogleSheet(false);
      }, []);

      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem("theme_mode") === "dark" || 
               (!('theme_mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches);
      });

      const [currentView, setCurrentView] = useState("public");
      const [isAdminAuthenticated, setIsAdminAuthenticated] = useState(false);
      const [showLoginModal, setShowLoginModal] = useState(false);
      const [showSheetsModal, setShowSheetsModal] = useState(false);
      const [showPersonnelModal, setShowPersonnelModal] = useState(false);
      const [adminPasscode, setAdminPasscode] = useState("");
      const [loginError, setLoginError] = useState("");

      const [newPersonName, setNewPersonName] = useState("");
      const [newPersonEmail, setNewPersonEmail] = useState("");
      const [newPersonPosition, setNewPersonPosition] = useState("");
      const [newPersonDept, setNewPersonDept] = useState("-");
      const [editingPersonIndex, setEditingPersonIndex] = useState(null);
      const [editPersonName, setEditPersonName] = useState("");
      const [editPersonEmail, setEditPersonEmail] = useState("");
      const [editPersonPosition, setEditPersonPosition] = useState("");
      const [editPersonDept, setEditPersonDept] = useState("-");

      const [searchQuery, setSearchQuery] = useState("");
      const [selectedMonthFilter, setSelectedMonthFilter] = useState("ALL");
      const [selectedYearFilter, setSelectedYearFilter] = useState("ALL");

      const [showRequestModal, setShowRequestModal] = useState(false);
      const [selectedDetailRequest, setSelectedDetailRequest] = useState(null);
      const [selectedDepartmentDetail, setSelectedDepartmentDetail] = useState(null);
      const [cancelModalItem, setCancelModalItem] = useState(null);
      const [cancelReasonInput, setCancelReasonInput] = useState("");
      const [toastMessage, setToastMessage] = useState("");

      const [activeKpiModalType, setActiveKpiModalType] = useState(null);
      const [isEditingCandidate, setIsEditingCandidate] = useState(false);
      const [candidateNameInput, setCandidateNameInput] = useState("");
      const [resumeUrlInput, setResumeUrlInput] = useState("");
      const [draggedRequestId, setDraggedRequestId] = useState(null);

      const initialForm = {
        requesterName: "",
        requesterPosition: "",
        requesterEmail: "",
        approverName: "",
        approverEmail: "",
        forwardTo: "",
        forwardEmail: "",
        approverNote1: "",
        approvalStatusL1: "Approved",
        approvalStatusL2: "Pending",
        detailsForPeople: "",
        headcountRequired: 1,
        positionType: "Replacement",
        docStatus: "Pending",
        forwardToPeopleDept: "ศรัณย์ภัทธ อุบล",
        peopleEmail: "sarunpat.ub@valuesourcing.co",
        buddy: "",
        jobTitle: "",
        department: DEPARTMENTS[0],
        jobDescription: "",
        gender: "Any",
        age: "Under 35",
        education: EDUCATION_OPTIONS[4],
        major: "-",
        experience: EXPERIENCE_OPTIONS[2],
        requiredSkills: "",
        targetDate: new Date().toISOString().split('T')[0],
        equipment: { laptop: true, simCard: false, email: true, netsuite: false }
      };

      const [formInput, setFormInput] = useState(initialForm);
      const [formStep, setFormStep] = useState(1);

      useEffect(() => {
        localStorage.setItem("hr_personnel_list_v10", JSON.stringify(personnelList));
      }, [personnelList]);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('theme_mode', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('theme_mode', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem("hr_headcount_requests_v10", JSON.stringify(requests));
      }, [requests]);

      useEffect(() => {
        localStorage.setItem("hr_google_script_url", googleScriptUrl);
      }, [googleScriptUrl]);

      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        if (params.get('openRequest') === 'true') {
          setShowRequestModal(true);
        }
      }, []);

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 3500);
      };

      const handleAddPerson = (e) => {
        e.preventDefault();
        if (!newPersonName.trim() || !newPersonEmail.trim()) return;
        setPersonnelList(prev => [...prev, { 
          name: newPersonName.trim(), 
          email: newPersonEmail.trim(),
          position: newPersonPosition.trim() || "Staff",
          department: newPersonDept || "-"
        }]);
        setNewPersonName("");
        setNewPersonEmail("");
        setNewPersonPosition("");
        triggerToast("เพิ่มรายชื่อบุคลากรและข้อมูลตำแหน่งเรียบร้อยแล้ว!");
      };

      const handleSaveEditPerson = (index) => {
        if (!editPersonName.trim() || !editPersonEmail.trim()) return;
        setPersonnelList(prev => prev.map((p, i) => i === index ? { 
          name: editPersonName.trim(), 
          email: editPersonEmail.trim(),
          position: editPersonPosition.trim() || p.position || "Staff",
          department: editPersonDept || p.department || "-"
        } : p));
        setEditingPersonIndex(null);
        triggerToast("อัปเดตข้อมูลบุคลากรเรียบร้อยแล้ว!");
      };

      const handleDeletePerson = (index) => {
        setPersonnelList(prev => prev.filter((_, i) => i !== index));
        triggerToast("ลบรายชื่อบุคลากรเรียบร้อยแล้ว!");
      };

      const handleCopyShareLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const shareUrl = `${baseUrl}?openRequest=true`;
        
        const textArea = document.createElement("textarea");
        textArea.value = shareUrl;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          triggerToast("คัดลอกลิงก์ฟอร์มแล้ว! ส่งต่อให้ผู้อื่นกรอกขอกำลังคนได้ทันที 🔗");
        } catch (err) {
          triggerToast("Share Link: " + shareUrl);
        }
        document.body.removeChild(textArea);
      };

      const filteredRequests = useMemo(() => {
        return requests.filter(r => {
          const query = searchQuery.toLowerCase();
          const matchQuery = (r.jobTitle || "").toLowerCase().includes(query) ||
                             (r.id || "").toLowerCase().includes(query) ||
                             (r.department || "").toLowerCase().includes(query) ||
                             (r.requesterName || "").toLowerCase().includes(query);

          if (!matchQuery) return false;

          const reqDate = new Date(r.requestDate);
          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          return matchMonth && matchYear;
        });
      }, [requests, searchQuery, selectedMonthFilter, selectedYearFilter]);

      const departmentStats = useMemo(() => {
        const statsMap = {};
        DEPARTMENTS.forEach(dept => {
          statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
        });

        filteredRequests.forEach(r => {
          const dept = r.department;
          if (!statsMap[dept]) {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }
          const hc = Number(r.headcountRequired) || 1;
          statsMap[dept].total += hc;
          if (r.stage === "onboarded") {
            statsMap[dept].filled += hc;
          } else if (r.stage === "cancelled") {
            statsMap[dept].cancelled += hc;
          } else {
            statsMap[dept].open += hc;
          }
        });

        return Object.entries(statsMap)
          .map(([department, counts]) => ({ department, ...counts }))
          .sort((a, b) => b.total - a.total);
      }, [filteredRequests]);

      const kpis = useMemo(() => {
        const totalReq = filteredRequests.reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        const openReq = filteredRequests.filter(r => r.stage !== "onboarded" && r.stage !== "cancelled").reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        const filledReq = filteredRequests.filter(r => r.stage === "onboarded").reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        const cancelledReq = filteredRequests.filter(r => r.stage === "cancelled").reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        return { totalReq, openReq, filledReq, cancelledReq };
      }, [filteredRequests]);

      const activeKpiItems = useMemo(() => {
        if (!activeKpiModalType) return [];
        if (activeKpiModalType === "total") return filteredRequests;
        if (activeKpiModalType === "open") return filteredRequests.filter(r => r.stage !== "onboarded" && r.stage !== "cancelled");
        if (activeKpiModalType === "filled") return filteredRequests.filter(r => r.stage === "onboarded");
        if (activeKpiModalType === "cancelled") return filteredRequests.filter(r => r.stage === "cancelled");
        return [];
      }, [filteredRequests, activeKpiModalType]);

      const activeKpiTitle = useMemo(() => {
        if (activeKpiModalType === "total") return "Total Headcount Requisitions";
        if (activeKpiModalType === "open") return "Open Pipeline Positions";
        if (activeKpiModalType === "filled") return "Onboarded / Filled Positions";
        if (activeKpiModalType === "cancelled") return "Cancelled / On Hold Requests";
        return "";
      }, [activeKpiModalType]);

      const departmentModalRequests = useMemo(() => {
        if (!selectedDepartmentDetail) return [];
        return filteredRequests.filter(r => r.department === selectedDepartmentDetail);
      }, [filteredRequests, selectedDepartmentDetail]);

      const departmentModalStats = useMemo(() => {
        if (!selectedDepartmentDetail) return { total: 0, open: 0, filled: 0, cancelled: 0 };
        let total = 0, open = 0, filled = 0, cancelled = 0;
        departmentModalRequests.forEach(r => {
          const hc = Number(r.headcountRequired) || 1;
          total += hc;
          if (r.stage === "onboarded") filled += hc;
          else if (r.stage === "cancelled") cancelled += hc;
          else open += hc;
        });
        return { total, open, filled, cancelled };
      }, [departmentModalRequests, selectedDepartmentDetail]);

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPasscode === "admin123" || adminPasscode === "hr2025") {
          setIsAdminAuthenticated(true);
          setShowLoginModal(false);
          setCurrentView("admin");
          setAdminPasscode("");
          setLoginError("");
          triggerToast("Authenticated as HR Admin");
        } else {
          setLoginError("Invalid passcode. Try 'admin123'");
        }
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().split(' ')[0];

        const newId = `REQ-${now.getFullYear()}-${String(requests.length + 1).padStart(3, '0')}`;
        const newReq = {
          ...formInput,
          id: newId,
          requestDate: dateStr,
          lastUpdated: `${dateStr} ${timeStr}`,
          approvalStatusL1: formInput.approvalStatusL1 || "Approved",
          approvalStatusL2: formInput.approvalStatusL2 || "Pending",
          docStatus: formInput.docStatus || "Pending",
          stage: "received",
          cancellationReason: "",
          candidateName: "",
          resumeUrl: ""
        };

        setRequests([newReq, ...requests]);
        setShowRequestModal(false);
        setFormInput(initialForm);
        setFormStep(1);

        if (googleScriptUrl) {
          try {
            fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify(newReq)
            });
            triggerToast("บันทึกสำเร็จ & ซิงค์ข้อมูลลง Google Sheet เรียบร้อยแล้ว! 📊");
          } catch (err) {
            triggerToast("บันทึกในแอปสำเร็จ (แต่ซิงค์ Google Sheet ขัดข้อง)");
          }
        } else {
          triggerToast("บันทึกในแอปสำเร็จ!");
        }
      };

      const handleSaveCandidateInfo = (id) => {
        setRequests(prev => prev.map(r => {
          if (r.id === id) {
            return {
              ...r,
              candidateName: candidateNameInput,
              resumeUrl: resumeUrlInput,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));
        setSelectedDetailRequest(prev => prev ? { ...prev, candidateName: candidateNameInput, resumeUrl: resumeUrlInput } : null);
        setIsEditingCandidate(false);
        triggerToast("Saved Candidate CV/Resume link successfully!");
      };

      const updateStageDirectly = (id, targetStage, reason = "") => {
        setRequests(prev => prev.map(r => {
          if (r.id === id) {
            return {
              ...r,
              stage: targetStage,
              cancellationReason: reason || r.cancellationReason,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));
        triggerToast(`Updated stage to ${targetStage}`);
      };

      const handleDragStart = (e, id) => {
        setDraggedRequestId(id);
        e.dataTransfer.setData("text/plain", id);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e, targetStage) => {
        e.preventDefault();
        const id = draggedRequestId || e.dataTransfer.getData("text/plain");
        if (!id) return;

        if (targetStage === "cancelled") {
          setCancelModalItem({ id, targetStage });
          setCancelReasonInput("");
        } else {
          updateStageDirectly(id, targetStage);
        }
        setDraggedRequestId(null);
      };

      const exportToCSV = () => {
        const headers = [
          "Request ID", "Date", "Days Elapsed", "SLA Status (30 Days)", "Requester", "Requester Title", "Requester Email",
          "Approver L1", "Approver Email", "Forward To", "Forward Email", "Forward People Dept", "People Email", "Buddy",
          "Status L1", "Status L2", "Doc Status",
          "Job Title", "Department", "Headcount", "Position Type", "Candidate Name", "CV / Resume Drive Link",
          "Job Summary", "Details For People", "Approver Note 1", "Gender", "Age", "Education", "Major", "Experience", "Required Skills", "Target Date",
          "Laptop", "Sim Card", "Email Account", "Netsuite ERP", "Stage", "Cancel Reason", "Last Updated"
        ];

        const rows = requests.map(r => {
          const sla = getSLAInfo(r.requestDate, r.stage);
          const slaLabel = sla.isCompleted ? "Closed" : (sla.isOverdue ? `Overdue (${sla.daysElapsed}d)` : `Within SLA (${sla.daysElapsed}d)`);

          return [
            r.id,
            r.requestDate,
            sla.daysElapsed,
            slaLabel,
            `"${r.requesterName || ''}"`,
            `"${r.requesterPosition || ''}"`,
            r.requesterEmail || '',
            `"${r.approverName || ''}"`,
            r.approverEmail || '',
            `"${r.forwardTo || ''}"`,
            r.forwardEmail || '',
            `"${r.forwardToPeopleDept || ''}"`,
            r.peopleEmail || '',
            `"${r.buddy || ''}"`,
            r.approvalStatusL1 || 'Approved',
            r.approvalStatusL2 || 'Pending',
            r.docStatus || 'Pending',
            `"${r.jobTitle || ''}"`,
            `"${r.department || ''}"`,
            r.headcountRequired || 1,
            `"${r.positionType || ''}"`,
            `"${r.candidateName || ''}"`,
            `"${r.resumeUrl || ''}"`,
            `"${(r.jobDescription || '').replace(/"/g, '""')}"`,
            `"${(r.detailsForPeople || '').replace(/"/g, '""')}"`,
            `"${(r.approverNote1 || '').replace(/"/g, '""')}"`,
            r.gender || 'Any',
            `"${r.age || ''}"`,
            `"${r.education || ''}"`,
            `"${r.major || ''}"`,
            `"${r.experience || ''}"`,
            `"${(r.requiredSkills || '').replace(/"/g, '""')}"`,
            r.targetDate || '',
            r.equipment?.laptop ? "Yes" : "No",
            r.equipment?.simCard ? "Yes" : "No",
            r.equipment?.email ? "Yes" : "No",
            r.equipment?.netsuite ? "Yes" : "No",
            r.stage,
            `"${(r.cancellationReason || '').replace(/"/g, '""')}"`,
            r.lastUpdated
          ];
        });

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `HR_Headcount_Export_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          {/* Top Header Bar */}
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                {/* Logo & Title */}
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-400 dark:text-slate-400 font-normal mt-0.5">Headcount Tracking & SLA Lead Time (Target: 30 Days)</p>
                  </div>
                </div>

                {/* Header Action Buttons */}
                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    title="Toggle Light/Dark Theme"
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {
                        if (isAdminAuthenticated) {
                          setCurrentView("admin");
                        } else {
                          setShowLoginModal(true);
                        }
                      }}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Admin Portal</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setCurrentView("public")}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                      >
                        <Icon name="grid" className="w-3.5 h-3.5" />
                        <span>Public View</span>
                      </button>
                      <button
                        onClick={() => {
                          setIsAdminAuthenticated(false);
                          setCurrentView("public");
                          triggerToast("Logged out of Admin Portal");
                        }}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 transition"
                      >
                        <Icon name="logOut" className="w-3.5 h-3.5" />
                        <span className="hidden sm:inline">Logout</span>
                      </button>
                    </div>
                  )}

                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => {
                        setFormStep(1);
                        setShowRequestModal(true);
                      }}
                      className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition hover:scale-[1.02]"
                    >
                      <Icon name="plus" className="w-4 h-4 text-white" />
                      <span>+ Request Headcount</span>
                    </button>
                    
                    <button
                      onClick={handleCopyShareLink}
                      title="คัดลอกลิงก์ฟอร์มขอกำลังคน"
                      className="p-2 sm:p-2.5 rounded-xl text-brand-700 dark:text-brand-300 bg-brand-50 dark:bg-brand-950 hover:bg-brand-100 dark:hover:bg-brand-900 border border-brand-200 dark:border-brand-800 transition active:scale-95"
                    >
                      <Icon name="link" className="w-4 h-4 text-brand-600 dark:text-brand-400" />
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* Clickable KPI Cards Overview */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div 
                onClick={() => setActiveKpiModalType("total")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-brand-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-brand-600 transition">Total Headcount</p>
                  <p className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{kpis.totalReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div 
                onClick={() => setActiveKpiModalType("open")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-amber-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-amber-600 transition">Open Pipeline</p>
                  <p className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{kpis.openReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div 
                onClick={() => setActiveKpiModalType("filled")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-emerald-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-emerald-600 transition">Onboarded / Filled</p>
                  <p className="text-xl sm:text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{kpis.filledReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div 
                onClick={() => setActiveKpiModalType("cancelled")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-rose-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-rose-600 transition">Cancelled / On Hold</p>
                  <p className="text-xl sm:text-2xl font-bold text-rose-600 dark:text-rose-400 mt-1">{kpis.cancelledReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="x" className="w-5 h-5 text-rose-600" />
                </div>
              </div>
            </div>

            {/* Public View Views */}
            {currentView === "public" && (
              <div className="space-y-8">
                
                {/* SECTION 1: RECRUITMENT STAGE TRACKER (READ-ONLY KANBAN) */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span className="p-2 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400">
                          <Icon name="grid" className="w-5 h-5 text-amber-600 dark:text-amber-400" />
                        </span>
                        Recruitment Stage Tracker
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        Current progress of open positions across recruitment stages. Click any position card to view full details.
                      </p>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4 text-slate-400" />
                      </div>
                      <input
                        type="text"
                        placeholder="Search title, ID, department..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  {/* Kanban Horizontal Scroll Columns */}
                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = filteredRequests.filter(r => r.stage === stage.id);
                      return (
                        <div 
                          key={stage.id} 
                          className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border border-slate-200/60 dark:border-slate-800"
                        >
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">
                              {stage.label}
                            </span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px] pr-0.5">
                            {stageItems.length === 0 ? (
                              <div className="py-8 text-center text-[11px] text-slate-400 italic">No positions</div>
                            ) : (
                              stageItems.map(item => {
                                const sla = getSLAInfo(item.requestDate, item.stage);
                                return (
                                  <div
                                    key={item.id}
                                    onClick={() => {
                                      setSelectedDetailRequest(item);
                                      setIsEditingCandidate(false);
                                      setCandidateNameInput(item.candidateName || "");
                                      setResumeUrlInput(item.resumeUrl || "");
                                    }}
                                    className="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 shadow-xs hover:border-brand-400 transition cursor-pointer group"
                                  >
                                    <div className="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                                      <span>{item.id}</span>
                                      <span className="text-brand-600 dark:text-brand-400 font-bold">{item.headcountRequired} Headcount</span>
                                    </div>
                                    <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                      {item.jobTitle}
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 truncate">
                                      {item.department}
                                    </p>

                                    {/* SLA Lead Time Badge Counter */}
                                    <div className="mt-2 inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-md">
                                      {sla.isCompleted ? (
                                        <span className="bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                          ⏱️ Closed in {sla.daysElapsed} days
                                        </span>
                                      ) : sla.isOverdue ? (
                                        <span className="bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 animate-pulse">
                                          ⚠️ SLA Overdue: {sla.daysElapsed} days open
                                        </span>
                                      ) : (
                                        <span className="bg-sky-50 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">
                                          ⏱️ Open {sla.daysElapsed}d ({sla.daysRemaining}d SLA left)
                                        </span>
                                      )}
                                    </div>

                                    <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[10px] text-slate-400">
                                      <span>Target: {item.targetDate}</span>
                                      <span className="text-brand-500 font-semibold">Details &rarr;</span>
                                    </div>
                                  </div>
                                );
                              })
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* SECTION 2: COMPACT DEPARTMENT HEADCOUNT DEMAND GRID */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span className="p-2 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400">
                          <Icon name="chart" className="w-5 h-5 text-brand-600 dark:text-brand-400" />
                        </span>
                        Headcount Demand by Department
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        Compact overview of total requested headcounts broken down by department. Click any card to inspect details.
                      </p>
                    </div>

                    <div className="flex items-center gap-2 text-xs">
                      <select
                        value={selectedMonthFilter}
                        onChange={(e) => setSelectedMonthFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Months</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                      </select>
                      <select
                        value={selectedYearFilter}
                        onChange={(e) => setSelectedYearFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Years</option>
                        <option value="2026">2026</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1">
                    {departmentStats.map((item, idx) => {
                      const maxTotal = departmentStats[0]?.total || 1;
                      const percent = Math.min(100, Math.round((item.total / maxTotal) * 100));

                      return (
                        <div 
                          key={item.department} 
                          onClick={() => setSelectedDepartmentDetail(item.department)}
                          className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:bg-white dark:hover:bg-slate-800 hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                        >
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 dark:group-hover:text-brand-400 transition">
                              <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                              {item.department}
                            </span>
                            <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                              <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                              <span className="text-amber-600">Open: {item.open}</span>
                              <span className="text-emerald-600">Filled: {item.filled}</span>
                            </div>
                          </div>

                          <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                            <div 
                              className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full transition-all duration-500"
                              style={{ width: `${item.total > 0 ? percent : 0}%` }}
                            ></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}

            {/* Admin View Views */}
            {currentView === "admin" && (
              <div className="space-y-8">
                
                {/* ADMIN INTERACTIVE DRAG-AND-DROP KANBAN */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span className="p-2 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400">
                          <Icon name="grid" className="w-5 h-5 text-brand-600 dark:text-brand-400" />
                        </span>
                        Interactive Kanban Pipeline (Drag & Drop to Change Stage)
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        Drag cards between columns to update recruitment stages instantly.
                      </p>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4 text-slate-400" />
                      </div>
                      <input
                        type="text"
                        placeholder="Search positions..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = filteredRequests.filter(r => r.stage === stage.id);
                      return (
                        <div 
                          key={stage.id} 
                          onDragOver={handleDragOver}
                          onDrop={(e) => handleDrop(e, stage.id)}
                          className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border-2 border-dashed border-slate-200 dark:border-slate-800 transition hover:border-brand-400"
                        >
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">
                              {stage.label}
                            </span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px] pr-0.5">
                            {stageItems.length === 0 ? (
                              <div className="py-8 text-center text-[11px] text-slate-400 italic">Drag cards here</div>
                            ) : (
                              stageItems.map(item => {
                                const sla = getSLAInfo(item.requestDate, item.stage);
                                return (
                                  <div
                                    key={item.id}
                                    draggable
                                    onDragStart={(e) => handleDragStart(e, item.id)}

                                          setResumeUrlInput(item.resumeUrl || "");

                                        Details

                                  </div>

                      );

                          <span className="px-2 py-0.5 rounded-md bg-amber-100 text-amber-700 dark:bg-amber-950 dark:text-amber-300 text-[10px] font-bold">

                          <th className="px-4 py-3">ID / Date</th>
                          <th className="px-4 py-3">Job Title</th>
                          <th className="px-4 py-3">Requester & Dept</th>
                          <th className="px-4 py-3">Candidate & CV</th>

                          <th className="px-4 py-3">Stage</th>
                          <th className="px-4 py-3 text-center">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                        {filteredRequests.map(r => {
                          const sla = getSLAInfo(r.requestDate, r.stage);
                          return (
                            <tr key={r.id} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40">
                              <td className="px-4 py-3 font-semibold text-slate-900 dark:text-white whitespace-nowrap">

                                <div className="text-[10px] text-slate-400">{r.requestDate}</div>
                              </td>
                              <td className="px-4 py-3 font-bold text-slate-900 dark:text-white">

                                <div className="text-[10px] font-normal text-slate-400">{r.positionType}</div>

                              <td className="px-4 py-3">

                                <div className="text-[10px] text-slate-400">{r.department}</div>

                              <td className="px-4 py-3">
                                {r.candidateName ? (
                                  <div>
                                    <span className="font-semibold text-slate-900 dark:text-white">{r.candidateName}</span>

                                      <a
                                        href={r.resumeUrl}

                                        className="block text-[10px] text-emerald-600 hover:underline"

                                      </a>

                                  </div>
                                ) : (
                                  <span className="text-[10px] text-slate-400 italic">Unassigned</span>
                                )}

                              <td className="px-4 py-3 whitespace-nowrap">
                                {sla.isCompleted ? (
                                  <span className="text-[11px] font-semibold text-slate-500">Completed in {sla.daysElapsed}d</span>
                                ) : sla.isOverdue ? (
                                  <span className="text-[11px] font-bold text-rose-600 dark:text-rose-400">⚠️ {sla.daysElapsed}d (Overdue)</span>
                                ) : (
                                  <span className="text-[11px] font-semibold text-sky-600 dark:text-sky-400">⏱️ {sla.daysElapsed}d ({sla.daysRemaining}d left)</span>
                                )}

                                <select

                                    const targetStage = e.target.value;

                                    } else {
                                      updateStageDirectly(r.id, targetStage);
                                    }
                                  }}
                                  className="text-xs p-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                                >
                                  {STAGES.map(s => (
                                    <option key={s.id} value={s.id}>{s.label}</option>

                                </select>
                              </td>
                              <td className="px-4 py-3 text-center whitespace-nowrap">
                                <button
                                  onClick={() => {
                                    setSelectedDetailRequest(r);
                                    setIsEditingCandidate(false);
                                    setCandidateNameInput(r.candidateName || "");
                                    setResumeUrlInput(r.resumeUrl || "");

                                >
                                  <Icon name="eye" className="w-4 h-4" />
                                </button>
                              </td>
                            </tr>

                        })}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            )}

                  </div>

                            setCandidateNameInput(item.candidateName || "");
                            setResumeUrlInput(item.resumeUrl || "");

                        >
                          <div>
                            <div className="flex items-center gap-2 text-[10px] text-slate-400 mb-1">
                              <span className="font-bold text-slate-600 dark:text-slate-300">{item.id}</span>
                              <span>&bull;</span>
                              <span>Requested: {item.requestDate}</span>

                            <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5">

                            </p>

                          </div>

                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* KPI Modal */}
          {activeKpiModalType && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">

                            setIsEditingCandidate(false);
                            setCandidateNameInput(item.candidateName || "");
                            setResumeUrlInput(item.resumeUrl || "");

                              <span>Requested: {item.requestDate}</span>

                              {item.jobTitle}

                            <p className="text-xs text-slate-500 dark:text-slate-400">

                              Stage: {item.stage}
                            </span>
                            
                            <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md ${

                        <span className="hidden sm:inline-block text-[11px] font-medium px-2.5 py-0.5 rounded-full bg-brand-50 dark:bg-brand-950 text-brand-700 dark:text-brand-300 border border-brand-200/60 dark:border-brand-800/60">

                    </button>

                      <Icon name="x" className="w-5 h-5" />
