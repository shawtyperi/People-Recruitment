                                          <div className="text-[9px] text-slate-400 pl-1 truncate max-w-[170px]" title={duration.rangeText}>
                                            {duration.rangeText}
                                          </div>
                                        </div>
                                      </td>
                                    )}

                                    <td className="px-3 py-2.5">
                                      {s.stage === "interview" ? (
                                        <div className="flex items-center gap-2">
                                          <button
                                            onClick={() => handleOpenBlindEvaluationModal(s)}
                                            className="px-2.5 py-1 rounded-lg bg-brand-50 hover:bg-brand-100 dark:bg-brand-950 dark:hover:bg-brand-900 text-brand-700 dark:text-brand-300 font-bold text-[11px] flex items-center gap-1 transition"
                                          >
                                            <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-brand-600" />
                                            <span>+ ประเมินสัมภาษณ์</span>
                                          </button>

                                          {hasEvaluation ? (
                                            <button
                                              onClick={() => setAdminAuditSlot(s)}
                                              className={`px-2.5 py-1 rounded-md text-[10px] font-extrabold flex items-center gap-1 border transition hover:opacity-90 ${
                                                isPassingScore
                                                  ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                                  : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800"
                                              }`}
                                              title="คลิกเพื่อดู Audit Breakdown"
                                            >
                                              <span>⭐ {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน ({isPassingScore ? "ผ่าน" : "ตก"})</span>
                                              <span className="underline ml-0.5">Audit 🔍</span>
                                            </button>
                                          ) : (
                                            <span className="text-[10px] text-slate-400 italic">รอผลประเมิน</span>
                                          )}
                                        </div>
                                      ) : hasEvaluation ? (
                                        <button
                                          onClick={() => setAdminAuditSlot(s)}
                                          className={`px-2.5 py-1 rounded-md text-[10px] font-extrabold flex items-center gap-1 border transition hover:opacity-90 ${
                                            isPassingScore
                                              ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                              : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-800"
                                          }`}
                                          title="คลิกเพื่อดู Audit Breakdown"
                                        >
                                          <span>⭐ {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน</span>
                                          <span className="underline ml-0.5">Audit 🔍</span>
                                        </button>
                                      ) : (
                                        <span className="text-slate-400 text-[10px] italic">-</span>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5 text-center">
                                      <button
                                        onClick={() => setSelectedDetailSlot(s)}
                                        className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 text-slate-600 transition"
                                        title="ดูรายละเอียดคำขอ"
                                      >
                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* SECTION 2: Candidate Pool Directory */}
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                            Candidate Pool
                          </h2>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            onClick={() => setShowAddCandidateModal(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-brand-500/20 transition active:scale-95"
                          >
                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                            <span>+ Add Candidate</span>
                          </button>

                          <button
                            onClick={() => syncCandidatesFromGoogleSheet(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200 transition"
                          >
                            <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                            <span>Sync Sheet</span>
                          </button>

                          <button
                            onClick={() => {
                              setScriptUrlInput(googleScriptUrl);
                              setShowSheetsModal(true);
                            }}
                            className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200 transition"
                            title="Google Apps Script Sync Settings"
                          >
                            <span>⚙️ Settings</span>
                          </button>

                          <a
                            href={CANDIDATES_SHEET_EDIT_URL}
                            target="_blank"
                            rel="noreferrer"
                            className="px-3 py-1.5 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 font-bold text-xs flex items-center gap-1 hover:underline"
                          >
                            <span>Open Sheet</span>
                            <Icon name="link" className="w-3 h-3 text-sky-600" />
                          </a>
                        </div>
                      </div>

                      {/* Filters: Position and Status */}
                      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-2 text-xs">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">Position:</span>
                            <select
                              value={candidatePositionFilter}
                              onChange={(e) => setCandidatePositionFilter(e.target.value)}
                              className="px-2.5 py-1 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold max-w-[200px] truncate"
                            >
                              <option value="ALL">All Positions</option>
                              {positionFilterOptions.map(pos => (
                                <option key={pos} value={pos}>{pos}</option>
                              ))}
                            </select>
                          </div>

                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">Status:</span>
                            <button
                              onClick={() => setSelectedStatusFilter("ALL")}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold transition ${
                                selectedStatusFilter === "ALL"
                                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs"
                                  : "bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                              }`}
                            >
                              All ({candidatePool.length})
                            </button>
                            {CANDIDATE_STATUS_CONFIG.map(st => {
                              const count = candidatePool.filter(c => c.status === st.id).length;
                              return (
                                <button
                                  key={st.id}
                                  onClick={() => setSelectedStatusFilter(st.id)}
                                  className={`px-2 py-1 rounded-xl text-xs font-bold transition border ${st.bg} ${st.text} ${st.border} ${
                                    selectedStatusFilter === st.id ? "ring-2 ring-slate-800 dark:ring-slate-200 shadow-xs" : "opacity-80 hover:opacity-100"
                                  }`}
                                >
                                  <span>{st.label}</span>
                                  <span className="ml-1 px-1.5 py-0.2 rounded-full bg-black/10 text-[10px]">{count}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div className="relative w-full md:w-64">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-3.5 h-3.5" />
                          </div>
                          <input
                            type="text"
                            placeholder="Search candidates..."
                            value={candidateSearchQuery}
                            onChange={(e) => setCandidateSearchQuery(e.target.value)}
                            className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      {/* Candidate Pool Data Table */}
                      <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5 font-bold">Action</th>
                              <th className="px-3 py-2.5 font-bold">No.</th>
                              <th className="px-3 py-2.5 font-bold">Full Name</th>
                              <th className="px-3 py-2.5 font-bold">Nickname</th>
                              <th className="px-3 py-2.5 font-bold">Phone</th>
                              <th className="px-3 py-2.5 font-bold">Position</th>
                              <th className="px-3 py-2.5 font-bold">Level</th>
                              <th className="px-3 py-2.5 font-bold">Status</th>
                              <th className="px-3 py-2.5 font-bold text-center">Manage</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {filteredCandidates.length === 0 ? (
                              <tr>
                                <td colSpan="9" className="text-center py-8 text-slate-400 italic">
                                  ไม่พบข้อมูลผู้สมัครตามเงื่อนไขที่ค้นหา
                                </td>
                              </tr>
                            ) : (
                              filteredCandidates.map((cand, idx) => {
                                const statusCfg = CANDIDATE_STATUS_CONFIG.find(c => c.id === cand.status) || CANDIDATE_STATUS_CONFIG[0];
                                const shouldHideMapping = statusCfg.hideMapping;

                                return (
                                  <tr key={cand.candidateId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                                    <td className="px-3 py-2">
                                      <div className="flex items-center gap-1.5">
                                        {/* 1. ปุ่มดูรายละเอียด/แก้ไข */}
                                        <button
                                          type="button"
                                          onClick={() => handleOpenCandidateDetail(cand)}
                                          className="p-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 dark:bg-sky-950/60 dark:hover:bg-sky-900 text-sky-700 dark:text-sky-300 transition shadow-2xs border border-sky-200 dark:border-sky-800"
                                          title="ดูรายละเอียด / แก้ไขข้อมูล 18 คอลัมน์"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>

                                        {/* 2. ปุ่มแมปตำแหน่ง */}
                                        {cand.assignedSlotId ? (
                                          <div className="flex items-center gap-1">
                                            <span className="px-1.5 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 font-extrabold text-[10px] border border-emerald-300">
                                              ✓ {cand.assignedSlotId}
                                            </span>
                                            <button
                                              onClick={() => handleUnassignCandidate(cand.assignedSlotId, cand.fullName)}
                                              className="text-[10px] text-rose-600 hover:text-rose-800 underline font-semibold shrink-0"
                                              title="Unassign"
                                            >
                                              ถอด
                                            </button>
                                          </div>
                                        ) : shouldHideMapping ? (
                                          <span className="text-[10px] font-semibold italic text-slate-400 dark:text-slate-500">
                                            {cand.status === "Hiring / Offer" ? "✓ บรรจุงานแล้ว" : "(พ้นกระบวนการ)"}
                                          </span>
                                        ) : (
                                          <button
                                            onClick={() => setSlotPickerCandidate(cand)}
                                            className="p-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white transition shadow-2xs active:scale-95"
                                            title="แมปตำแหน่ง"
                                          >
                                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                                          </button>
                                        )}
                                      </div>
                                    </td>

                                    <td className="px-3 py-2 font-bold text-slate-800 dark:text-slate-200">{cand.no || idx + 1}</td>
                                    <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                      <div className="flex items-center gap-1.5">
                                        <span>{cand.fullName}</span>
                                        {cand.resumeUrl && (
                                          <a
                                            href={cand.resumeUrl}
                                            target="_blank"
                                            rel="noopener noreferrer"
                                            className="inline-flex items-center gap-0.5 px-1.5 py-0.2 rounded bg-sky-50 dark:bg-sky-950/70 text-sky-600 dark:text-sky-300 border border-sky-200 dark:border-sky-800 text-[9px] font-semibold hover:bg-sky-100 transition shadow-2xs"
                                            title="เปิดดู Google Drive CV / Resume"
                                          >
                                            <Icon name="link" className="w-2.5 h-2.5 text-sky-500" />
                                            <span>CV</span>
                                          </a>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2">{cand.nickname || "-"}</td>
                                    <td className="px-3 py-2">{cand.phone || "-"}</td>
                                    <td className="px-3 py-2 font-semibold text-brand-600 dark:text-brand-400">{cand.targetJobTitle}</td>
                                    <td className="px-3 py-2">{cand.level || "-"}</td>
                                    
                                    <td className="px-3 py-2">
                                      <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-lg border ${statusCfg.bg} ${statusCfg.text} ${statusCfg.border}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>

                                    <td className="px-3 py-2 text-center">
                                      <button
                                        type="button"
                                        onClick={() => setCandidateToDelete(cand)}
                                        className="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 dark:bg-rose-950/60 dark:hover:bg-rose-900 text-rose-700 dark:text-rose-300 font-bold text-[11px] border border-rose-200 dark:border-rose-800 transition active:scale-95 shadow-2xs cursor-pointer"
                                        title="ลบข้อมูลผู้สมัครรายนี้"
                                      >
                                        <span>🗑️ ลบ</span>
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}

          </main>

          {/* Stage Header Multi-Select Clear / Archive Modal */}
          {stageClearModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[90vh] flex flex-col">
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-bold text-amber-400 uppercase tracking-wider">
                      KANBAN STAGE CLEAR / HIDE MODAL
                    </span>
                    <h3 className="text-base font-extrabold mt-0.5 flex items-center gap-1.5">
                      <span>🧹 ล้างการ์ดในด่าน: {stageClearModal.stageLabel}</span>
                    </h3>
                  </div>
                  <button onClick={() => setStageClearModal(null)} className="p-1.5 text-slate-400 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-4 bg-amber-50 dark:bg-amber-950/40 border-b border-amber-200 dark:border-amber-900/50 text-[11px] text-amber-800 dark:text-amber-200">
                  💡 <strong>หมายเหตุ:</strong> การล้างการ์ดจะซ่อนการ์ดที่เลือกออกจากหน้ากระดาน Kanban เท่านั้น โดยข้อมูลคำขอและ Slot ทั้งหมดยังคงถูกบันทึกและแสดงผลใน <strong>Manpower Request (แท็บ Closed)</strong> ครบถ้วน 100%
                </div>

                <div className="p-6 space-y-3 overflow-y-auto flex-1 text-xs">
                  <div className="flex items-center justify-between pb-2 border-b border-slate-200 dark:border-slate-800">
                    <label className="flex items-center gap-2 cursor-pointer font-bold text-slate-900 dark:text-white select-none">
                      <input
                        type="checkbox"
                        checked={selectedSlotsToClear.length === stageClearModal.slots.length && stageClearModal.slots.length > 0}
                        onChange={(e) => {
                          if (e.target.checked) {
                            setSelectedSlotsToClear(stageClearModal.slots.map(s => s.slotId));
                          } else {
                            setSelectedSlotsToClear([]);
                          }
                        }}
                        className="w-4 h-4 rounded text-brand-600 focus:ring-brand-500"
                      />
                      <span>เลือกทั้งหมด ({stageClearModal.slots.length} รายการ)</span>
                    </label>
                    <span className="text-[11px] text-slate-400">เลือกแล้ว {selectedSlotsToClear.length} รายการ</span>
                  </div>

                  <div className="space-y-2 max-h-64 overflow-y-auto pr-1">
                    {stageClearModal.slots.map(slot => (
                      <label
                        key={slot.slotId}
                        className={`flex items-start gap-3 p-3 rounded-xl border transition cursor-pointer select-none ${
                          selectedSlotsToClear.includes(slot.slotId)
                            ? "bg-brand-50/80 dark:bg-brand-950/40 border-brand-300 dark:border-brand-700"
                            : "bg-slate-50/50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-800 hover:bg-slate-50"
                        }`}
                      >
                        <input
                          type="checkbox"
                          checked={selectedSlotsToClear.includes(slot.slotId)}
                          onChange={() => {
                            setSelectedSlotsToClear(prev =>
                              prev.includes(slot.slotId)
                                ? prev.filter(id => id !== slot.slotId)
                                : [...prev, slot.slotId]
                            );
                          }}
                          className="w-4 h-4 mt-0.5 rounded text-brand-600 focus:ring-brand-500 shrink-0"
                        />
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-brand-600 text-xs">Slot #{slot.slotId}</span>
                            <span className="text-[10px] text-slate-400">{slot.requestDate}</span>
                          </div>
                          <p className="font-bold text-slate-900 dark:text-white truncate mt-0.5">{slot.jobTitle}</p>
                          <p className="text-[11px] text-slate-500 truncate">{slot.department}</p>
                          {slot.candidateName && (
                            <p className="text-[11px] text-emerald-700 dark:text-emerald-300 font-semibold mt-1">
                              👤 {slot.candidateName}
                            </p>
                          )}
                        </div>
                      </label>
                    ))}
                  </div>
                </div>

                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onClick={() => setStageClearModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmBatchArchive}
                    disabled={selectedSlotsToClear.length === 0}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 disabled:opacity-50 disabled:cursor-not-allowed shadow-md transition"
                  >
                    ล้างตำแหน่งที่เลือก ({selectedSlotsToClear.length} รายการ)
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Unassigned Interview Slot Alert & Picker Modal */}
          {unassignedInterviewSlotModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-amber-300 dark:border-amber-700 p-6 space-y-4">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center gap-2">
                    <div className="w-10 h-10 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-lg font-bold shrink-0">
                      ⚠️
                    </div>
                    <div>
                      <span className="text-[10px] font-extrabold text-amber-600 uppercase">
                        INTERVIEW STAGE CANDIDATE CHECK
                      </span>
                      <h3 className="text-base font-extrabold text-slate-900 dark:text-white mt-0.5">
                        ตำแหน่งนี้ยังไม่มีผู้สมัครจับคู่ (Unassigned)
                      </h3>
                    </div>
                  </div>
                  <button onClick={() => setUnassignedInterviewSlotModal(null)} className="p-1 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 text-xs space-y-1">
                  <p><span className="text-slate-400">ตำแหน่ง:</span> <strong className="text-slate-900 dark:text-white">{unassignedInterviewSlotModal.jobTitle}</strong></p>
                  <p><span className="text-slate-400">Slot ID:</span> <strong className="text-brand-600">#{unassignedInterviewSlotModal.slotId}</strong></p>
                  <p><span className="text-slate-400">ฝ่ายงาน:</span> <strong className="text-slate-700 dark:text-slate-300">{unassignedInterviewSlotModal.department}</strong></p>
                </div>

                <p className="text-xs text-slate-600 dark:text-slate-300 font-medium">
                  ก่อนจะย้ายตำแหน่งเข้าสู่ด่าน <strong>Interview Stage</strong> กรุณาเลือกผู้สมัครจาก Candidate Pool เพื่อนำมาจับคู่และกำหนดวันเวลานัดสัมภาษณ์:
                </p>

                <div className="space-y-2 max-h-52 overflow-y-auto pr-1">
                  {candidatePool.filter(c => !c.assignedSlotId && c.status !== "not suitable" && c.status !== "cancel by candidate" && c.status !== "Hiring / Offer").length === 0 ? (
                    <div className="p-4 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-xl text-xs">
                      ไม่มีผู้สมัครที่พร้อมแมปใน Candidate Pool (กรุณาเพิ่มผู้สมัครก่อน)
                    </div>
                  ) : (
                    candidatePool
                      .filter(c => !c.assignedSlotId && c.status !== "not suitable" && c.status !== "cancel by candidate" && c.status !== "Hiring / Offer")
                      .map(cand => (
                        <div
                          key={cand.candidateId}
                          onClick={() => handleSelectSlotForCandidate(unassignedInterviewSlotModal, cand)}
                          className="p-3 rounded-xl bg-slate-50 hover:bg-brand-50 dark:bg-slate-800 dark:hover:bg-brand-950/60 border border-slate-200 dark:border-slate-700 hover:border-brand-500 transition cursor-pointer flex items-center justify-between group"
                        >
                          <div>
                            <div className="font-bold text-slate-900 dark:text-white text-xs">{cand.fullName}</div>
                            <div className="text-[11px] text-slate-500">{cand.targetJobTitle} &bull; {cand.phone}</div>
                          </div>
                          <span className="text-xs font-bold text-brand-600 group-hover:underline">เลือก &rarr;</span>
                        </div>
                      ))
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    type="button"
                    onClick={() => setUnassignedInterviewSlotModal(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Candidate Full 18-Column Details & Edit Modal */}
          {selectedCandidateDetail && candidateEditForm && (
            <div className="fixed inset-0 z-[60] flex items-center justify-center p-3 sm:p-4 bg-slate-950/75 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                {/* Modal Header */}
                <div className="px-6 py-4 bg-gradient-to-r from-slate-900 via-slate-800 to-sky-950 text-white flex items-center justify-between">
                  <div className="flex items-center gap-3">
                    <div className="w-10 h-10 rounded-2xl bg-sky-500/20 text-sky-300 flex items-center justify-center text-lg font-bold border border-sky-400/30 shadow-inner">
                      👤
                    </div>
                    <div>
                      <div className="flex items-center gap-2">
                        <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-400">
                          {selectedCandidateDetail.candidateId || `CAND-2026-${String(selectedCandidateDetail.no || 1).padStart(3, '0')}`}
                        </span>
                        <span className="text-[10px] text-slate-400 font-semibold">&bull; ลำดับที่ (No.) #{selectedCandidateDetail.no || '-'}</span>
                      </div>
                      <h3 className="text-base sm:text-lg font-extrabold text-white leading-tight">
                        {isEditingCandidate ? "แก้ไขข้อมูลผู้สมัคร" : `${selectedCandidateDetail.fullName} ${selectedCandidateDetail.nickname ? `(${selectedCandidateDetail.nickname})` : ''}`}
                      </h3>
                    </div>
                  </div>

                  <div className="flex items-center gap-2">
                    <button
                      type="button"
                      onClick={() => setIsEditingCandidate(!isEditingCandidate)}
                      className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                        isEditingCandidate 
                          ? "bg-amber-500 hover:bg-amber-600 text-white shadow-md"
                          : "bg-white/10 hover:bg-white/20 text-sky-300 border border-sky-400/30"
                      }`}
                    >
                      <span>{isEditingCandidate ? "👁️ โหมดดูข้อมูล" : "✏️ แก้ไขข้อมูล"}</span>
                    </button>
                    <button 
                      type="button"
                      onClick={() => { setSelectedCandidateDetail(null); setIsEditingCandidate(false); }} 
                      className="p-2 rounded-xl text-slate-400 hover:text-white hover:bg-white/10 transition cursor-pointer"
                    >
                      <Icon name="x" className="w-5 h-5" />
                    </button>
                  </div>
                </div>

                {/* Modal Body */}
                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {isEditingCandidate ? (
                    /* Edit Form */
                    <form id="candidateEditForm" onSubmit={handleSaveCandidateEdit} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div className="sm:col-span-2">
                          <label className="block text-[11px] font-semibold mb-1">ชื่อ - นามสกุล *</label>
                          <input
                            type="text"
                            required
                            value={candidateEditForm.fullName}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, fullName: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ชื่อเล่น</label>
                          <input
                            type="text"
                            value={candidateEditForm.nickname || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, nickname: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">เบอร์โทรศัพท์</label>
                          <input
                            type="tel"
                            value={candidateEditForm.phone || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, phone: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ตำแหน่งที่สนใจ (Target Role) *</label>
                          <input
                            type="text"
                            required
                            value={candidateEditForm.targetJobTitle}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, targetJobTitle: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ระดับ (Level)</label>
                          <input
                            type="text"
                            value={candidateEditForm.level || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, level: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">สาขา / Branch</label>
                          <input
                            type="text"
                            value={candidateEditForm.branch || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, branch: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">ประเภท (Type)</label>
                          <select
                            value={candidateEditForm.type || "Full-Time"}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, type: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          >
                            <option value="Full-Time">Full-Time</option>
                            <option value="Contract">Contract</option>
                            <option value="Internship">Internship</option>
                          </select>
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">MBTI</label>
                          <input
                            type="text"
                            value={candidateEditForm.mbti || ""}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, mbti: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-mono"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold mb-1">สถานะ (Status)</label>
                          <select
                            value={candidateEditForm.status}
                            onChange={(e) => setCandidateEditForm({ ...candidateEditForm, status: e.target.value })}
                            className="w-full p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                          >
                            {CANDIDATE_STATUS_CONFIG.map(st => (
                              <option key={st.id} value={st.id}>{st.label}</option>
                            ))}

                    <textarea
                      required
                      rows="3"
                      placeholder="e.g. ผู้สมัครได้งานที่อื่นใกล้บ้าน, สละสิทธิ์เนื่องจากไม่สะดวกเดินทาง, แผนกชะลอการเปิดรับ..."
                      value={rejectionReasonInput}
                      onChange={(e) => setRejectionReasonInput(e.target.value)}
                      className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-rose-300 dark:border-rose-800 font-medium focus:ring-2 focus:ring-rose-500"
                    ></textarea>
                  </div>

                  <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-900 text-[11px] text-amber-800 dark:text-amber-200">
                    ⚠️ เมื่อบันทึกแล้ว ระบบจะล็อกสถานะเป็น <strong>"❌ สละสิทธิ์ / ไม่มาเริ่มงาน"</strong> ทันที และแสดงแถบสีแดงในรายงานเพื่อความถูกต้องของข้อมูล
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setRejectionModalData(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md"
                    >
                      ยืนยันบันทึกเหตุผล &amp; ล็อกสถานะ
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* Department Position Breakdown Modal */}
          {selectedDepartmentDetail && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[90vh] flex flex-col">
                
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200">
                      DEPARTMENT POSITION BREAKDOWN &bull; {currentView === "admin" ? "ADMIN DETAILED AUDIT" : "OPEN REQUISITIONS"}
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold mt-0.5 flex items-center gap-2">
                      <Icon name="building" className="w-5 h-5 text-white" />
                      <span>{selectedDepartmentDetail}</span>
                    </h3>
                  </div>
                  <button onClick={() => setSelectedDepartmentDetail(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  {departmentModalSlots.length === 0 ? (
                    <div className="p-8 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-2xl">
                      ไม่มีตำแหน่งงานในฝ่ายนี้
                    </div>
                  ) : (
                    departmentModalSlots.map(s => {
                      const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                      return (
                        <div key={s.slotId} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                          <div>
                            <div className="flex items-center gap-2 text-[10px] mb-1">
                              <span className="font-bold text-brand-600">{s.slotId}</span>
                              <span className="text-slate-400">&bull;</span>
                              <span className="text-slate-500 font-semibold">{s.positionType}</span>
                              <span className="text-slate-400">&bull;</span>
                              <span className={`px-2 py-0.5 rounded font-bold ${s.slotStatus === "Closed" ? "bg-emerald-100 text-emerald-800" : "bg-amber-100 text-amber-800"}`}>
                                {s.slotStatus}
                              </span>
                            </div>
                            <h4 className="font-bold text-sm text-slate-900 dark:text-white">{s.jobTitle}</h4>
                            {s.candidateName && (
                              <p className="text-emerald-700 dark:text-emerald-300 font-semibold text-xs mt-1">
                                👤 แคนดิเดต: {s.candidateName} {s.candidateNickname ? `(${s.candidateNickname})` : ''}
                              </p>
                            )}
                            {currentView === "admin" && (
                              <div className="mt-2 text-[10px] text-slate-400 space-y-0.5">
                                <p>ผู้ขอ: {s.requesterName} &bull; ผู้อนุมัติ: {s.approverName}</p>
                                {s.hireDate && <p className="text-emerald-600 font-bold">🎉 วันเริ่มงาน: {s.hireDate}</p>}
                                {s.evaluationsCount > 0 && (
                                  <p className="text-brand-600 font-semibold">⭐ ผลประเมิน: {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน</p>
                                )}
                              </div>
                            )}
                          </div>

                          <div className="flex sm:flex-col items-end gap-1.5 shrink-0">
                            <span className="px-2.5 py-1 rounded-xl bg-slate-200 dark:bg-slate-700 font-bold text-[11px]">
                              Stage: {s.stage}
                            </span>
                            <span className="text-[10px] text-slate-500">
                              ⏱️ {sla.workingDaysElapsed} วันทำการ
                            </span>
                          </div>
                        </div>
                      );
                    })
                  )}
                </div>

                <div className="pt-3 pb-4 px-6 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setSelectedDepartmentDetail(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* Blind Evaluation Modal Form */}
          {blindEvalModalSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[94vh] flex flex-col">
                
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200">
                      แบบฟอร์มประเมินสัมภาษณ์งาน (INTERVIEW EVALUATION FORM)
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold mt-0.5">
                      {blindEvalModalSlot.candidateName || "ผู้สมัคร"} &bull; {blindEvalModalSlot.jobTitle}
                    </h3>
                  </div>
                  <button onClick={() => setBlindEvalModalSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="bg-sky-50 dark:bg-sky-950/70 border-b border-sky-200/80 dark:border-sky-800 px-6 py-2.5 flex items-center gap-2 text-xs text-sky-800 dark:text-sky-200 font-medium">
                  <Icon name="shieldCheck" className="w-4 h-4 text-sky-600 shrink-0" />
                  <span>
                    <strong>การประเมินแบบอิสระ (Blind Assessment):</strong> แบบฟอร์มนี้จะไม่แสดงคะแนนหรือความคิดเห็นของกรรมการท่านอื่น เพื่อความเป็นกลาง
                  </span>
                </div>

                <form onSubmit={handleSaveBlindEvaluation} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ชื่อผู้ประเมิน <span className="text-rose-600">*</span>
                      </label>
                      <SearchableSelect
                        value={blindEvalForm.evaluatorName}
                        placeholder="-- เลือกหรือพิมพ์ชื่อผู้ประเมิน --"
                        options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                        onChange={(name) => setBlindEvalForm({ ...blindEvalForm, evaluatorName: name })}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        บทบาท (Role) <span className="text-rose-600">*</span>
                      </label>
                      <select
                        value={blindEvalForm.evaluatorRole}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, evaluatorRole: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      >
                        {EVALUATOR_ROLES.map(role => (
                          <option key={role} value={role}>{role}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        วันที่ประเมิน <span className="text-rose-600">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={blindEvalForm.date}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, date: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      />
                    </div>
                  </div>

                  <div className="space-y-3">
                    <div className="font-bold text-slate-900 dark:text-white text-xs pb-1 border-b border-slate-200 dark:border-slate-800">
                      เกณฑ์การประเมิน 5 ด้าน (1 = ต่ำกว่ามาตรฐานมาก, 5 = เหนือกว่ามาตรฐานมาก)
                    </div>

                    {EVALUATION_CRITERIA.map(crit => {
                      const score = blindEvalForm.scores[crit.id];

                      return (
                        <div key={crit.id} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-700/80 space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                            <div>
                              <h4 className="font-bold text-slate-900 dark:text-white text-xs">{crit.label}</h4>
                              <p className="text-[11px] text-slate-500 dark:text-slate-400">{crit.desc}</p>
                            </div>
                            <span className="text-brand-600 dark:text-brand-400 font-extrabold text-xs shrink-0">
                              คะแนน: {score} / 5
                            </span>
                          </div>

                          <div className="flex items-center gap-1.5 pt-1 border-t border-slate-200/50 dark:border-slate-700/50">
                            {[1, 2, 3, 4, 5].map(val => (
                              <button
                                key={`score-${crit.id}-${val}`}
                                type="button"
                                onClick={() => setBlindEvalForm({
                                  ...blindEvalForm,
                                  scores: { ...blindEvalForm.scores, [crit.id]: val }
                                })}
                                className={`flex-1 py-1.5 rounded-xl font-bold text-xs transition border ${
                                  score === val
                                    ? "bg-brand-600 text-white border-brand-600 shadow-sm"
                                    : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                                }`}
                              >
                                {val}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {(() => {
                    const sc = blindEvalForm.scores;
                    const tot = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
                    const avg = (tot / 5).toFixed(1);
                    const pct = Math.round((tot / 25) * 100);
                    const isPass = pct >= 70;

                    return (
                      <div className={`p-3.5 rounded-2xl border flex items-center justify-between ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200"
                      }`}>
                        <div>
                          <p className="text-[10px] uppercase font-bold opacity-80">สรุปคะแนนประเมินของคุณ</p>
                          <h4 className="text-base font-extrabold mt-0.5">{tot} / 25 คะแนน (เฉลี่ย {avg}/5 &bull; {pct}%)</h4>
                        </div>
                        <span className={`px-2.5 py-1 rounded-lg font-bold text-xs ${
                          isPass ? "bg-emerald-600 text-white" : "bg-amber-600 text-white"
                        }`}>
                          {isPass ? "เกณฑ์ผ่าน (≥ 70%)" : "ต่ำกว่า 70%"}
                        </span>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">จุดเด่นของผู้สมัคร (Strengths)</label>
                      <textarea
                        rows="2"
                        placeholder="ระบุจุดเด่น ทักษะ หรือประสบการณ์สำคัญ..."
                        value={blindEvalForm.strengths}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, strengths: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ข้อควรพัฒนา (Areas for Improvement)</label>
                      <textarea
                        rows="2"
                        placeholder="ระบุข้อควรพัฒนาเพิ่มเติม..."
                        value={blindEvalForm.improvements}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, improvements: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ข้อเสนอแนะสรุปผล (Recommendation) *</label>
                      <select
                        value={blindEvalForm.recommendation}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, recommendation: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                      >
                        <option value="Recommend to Hire">Recommend to Hire (เสนอรับเข้าทำงาน)</option>
                        <option value="Compare">Compare (เปรียบเทียบกับผู้สมัครรายอื่น)</option>
                        <option value="Keep in Pool / Reserve">Keep in Pool / Reserve (เก็บเป็นตัวสำรอง)</option>
                        <option value="Not Recommended">Not Recommended (ไม่ผ่านการคัดเลือก)</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setBlindEvalModalSlot(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md"
                    >
                      บันทึกผลการประเมิน
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* Admin Audit Modal */}
          {adminAuditSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">
                      ADMIN &amp; HR AUDIT REPORT: DETAILED EVALUATION BREAKDOWN
                    </span>
                    <h3 className="text-base sm:text-lg font-bold mt-0.5">
                      {adminAuditSlot.candidateName || "ผู้สมัคร"} &bull; {adminAuditSlot.jobTitle} (Slot #{adminAuditSlot.slotId})
                    </h3>
                  </div>
                  <button onClick={() => setAdminAuditSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  {(() => {
                    const stats = calculateOverallScore(adminAuditSlot.evaluations);
                    const isPass = stats.result === "Pass";

                    return (
                      <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-rose-50 dark:bg-rose-950/50 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200"
                      }`}>
                        <div>
                          <span className="text-[10px] uppercase font-extrabold opacity-80">
                            คะแนนเฉลี่ยรวมจากกรรมการทั้งหมด ({stats.count} ท่าน)
                          </span>
                          <h4 className="text-2xl font-extrabold mt-0.5">
                            {stats.combinedAvg} / 5 ({stats.combinedPct}%)
                          </h4>
                          <p className="text-[11px] opacity-80 mt-0.5">
                            เกณฑ์การคัดเลือก: ผ่านที่ 70% ขึ้นไป (คะแนนเฉลี่ย 3.5 / 5.0)
                          </p>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className={`px-3 py-1.5 rounded-xl font-extrabold text-xs uppercase shadow-xs ${
                            isPass ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                          }`}>
                            {isPass ? "✓ ผ่านการประเมิน (Pass)" : "✗ ไม่ผ่านการประเมิน (Fail)"}
                          </span>
                        </div>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div className="font-bold text-slate-900 dark:text-white text-xs pb-1 border-b border-slate-200 dark:border-slate-800">
                      รายละเอียดคะแนนแยกรายบุคคล (Individual Submissions)
                    </div>

                    {(adminAuditSlot.evaluations || []).length === 0 ? (
                      <div className="p-8 text-center text-slate-400 italic bg-slate-50 dark:bg-slate-800/40 rounded-2xl">
                        ยังไม่มีกรรมการหรือ HR บันทึกผลประเมินสำหรับตำแหน่งนี้
                      </div>
                    ) : (
                      adminAuditSlot.evaluations.map((ev, idx) => (
                        <div key={ev.id || idx} className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 space-y-3">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1 pb-2 border-b border-slate-200/60 dark:border-slate-700/60">
                            <div>
                              <div className="font-extrabold text-slate-900 dark:text-white text-sm flex items-center gap-2">
                                <span>#{idx + 1} {ev.evaluatorName}</span>
                                <span className="px-2 py-0.5 rounded-md bg-brand-50 dark:bg-brand-950 text-brand-600 dark:text-brand-400 text-[10px] font-semibold">
                                  {ev.evaluatorRole}
                                </span>
                              </div>
                              <p className="text-[10px] text-slate-400 mt-0.5">วันที่ประเมิน: {ev.date}</p>
                            </div>
                            <div className="text-right">
                              <span className="text-base font-extrabold text-slate-900 dark:text-white">{ev.avg} / 5</span>
                              <span className="text-[10px] text-slate-400 ml-1">({ev.pct}%)</span>
                            </div>
                          </div>

                          <div className="grid grid-cols-5 gap-1.5 text-center text-[10px]">
                            {EVALUATION_CRITERIA.map(crit => (
                              <div key={crit.id} className="p-1.5 rounded-lg bg-white dark:bg-slate-800 border border-slate-200/60 dark:border-slate-700">
                                <span className="block text-slate-400 truncate" title={crit.label}>ข้อ {crit.id.replace('c','')}</span>
                                <strong className="text-xs font-bold text-brand-600">{ev.scores?.[crit.id] || '-'}/5</strong>
                              </div>
                            ))}
                          </div>

                          <div className="space-y-1 text-[11px] text-slate-600 dark:text-slate-300 pt-1">
                            {ev.strengths && <p><strong>จุดเด่น:</strong> {ev.strengths}</p>}
                            {ev.improvements && <p><strong>ข้อควรพัฒนา:</strong> {ev.improvements}</p>}
                            <p><strong>ข้อเสนอแนะ:</strong> <span className="font-semibold text-brand-600 dark:text-brand-400">{ev.recommendation || '-'}</span></p>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                </div>

                <div className="pt-3 pb-4 px-6 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setAdminAuditSlot(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    ปิดหน้าต่าง Audit
                  </button>

            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                <div className="px-6 py-5 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <h3 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                    <Icon name="plus" className="w-5 h-5 text-brand-600" />
