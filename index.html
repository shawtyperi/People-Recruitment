          const yearStr = String(reqDate.getFullYear());

          const matchMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          return matchMonth && matchYear;
        });
      }, [requests, searchQuery, selectedMonthFilter, selectedYearFilter]);

      const departmentStats = useMemo(() => {
        const statsMap = {};
        DEPARTMENTS.forEach(dept => {
          statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
        });

        filteredRequests.forEach(r => {
          const dept = r.department;
          if (!statsMap[dept]) {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }
          const hc = Number(r.headcountRequired) || 1;
          statsMap[dept].total += hc;
          if (r.stage === "onboarded") {
            statsMap[dept].filled += hc;
          } else if (r.stage === "cancelled") {
            statsMap[dept].cancelled += hc;
          } else {
            statsMap[dept].open += hc;
          }
        });

        return Object.entries(statsMap)
          .map(([department, counts]) => ({ department, ...counts }))
          .sort((a, b) => b.total - a.total);
      }, [filteredRequests]);

      const kpis = useMemo(() => {
        const totalReq = filteredRequests.reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        const openReq = filteredRequests.filter(r => r.stage !== "onboarded" && r.stage !== "cancelled").reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        const filledReq = filteredRequests.filter(r => r.stage === "onboarded").reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        const cancelledReq = filteredRequests.filter(r => r.stage === "cancelled").reduce((sum, r) => sum + (Number(r.headcountRequired) || 1), 0);
        return { totalReq, openReq, filledReq, cancelledReq };
      }, [filteredRequests]);

      const activeKpiItems = useMemo(() => {
        if (!activeKpiModalType) return [];
        if (activeKpiModalType === "total") return filteredRequests;
        if (activeKpiModalType === "open") return filteredRequests.filter(r => r.stage !== "onboarded" && r.stage !== "cancelled");
        if (activeKpiModalType === "filled") return filteredRequests.filter(r => r.stage === "onboarded");
        if (activeKpiModalType === "cancelled") return filteredRequests.filter(r => r.stage === "cancelled");
        return [];
      }, [filteredRequests, activeKpiModalType]);

      const activeKpiTitle = useMemo(() => {
        if (activeKpiModalType === "total") return "Total Headcount Requisitions";
        if (activeKpiModalType === "open") return "Open Pipeline Positions";
        if (activeKpiModalType === "filled") return "Onboarded / Filled Positions";
        if (activeKpiModalType === "cancelled") return "Cancelled / On Hold Requests";
        return "";
      }, [activeKpiModalType]);

      const departmentModalRequests = useMemo(() => {
        if (!selectedDepartmentDetail) return [];
        return filteredRequests.filter(r => r.department === selectedDepartmentDetail);
      }, [filteredRequests, selectedDepartmentDetail]);

      const departmentModalStats = useMemo(() => {
        if (!selectedDepartmentDetail) return { total: 0, open: 0, filled: 0, cancelled: 0 };
        let total = 0, open = 0, filled = 0, cancelled = 0;
        departmentModalRequests.forEach(r => {
          const hc = Number(r.headcountRequired) || 1;
          total += hc;
          if (r.stage === "onboarded") filled += hc;
          else if (r.stage === "cancelled") cancelled += hc;
          else open += hc;
        });
        return { total, open, filled, cancelled };
      }, [departmentModalRequests, selectedDepartmentDetail]);

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPasscode === "admin123" || adminPasscode === "hr2025") {
          setIsAdminAuthenticated(true);
          setShowLoginModal(false);
          setCurrentView("admin");
          setAdminPasscode("");
          setLoginError("");
          triggerToast("Authenticated as HR Admin");
        } else {
          setLoginError("Invalid passcode. Try 'admin123'");
        }
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().split(' ')[0];

        const newId = `REQ-${now.getFullYear()}-${String(requests.length + 1).padStart(3, '0')}`;
        const newReq = {
          ...formInput,
          id: newId,
          requestDate: dateStr,
          lastUpdated: `${dateStr} ${timeStr}`,
          approvalStatusL1: "Approved",
          approvalStatusL2: "Pending",
          docStatus: "Pending",
          stage: "received",
          cancellationReason: "",
          candidateName: "",
          resumeUrl: ""
        };

        setRequests([newReq, ...requests]);
        setShowRequestModal(false);
        setFormInput(initialForm);
        setFormStep(1);

        // Real-time POST sync to Google Sheets Apps Script endpoint
        if (googleScriptUrl) {
          try {
            fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify(newReq)
            });
            triggerToast("บันทึกสำเร็จ & ซิงค์ข้อมูลลง Google Sheet เรียบร้อยแล้ว! 📊");
          } catch (err) {
            triggerToast("บันทึกในแอปสำเร็จ (แต่ซิงค์ Google Sheet ขัดข้อง)");
          }
        } else {
          triggerToast("บันทึกในแอปสำเร็จ! (อย่าลืมวาง Google Script Web App URL ใน Admin เพื่อซิงค์ลง Sheet)");
        }
      };

      const handleSaveCandidateInfo = (id) => {
        setRequests(prev => prev.map(r => {
          if (r.id === id) {
            return {
              ...r,
              candidateName: candidateNameInput,
              resumeUrl: resumeUrlInput,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));
        setSelectedDetailRequest(prev => prev ? { ...prev, candidateName: candidateNameInput, resumeUrl: resumeUrlInput } : null);
        setIsEditingCandidate(false);
        triggerToast("Saved Candidate CV/Resume link successfully!");
      };

      const updateStageDirectly = (id, targetStage, reason = "") => {
        setRequests(prev => prev.map(r => {
          if (r.id === id) {
            return {
              ...r,
              stage: targetStage,
              cancellationReason: reason || r.cancellationReason,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));
        triggerToast(`Updated stage to ${targetStage}`);
      };

      const handleDragStart = (e, id) => {
        setDraggedRequestId(id);
        e.dataTransfer.setData("text/plain", id);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e, targetStage) => {
        e.preventDefault();
        const id = draggedRequestId || e.dataTransfer.getData("text/plain");
        if (!id) return;

        if (targetStage === "cancelled") {
          setCancelModalItem({ id, targetStage });
          setCancelReasonInput("");
        } else {
          updateStageDirectly(id, targetStage);
        }
        setDraggedRequestId(null);
      };

      const exportToCSV = () => {
        const headers = [
          "Request ID", "Date", "Days Elapsed", "SLA Status (30 Days)", "Requester", "Requester Title", "Requester Email",
          "Approver L1", "Approver Email", "Status L1", "Status L2", "Doc Status",
          "Job Title", "Department", "Headcount", "Position Type", "Candidate Name", "CV / Resume Drive Link",
          "Job Summary", "Gender", "Age", "Education", "Required Skills", "Target Date",
          "Laptop", "Sim Card", "Email Account", "Netsuite ERP", "Stage", "Cancel Reason", "Last Updated"
        ];

        const rows = requests.map(r => {
          const sla = getSLAInfo(r.requestDate, r.stage);
          const slaLabel = sla.isCompleted ? "Closed" : (sla.isOverdue ? `Overdue (${sla.daysElapsed}d)` : `Within SLA (${sla.daysElapsed}d)`);

          return [
            r.id,
            r.requestDate,
            sla.daysElapsed,
            slaLabel,
            `"${r.requesterName}"`,
            `"${r.requesterPosition}"`,
            r.requesterEmail,
            `"${r.approverName}"`,
            r.approverEmail,
            r.approvalStatusL1,
            r.approvalStatusL2,
            r.docStatus,
            `"${r.jobTitle}"`,
            `"${r.department}"`,
            r.headcountRequired,
            `"${r.positionType}"`,
            `"${r.candidateName || ''}"`,
            `"${r.resumeUrl || ''}"`,
            `"${(r.jobDescription || '').replace(/"/g, '""')}"`,
            r.gender,
            `"${r.age}"`,
            `"${r.education}"`,
            `"${(r.requiredSkills || '').replace(/"/g, '""')}"`,
            r.targetDate,
            r.equipment?.laptop ? "Yes" : "No",
            r.equipment?.simCard ? "Yes" : "No",
            r.equipment?.email ? "Yes" : "No",
            r.equipment?.netsuite ? "Yes" : "No",
            r.stage,
            `"${(r.cancellationReason || '').replace(/"/g, '""')}"`,
            r.lastUpdated
          ];
        });

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `HR_Headcount_Export_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          {/* Top Header Bar */}
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                {/* Logo & Title */}
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-400 dark:text-slate-400 font-normal mt-0.5">Headcount Tracking & SLA Lead Time (Target: 30 Days)</p>
                  </div>
                </div>

                {/* Header Action Buttons */}
                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    title="Toggle Light/Dark Theme"
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {
                        if (isAdminAuthenticated) {
                          setCurrentView("admin");
                        } else {
                          setShowLoginModal(true);
                        }
                      }}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Admin Portal</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setCurrentView("public")}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 transition"
                      >
                        <Icon name="grid" className="w-3.5 h-3.5" />
                        <span>Public View</span>
                      </button>
                      <button
                        onClick={() => {
                          setIsAdminAuthenticated(false);
                          setCurrentView("public");
                          triggerToast("Logged out of Admin Portal");
                        }}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 transition"
                      >
                        <Icon name="logOut" className="w-3.5 h-3.5" />
                        <span className="hidden sm:inline">Logout</span>
                      </button>
                    </div>
                  )}

                  <div className="flex items-center gap-1.5">
                    <button
                      onClick={() => {
                        setFormStep(1);
                        setShowRequestModal(true);
                      }}
                      className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition hover:scale-[1.02]"
                    >
                      <Icon name="plus" className="w-4 h-4 text-white" />
                      <span>+ Request Headcount</span>
                    </button>
                    
                    <button
                      onClick={handleCopyShareLink}
                      title="คัดลอกลิงก์ฟอร์มขอกำลังคน"
                      className="p-2 sm:p-2.5 rounded-xl text-brand-700 dark:text-brand-300 bg-brand-50 dark:bg-brand-950 hover:bg-brand-100 dark:hover:bg-brand-900 border border-brand-200 dark:border-brand-800 transition active:scale-95"
                    >
                      <Icon name="link" className="w-4 h-4 text-brand-600 dark:text-brand-400" />
                    </button>
                  </div>
                </div>

              </div>
            </div>
          </header>

          {}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* Clickable KPI Cards Overview */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div 
                onClick={() => setActiveKpiModalType("total")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-brand-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-brand-600 transition">Total Headcount</p>
                  <p className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{kpis.totalReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div 
                onClick={() => setActiveKpiModalType("open")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-amber-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-amber-600 transition">Open Pipeline</p>
                  <p className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{kpis.openReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div 
                onClick={() => setActiveKpiModalType("filled")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-emerald-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-emerald-600 transition">Onboarded / Filled</p>
                  <p className="text-xl sm:text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{kpis.filledReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div 
                onClick={() => setActiveKpiModalType("cancelled")}
                className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between cursor-pointer hover:border-rose-400 hover:shadow-md transition group"
              >
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider group-hover:text-rose-600 transition">Cancelled / On Hold</p>
                  <p className="text-xl sm:text-2xl font-bold text-rose-600 dark:text-rose-400 mt-1">{kpis.cancelledReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-600 flex items-center justify-center group-hover:scale-110 transition">
                  <Icon name="x" className="w-5 h-5 text-rose-600" />
                </div>
              </div>
            </div>

            {}
            {currentView === "public" && (
              <div className="space-y-8">
                
                {/* SECTION 1: RECRUITMENT STAGE TRACKER (READ-ONLY KANBAN) */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <span className="p-2 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 dark:text-amber-400">
                          <Icon name="grid" className="w-5 h-5 text-amber-600 dark:text-amber-400" />
                        </span>
                        Recruitment Stage Tracker
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        Current progress of open positions across recruitment stages. Click any position card to view full details.
                      </p>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4 text-slate-400" />
                      </div>
                      <input
                        type="text"
                        placeholder="Search title, ID, department..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  {/* Kanban Horizontal Scroll Columns */}
                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = filteredRequests.filter(r => r.stage === stage.id);
                      return (
                        <div 
                          key={stage.id} 
                          className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border border-slate-200/60 dark:border-slate-800"
                        >
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">
                              {stage.label}
                            </span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px] pr-0.5">
                            {stageItems.length === 0 ? (
                              <div className="py-8 text-center text-[11px] text-slate-400 italic">No positions</div>
                            ) : (
                              stageItems.map(item => {
                                const sla = getSLAInfo(item.requestDate, item.stage);
                                return (
                                  <div
                                    key={item.id}
                                    onClick={() => {
                                      setSelectedDetailRequest(item);
                                      setIsEditingCandidate(false);
                                      setCandidateNameInput(item.candidateName || "");
                                      setResumeUrlInput(item.resumeUrl || "");
                                    }}
                                    className="p-3 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 shadow-xs hover:border-brand-400 transition cursor-pointer group"
                                  >
                                    <div className="flex items-center justify-between text-[10px] text-slate-400 mb-1">
                                      <span>{item.id}</span>
                                      <span className="text-brand-600 dark:text-brand-400 font-bold">{item.headcountRequired} Headcount</span>
                                    </div>
                                    <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                      {item.jobTitle}
                                    </h4>
                                    <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 truncate">
                                      {item.department}
                                    </p>

                                    {/* SLA Lead Time Badge Counter */}
                                    <div className="mt-2 inline-flex items-center gap-1 text-[10px] font-semibold px-2 py-0.5 rounded-md">
                                      {sla.isCompleted ? (
                                        <span className="bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                          ⏱️ Closed in {sla.daysElapsed} days
                                        </span>
                                      ) : sla.isOverdue ? (
                                        <span className="bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 animate-pulse">
                                          ⚠️ SLA Overdue: {sla.daysElapsed} days open
                                        </span>
                                      ) : (
                                        <span className="bg-sky-50 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">
                                          ⏱️ Open {sla.daysElapsed}d ({sla.daysRemaining}d SLA left)
                                        </span>
                                      )}
                                    </div>

                                    <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[10px] text-slate-400">
                                      <span>Target: {item.targetDate}</span>
                                      <span className="text-brand-500 font-semibold">Details &rarr;</span>
                                    </div>
                                  </div>
                                );
                              })
                            )}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* SECTION 2: COMPACT DEPARTMENT HEADCOUNT DEMAND GRID */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>

                            <p className="text-xs text-slate-500 dark:text-slate-400">
                              {item.department} &bull; <strong className="text-brand-600">{item.headcountRequired} Headcount</strong>

                              <p className="text-[11px] font-semibold text-emerald-600 dark:text-emerald-400 mt-1">

                                  ? "bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300" 
                                  : "bg-sky-100 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300"
                            }`}>

                            </span>
                          </div>
                        </div>
                      );
                    })

                    onClick={() => setActiveKpiModalType(null)}

                  </button>
                </div>
              </div>
            </div>
          )}

                    <button
                      type="button"
                      onClick={handleCopyShareLink}

                </div>

                <form onSubmit={handleFormSubmit} className="py-4 space-y-4 max-h-[70vh] overflow-y-auto text-xs">

                            onChange={(e) => setFormInput({ ...formInput, requesterName: e.target.value })}
                            className="w-full p-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Requester Title *</label>
                          <input
                            type="text"
                            required
                            placeholder="e.g. People Lead"
                            value={formInput.requesterPosition}
                            onChange={(e) => setFormInput({ ...formInput, requesterPosition: e.target.value })}
                            className="w-full p-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Requester Email *</label>
                          <input
                            type="email"
                            required
                            placeholder="name@valuesourcing.co"
                            value={formInput.requesterEmail}
                            onChange={(e) => setFormInput({ ...formInput, requesterEmail: e.target.value })}

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Department *</label>

                              <option key={d} value={d}>{d}</option>

                          </select>
                        </div>
                      </div>
                    </div>

                  {formStep === 2 && (

                        <div className="sm:col-span-2">
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Job Title *</label>
                          <input
                            type="text"
                            required
                            placeholder="e.g. Senior Full-Stack Engineer"
                            value={formInput.jobTitle}
                            onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                            className="w-full p-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Headcount *</label>
                          <input
                            type="number"
                            min="1"
                            max="20"
                            required
                            value={formInput.headcountRequired}
                            onChange={(e) => setFormInput({ ...formInput, headcountRequired: e.target.value })}
                            className="w-full p-2 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"

                        </div>
                      </div>

                        <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Job Summary *</label>

                          required
                          placeholder="Brief description of job responsibilities..."
                          value={formInput.jobDescription}
                          onChange={(e) => setFormInput({ ...formInput, jobDescription: e.target.value })}

                        ></textarea>
                      </div>
                    </div>
                  )}

                  <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-between">

                      <button
                        type="button"
                        onClick={() => setFormStep(formStep - 1)}
                        className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                      >
                        Previous
                      </button>
                    ) : <div />}

                    {formStep < 2 ? (
                      <button
                        type="button"
                        onClick={() => setFormStep(formStep + 1)}
                        className="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700"
                      >
                        Next Step
                      </button>
                    ) : (
                      <button
                        type="submit"
                        className="px-5 py-2 rounded-xl text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700"
                      >
                        Submit Requisition
                      </button>
                    )}
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {selectedDetailRequest && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">

                <div className="flex items-start justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-300">
                      {selectedDetailRequest.id}
                    </span>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-1">
                      {selectedDetailRequest.jobTitle}
                    </h3>
                    <p className="text-xs text-slate-500">{selectedDetailRequest.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailRequest(null)} className="p-2 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>

                      <div className={`p-3 rounded-xl flex items-center justify-between text-xs font-semibold ${
                        sla.isCompleted 
                          ? "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                          : sla.isOverdue
                            ? "bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-900"
                            : "bg-sky-50 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300 border border-sky-200 dark:border-sky-900"
                      }`}>
                        <div className="flex items-center gap-2">
                          <Icon name="clock" className="w-4 h-4" />
                          <span>Request Date: {selectedDetailRequest.requestDate} ({sla.daysElapsed} days elapsed)</span>
                        </div>
                        <div>
                          {sla.isCompleted ? (
                            <span>Closed</span>
                          ) : sla.isOverdue ? (
                            <span className="font-bold text-rose-600 dark:text-rose-400">SLA Overdue</span>
                          ) : (
                            <span>{sla.daysRemaining} days remaining (30d SLA)</span>
                          )}
                        </div>
                      </div>
                    );
                  })()}

                  <div className="grid grid-cols-2 sm:grid-cols-4 gap-2 text-center p-3 rounded-xl bg-slate-50 dark:bg-slate-800/50">
                    <div>
                      <p className="text-[10px] text-slate-400">Headcount</p>
                      <p className="font-bold text-brand-600">{selectedDetailRequest.headcountRequired}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Target Date</p>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{selectedDetailRequest.targetDate}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">L1 Approval</p>
                      <p className="font-bold text-emerald-600">{selectedDetailRequest.approvalStatusL1}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Current Stage</p>
                      <p className="font-bold text-amber-600">{selectedDetailRequest.stage}</p>
                    </div>
                  </div>

                  {/* CANDIDATE & CV SECTION (ADMIN ONLY) */}
                  {isAdminAuthenticated && (
                    <div className="p-4 rounded-2xl bg-brand-50/50 dark:bg-brand-950/30 border border-brand-200 dark:border-brand-900 space-y-3">
                      <div className="flex items-center justify-between">
                        <h4 className="font-bold text-brand-900 dark:text-brand-200 flex items-center gap-1.5 text-xs">
                          <Icon name="users" className="w-4 h-4 text-brand-600" />
                          Candidate Info & CV / Resume (Google Drive Link)
                        </h4>
                        {!isEditingCandidate && (
                          <button
                            onClick={() => setIsEditingCandidate(true)}
                            className="px-2.5 py-1 rounded-lg bg-brand-600 text-white font-semibold text-[11px] hover:bg-brand-700 transition"
                          >
                            Edit CV / Candidate Link
                          </button>
                        )}
                      </div>

                      {isEditingCandidate ? (
                        <div className="space-y-3 pt-2">
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Candidate Full Name</label>
                            <input
                              type="text"
                              placeholder="e.g. นาย สมศักดิ์ มีสุข"
                              value={candidateNameInput}
                              onChange={(e) => setCandidateNameInput(e.target.value)}
                              className="w-full p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                            />
                          </div>
                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Google Drive Resume / CV Link</label>
                            <input
                              type="url"
                              placeholder="https://drive.google.com/file/d/..."
                              value={resumeUrlInput}
                              onChange={(e) => setResumeUrlInput(e.target.value)}
                              className="w-full p-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                            />
                          </div>
                          <div className="flex gap-2 justify-end pt-1">
                            <button
                              onClick={() => setIsEditingCandidate(false)}
                              className="px-3 py-1.5 rounded-lg text-[11px] font-semibold bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                            >
                              Cancel
                            </button>
                            <button
                              onClick={() => handleSaveCandidateInfo(selectedDetailRequest.id)}
                              className="px-3 py-1.5 rounded-lg text-[11px] font-semibold text-white bg-emerald-600 hover:bg-emerald-700"
                            >
                              Save Candidate CV Link
                            </button>
                          </div>
                        </div>
                      ) : (
                        <div className="text-xs space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                              <span className="text-[11px] text-slate-500">Candidate Name: </span>
                              <span className="font-bold text-slate-900 dark:text-white">
                                {selectedDetailRequest.candidateName || "No candidate assigned yet"}
                              </span>
                            </div>
                            {selectedDetailRequest.resumeUrl ? (
                              <a
                                href={selectedDetailRequest.resumeUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-semibold text-[11px] hover:bg-emerald-700 shadow-xs transition shrink-0"
                              >
                                Open CV (Google Drive) <Icon name="externalLink" className="w-3.5 h-3.5 text-white" />
                              </a>
                            ) : (
                              <span className="text-[11px] italic text-slate-400">No CV Drive Link Attached</span>
                            )}
                          </div>
                        </div>
                      )}
                    </div>
                  )}

                  <div>
                    <h4 className="font-bold text-slate-900 dark:text-white mb-1">Job Summary</h4>
                    <p className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {selectedDetailRequest.jobDescription}
                    </p>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                      <p className="font-bold text-slate-900 dark:text-white mb-1">Requester</p>
                      <p>{selectedDetailRequest.requesterName} ({selectedDetailRequest.requesterPosition})</p>
                      <p className="text-brand-600">{selectedDetailRequest.requesterEmail}</p>
                    </div>
                    <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                      <p className="font-bold text-slate-900 dark:text-white mb-1">Approver</p>
                      <p>{selectedDetailRequest.approverName}</p>
                      <p className="text-brand-600">{selectedDetailRequest.approverEmail}</p>
                    </div>
                  </div>

                  {selectedDetailRequest.cancellationReason && (
                    <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/40 border border-rose-200 dark:border-rose-900 text-rose-800 dark:text-rose-300">
                      <p className="font-bold">Cancellation / Rejection Reason:</p>
                      <p className="mt-1">{selectedDetailRequest.cancellationReason}</p>
                    </div>
                  )}
                </div>

                <div className="pt-4 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button
                    onClick={() => setSelectedDetailRequest(null)}
                    className="px-5 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {cancelModalItem && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6">
                <h3 className="text-base font-bold text-rose-600 dark:text-rose-400 mb-2">
                  Cancellation / Rejection Reason
                </h3>
                <p className="text-xs text-slate-500 mb-4">
                  Please specify why position ID <strong>{cancelModalItem.id}</strong> is being cancelled or rejected.
                </p>

                <textarea
                  rows="3"
                  autoFocus
                  placeholder="e.g. Budget revoked, Position on hold, Candidate declined..."
                  value={cancelReasonInput}
                  onChange={(e) => setCancelReasonInput(e.target.value)}
                  className="w-full p-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-rose-500 mb-4"
                ></textarea>

                <div className="flex gap-2 justify-end">
                  <button
                    onClick={() => setCancelModalItem(null)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      updateStageDirectly(cancelModalItem.id, cancelModalItem.targetStage, cancelReasonInput || "Cancelled by admin");
                      setCancelModalItem(null);
                    }}
                    className="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-rose-600 hover:bg-rose-700"
                  >
                    Confirm Stage Change
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {showSheetsModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6">
                <div className="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <h3 className="text-base font-bold text-slate-900 dark:text-white flex items-center gap-2">
                    <Icon name="refresh" className="w-5 h-5 text-brand-600" />
                    Google Sheets Real-Time Sync Setup
                  </h3>
                  <button onClick={() => setShowSheetsModal(false)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-4 text-xs">
                  <div>
                    <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Target Google Sheet Link:</label>
                    <a
                      href={GOOGLE_SHEET_URL}
                      target="_blank"
                      rel="noreferrer"
                      className="text-brand-600 font-medium hover:underline flex items-center gap-1"
                    >

                    </a>
                  </div>

                  <div>
                    <label className="block font-semibold text-slate-700 dark:text-slate-300 mb-1">Google Apps Script Web App URL (for live POST sync):</label>
                    <input
                      type="url"
                      placeholder="https://script.google.com/macros/s/AKfycbx.../exec"
                      value={googleScriptUrl}
                      onChange={(e) => setGoogleScriptUrl(e.target.value)}
                      className="w-full p-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                    />
                    <p className="text-[10px] text-slate-400 mt-1">Paste your deployed Apps Script Web App URL here to stream submissions live into Google Sheets.</p>
                  </div>

                    <ol className="list-decimal pl-4 space-y-1 text-slate-600 dark:text-slate-400 text-[11px]">
                      <li>Open your Google Sheet &rarr; Click <strong>Extensions &rarr; Apps Script</strong>.</li>
                      <li>Paste this code: <br />
                        <code className="block bg-slate-200 dark:bg-slate-900 p-2 rounded text-[10px] my-1 text-slate-800 dark:text-slate-200 select-all">
                          {`function doPost(e) { const data = JSON.parse(e.postData.contents); const sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet(); sheet.appendRow([data.id, data.requestDate, data.requesterName, data.jobTitle, data.department, data.headcountRequired, data.stage, data.targetDate]); return ContentService.createTextOutput("Success"); }`}
                        </code>
                      </li>
                      <li>Click <strong>Deploy &rarr; New deployment &rarr; Web app</strong>.</li>
                      <li>Set <i>"Who has access"</i> to <strong>Anyone</strong> &rarr; Deploy &amp; copy the Web App URL into the field above!</li>
                    </ol>
                  </div>
                </div>

                <div className="flex gap-2 justify-end pt-2 border-t border-slate-200 dark:border-slate-800">
                  <button
                    onClick={() => setShowSheetsModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-brand-600 text-white hover:bg-brand-700"
                  >
                    Save &amp; Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <div className="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center mx-auto mb-3">
                  <Icon name="lock" className="w-6 h-6" />
                </div>
                <h3 className="text-base font-bold text-slate-900 dark:text-white">Admin Authentication</h3>
                <p className="text-xs text-slate-500 mt-1 mb-4">Enter passcode to access HR Admin Portal</p>

                <form onSubmit={handleAdminLoginSubmit} className="space-y-4">
                  <input
                    type="password"
                    autoFocus
                    placeholder="Enter passcode (admin123)"
                    value={adminPasscode}
                    onChange={(e) => setAdminPasscode(e.target.value)}
                    className="w-full p-2.5 text-sm text-center tracking-widest rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:ring-2 focus:ring-brand-500"
                  />
                  {loginError && <p className="text-[11px] text-rose-500 font-medium">{loginError}</p>}

                  <div className="flex gap-2">
                    <button
                      type="button"
                      onClick={() => setShowLoginModal(false)}
                      className="w-1/2 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="w-1/2 py-2 rounded-xl text-xs font-semibold text-white bg-brand-600 hover:bg-brand-700"
                    >
                      Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
