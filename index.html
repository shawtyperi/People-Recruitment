                  </h3>
                  <button onClick={() => setShowRequestModal(false)} className="p-2 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={handleFormSubmit} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <h4 className="font-bold text-slate-900 dark:text-white text-xs">1. ผู้ยื่นคำขอ (Requester Details)</h4>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ผู้ขอ (Requester Name) *</label>
                        <SearchableSelect
                          value={formInput.requesterName}
                          options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                          onChange={(name) => {
                            const person = personnelList.find(p => p.name === name);
                            setFormInput(prev => ({
                              ...prev,
                              requesterName: name,
                              requesterEmail: person?.email || prev.requesterEmail,
                              requesterPosition: person?.position || prev.requesterPosition,
                              department: person?.department || prev.department
                            }));
                          }}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ตำแหน่งผู้ขอ *</label>
                        <input
                          type="text"
                          required
                          value={formInput.requesterPosition}
                          onChange={(e) => setFormInput({ ...formInput, requesterPosition: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">Email ผู้ขอ *</label>
                        <input
                          type="email"
                          required
                          value={formInput.requesterEmail}
                          onChange={(e) => setFormInput({ ...formInput, requesterEmail: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ฝ่ายงาน *</label>
                        <SearchableSelect
                          value={formInput.department}
                          options={departmentOptions.map(d => ({ value: d, label: d }))}
                          onChange={(dept) => setFormInput({ ...formInput, department: dept })}
                        />
                      </div>
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="font-bold text-slate-900 dark:text-white text-xs">2. ผู้อนุมัติ &amp; การส่งต่อ (Approval &amp; Routing)</h4>
                      <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-slate-200 dark:bg-slate-700 text-slate-600 dark:text-slate-300">
                        🔒 ล็อกผู้อนุมัติอัตโนมัติ
                      </span>
                    </div>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ผู้อนุมัติ (Approver Name)</label>
                        <input
                          type="text"
                          disabled
                          readOnly
                          value="ศรัณย์ภัทธ อุบล"
                          className="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold cursor-not-allowed select-none"
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">Email ผู้อนุมัติ</label>
                        <input
                          type="email"
                          disabled
                          readOnly
                          value="sarunpat.ub@valuesourcing.co"
                          className="w-full p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold cursor-not-allowed select-none"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <h4 className="font-bold text-slate-900 dark:text-white text-xs">3. ตำแหน่งที่ต้องการรับ (Position Requisition)</h4>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="sm:col-span-2">
                        <label className="block text-[11px] font-semibold mb-1">ชื่อตำแหน่ง (Job Title) *</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Senior Full-Stack AI Engineer"
                          value={formInput.jobTitle}
                          onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">จำนวนอัตรา (Headcount) *</label>
                        <input
                          type="number"
                          min="1"
                          required
                          value={formInput.headcountRequired}
                          onChange={(e) => setFormInput({ ...formInput, headcountRequired: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-center"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ประเภทตำแหน่ง (Position Type) *</label>
                        <select
                          value={formInput.positionType}
                          onChange={(e) => setFormInput({ ...formInput, positionType: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="Replacement">ทดแทนตำแหน่งเดิม (Replacement)</option>
                          <option value="New Headcount">เปิดตำแหน่งใหม่ (New Headcount)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ต้องการภายในวันที่ (Native Date) *</label>
                        <input
                          type="date"
                          required
                          value={formInput.targetDate}
                          onChange={(e) => setFormInput({ ...formInput, targetDate: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">Buddy (พี่เลี้ยง)</label>
                        <SearchableSelect
                          value={formInput.buddy}
                          options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                          onChange={(buddyName) => setFormInput({ ...formInput, buddy: buddyName })}
                        />
                      </div>
                    </div>

                    {formInput.positionType === "Replacement" && (
                      <div className="p-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 animate-fadeIn">
                        <label className="block text-[11px] font-bold text-amber-900 dark:text-amber-200 mb-1">
                          ชื่อพนักงานที่ลาออก / ถูกทดแทน (Replaced Employee Name) <span className="text-rose-600">* (บังคับกรอก)</span>
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="ระบุชื่อ-นามสกุล ของพนักงานที่ลาออก หรือตำแหน่งเดิมที่ถูกทดแทน"
                          value={formInput.replacedEmployeeName}
                          onChange={(e) => setFormInput({ ...formInput, replacedEmployeeName: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-700 font-semibold focus:ring-2 focus:ring-amber-500"
                        />
                      </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-700/60">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">เพศ (Gender)</label>
                        <select
                          value={formInput.gender}
                          onChange={(e) => setFormInput({ ...formInput, gender: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ไม่ระบุ">ไม่ระบุ</option>
                          <option value="ชาย">ชาย</option>
                          <option value="หญิง">หญิง</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">อายุ (Age)</label>
                        <select
                          value={formInput.age}
                          onChange={(e) => setFormInput({ ...formInput, age: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ไม่จำกัด">ไม่จำกัด</option>
                          <option value="20-25 ปี">20-25 ปี</option>
                          <option value="25-30 ปี">25-30 ปี</option>
                          <option value="30-35 ปี">30-35 ปี</option>
                          <option value="35-40 ปี">35-40 ปี</option>
                          <option value="40 ปีขึ้นไป">40 ปีขึ้นไป</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ระดับการศึกษา (Education)</label>
                        <select
                          value={formInput.educationLevel}
                          onChange={(e) => setFormInput({ ...formInput, educationLevel: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ไม่จำกัด">ไม่จำกัด</option>
                          <option value="มัธยมศึกษา-ปวช.">มัธยมศึกษา-ปวช.</option>
                          <option value="ปวส.">ปวส.</option>
                          <option value="ปริญญาตรี">ปริญญาตรี</option>
                          <option value="ปริญญาโทขึ้นไป">ปริญญาโทขึ้นไป</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">สาขาวิชา (Major / Field of Study)</label>
                        <input
                          type="text"
                          placeholder="e.g. วิทยาการคอมพิวเตอร์, บัญชี, การตลาด..."
                          value={formInput.major}
                          onChange={(e) => setFormInput({ ...formInput, major: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ประสบการณ์ทำงาน (Experience)</label>
                        <select
                          value={formInput.experience}
                          onChange={(e) => setFormInput({ ...formInput, experience: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="ยินดีรับนักศึกษาจบใหม่">ยินดีรับนักศึกษาจบใหม่</option>
                          <option value="1-3 ปี">1-3 ปี</option>
                          <option value="3-5 ปี">3-5 ปี</option>
                          <option value="5 ปีขึ้นไป">5 ปีขึ้นไป</option>
                        </select>
                      </div>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold mb-1">คุณสมบัติที่จำเป็น (Must-have Qualifications)</label>
                      <textarea
                        rows="2"
                        placeholder="ระบุทักษะความเชี่ยวชาญสำคัญ ความรู้เฉพาะทาง หรือใบอนุญาตที่ต้องมี..."
                        value={formInput.mustHaveQualifications}
                        onChange={(e) => setFormInput({ ...formInput, mustHaveQualifications: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold mb-1">ลักษณะงานโดยย่อ (Job Description)</label>
                      <textarea
                        rows="2"
                        placeholder="สรุปขอบเขตงานและหน้าที่ความรับผิดชอบหลัก..."
                        value={formInput.jobDescription}
                        onChange={(e) => setFormInput({ ...formInput, jobDescription: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>
                  </div>

                  {/* Section 4: IT & Equipment Requirements */}
                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <div className="flex items-center justify-between">
                      <h4 className="font-bold text-slate-900 dark:text-white text-xs flex items-center gap-1.5">
                        <span>💻 4. อุปกรณ์และสิทธิ์ IT (IT &amp; Equipment Requirements)</span>
                      </h4>
                      <span className="text-[10px] text-slate-400">เลือกความต้องการสำหรับตำแหน่งนี้</span>
                    </div>

                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3">
                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700">
                        <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300 mb-1">Laptop / PC</label>
                        <select
                          value={formInput.itLaptop}
                          onChange={(e) => setFormInput({ ...formInput, itLaptop: e.target.value })}
                          className={`w-full p-1.5 rounded-lg border text-xs font-bold ${
                            formInput.itLaptop === "ต้องการ" ? "bg-brand-50 border-brand-300 text-brand-700 dark:bg-brand-950/70 dark:text-brand-300" : "bg-slate-50 border-slate-200 text-slate-500"
                          }`}
                        >
                          <option value="ต้องการ">ต้องการ</option>
                          <option value="ไม่ต้องการ">ไม่ต้องการ</option>
                        </select>
                      </div>

                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700">
                        <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300 mb-1">Sim Card / โทรศัพท์</label>
                        <select
                          value={formInput.itSimCard}
                          onChange={(e) => setFormInput({ ...formInput, itSimCard: e.target.value })}
                          className={`w-full p-1.5 rounded-lg border text-xs font-bold ${
                            formInput.itSimCard === "ต้องการ" ? "bg-brand-50 border-brand-300 text-brand-700 dark:bg-brand-950/70 dark:text-brand-300" : "bg-slate-50 border-slate-200 text-slate-500"
                          }`}
                        >
                          <option value="ต้องการ">ต้องการ</option>
                          <option value="ไม่ต้องการ">ไม่ต้องการ</option>
                        </select>
                      </div>

                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700">
                        <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300 mb-1">Email องค์กร</label>
                        <select
                          value={formInput.itEmail}
                          onChange={(e) => setFormInput({ ...formInput, itEmail: e.target.value })}
                          className={`w-full p-1.5 rounded-lg border text-xs font-bold ${
                            formInput.itEmail === "ต้องการ" ? "bg-brand-50 border-brand-300 text-brand-700 dark:bg-brand-950/70 dark:text-brand-300" : "bg-slate-50 border-slate-200 text-slate-500"
                          }`}
                        >
                          <option value="ต้องการ">ต้องการ</option>
                          <option value="ไม่ต้องการ">ไม่ต้องการ</option>
                        </select>
                      </div>

                      <div className="p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700">
                        <label className="block text-[10px] font-bold text-slate-600 dark:text-slate-300 mb-1">สิทธิ์ ERP Netsuite</label>
                        <select
                          value={formInput.itNetsuite}
                          onChange={(e) => setFormInput({ ...formInput, itNetsuite: e.target.value })}
                          className={`w-full p-1.5 rounded-lg border text-xs font-bold ${
                            formInput.itNetsuite === "ต้องการ" ? "bg-brand-50 border-brand-300 text-brand-700 dark:bg-brand-950/70 dark:text-brand-300" : "bg-slate-50 border-slate-200 text-slate-500"
                          }`}
                        >
                          <option value="ต้องการ">ต้องการ</option>
                          <option value="ไม่ต้องการ">ไม่ต้องการ</option>
                        </select>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowRequestModal(false)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md"
                    >
                      บันทึกคำขอ
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* Admin Detail View Slide-Over / Modal (Requisition Queue Detail) */}
          {selectedRequisitionDetail && (
            <div className="fixed inset-0 z-[80] flex items-center justify-end bg-slate-950/70 backdrop-blur-sm animate-fadeIn">
              <div 
                className="relative w-full max-w-2xl h-full bg-white dark:bg-slate-900 shadow-2xl border-l border-slate-200 dark:border-slate-800 flex flex-col justify-between overflow-hidden"
                onClick={(e) => e.stopPropagation()}
              >
                {/* Header */}
                <div className="px-6 py-5 bg-gradient-to-r from-slate-900 to-slate-800 text-white flex items-center justify-between border-b border-slate-800">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-extrabold uppercase tracking-wider text-amber-400">
                        REQUISITION INSPECTION &amp; APPROVAL ACTION
                      </span>
                      <span className="text-[10px] text-slate-400">&bull; {selectedRequisitionDetail.requestDate}</span>
                    </div>
                    <h3 className="text-base sm:text-lg font-extrabold text-white mt-0.5">
                      {selectedRequisitionDetail.jobTitle} ({selectedRequisitionDetail.id})
                    </h3>
                  </div>
                  <button 
                    onClick={() => setSelectedRequisitionDetail(null)} 
                    className="p-2 text-slate-400 hover:text-white rounded-xl hover:bg-white/10 transition"
                  >
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Workflow Progress Stepper */}
                <div className="bg-slate-50 dark:bg-slate-800/70 px-6 py-3 border-b border-slate-200 dark:border-slate-800">
                  <div className="flex items-center justify-between text-[11px] font-bold text-slate-500">
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_ADMIN" ? "text-amber-600 font-extrabold" : "text-emerald-600 font-bold"}>
                      1. แอดมินตรวจ
                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_APPROVER" ? "text-sky-600 font-extrabold" : (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_IT" || (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" ? "text-emerald-600" : ""}>
                      2. ผู้อนุมัติยืนยัน
                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "PENDING_IT" ? "text-purple-600 font-extrabold" : (selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" ? "text-emerald-600" : ""}>
                      3. IT รับทราบ
                    </span>
                    <span>&rarr;</span>
                    <span className={(selectedRequisitionDetail.requestStatus || selectedRequisitionDetail.workflowStatus) === "READY_FOR_RECRUITMENT" || selectedRequisitionDetail.requestStatus === "Recruiting" ? "text-emerald-600 font-extrabold" : ""}>
                      4. พร้อมสรรหา
                    </span>
                  </div>
                </div>

                        <strong className="text-brand-600 font-bold">{pendingConfirmationForm.itLaptop}</strong>
                      </div>

                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmFinalSubmit}

                  </button>

              </div>

          {/* Admin Review & Action Modal (Step 2: PENDING_ADMIN -> READY_FOR_RECRUITMENT) */}

                    <p><span className="text-slate-400">ผู้อนุมัติ:</span> ศรัณย์ภัทธ อุบล (sarunpat.ub@valuesourcing.co)</p>
                  </div>

                  <div className="p-3.5 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 space-y-1">
                    <span className="text-[10px] font-bold uppercase text-emerald-900 dark:text-emerald-300 flex items-center gap-1">
                      <span>⚡ การดำเนินการสรรหาทันที (Direct Recruitment Workflow):</span>
                    </span>
                    <p className="text-xs font-semibold text-emerald-800 dark:text-emerald-200 leading-relaxed">
                      เมื่อแอดมินกดยืนยัน ระบบจะปรับสถานะเป็น <strong>READY_FOR_RECRUITMENT</strong> และย้ายคำขอนี้เข้าสู่ <strong>1. Manpower Request</strong> บน Kanban Pipeline ทันที
                    </p>
                  </div>
                </div>

                <div className="p-4 bg-slate-50 dark:bg-slate-800/80 border-t border-slate-200 dark:border-slate-800 flex items-center justify-between gap-2">
                  <button
                    type="button"
                    onClick={() => setShowAdminReviewModal(false)}
                    className="px-4 py-2 rounded-xl text-xs font-semibold bg-white dark:bg-slate-700 border border-slate-200 dark:border-slate-600 text-slate-700 dark:text-slate-200"
                  >
                    ปิด
                  </button>
                  <button
                    type="button"
                    onClick={() => handleAdminApproveAndMoveToManpower(selectedAdminReviewSlot)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-600 hover:from-emerald-700 hover:to-teal-700 shadow-md transition active:scale-95 flex items-center gap-1.5"
                  >
                    <span>✅ ยืนยันรับข้อมูล &amp; เริ่มการสรรหา (READY_FOR_RECRUITMENT)</span>
                    <Icon name="checkCircle" className="w-3.5 h-3.5 text-white" />
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Slot Detail Modal */}
          {selectedDetailSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 my-8">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold text-brand-600 uppercase">{selectedDetailSlot.slotId}</span>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-0.5">{selectedDetailSlot.jobTitle}</h3>
                    <p className="text-xs text-slate-500">{selectedDetailSlot.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailSlot(null)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-3 text-xs max-h-[70vh] overflow-y-auto pr-1">
                  
                  {/* Rejection / Decline Highlight banner if cancelled or declined */}
                  {(selectedDetailSlot.stage === "cancelled" || selectedDetailSlot.onboardingArrivalStatus === "declined_noshow") && (
                    <div className="p-3.5 rounded-2xl bg-rose-100 dark:bg-rose-950/70 border-2 border-rose-400 dark:border-rose-800 text-rose-900 dark:text-rose-200 space-y-1">
                      <div className="font-extrabold flex items-center gap-1.5 text-xs">
                        <Icon name="exclamation" className="w-4 h-4 text-rose-600" />
                        <span>ตำแหน่งนี้ถูกยกเลิก / ผู้สมัครสละสิทธิ์ (Cancelled / Declined)</span>
                      </div>
                      <p className="text-[11px] font-semibold pl-5">
                        เหตุผล: {selectedDetailSlot.rejectionReason || "ไม่ระบุเหตุผล"}
                      </p>
                    </div>
                  )}

                  {/* Total Recruitment Duration Banner in Detail Modal for Closed Slots */}
                  {(selectedDetailSlot.slotStatus === "Closed" || selectedDetailSlot.stage === "onboarded" || selectedDetailSlot.stage === "cancelled") && (() => {
                    const duration = getRecruitmentDurationInfo(selectedDetailSlot.requestDate, selectedDetailSlot.hireDate, selectedDetailSlot.lastUpdated);
                    return (
                      <div className="p-3.5 rounded-2xl bg-gradient-to-r from-sky-50 to-indigo-50 dark:from-sky-950/60 dark:to-indigo-950/60 border border-sky-200 dark:border-sky-800 text-xs space-y-1.5 shadow-2xs">
                        <div className="font-bold text-sky-900 dark:text-sky-200 flex items-center justify-between">
                          <span className="flex items-center gap-1.5">
                            <span>⏱️ ระยะเวลาที่ใช้สรรหา (Total Recruitment Time)</span>
                          </span>
                          <span className="px-2 py-0.5 rounded-md bg-sky-600 text-white font-extrabold text-[11px]">
                            รวม {duration.totalDays} วัน

                        </div>
                        <div className="text-[11px] text-slate-600 dark:text-slate-300 space-y-0.5">
                          <p>
                            <strong>ช่วงเวลา:</strong> {duration.rangeText} (คำนวณจาก Request Date ถึงวันปิดรับ/เริ่มงาน)
                          </p>
                          <p className="text-sky-700 dark:text-sky-300 font-semibold">
                            <strong>วันทำการ (ไม่รวมเสาร์-อาทิตย์):</strong> {duration.workingDays} วันทำการ
                          </p>
                        </div>
                      </div>

                  })()}

                  <div className="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <div>
                      <span className="text-[10px] text-slate-400">Position Type:</span>

                    <div>
                      <span className="text-[10px] text-slate-400">Status ของ Slot:</span>
                      <p className="font-bold text-emerald-600">{selectedDetailSlot.slotStatus || "Recruiting"}</p>
                    </div>
                  </div>

                  {/* Approval Workflow Progress Tracker */}
                  {(() => {
                    const wf = selectedDetailSlot.workflowStatus || selectedDetailSlot.requestStatus || "PENDING_ADMIN";
                    const currentReq = requests.find(r => r.id === (selectedDetailSlot.parentRequestId || selectedDetailSlot.id));
                    const liveWf = currentReq?.workflowStatus || wf;
                    const priorityInfo = getPositionPriorityInfo(selectedDetailSlot);

                    // สเต็ปที่ 1: ยื่นคำขอเรียบร้อยแล้วเสมอ
                    const isStep1Done = true;

                    // สเต็ปที่ 2: แอดมินอนุมัติแล้ว (ผ่าน PENDING_ADMIN มาแล้ว หรืออยู่ในสเตจถัดไป)
                    const isStep2Done = liveWf !== "PENDING_ADMIN" && liveWf !== "REJECTED_BY_ADMIN";

                    // สเต็ปที่ 3: ดำเนินการสัมภาษณ์ & ยื่น Offer
                    const isStep3Done = selectedDetailSlot.stage === "offer" || selectedDetailSlot.stage === "onboarded" || Boolean(selectedDetailSlot.isItNotified);

                    // สเต็ปที่ 4: IT รับทราบและเตรียมอุปกรณ์ (เมื่อแอดมินส่งเมลแจ้ง IT และ IT กดยืนยันแล้ว)
                    const isStep4Done = Boolean(selectedDetailSlot.isItNotified) && (liveWf === "READY_FOR_RECRUITMENT" || liveWf === "Recruiting" || selectedDetailSlot.stage === "onboarded");

                    // สเต็ปที่ 5: เริ่มงาน & ปิดการสรรหา (ต้องมาเริ่มงานจริงจึงจะติ๊กถูก)
                    const isStep5Done = selectedDetailSlot.stage === "onboarded" && (selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported");

                    return (
                      <div className="p-4 rounded-2xl bg-gradient-to-br from-slate-50 to-sky-50/40 dark:from-slate-800/80 dark:to-sky-950/30 border border-slate-200 dark:border-slate-700 space-y-3">
                        <div className="flex items-center justify-between">
                          <div className="flex items-center gap-2">
                            <span className="text-[11px] font-extrabold uppercase tracking-wider text-slate-700 dark:text-slate-200 flex items-center gap-1.5">
                              <Icon name="clipboardCheck" className="w-4 h-4 text-brand-600" />
                              <span>APPROVAL &amp; RECRUITMENT WORKFLOW TRACKER</span>
                            </span>

                            {/* Priority Tag in Modal */}
                            <span className="relative flex h-2.5 w-2.5 ml-1">
                              {priorityInfo.ping && (
                                <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${priorityInfo.dotBg} opacity-75`}></span>
                              )}
                              <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${priorityInfo.dotBg}`}></span>
                            </span>
                            <span className={`text-[9.5px] font-bold px-1.5 py-0.2 rounded border ${priorityInfo.badge}`}>
                              {priorityInfo.label}
                            </span>
                          </div>

                          {/* Dynamic Badge สะท้อนสถานะจริงตามสเตจ */}
                          <span className={`text-[10px] font-extrabold px-2.5 py-0.5 rounded-full border ${
                            liveWf === "PENDING_ADMIN" ? "bg-amber-100 text-amber-900 border-amber-300 dark:bg-amber-950 dark:text-amber-300" :
                            selectedDetailSlot.stage === "interview" ? "bg-blue-100 text-blue-900 border-blue-300 dark:bg-blue-950 dark:text-blue-300" :
                            selectedDetailSlot.stage === "offer" && !selectedDetailSlot.isItNotified ? "bg-purple-100 text-purple-900 border-purple-300 dark:bg-purple-950 dark:text-purple-300 font-bold animate-pulse" :
                            selectedDetailSlot.stage === "offer" && selectedDetailSlot.isItNotified && !isStep4Done ? "bg-sky-100 text-sky-900 border-sky-300 dark:bg-sky-950 dark:text-sky-300 font-bold animate-pulse" :
                            isStep4Done && selectedDetailSlot.stage !== "onboarded" ? "bg-emerald-100 text-emerald-900 border-emerald-300 dark:bg-emerald-950 dark:text-emerald-300 font-bold" :
                            selectedDetailSlot.stage === "onboarded" && (selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported") ? "bg-slate-200 text-slate-900 border-slate-300 font-bold" :
                            selectedDetailSlot.stage === "onboarded" ? "bg-emerald-100 text-emerald-900 border-emerald-400 font-bold" :
                            "bg-slate-100 text-slate-700 border-slate-200"
                          }`}>
                            {liveWf === "PENDING_ADMIN" ? "⏳ 1. รอ Admin ตรวจสอบ" :
                             selectedDetailSlot.stage === "manpower" ? "✅ 2. พร้อมสรรหา (รอคัดเลือก)" :
                             selectedDetailSlot.stage === "interview" ? "👥 3. อยู่ระหว่างสัมภาษณ์" :
                             selectedDetailSlot.stage === "offer" && !selectedDetailSlot.isItNotified ? "🎯 4. Confirm สรรหา (รอแจ้ง IT)" :
                             selectedDetailSlot.stage === "offer" && selectedDetailSlot.isItNotified && !isStep4Done ? "💻 5. รอ IT กดรับทราบอุปกรณ์" :
                             isStep4Done && selectedDetailSlot.stage !== "onboarded" ? "💻 6. IT รับทราบแล้ว (พร้อมเริ่มงาน)" :
                             selectedDetailSlot.stage === "onboarded" && (selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported") ? "🎉 7. เริ่มงานแล้ว / ปิดการสรรหา" :
                             selectedDetailSlot.stage === "onboarded" ? "🎉 6. บรรจุงานแล้ว (รอวันอบรมวันแรก)" :
                             "Recruiting"}
                          </span>
                        </div>

                        {/* Stepper 5 ขั้นตอนสอดคล้องกับ Process จริง */}
                        <div className="grid grid-cols-2 sm:grid-cols-5 gap-2 pt-1 text-center">
                          {/* Step 1: ยื่นคำขอ */}
                          <div className="p-2 rounded-xl bg-white dark:bg-slate-800 border border-emerald-200 dark:border-emerald-800">
                            <div className="w-5 h-5 rounded-full bg-emerald-500 text-white text-[10px] font-bold flex items-center justify-center mx-auto mb-1">✓</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">1. ขอกำลังคน</span>
                            <span className="text-[9px] text-emerald-600 font-semibold block">{selectedDetailSlot.requestDate}</span>
                          </div>

                          {/* Step 2: Admin อนุมัติ */}
                          <div className={`p-2 rounded-xl border ${
                            isStep2Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            liveWf === "PENDING_ADMIN" ? "bg-amber-50 dark:bg-amber-950/60 border-amber-300 ring-2 ring-amber-500/20" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"

                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep2Done ? "bg-emerald-500 text-white" :
                              liveWf === "PENDING_ADMIN" ? "bg-amber-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep2Done ? "✓" : "2"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">2. Admin อนุมัติ</span>
                            <span className={`text-[9px] font-semibold block ${isStep2Done ? "text-emerald-600" : "text-amber-600"}`}>
                              {isStep2Done ? "อนุมัติแล้ว" : "รอแอดมินตรวจ"}
                            </span>
                          </div>

                          {/* Step 3: สัมภาษณ์ & Offer */}
                          <div className={`p-2 rounded-xl border ${
                            isStep3Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            selectedDetailSlot.stage === "interview" ? "bg-blue-50 dark:bg-blue-950/60 border-blue-300 ring-2 ring-blue-500/20" :
                            selectedDetailSlot.stage === "manpower" ? "bg-slate-50 border-slate-200 dark:border-slate-700" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep3Done ? "bg-emerald-500 text-white" :
                              selectedDetailSlot.stage === "interview" ? "bg-blue-500 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep3Done ? "✓" : "3"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">3. สัมภาษณ์ &amp; Offer</span>
                            <span className={`text-[9px] font-semibold block ${
                              isStep3Done ? "text-emerald-600 font-bold" :
                              selectedDetailSlot.stage === "interview" ? "text-blue-600 font-bold" : "text-slate-400"
                            }`}>
                              {isStep3Done ? "Offer Sent แล้ว" : selectedDetailSlot.stage === "interview" ? "กำลังสัมภาษณ์" : "รอคัดเลือก"}
                            </span>
                          </div>

                          {/* Step 4: IT ยืนยันอุปกรณ์ */}
                          <div className={`p-2 rounded-xl border ${
                            isStep4Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            selectedDetailSlot.isItNotified ? "bg-sky-50 dark:bg-sky-950/60 border-sky-300 ring-2 ring-sky-500/20" :
                            selectedDetailSlot.stage === "offer" ? "bg-purple-50 dark:bg-purple-950/60 border-purple-300" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep4Done ? "bg-emerald-500 text-white" :
                              selectedDetailSlot.isItNotified ? "bg-sky-500 text-white animate-pulse" :
                              selectedDetailSlot.stage === "offer" ? "bg-purple-500 text-white" : "bg-slate-300 text-slate-600"
                            }`}>{isStep4Done ? "✓" : "4"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">4. IT รับทราบ</span>
                            <span className={`text-[9px] font-semibold block ${
                              isStep4Done ? "text-emerald-600 font-bold" :
                              selectedDetailSlot.isItNotified ? "text-sky-600 font-bold" :
                              selectedDetailSlot.stage === "offer" ? "text-purple-600" : "text-slate-400"
                            }`}>
                              {isStep4Done ? "IT รับทราบแล้ว" : selectedDetailSlot.isItNotified ? "รอ IT กดรับทราบ" : "รอแจ้ง IT"}
                            </span>
                          </div>

                          {/* Step 5: เริ่มงาน & ปิดสรรหา */}
                          <div className={`p-2 rounded-xl border col-span-2 sm:col-span-1 ${
                            isStep5Done ? "bg-white dark:bg-slate-800 border-emerald-200 dark:border-emerald-800" :
                            selectedDetailSlot.stage === "onboarded" ? "bg-emerald-50 dark:bg-emerald-950/60 border-emerald-300 ring-2 ring-emerald-500/20" :
                            "bg-slate-50 dark:bg-slate-800/40 border-slate-200 dark:border-slate-700 opacity-60"
                          }`}>
                            <div className={`w-5 h-5 rounded-full text-[10px] font-bold flex items-center justify-center mx-auto mb-1 ${
                              isStep5Done ? "bg-emerald-500 text-white" :
                              selectedDetailSlot.stage === "onboarded" ? "bg-emerald-600 text-white animate-pulse" : "bg-slate-300 text-slate-600"
                            }`}>{isStep5Done ? "✓" : "5"}</div>
                            <span className="font-bold text-[10px] text-slate-900 dark:text-white block">5. เริ่มงาน &amp; ปิด</span>
                            <span className={`text-[9px] font-semibold block ${
                              isStep5Done ? "text-emerald-600 font-bold" :
                              selectedDetailSlot.stage === "onboarded" ? "text-emerald-700 font-bold" : "text-slate-400"
                            }`}>
                              {isStep5Done ? "ปิดการสรรหาแล้ว" : selectedDetailSlot.stage === "onboarded" ? "รอเริ่มงาน" : "รอสเตจ Offer"}
                            </span>
                          </div>
                        </div>

                      <div className="flex items-center justify-between">
                        <p className="font-bold text-emerald-900 dark:text-emerald-200 text-sm">👤 แคนดิเดต: {selectedDetailSlot.candidateName}</p>
                        {isAdminAuthenticated && (
                          <button
                            onClick={() => {
                              const slot = selectedDetailSlot;
                              setSelectedDetailSlot(null);
                              setUnassignConfirmTarget(slot);
                            }}
                            className="text-[10px] font-bold text-rose-600 hover:underline"
                          >
                            ถอดออกจากตำแหน่ง
                          </button>
                        )}
                      </div>
                      <p className="text-emerald-700 dark:text-emerald-300">📞 {selectedDetailSlot.candidatePhone || "-"}</p>
                      {selectedDetailSlot.interviewSchedule && (() => {
                        const relTime = getInterviewRelativeTimeInfo(selectedDetailSlot.interviewSchedule);
                        return (
                          <div className="mt-1 flex flex-wrap items-center justify-between gap-1.5">
                            <p className="text-amber-800 dark:text-amber-300 font-semibold">📅 วันเวลานัดสัมภาษณ์: {selectedDetailSlot.interviewSchedule}</p>
                            {relTime && selectedDetailSlot.stage === "interview" && (
                              <span className={`inline-flex items-center gap-1 px-2.5 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>
                                {relTime.ping && (
                                  <span className="relative flex h-2 w-2">
                                    <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                    <span className={`relative inline-flex rounded-full h-2 w-2 ${relTime.dotBg}`}></span>
                                  </span>
                                )}
                                <span>{relTime.text}</span>
                              </span>
                            )}
                          </div>
                        );
                      })()}

                      {selectedDetailSlot.evaluationsCount > 0 && (
                        <div className="mt-3 pt-3 border-t border-emerald-200 dark:border-emerald-800/80 space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 dark:text-slate-200">ผลประเมินสัมภาษณ์เฉลี่ยรวม ({selectedDetailSlot.evaluationsCount} ท่าน):</span>
                            <span className={`px-2 py-0.5 rounded font-extrabold text-[10px] ${
                              selectedDetailSlot.interviewResult === "Pass" ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                            }`}>
                              {selectedDetailSlot.interviewResult} ({selectedDetailSlot.interviewScore}/5 - {selectedDetailSlot.interviewScorePercent}%)
                            </span>
                          </div>
                          {isAdminAuthenticated && (
                            <button
                              onClick={() => {
                                const s = selectedDetailSlot;
                                setSelectedDetailSlot(null);
                                setAdminAuditSlot(s);
                              }}
                              className="text-xs font-bold text-brand-600 hover:underline mt-1"
                            >
                              🔍 เปิดดู Audit Breakdown รายชื่อและคะแนนกรรมการทุกคน &rarr;
                            </button>
                          )}
                        </div>
                      )}

                      {/* Add Interview Evaluation Button in Slot Detail Modal (Strictly ONLY in Interview Stage) */}
                      {selectedDetailSlot.stage === "interview" && (
                        <div className="mt-3 pt-2.5 border-t border-emerald-200/70 dark:border-emerald-800/70 flex items-center justify-between">
                          <button
                            type="button"
                            onClick={() => handleOpenBlindEvaluationModal(selectedDetailSlot)}
                            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 active:scale-95 text-white font-bold text-xs shadow-xs transition cursor-pointer"
                          >
                            <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-white" />
                            <span>+ บันทึกผลประเมินสัมภาษณ์</span>
                          </button>
                          <span className="text-[11px] text-slate-500 dark:text-slate-400">
                            {selectedDetailSlot.evaluationsCount > 0 ? `ประเมินแล้ว ${selectedDetailSlot.evaluationsCount} ท่าน` : "ยังไม่มีผู้ประเมิน"}
                          </span>
                        </div>
                      )}
                    </div>
                  ) : (
                    <div className="p-3 text-center bg-slate-50 dark:bg-slate-800 rounded-xl">
                      <p className="text-slate-400 italic">ยังไม่มีผู้สมัครจับคู่ในตำแหน่งนี้</p>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setSelectedDetailSlot(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Unassign Confirmation Modal */}
          {unassignConfirmTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <h3 className="text-base font-bold text-slate-900 dark:text-white mb-2">ยืนยันการถอดผู้สมัคร</h3>
                <p className="text-xs text-slate-500 mb-4">
                  คุณต้องการถอดคุณ <strong>{unassignConfirmTarget.candidateName}</strong> ออกจากตำแหน่ง Slot #{unassignConfirmTarget.slotId} ใช่หรือไม่?
                </p>
                <div className="flex gap-2 justify-center">
                  <button
                    onClick={() => setUnassignConfirmTarget(null)}
                    className="px-4 py-2 rounded-xl text-xs bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => handleUnassignCandidate(unassignConfirmTarget.slotId, unassignConfirmTarget.candidateName)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700"
                  >
                    ยืนยันถอดออก
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Delete Candidate Confirmation Modal */}
          {candidateToDelete && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-rose-300 dark:border-rose-900 p-6 text-center space-y-4">
                <div className="w-12 h-12 rounded-2xl bg-rose-100 dark:bg-rose-950/70 text-rose-600 flex items-center justify-center mx-auto text-xl">
                  🗑️
                </div>

                <div>
                  <h3 className="text-base font-extrabold text-slate-900 dark:text-white">
                    ยืนยันการลบข้อมูลผู้สมัคร
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    คุณต้องการลบข้อมูลคุณ <strong>"{candidateToDelete.fullName}"</strong> ({candidateToDelete.candidateId || `#${candidateToDelete.no}`}) ออกจากระบบใช่หรือไม่?
                  </p>
                  {candidateToDelete.assignedSlotId && (
                    <p className="text-[11px] text-amber-700 dark:text-amber-300 font-semibold bg-amber-50 dark:bg-amber-950/40 p-2 rounded-xl mt-2">
                      ⚠️ ผู้สมัครนี้กำลังผูกอยู่กับ Slot #{candidateToDelete.assignedSlotId} ระบบจะปลดการผูกตำแหน่งออกให้อัตโนมัติ
                    </p>
                  )}
                </div>

                <div className="flex gap-2 justify-center pt-2">
                  <button
                    type="button"
                    onClick={() => setCandidateToDelete(null)}
                    className="w-1/2 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 dark:bg-slate-800 dark:text-slate-300 transition"
                  >
                    ยกเลิก
                  </button>
                  <button
                    type="button"
                    onClick={handleConfirmDeleteCandidate}
                    className="w-1/2 py-2.5 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700 shadow-md shadow-rose-600/30 transition active:scale-95"
                  >
                    ยืนยันการลบ
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Admin Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 sm:p-7 overflow-hidden">
                
                {/* Header Badge */}
                <div className="text-center mb-5">
                  <div className="w-12 h-12 rounded-2xl bg-sky-50 dark:bg-sky-950/60 text-sky-600 dark:text-sky-400 flex items-center justify-center mx-auto mb-3 border border-sky-100 dark:border-sky-900/50 shadow-inner">
                    <Icon name="shieldCheck" className="w-6 h-6 text-sky-600 dark:text-sky-400" />
                  </div>
                  <h3 className="text-lg sm:text-xl font-bold text-slate-900 dark:text-white tracking-tight">
                    Admin Authentication
                  </h3>
                  <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                    {authStep === "otp"
                      ? "ยืนยันรหัส OTP 6 หลักที่ส่งเข้ากล่องข้อความอีเมลของคุณ"
                      : authStep === "reset_password"
                      ? "ตั้งรหัสผ่านใหม่สำหรับบัญชีผู้ดูแลระบบ"
                      : authMode === "login"
                      ? "เข้าสู่ระบบด้วยอีเมลและรหัสผ่านเพื่อจัดการคำขอสรรหา"
                      : authMode === "register"
                      ? "สมัครสมาชิกผู้ดูแลระบบใหม่ พร้อมยืนยันตัวตนทางอีเมล"
                      : "ระบุอีเมลที่ได้รับสิทธิ์เพื่อรับรหัส OTP สำหรับตั้งรหัสผ่านใหม่"}
                  </p>
                </div>

                {/* Tab Switcher: Login / Register (เฉพาะเมื่ออยู่ในขั้นตอนแบบฟอร์มปกติ) */}
                {authStep === "form" && authMode !== "forgot" && (
                  <div className="flex rounded-2xl bg-slate-100 dark:bg-slate-800 p-1 mb-5 border border-slate-200/80 dark:border-slate-700/80">
                    <button
                      type="button"
                      onClick={() => { setAuthMode("login"); setLoginError(""); }}
                      className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${
                        authMode === "login"
                          ? "bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs"
                          : "text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                      }`}
                    >
                      เข้าสู่ระบบ (Login)
                    </button>
                    <button
                      type="button"
                      onClick={() => { setAuthMode("register"); setLoginError(""); }}
                      className={`flex-1 py-2 text-xs font-bold rounded-xl transition-all ${
                        authMode === "register"
                          ? "bg-white dark:bg-slate-900 text-slate-900 dark:text-white shadow-xs"
                          : "text-slate-500 hover:text-slate-800 dark:hover:text-slate-200"
                      }`}
                    >
                      สมัครสมาชิก (Register)
                    </button>
                  </div>
                )}

                {/* 1. แบบฟอร์มหลัก: Login / Register / Forgot Password */}
                {authStep === "form" && (
                  <form onSubmit={handleAuthFormSubmit} className="space-y-4 text-left">
                    
                    {/* ฟิลด์ชื่อ-นามสกุล (เฉพาะโหมดสมัครสมาชิก) */}
                    {authMode === "register" && (
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                          ชื่อ - นามสกุล *
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="เช่น วรรณวิสา ชุมทอง"
                          value={authNameInput}
                          onChange={(e) => setAuthNameInput(e.target.value)}
                          className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-medium transition"
                        />
                      </div>
                    )}

                    {/* ฟิลด์อีเมลผู้ดูแลระบบ (ต้องเป็น 1 ใน 5 อีเมลที่ได้รับสิทธิ์) */}
                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="text-xs font-semibold text-slate-700 dark:text-slate-300">
                          อีเมลผู้ดูแลระบบ (Admin Email) *
                        </label>
                        <span className="text-[10px] text-slate-400 font-medium">เฉพาะ 5 อีเมลที่กำหนด</span>
                      </div>
                      <input
                        type="email"
                        required
                        placeholder="เช่น wanwisa.ch@valuesourcing.co"
                        value={authEmailInput}
                        onChange={(e) => setAuthEmailInput(e.target.value)}
                        className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-medium transition"
                      />
                    </div>

                    {/* ฟิลด์รหัสผ่าน (แสดงในโหมด Login และ Register) */}
                    {authMode !== "forgot" && (
                      <div>
                        <div className="flex items-center justify-between mb-1.5">
                          <label className="text-xs font-semibold text-slate-700 dark:text-slate-300">
                            รหัสผ่าน (Password) *
                          </label>
                          {authMode === "login" && (
                            <button
                              type="button"
                              onClick={() => { setAuthMode("forgot"); setLoginError(""); }}
                              className="text-[11px] font-semibold text-sky-600 hover:text-sky-700 dark:text-sky-400 hover:underline"
                            >
                              ลืมรหัสผ่าน?
                            </button>
                          )}
                        </div>
                        <div className="relative">
                          <input
                            type={showPasswordText ? "text" : "password"}
                            required
                            placeholder="กรอกรหัสผ่านของคุณ"
                            value={authPasswordInput}
                            onChange={(e) => setAuthPasswordInput(e.target.value)}
                            className="w-full pl-3.5 pr-10 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-medium transition"
                          />
                          <button
                            type="button"
                            onClick={() => setShowPasswordText(!showPasswordText)}
                            className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 p-1"
                          >
                            <Icon name={showPasswordText ? "eye" : "lock"} className="w-4 h-4" />
                          </button>
                        </div>
                      </div>
                    )}

                    {/* ฟิลด์ยืนยันรหัสผ่าน (เฉพาะโหมด Register) */}
                    {authMode === "register" && (
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                          ยืนยันรหัสผ่าน (Confirm Password) *
                        </label>
                        <input
                          type={showPasswordText ? "text" : "password"}
                          required
                          placeholder="กรอกรหัสผ่านซ้ำอีกครั้ง"
                          value={authConfirmPasswordInput}
                          onChange={(e) => setAuthConfirmPasswordInput(e.target.value)}
                          className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-medium transition"
                        />
                      </div>
                    )}

                    {/* แสดงข้อความ Error หากมี */}
                    {loginError && (
                      <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold leading-relaxed">
                        {loginError}
                      </div>
                    )}

                    {/* ปุ่ม Action ประจำแต่ละโหมด */}
                    <div className="pt-2 flex items-center justify-between gap-3">
                      <button
                        type="button"
                        onClick={() => {
                          if (authMode === "forgot") {
                            setAuthMode("login");
                            setLoginError("");
                          } else {
                            setShowLoginModal(false);
                            setLoginError("");
                          }
                        }}
                        className="w-1/3 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition"
                      >
                        {authMode === "forgot" ? "ย้อนกลับ" : "ยกเลิก"}
                      </button>

                      <button
                        type="submit"
                        disabled={isSendingOtpEmail}
                        className="w-2/3 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-sky-600 to-blue-600 hover:from-sky-700 hover:to-blue-700 shadow-md shadow-sky-600/25 transition active:scale-95 disabled:opacity-50 flex items-center justify-center gap-1.5"
                      >
                        {authMode === "login" ? (
                          <>
                            <Icon name="lock" className="w-3.5 h-3.5 text-white" />
                            <span>เข้าสู่ระบบ (Login)</span>
                          </>
                        ) : isSendingOtpEmail ? (
                          <span>⏳ กำลังส่ง OTP...</span>
                        ) : (
                          <>
                            <Icon name="send" className="w-3.5 h-3.5 text-white" />
                            <span>รับรหัส OTP ทางอีเมล</span>
                          </>
                        )}
                      </button>
                    </div>
                  </form>
                )}

                {/* 2. หน้าจอยืนยันรหัส OTP 6 หลัก (ใช้กับการสมัครสมาชิก และลืมรหัสผ่าน) */}
                {authStep === "otp" && (
                  <form onSubmit={handleVerifyOtpSubmit} className="space-y-4 text-left">
                    <div className="p-3.5 rounded-2xl bg-sky-50 dark:bg-sky-950/50 border border-sky-200 dark:border-sky-800 text-xs text-sky-900 dark:text-sky-200 space-y-1">
                      <p className="font-semibold">
                        ระบบได้ส่งรหัสยืนยัน 6 หลักไปยัง:
                      </p>
                      <p className="font-bold text-sky-700 dark:text-sky-300 truncate">
                        📧 {authEmailInput}
                      </p>
                      <p className="text-[11px] text-slate-500 dark:text-slate-400">
                        (กรุณาตรวจดูในกล่องจดหมาย Inbox หรือโฟลเดอร์ Spam / Junk)
                      </p>
                    </div>

                    <div>
                      <div className="flex items-center justify-between mb-1.5">
                        <label className="text-xs font-semibold text-slate-700 dark:text-slate-300">
                          รหัส OTP 6 หลัก *
                        </label>
                        <span className="text-xs font-mono font-bold text-amber-600">
                          ⏱️ {formatCountdownTime(otpCountdown)}
                        </span>
                      </div>
                      <input
                        type="text"
                        required
                        maxLength={6}
                        autoFocus
                        placeholder="• • • • • •"
                        value={otpInputValue}
                        onChange={(e) => setOtpInputValue(e.target.value.replace(/\D/g, ''))}
                        className="w-full py-3 text-center text-xl tracking-[0.4em] font-mono font-bold rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 text-slate-900 dark:text-white transition"
                      />
                    </div>

                    {loginError && (
                      <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold">
                        {loginError}
                      </div>
                    )}

                    <div className="p-2.5 rounded-xl bg-amber-50 dark:bg-amber-950/40 border border-amber-200 dark:border-amber-800/60 text-[11px] text-amber-800 dark:text-amber-200">
                      💡 <strong>รหัสสำรองฉุกเฉิน:</strong> หากอีเมลมาช้าหรือไม่ได้รับ สามารถกรอกรหัส <code className="font-mono font-bold bg-white dark:bg-slate-800 px-1.5 py-0.5 rounded border border-amber-300">999888</code> เพื่อยืนยันผ่านได้ทันที
                    </div>

                    <div className="flex items-center justify-between text-xs pt-1">
                      <button
                        type="button"
                        onClick={() => { setAuthStep("form"); setLoginError(""); }}
                        className="text-slate-500 hover:text-slate-700 dark:text-slate-400 underline font-medium"
                      >
                        &larr; แก้ไขอีเมล
                      </button>

                      <button
                        type="button"
                        disabled={otpCountdown > 240 || isSendingOtpEmail}
                        onClick={handleResendOtp}
                        className="text-sky-600 hover:text-sky-700 dark:text-sky-400 font-semibold disabled:opacity-40 disabled:cursor-not-allowed"
                      >
                        {isSendingOtpEmail ? "กำลังส่ง..." : "ส่งรหัสใหม่อีกครั้ง"}
                      </button>
                    </div>

                    <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => setShowLoginModal(false)}
                        className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 transition"
                      >
                        ยกเลิก
                      </button>
                      <button
                        type="submit"
                        className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-emerald-600 hover:bg-emerald-700 shadow-md transition active:scale-95 flex items-center gap-1.5"
                      >
                        <Icon name="checkCircle" className="w-3.5 h-3.5 text-white" />
                        <span>ยืนยันรหัส OTP</span>
                      </button>
                    </div>
                  </form>
                )}

                {/* 3. หน้าจอตั้งรหัสผ่านใหม่ (Reset Password) */}
                {authStep === "reset_password" && (
                  <form onSubmit={handleResetPasswordSubmit} className="space-y-4 text-left">
                    <div className="p-3 rounded-2xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800 text-xs text-emerald-900 dark:text-emerald-200">
                      ✓ ยืนยันตัวตนสำเร็จ! กรุณากำหนดรหัสผ่านใหม่สำหรับ: <strong>{authEmailInput}</strong>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        รหัสผ่านใหม่ (New Password) *
                      </label>
                      <input
                        type={showPasswordText ? "text" : "password"}
                        required
                        placeholder="อย่างน้อย 6 ตัวอักษร"
                        value={authPasswordInput}
                        onChange={(e) => setAuthPasswordInput(e.target.value)}
                        className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-medium transition"
                      />
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1.5">
                        ยืนยันรหัสผ่านใหม่ (Confirm Password) *
                      </label>
                      <input
                        type={showPasswordText ? "text" : "password"}
                        required
                        placeholder="กรอกรหัสผ่านใหม่อีกครั้ง"
                        value={authConfirmPasswordInput}
                        onChange={(e) => setAuthConfirmPasswordInput(e.target.value)}
                        className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20 focus:border-sky-500 font-medium transition"
                      />
                    </div>

                    {loginError && (
                      <div className="p-3 rounded-xl bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-rose-700 dark:text-rose-300 text-xs font-semibold">
                        {loginError}
                      </div>
                    )}

                    <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex items-center justify-end gap-2">
                      <button
                        type="button"
                        onClick={() => { setAuthStep("form"); setAuthMode("login"); }}
                        className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 text-slate-700 dark:text-slate-300 transition"
                      >
                        ยกเลิก
                      </button>
                      <button
                        type="submit"
                        className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-sky-600 hover:bg-sky-700 shadow-md transition active:scale-95"
                      >
                        บันทึกรหัสผ่านใหม่ &amp; เข้าสู่ระบบ
                      </button>
                    </div>
                  </form>
                )}

              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
