                                      }`}>
                                        {cand.status === "Hiring / Offer" ? "✓ จ้างงานแล้ว" : "✕ พ้นกระบวนการ"}
                                      </span>
                                    ) : (
                                      <button
                                        onClick={() => handleOpenSlotPicker(cand)}
                                        className="px-2 py-1 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-bold text-[10px] flex items-center gap-1 transition shadow-2xs"
                                      >
                                        <Icon name="plus" className="w-3 h-3 text-white" />
                                        <span>แมปตำแหน่ง</span>
                                      </button>
                                    )}
                                  </td>

                                  <td className="px-3 py-2 font-bold text-slate-800 dark:text-slate-200">{cand.no || idx + 1}</td>
                                  <td className="px-3 py-2">{cand.year || "2026"}</td>
                                  <td className="px-3 py-2">{cand.month || "08"}</td>
                                  <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">
                                    {cand.fullName}
                                  </td>
                                  <td className="px-3 py-2">{cand.nickname || "-"}</td>
                                  <td className="px-3 py-2">{cand.phone || "-"}</td>
                                  <td className="px-3 py-2 font-semibold text-brand-600 dark:text-brand-400">{cand.targetJobTitle}</td>
                                  <td className="px-3 py-2">{cand.level || "-"}</td>
                                  <td className="px-3 py-2">{cand.branch || "-"}</td>
                                  <td className="px-3 py-2">{cand.type || "Full-Time"}</td>
                                  <td className="px-3 py-2 font-mono font-bold text-slate-700 dark:text-slate-300">{cand.mbti || "-"}</td>
                                  <td className="px-3 py-2">{cand.prescreenDate || "-"}</td>
                                  <td className="px-3 py-2">{cand.resumeConfirmDate || "-"}</td>
                                  <td className="px-3 py-2 font-semibold text-amber-700 dark:text-amber-300">
                                    {cand.interviewDate || "-"}
                                  </td>
                                  <td className="px-3 py-2 text-emerald-600 font-semibold">{cand.hireDate || "-"}</td>
                                  
                                  {/* Status Tag */}
                                  <td className="px-3 py-2">
                                    <span className={`inline-block text-[11px] font-bold px-2.5 py-1 rounded-lg border ${statusCfg.bg} ${statusCfg.text} ${statusCfg.border}`}>
                                      {statusCfg.label}
                                    </span>
                                  </td>

                                  <td className="px-3 py-2">{cand.source || "-"}</td>
                                  <td className="px-3 py-2 max-w-[180px] truncate text-slate-500" title={cand.remark}>
                                    {cand.remark || "-"}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>

                  </div>
                )}
              </div>
            )}

          </main>

          {/* 1. Multi-Evaluator Blind Assessment Form Modal (Clean Initial State with Searchable Personnel Name Dropdown) */}
          {blindEvalModalSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[94vh] flex flex-col">
                
                <div className="px-6 py-4 bg-gradient-to-r from-brand-600 to-sky-600 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-sky-200">
                      แบบฟอร์มประเมินสัมภาษณ์งาน (INTERVIEW EVALUATION FORM)
                    </span>
                    <h3 className="text-base sm:text-lg font-extrabold mt-0.5">
                      {blindEvalModalSlot.candidateName || "ผู้สมัคร"} &bull; {blindEvalModalSlot.jobTitle}
                    </h3>
                  </div>
                  <button onClick={() => setBlindEvalModalSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                {/* Blind Assessment Notice Banner */}
                <div className="bg-sky-50 dark:bg-sky-950/70 border-b border-sky-200/80 dark:border-sky-800 px-6 py-2.5 flex items-center gap-2 text-xs text-sky-800 dark:text-sky-200 font-medium">
                  <Icon name="shieldCheck" className="w-4 h-4 text-sky-600 shrink-0" />
                  <span>
                    <strong>การประเมินแบบอิสระ (Blind Assessment):</strong> แบบฟอร์มนี้จะไม่แสดงคะแนนหรือความเห็นของกรรมการท่านอื่นขณะกรอก เพื่อความเป็นกลางและความโปร่งใส
                  </span>
                </div>

                <form onSubmit={handleSaveBlindEvaluation} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  {/* Evaluator Identity via Searchable Dropdown & Native Date Picker */}
                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        ผู้ประเมิน (Searchable Select) <span className="text-rose-600">*</span>
                      </label>
                      <SearchableSelect
                        value={blindEvalForm.evaluatorName}
                        placeholder="-- พิมพ์ค้นหาหรือเลือกชื่อ --"
                        options={personnelList.map(p => ({ 
                          value: p.name, 
                          label: `${p.name} (${p.position || p.department})` 
                        }))}
                        onChange={(selectedName) => {
                          const person = personnelList.find(p => p.name === selectedName);
                          setBlindEvalForm(prev => ({
                            ...prev,
                            evaluatorName: selectedName,
                            evaluatorRole: person?.position ? (person.position.includes("HR") ? "HR Interviewer (ฝ่ายทรัพยากรบุคคล)" : prev.evaluatorRole) : prev.evaluatorRole
                          }));
                        }}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        บทบาทผู้ประเมิน (Role) <span className="text-rose-600">*</span>
                      </label>
                      <select
                        value={blindEvalForm.evaluatorRole}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, evaluatorRole: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      >
                        {EVALUATOR_ROLES.map(role => (
                          <option key={role} value={role}>{role}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                        วันที่ประเมิน (Native Date) <span className="text-rose-600">*</span>
                      </label>
                      <input
                        type="date"
                        required
                        value={blindEvalForm.date}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, date: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                      />
                    </div>
                  </div>

                  {/* 5 Scoring Dimensions */}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-slate-800">
                      <span className="font-bold text-slate-900 dark:text-white text-xs">
                        เกณฑ์การประเมิน 5 ด้าน (1 = ต่ำกว่ามาตรฐานมาก, 5 = เหนือกว่ามาตรฐานมาก)
                      </span>
                    </div>

                    {EVALUATION_CRITERIA.map(crit => {
                      const score = blindEvalForm.scores[crit.id];

                      return (
                        <div key={crit.id} className="p-3.5 rounded-2xl bg-slate-50 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-700/80 space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-1">
                            <div>
                              <h4 className="font-bold text-slate-900 dark:text-white text-xs">{crit.label}</h4>
                              <p className="text-[11px] text-slate-500 dark:text-slate-400">{crit.desc}</p>
                            </div>
                            <span className="text-brand-600 dark:text-brand-400 font-extrabold text-xs shrink-0">
                              คะแนนที่ให้: {score} / 5
                            </span>
                          </div>

                          <div className="flex items-center gap-1.5 pt-1 border-t border-slate-200/50 dark:border-slate-700/50">
                            {[1, 2, 3, 4, 5].map(val => (
                              <button
                                key={`score-${crit.id}-${val}`}
                                type="button"
                                onClick={() => setBlindEvalForm({
                                  ...blindEvalForm,
                                  scores: { ...blindEvalForm.scores, [crit.id]: val }
                                })}
                                className={`flex-1 py-1.5 rounded-xl font-bold text-xs transition border ${
                                  score === val
                                    ? "bg-brand-600 text-white border-brand-600 shadow-sm"
                                    : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200 border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                                }`}
                              >
                                {val}
                              </button>
                            ))}
                          </div>
                        </div>
                      );
                    })}
                  </div>

                  {/* Real-time Subtotal of Current Evaluator */}
                  {(() => {
                    const sc = blindEvalForm.scores;
                    const tot = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
                    const avg = (tot / 5).toFixed(1);
                    const pct = Math.round((tot / 25) * 100);
                    const isPass = pct >= 70;

                    return (
                      <div className={`p-3.5 rounded-2xl border flex items-center justify-between ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-amber-50 dark:bg-amber-950/40 border-amber-300 dark:border-amber-800 text-amber-900 dark:text-amber-200"
                      }`}>
                        <div>
                          <p className="text-[10px] uppercase font-bold opacity-80">สรุปคะแนนประเมินของคุณ (Individual Total)</p>
                          <h4 className="text-base font-extrabold mt-0.5">{tot} / 25 คะแนน (เฉลี่ย {avg}/5 &bull; {pct}%)</h4>
                        </div>
                        <span className={`px-2.5 py-1 rounded-lg font-bold text-xs ${
                          isPass ? "bg-emerald-600 text-white" : "bg-amber-600 text-white"
                        }`}>
                          {isPass ? "เกณฑ์ผ่าน (≥ 70%)" : "ต่ำกว่า 70%"}
                        </span>
                      </div>
                    );
                  })()}

                  <div className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">จุดเด่นของผู้สมัคร (Strengths)</label>
                      <textarea
                        rows="2"
                        placeholder="ระบุจุดเด่น ทักษะเฉพาะ หรือประสบการณ์ที่น่าสนใจ..."
                        value={blindEvalForm.strengths}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, strengths: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ข้อสังเกต / สิ่งที่ต้องพัฒนา (Areas for Improvement)</label>
                      <textarea
                        rows="2"
                        placeholder="ระบุข้อสังเกต หรือสิ่งที่ต้องพัฒนาเพิ่มเติม..."
                        value={blindEvalForm.improvements}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, improvements: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      ></textarea>
                    </div>

                    <div>
                      <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ข้อเสนอแนะสรุปผล (Recommendation) <span className="text-rose-600">*</span></label>
                      <select
                        value={blindEvalForm.recommendation}
                        onChange={(e) => setBlindEvalForm({ ...blindEvalForm, recommendation: e.target.value })}
                        className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                      >
                        <option value="Recommend to Hire">Recommend to Hire (เสนอรับเข้าทำงาน)</option>
                        <option value="Compare">Compare (เปรียบเทียบกับผู้สมัครรายอื่น)</option>
                        <option value="Keep in Pool / Reserve">Keep in Pool / Reserve (เก็บเป็นตัวสำรองในคลัง)</option>
                        <option value="Not Recommended">Not Recommended (ไม่ผ่านการคัดเลือก)</option>
                      </select>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setBlindEvalModalSlot(null)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md"
                    >
                      บันทึกผลการประเมิน (Submit Assessment)
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* 2. Admin & HR Detailed Evaluation Audit Breakdown Modal */}
          {adminAuditSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-3xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                
                <div className="px-6 py-4 bg-slate-900 text-white flex items-center justify-between">
                  <div>
                    <span className="text-[10px] font-extrabold uppercase tracking-wider text-emerald-400">
                      ADMIN &amp; HR AUDIT REPORT: DETAILED EVALUATION BREAKDOWN
                    </span>
                    <h3 className="text-base sm:text-lg font-bold mt-0.5">
                      {adminAuditSlot.candidateName || "ผู้สมัคร"} &bull; {adminAuditSlot.jobTitle} (Slot #{adminAuditSlot.slotId})
                    </h3>
                  </div>
                  <button onClick={() => setAdminAuditSlot(null)} className="p-2 text-white/80 hover:text-white">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  
                  {/* Overall Aggregated Score Banner */}
                  {(() => {
                    const stats = calculateOverallScore(adminAuditSlot.evaluations);
                    const isPass = stats.result === "Pass";

                    return (
                      <div className={`p-4 rounded-2xl border flex flex-col sm:flex-row sm:items-center justify-between gap-3 ${
                        isPass 
                          ? "bg-emerald-50 dark:bg-emerald-950/50 border-emerald-300 dark:border-emerald-800 text-emerald-900 dark:text-emerald-200"
                          : "bg-rose-50 dark:bg-rose-950/50 border-rose-300 dark:border-rose-800 text-rose-900 dark:text-rose-200"
                      }`}>
                        <div>
                          <span className="text-[10px] uppercase font-extrabold opacity-80">
                            คะแนนเฉลี่ยรวมจากกรรมการทั้งหมด ({stats.count} ท่าน)
                          </span>
                          <h4 className="text-2xl font-extrabold mt-0.5">
                            {stats.combinedAvg} / 5 ({stats.combinedPct}%)
                          </h4>
                          <p className="text-[11px] opacity-80 mt-0.5">
                            เกณฑ์การคัดเลือก: ผ่านที่ 70% ขึ้นไป (คะแนนเฉลี่ย 3.5 / 5.0)
                          </p>
                        </div>
                        <div className="flex items-center gap-2 shrink-0">
                          <span className={`px-3 py-1.5 rounded-xl font-extrabold text-xs uppercase shadow-xs ${
                            isPass ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                          }`}>
                            {isPass ? "✓ ผ่านการประเมิน (Pass)" : "✗ ไม่ผ่านการประเมิน (Fail)"}
                          </span>
                        </div>
                      </div>
                    );
                  })()}

                  {/* List of Individual Evaluator Submissions (Dynamic Rendering) */}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between pb-1 border-b border-slate-200 dark:border-slate-800">
                      <span className="font-bold text-slate-900 dark:text-white text-xs">
                        รายละเอียดคะแนนและความเห็นแยกรายบุคคล (Individual Submissions)
                      </span>
                      <button
                        onClick={() => {
                          const s = adminAuditSlot;
                          setAdminAuditSlot(null);
                          handleOpenBlindEvaluationModal(s);
                        }}
                        className="text-xs font-bold text-brand-600 hover:underline flex items-center gap-1"
                      >
                        <Icon name="plus" className="w-3.5 h-3.5" />
                        <span>+ เพิ่มผลประเมินอีก 1 ท่าน</span>
                      </button>
                    </div>

                    {(adminAuditSlot.evaluations || []).length === 0 ? (

                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <h4 className="font-bold text-slate-900 dark:text-white text-xs">2. ผู้อนุมัติ &amp; ส่งต่อ (Searchable Approvers)</h4>
                    
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ผู้อนุมัติ (Approver Name) *</label>
                        <SearchableSelect
                          value={formInput.approverName}
                          options={personnelList.map(p => ({ value: p.name, label: `${p.name} (${p.position || p.department})` }))}
                          onChange={(name) => {
                            const person = personnelList.find(p => p.name === name);
                            setFormInput(prev => ({
                              ...prev,
                              approverName: name,
                              approverEmail: person?.email || prev.approverEmail
                            }));
                          }}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">Email ผู้อนุมัติ *</label>
                        <input
                          type="email"
                          required
                          value={formInput.approverEmail}
                          onChange={(e) => setFormInput({ ...formInput, approverEmail: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ส่งต่อให้ (Forward To)</label>
                        <SearchableSelect
                          value={formInput.forwardTo}
                          options={personnelList.map(p => ({ value: p.name, label: `${p.name} (${p.position || p.department})` }))}
                          onChange={(name) => {
                            const person = personnelList.find(p => p.name === name);
                            setFormInput(prev => ({
                              ...prev,
                              forwardTo: name,
                              forwardEmail: person?.email || prev.forwardEmail
                            }));
                          }}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">Email ผู้รับส่งต่อ</label>
                        <input
                          type="email"
                          value={formInput.forwardEmail}
                          onChange={(e) => setFormInput({ ...formInput, forwardEmail: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                    </div>
                  </div>

                  <div className="p-4 rounded-2xl bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 space-y-3">
                    <h4 className="font-bold text-slate-900 dark:text-white text-xs">3. ตำแหน่งที่ต้องการรับ (Position Requisition)</h4>

                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                      <div className="sm:col-span-2">
                        <label className="block text-[11px] font-semibold mb-1">ชื่อตำแหน่ง (Job Title) *</label>
                        <input
                          type="text"
                          required
                          placeholder="e.g. Senior Full-Stack AI Engineer"
                          value={formInput.jobTitle}
                          onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">จำนวนอัตรา (Headcount) *</label>
                        <input
                          type="number"
                          min="1"
                          required
                          value={formInput.headcountRequired}
                          onChange={(e) => setFormInput({ ...formInput, headcountRequired: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-bold text-center"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ประเภทตำแหน่ง (Position Type) *</label>
                        <select
                          value={formInput.positionType}
                          onChange={(e) => setFormInput({ ...formInput, positionType: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        >
                          <option value="Replacement">ทดแทนตำแหน่งเดิม (Replacement)</option>
                          <option value="New Headcount">เปิดตำแหน่งใหม่ (New Headcount)</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ต้องการภายในวันที่ (Native Date) *</label>
                        <input
                          type="date"
                          required
                          value={formInput.targetDate}
                          onChange={(e) => setFormInput({ ...formInput, targetDate: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                        />
                      </div>
                    </div>

                    {/* Conditional Required Input for Replacement */}
                    {formInput.positionType === "Replacement" && (
                      <div className="p-3.5 rounded-xl bg-amber-50 dark:bg-amber-950/50 border border-amber-200 dark:border-amber-800 animate-fadeIn">
                        <label className="block text-[11px] font-bold text-amber-900 dark:text-amber-200 mb-1">
                          ชื่อพนักงานที่ลาออก / ถูกทดแทน (Replaced Employee Name) <span className="text-rose-600">* (บังคับกรอก)</span>
                        </label>
                        <input
                          type="text"
                          required
                          placeholder="ระบุชื่อ-นามสกุล ของพนักงานที่ลาออก หรือตำแหน่งเดิมที่ถูกทดแทน"
                          value={formInput.replacedEmployeeName}
                          onChange={(e) => setFormInput({ ...formInput, replacedEmployeeName: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-900 border border-amber-300 dark:border-amber-700 font-semibold focus:ring-2 focus:ring-amber-500"
                        />
                      </div>
                    )}

                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">Buddy (พี่เลี้ยง)</label>
                        <SearchableSelect
                          value={formInput.buddy}
                          options={personnelList.map(p => ({ value: p.name, label: `${p.name} (${p.position || p.department})` }))}
                          onChange={(name) => setFormInput({ ...formInput, buddy: name })}
                        />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold mb-1">ลักษณะงานโดยย่อ</label>
                        <textarea
                          rows="2"
                          value={formInput.jobDescription}
                          onChange={(e) => setFormInput({ ...formInput, jobDescription: e.target.value })}
                          className="w-full p-2.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                        ></textarea>
                      </div>
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowRequestModal(false)}
                      className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200"
                    >
                      ยกเลิก
                    </button>
                    <button
                      type="submit"
                      className="px-6 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md"
                    >
                      บันทึกคำขอ
                    </button>
                  </div>
                </form>

              </div>
            </div>
          )}

          {/* 7. Slot Detail Modal */}
          {selectedDetailSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 my-8">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold text-brand-600 uppercase">{selectedDetailSlot.slotId}</span>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-0.5">{selectedDetailSlot.jobTitle}</h3>
                    <p className="text-xs text-slate-500">{selectedDetailSlot.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailSlot(null)} className="p-1.5 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-3 text-xs max-h-[70vh] overflow-y-auto pr-1">
                  <div className="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <div>
                      <span className="text-[10px] text-slate-400">Position Type:</span>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{selectedDetailSlot.positionType}</p>
                      {selectedDetailSlot.replacedEmployeeName && (
                        <p className="text-amber-600 font-semibold text-[11px]">แทน: {selectedDetailSlot.replacedEmployeeName}</p>
                      )}
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400">Status คำขอ:</span>
                      <p className="font-bold text-emerald-600">{selectedDetailSlot.requestStatus || "Recruiting"}</p>
                    </div>
                  </div>

                  {/* Candidate and Evaluation summary */}
                  {selectedDetailSlot.candidateName ? (
                    <div className="p-4 rounded-2xl bg-emerald-50 dark:bg-emerald-950/50 border border-emerald-200 dark:border-emerald-800 space-y-2">
                      <div className="flex items-center justify-between">
                        <p className="font-bold text-emerald-900 dark:text-emerald-200 text-sm">👤 แคนดิเดต: {selectedDetailSlot.candidateName}</p>
                        {isAdminAuthenticated && (
                          <button
                            onClick={() => {
                              const slot = selectedDetailSlot;
                              setSelectedDetailSlot(null);
                              setUnassignConfirmTarget(slot);
                            }}
                            className="text-[10px] font-bold text-rose-600 hover:underline"
                          >
                            ถอดออกจากตำแหน่ง
                          </button>
                        )}
                      </div>
                      <p className="text-emerald-700 dark:text-emerald-300">📞 {selectedDetailSlot.candidatePhone || "-"}</p>
                      {selectedDetailSlot.interviewSchedule && (
                        <p className="text-amber-800 dark:text-amber-300 font-semibold">📅 วันเวลานัดสัมภาษณ์: {selectedDetailSlot.interviewSchedule}</p>
                      )}

                      {/* Evaluation Score Summary */}
                      {selectedDetailSlot.evaluationsCount > 0 && (
                        <div className="mt-3 pt-3 border-t border-emerald-200 dark:border-emerald-800/80 space-y-1.5">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-slate-800 dark:text-slate-200">ผลประเมินสัมภาษณ์เฉลี่ยรวม ({selectedDetailSlot.evaluationsCount} ท่าน):</span>
                            <span className={`px-2 py-0.5 rounded font-extrabold text-[10px] ${
                              selectedDetailSlot.interviewResult === "Pass" ? "bg-emerald-600 text-white" : "bg-rose-600 text-white"
                            }`}>
                              {selectedDetailSlot.interviewResult} ({selectedDetailSlot.interviewScore}/5 - {selectedDetailSlot.interviewScorePercent}%)
                            </span>
                          </div>
                          {isAdminAuthenticated && (
                            <button
                              onClick={() => {
                                const s = selectedDetailSlot;
                                setSelectedDetailSlot(null);
                                setAdminAuditSlot(s);
                              }}
                              className="text-xs font-bold text-brand-600 hover:underline mt-1"
                            >
                              🔍 เปิดดู Audit Breakdown รายชื่อและคะแนนกรรมการทุกคน &rarr;
                            </button>
                          )}
                        </div>
                      )}

                      <div className="pt-2 flex justify-end gap-2">
                        <button
                          onClick={() => {
                            const slot = selectedDetailSlot;
                            setSelectedDetailSlot(null);
                            handleOpenBlindEvaluationModal(slot);
                          }}
                          className="px-3 py-1 rounded-lg bg-emerald-600 text-white font-bold text-xs hover:bg-emerald-700 flex items-center gap-1"
                        >
                          <Icon name="clipboardCheck" className="w-3.5 h-3.5" />
                          <span>+ บันทึกผลประเมินสัมภาษณ์</span>
                        </button>
                      </div>
                    </div>
                  ) : (
                    <div className="p-3 text-center bg-slate-50 dark:bg-slate-800 rounded-xl">
                      <p className="text-slate-400 italic mb-2">ยังไม่มีผู้สมัครจับคู่ในตำแหน่งนี้</p>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setSelectedDetailSlot(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 8. Unassign Confirmation Modal */}
          {unassignConfirmTarget && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <h3 className="text-base font-bold text-slate-900 dark:text-white mb-2">ยืนยันการถอดผู้สมัคร</h3>
                <p className="text-xs text-slate-500 mb-4">
                  คุณต้องการถอดคุณ <strong>{unassignConfirmTarget.candidateName}</strong> ออกจากตำแหน่ง Slot #{unassignConfirmTarget.slotId} ใช่หรือไม่?
                </p>
                <div className="flex gap-2 justify-center">
                  <button
                    onClick={() => setUnassignConfirmTarget(null)}
                    className="px-4 py-2 rounded-xl text-xs bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                  >
                    ยกเลิก
                  </button>
                  <button
                    onClick={() => handleUnassignCandidate(unassignConfirmTarget.slotId, unassignConfirmTarget.candidateName)}
                    className="px-5 py-2 rounded-xl text-xs font-bold text-white bg-rose-600 hover:bg-rose-700"
                  >
                    ยืนยันถอดออก
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 9. Admin Login Modal */}
          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-sm bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                <Icon name="lock" className="w-8 h-8 text-brand-600 mx-auto mb-2" />
                <h3 className="text-base font-bold text-slate-900 dark:text-white">Admin Authentication</h3>
                <p className="text-xs text-slate-500 mt-1 mb-4">Enter passcode (admin123)</p>

                <form onSubmit={handleAdminLoginSubmit} className="space-y-4">
                  <input
                    type="password"
                    autoFocus
                    placeholder="admin123"
                    value={adminPasscode}
                    onChange={(e) => setAdminPasscode(e.target.value)}
                    className="w-full p-2.5 text-sm text-center rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                  />
                  {loginError && <p className="text-xs text-rose-500">{loginError}</p>}
                  <div className="flex gap-2">
                    <button type="button" onClick={() => setShowLoginModal(false)} className="w-1/2 py-2 rounded-xl text-xs bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300">
                      Cancel
                    </button>
                    <button type="submit" className="w-1/2 py-2 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700">
                      Login
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* Toast Notification */}
          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
