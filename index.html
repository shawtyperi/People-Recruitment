                                                <span className="relative flex h-2 w-2">
                                                  <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                                  <span className={`relative inline-flex rounded-full h-2 w-2 ${relTime.dotBg}`}></span>
                                                </span>
                                              )}
                                              <span>{relTime.text}</span>
                                            </span>
                                          </div>
                                        )}
                                      </div>
                                    );
                                  })()}

                                  {/* Onboarded status badge in Public View */}
                                  {item.stage === "onboarded" && (
                                    <div className="mt-1.5 space-y-1">
                                      {item.hireDate && (
                                        <div className="text-[10px] text-slate-600 dark:text-slate-300 font-semibold flex items-center gap-1">
                                          <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                          <span>วันเริ่มงาน: {item.hireDate}</span>
                                        </div>
                                      )}
                                      <div className={`p-1.5 rounded-lg text-[10px] font-extrabold flex items-center justify-between border ${
                                        isArrived
                                          ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-100 border-emerald-300 dark:border-emerald-700 shadow-2xs"
                                          : "bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200 border-amber-300 dark:border-amber-700 animate-pulse"
                                      }`}>
                                        <span className="flex items-center gap-1">
                                          {isArrived ? "✅ มาเริ่มงานเรียบร้อยแล้ว" : "⏳ รอถึงวันเริ่มงาน (ยังไม่มา)"}
                                        </span>
                                      </div>
                                    </div>
                                  )}

                                  {item.rejectionReason && (
                                    <div className="mt-1.5 p-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-[10px] text-rose-700 dark:text-rose-300 font-medium">

                                    </div>
                                  )}

                                  <div className="mt-2 text-[10px] font-semibold">
                                    {item.stage === "offer" ? (
                                      <span className="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300">
                                        ⏱️ สรรหาเสร็จใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                      </span>
                                    ) : sla.isCompleted ? (
                                      <span className="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                        ⏱️ ปิดตำแหน่งใน: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : sla.isOverdue ? (
                                      <span className="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 animate-pulse">
                                        ⚠️ เกิน SLA: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : (
                                      <span className="px-2 py-0.5 rounded-md bg-sky-50 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">
                                        ⏱️ {sla.workingDaysElapsed} วันทำการ (เหลือ {sla.workingDaysRemaining} วัน)
                                      </span>
                                    )}
                                  </div>

                                  {/* Evaluation button strictly visible in Interview stage only */}
                                  {item.stage === "interview" && (
                                    <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                                      <button
                                        onClick={() => handleOpenBlindEvaluationModal(item)}
                                        className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-600 hover:text-brand-700 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/60 px-2 py-1 rounded-lg border border-brand-200 dark:border-brand-800/80 transition"
                                      >
                                        <Icon name="clipboardCheck" className="w-3 h-3 text-brand-600" />
                                        <span>+ ร่วมประเมินสัมภาษณ์</span>
                                      </button>
                                      <span className="text-[10px] text-slate-400">
                                        {item.evaluationsCount > 0 ? `(${item.evaluationsCount} ท่านประเมินแล้ว)` : "รอประเมิน"}
                                      </span>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* 2. Headcount Demand by Department (Public View) */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">

                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="building" className="w-5 h-5 text-brand-600" />

                      </h2>
                    </div>

                    <div className="flex items-center gap-2 text-xs">
                      <select
                        value={selectedMonthFilter}
                        onChange={(e) => setSelectedMonthFilter(e.target.value)}

                      >
                        <option value="ALL">All Months</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                      </select>
                      <select
                        value={selectedYearFilter}
                        onChange={(e) => setSelectedYearFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Years</option>
                        <option value="2026">2026</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[440px] overflow-y-auto pr-1">

                      const maxTotal = departmentStats[0]?.total || 1;
                      const percent = Math.min(100, Math.round((item.total / maxTotal) * 100));

                      return (
                        <div 
                          key={item.department} 
                          onClick={() => setSelectedDepartmentDetail(item.department)}
                          className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:bg-white dark:hover:bg-slate-800 hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                        >
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 transition">
                              <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                              {item.department}
                            </span>
                            <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                              <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                              <span className="text-amber-600">Open: {item.open}</span>
                              <span className="text-emerald-600">Filled: {item.filled}</span>
                            </div>
                          </div>

                          <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                            <div 
                              className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full transition-all duration-500"
                              style={{ width: `${item.total > 0 ? percent : 0}%` }}
                            ></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

              </div>
            )}
            {currentView === "admin" && (
              <div className="space-y-6">
                
                {/* Admin Sub-Tabs */}
                <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                  <button
                    onClick={() => setAdminSubTab("requisitions")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                      adminSubTab === "requisitions"
                        ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                        : "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <Icon name="clipboardCheck" className="w-4 h-4" />
                    <span>1. ตรวจสอบคำขอ (Requisition Queue)</span>
                    {pendingAdminCount > 0 && (
                      <span className="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-500 text-white animate-pulse">
                        {pendingAdminCount}
                      </span>
                    )}
                  </button>

                  <button
                    onClick={() => setAdminSubTab("kanban")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                      adminSubTab === "kanban"
                        ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                        : "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    2. Kanban Pipeline & Demand
                  </button>

                  <button
                    onClick={() => setAdminSubTab("candidates")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                      adminSubTab === "candidates"
                        ? "bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md"
                        : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <Icon name="userSearch" className="w-3.5 h-3.5" />
                    <span>3. Candidate Pool & Manpower Request</span>
                  </button>
                </div>

                {/* SUB-TAB 1: REQUISITION QUEUE (PRIORITY SORTED: PENDING_ADMIN FIRST) */}
                {adminSubTab === "requisitions" && (
                  <div className="space-y-6">
                    {/* KPI Quick Status Cards - Modern Enterprise Style */}
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                      <div 
                        onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "PENDING_ADMIN"
                            ? "bg-amber-50/80 dark:bg-amber-950/30 border-amber-300 ring-2 ring-amber-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300 shadow-card"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-medium text-slate-500">รอแอดมินตรวจ</span>
                          <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length}
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "READY_FOR_RECRUITMENT"
                            ? "bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-300 ring-2 ring-emerald-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300 shadow-card"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-medium text-slate-500">พร้อมเริ่มสรรหา</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length}
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "REJECTED_BY_ADMIN"
                            ? "bg-rose-50/80 dark:bg-rose-950/30 border-rose-300 ring-2 ring-rose-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300 shadow-card"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-medium text-slate-500">ตีกลับ / ปฏิเสธ</span>
                          <span className="w-2 h-2 rounded-full bg-rose-400"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length}
                        </div>
                      </div>
                    </div>

                    {/* Filter Bar & Search */}
                    <div className="bg-white dark:bg-[#0F172A] rounded-2xl border border-slate-200/70 dark:border-slate-800 p-3 sm:p-4 shadow-card flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                      <div className="flex flex-wrap items-center gap-1.5 text-xs">
                        <button
                          onClick={() => setReqQueueFilter("ALL")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition ${
                            reqQueueFilter === "ALL"
                              ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200/80"
                          }`}
                        >
                          ทั้งหมด ({requests.length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition border ${
                            reqQueueFilter === "PENDING_ADMIN"
                              ? "bg-amber-50 text-amber-900 border-amber-300 dark:bg-amber-950/50 dark:text-amber-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700 hover:bg-slate-50"
                          }`}
                        >
                          รอตรวจ ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition border ${
                            reqQueueFilter === "READY_FOR_RECRUITMENT"
                              ? "bg-emerald-50 text-emerald-900 border-emerald-300 dark:bg-emerald-950/50 dark:text-emerald-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700 hover:bg-slate-50"
                          }`}
                        >
                          พร้อมสรรหา ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition border ${
                            reqQueueFilter === "REJECTED_BY_ADMIN"
                              ? "bg-rose-50 text-rose-900 border-rose-300 dark:bg-rose-950/50 dark:text-rose-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700 hover:bg-slate-50"
                          }`}
                        >
                          ตีกลับ ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length})
                        </button>
                      </div>

                      <div className="relative w-full md:w-64">
                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                          <Icon name="search" className="w-3.5 h-3.5" />
                        </div>
                        <input
                          type="text"
                          placeholder="ค้นหาคำขอ..."
                          value={reqQueueSearch}
                          onChange={(e) => setReqQueueSearch(e.target.value)}
                          className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                        />
                      </div>
                    </div>

                    {/* Data Table with Clean Modern Enterprise Styling */}
                    <div className="bg-white dark:bg-[#0F172A] rounded-2xl border border-slate-200/70 dark:border-slate-800 shadow-card overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50/80 dark:bg-slate-800/40 text-[11px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 dark:border-slate-800">
                            <tr>
                              <th className="px-4 py-3">วันที่ขอ</th>
                              <th className="px-4 py-3">รหัส</th>
                              <th className="px-4 py-3">ผู้ยื่นคำขอ</th>
                              <th className="px-4 py-3">ตำแหน่งที่ขอ</th>
                              <th className="px-4 py-3">ฝ่ายงาน</th>
                              <th className="px-4 py-3 text-center">อัตรา</th>
                              <th className="px-4 py-3">สถานะ</th>
                              <th className="px-4 py-3 text-center">จัดการ</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                            {sortedAdminRequisitions.length === 0 ? (
                              <tr>
                                <td colSpan="8" className="text-center py-10 text-slate-400 italic">
                                  ไม่พบรายการคำขอกำลังคนตามเงื่อนไขที่เลือก
                                </td>
                              </tr>
                            ) : (
                              sortedAdminRequisitions.map((req) => {
                                const currentStatus = req.requestStatus || req.workflowStatus || "PENDING_ADMIN";
                                const isPendingAdmin = currentStatus === "PENDING_ADMIN";
                                const statusCfg = REQUISITION_STATUSES.find(s => s.id === currentStatus) || REQUISITION_STATUSES[0];

                                return (
                                  <tr 
                                    key={req.id}
                                    onClick={() => setSelectedRequisitionDetail(req)}
                                    className={`cursor-pointer transition-colors ${
                                      isPendingAdmin
                                        ? "bg-amber-50/40 hover:bg-amber-50/70 dark:bg-amber-950/10 dark:hover:bg-amber-950/30"
                                        : "hover:bg-slate-50/60 dark:hover:bg-slate-800/30"
                                    }`}
                                  >
                                    <td className="px-4 py-3 text-slate-500 font-normal">{req.requestDate}</td>
                                    <td className="px-4 py-3 font-mono font-medium text-sky-600 dark:text-sky-400">{req.id}</td>
                                    <td className="px-4 py-3 font-medium text-slate-900 dark:text-white">
                                      <div>{req.requesterName}</div>
                                      <div className="text-[10px] text-slate-400 font-normal">{req.requesterPosition || "-"}</div>
                                    </td>
                                    <td className="px-4 py-3 font-semibold text-slate-900 dark:text-white">
                                      <div>{req.jobTitle}</div>
                                      <div className="text-[10px] text-slate-400 font-normal">
                                        {req.positionType}
                                        {req.positionType === "Replacement" && req.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1">(แทน: {req.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-4 py-3 text-slate-600 dark:text-slate-300 font-normal">{req.department}</td>
                                    <td className="px-4 py-3 text-center font-medium">{req.headcountRequired || 1}</td>
                                    <td className="px-4 py-3">
                                      <span className={`inline-flex items-center px-2 py-0.5 rounded-lg text-[11px] font-medium border ${statusCfg.badge}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>
                                    <td className="px-4 py-3 text-center" onClick={(e) => e.stopPropagation()}>
                                      {isPendingAdmin ? (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="px-2.5 py-1 rounded-lg text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 transition"
                                        >
                                          ตรวจคำขอ
                                        </button>
                                      ) : (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {/* SUB-TAB 2: KANBAN PIPELINE & DEMAND */}
                {adminSubTab === "kanban" && (
                  <div className="space-y-8">
                    {/* Interactive Kanban Pipeline */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="grid" className="w-5 h-5 text-brand-600" />
                            Kanban Pipeline
                          </h2>
                        </div>

                        <div className="flex items-center gap-2">
                          {allPositionSlots.some(s => s.isArchivedFromKanban) && (
                            <button
                              onClick={handleRestoreAllArchivedCards}
                              className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 text-xs font-semibold flex items-center gap-1 transition"
                              title="Restore hidden cards"
                            >
                              <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                              <span>Restore Hidden ({allPositionSlots.filter(s => s.isArchivedFromKanban).length})</span>
                            </button>
                          )}

                          <div className="relative w-full sm:w-64">
                            <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                              <Icon name="search" className="w-4 h-4" />
                            </div>
                            <input
                              type="text"
                              placeholder="Search..."
                              value={searchQuery}
                              onChange={(e) => setSearchQuery(e.target.value)}
                              className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            />
                          </div>
                        </div>
                      </div>

                      <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                        {STAGES.map(stage => {
                          const stageItems = allPositionSlots.filter(s => {
                            const matches = !searchQuery.trim() ||
                              s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                            return s.stage === stage.id && !s.isArchivedFromKanban && matches;
                          });

                          return (
                            <div
                              key={stage.id}
                              onDragOver={(e) => handleDragOver(e, stage.id)}
                              onDragLeave={(e) => handleDragLeave(e, stage.id)}
                              onDrop={(e) => handleDrop(e, stage.id)}
                              className={`w-72 shrink-0 snap-start flex flex-col rounded-2xl p-3 border-2 transition-all duration-150 ${
                                dragOverStage === stage.id
                                  ? 'border-brand-500 bg-brand-50/70 dark:bg-brand-950/50 ring-2 ring-brand-500/20'
                                  : draggedSlotId
                                  ? 'border-dashed border-slate-300 dark:border-slate-700 bg-slate-50/60 dark:bg-slate-800/30'
                                  : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40'
                              }`}
                            >
                              <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700 gap-1.5">
                                <div className="flex items-center gap-1.5 truncate">
                                  <span className="text-xs font-bold text-slate-700 dark:text-slate-300 truncate">{stage.label}</span>
                                  <span className="text-[10px] font-semibold px-1.5 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 shadow-2xs">
                                    {stageItems.length}
                                  </span>
                                </div>

                                {(stage.id === "onboarded" || stage.id === "cancelled") && stageItems.length > 0 && (
                                  <button
                                    type="button"
                                    onClick={(e) => {
                                      e.stopPropagation();
                                      handleOpenStageClearModal(stage.id, stage.label);
                                    }}
                                    className="inline-flex items-center gap-1 px-2 py-0.5 rounded-lg text-[10px] font-bold bg-white dark:bg-slate-800 hover:bg-rose-50 dark:hover:bg-rose-950/60 text-slate-600 hover:text-rose-600 dark:text-slate-300 dark:hover:text-rose-300 border border-slate-200 dark:border-slate-700 transition shadow-2xs shrink-0 active:scale-95"
                                    title={`Clear ${stage.label}`}
                                  >
                                    <span>Clear</span>
                                  </button>
                                )}
                              </div>

                              <div className="space-y-3 flex-1 overflow-y-auto max-h-[540px]">
                                {stageItems.map(item => {
                                  const isBeingDragged = draggedSlotId === item.slotId;
                                  const priorityInfo = getPositionPriorityInfo(item);
                                  const isArrived = item.stage === "onboarded" && (item.hasAttendedFirstDayTraining || item.onboardingArrivalStatus === "arrived_reported");
                                  const isPendingArrival = item.stage === "onboarded" && !isArrived;

                                  return (
                                    <div
                                      key={item.slotId}
                                      draggable={true}
                                      onDragStart={(e) => handleDragStart(e, item.slotId)}
                                      onDragEnd={() => { setDraggedSlotId(null); setDragOverStage(null); }}
                                      className={`p-3.5 rounded-xl border shadow-xs transition-all cursor-grab active:cursor-grabbing select-none group ${
                                        isBeingDragged
                                          ? 'opacity-40 scale-95 border-brand-400 dark:border-brand-600 ring-2 ring-brand-500/30 shadow-md'
                                          : item.stage === 'cancelled'
                                          ? 'border-rose-300 dark:border-rose-900 bg-rose-50/30 dark:bg-rose-950/20'
                                          : isArrived
                                          ? 'border-emerald-400 dark:border-emerald-600 bg-emerald-50/90 dark:bg-emerald-950/50 ring-2 ring-emerald-500/25 shadow-xs'
                                          : isPendingArrival
                                          ? 'border-amber-300 dark:border-amber-700 bg-amber-50/60 dark:bg-amber-950/30 ring-1 ring-amber-400/30'
                                          : priorityInfo.id === 'URGENT'
                                          ? 'border-rose-300 dark:border-rose-900/80 ring-1 ring-rose-400/30 hover:border-rose-500 bg-white dark:bg-slate-800'
                                          : 'border-slate-200/80 dark:border-slate-700 hover:border-brand-400 hover:shadow-md bg-white dark:bg-slate-800'
                                      }`}
                                    >
                                      {/* Priority Blinking Bar */}
                                      <div className="flex items-center justify-between text-[10px] mb-2 pb-1.5 border-b border-slate-100 dark:border-slate-700/60">
                                        <div className="flex items-center gap-1.5">
                                          <span className="relative flex h-2.5 w-2.5">
                                            {priorityInfo.ping && (
                                              <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${priorityInfo.dotBg} opacity-75`}></span>
                                            )}
                                            <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${priorityInfo.dotBg}`}></span>
                                          </span>
                                          <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded border ${priorityInfo.badge}`}>
                                            {priorityInfo.icon} {priorityInfo.label}
                                          </span>
                                        </div>
                                        <span className="text-slate-400">{item.requestDate}</span>
                                      </div>

                                      <div className="flex items-center justify-between text-[10px] mb-1.5">
                                        <div className="flex items-center gap-1.5">
                                          <span className="text-slate-400 font-mono text-xs cursor-grab" title="ลากเพื่อย้ายขั้นตอน">⋮⋮</span>
                                          <span className="text-brand-600 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded">
                                            Slot #{item.slotIndex}/{item.totalSlots}
                                          </span>
                                        </div>
                                        <span className="text-[10px] text-slate-400 font-mono">{item.slotId}</span>
                                      </div>
                                      <h4 className="text-xs font-bold text-slate-900 dark:text-white line-clamp-2">
                                        {item.jobTitle}
                                      </h4>
                                      <p className="text-[11px] text-slate-500 truncate mt-0.5">{item.department}</p>

                                      {/* Sub-status Badges for Approval Workflow (Kanban) */}
                                      {item.stage === "received" && (
                                        <div className="mt-2">
                                          {item.workflowStatus === "PENDING_ADMIN" && (
                                            <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-700">
                                              <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
                                              ⏳ รอ Admin ตรวจสอบ
                                            </span>
                                          )}
                                          {item.workflowStatus === "PENDING_APPROVER" && (
                                            <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-orange-100 text-orange-800 dark:bg-orange-950/80 dark:text-orange-300 border border-orange-300 dark:border-orange-700">
                                              📧 รอผู้อนุมัติยืนยัน
                                            </span>
                                          )}
                                          {item.workflowStatus === "PENDING_IT" && (
                                            <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-sky-100 text-sky-800 dark:bg-sky-950/80 dark:text-sky-300 border border-sky-300 dark:border-sky-700">
                                              💻 รอ IT จัดเตรียมอุปกรณ์
                                            </span>
                                          )}
                                        </div>
                                      )}

                                      {/* Badge for 1. Manpower Request (Ready for Recruitment) */}
                                      {item.stage === "manpower" && (
                                        <div className="mt-2">
                                          <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-400 ring-1 ring-emerald-500/20">
                                            ✅ พร้อมสรรหา
                                          </span>
                                        </div>
                                      )}

                                      {item.candidateName ? (
                                        <div className={`mt-2 p-2 rounded-lg border text-xs ${
                                          isArrived
                                            ? "bg-emerald-100/80 dark:bg-emerald-900/50 border-emerald-300 dark:border-emerald-700"
                                            : "bg-emerald-50/80 dark:bg-emerald-950/40 border-emerald-100 dark:border-emerald-900/60"
                                        }`}>
                                          <div className="font-bold text-emerald-800 dark:text-emerald-200 flex items-center justify-between">
                                            <span className="truncate">👤 {item.candidateName}</span>
                                            <button 
                                              onClick={() => setUnassignConfirmTarget(item)}
                                              className="text-[10px] text-rose-500 hover:text-rose-700 underline font-semibold ml-1 shrink-0"
                                            >
                                              ถอด
                                            </button>
                                          </div>

                                          {item.stage === "interview" && item.interviewSchedule && (() => {
                                            const relTime = getInterviewRelativeTimeInfo(item.interviewSchedule);
                                            return (
                                              <div className="mt-1.5 pt-1.5 border-t border-emerald-200/60 dark:border-emerald-800/60 space-y-1">
                                                <div className="text-[11px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1">
                                                  <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                                  <span className="truncate">นัดหมาย: {item.interviewSchedule}</span>
                                                </div>
                                                {relTime && (
                                                  <div className="flex items-center gap-1.5">
                                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>
                                                      {relTime.ping && (
                                                        <span className="relative flex h-2 w-2">
                                                          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                                          <span className={`relative inline-flex rounded-full h-2 w-2 ${relTime.dotBg}`}></span>
                                                        </span>
                                                      )}
                                                      <span>{relTime.text}</span>
                                                    </span>
                                                  </div>
                                                )}
                                              </div>
                                            );
                                          })()}

                                          {/* Onboarded Status inside Candidate Card Box */}
                                          {item.stage === "onboarded" && (
                                            <div className="mt-1.5 pt-1.5 border-t border-slate-200/60 dark:border-slate-700/60 space-y-1">
                                              {item.hireDate && (
                                                <div className="text-[11px] font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1">
                                                  <Icon name="calendar" className="w-3.5 h-3.5 shrink-0 text-brand-600" />
                                                  <span>เริ่มงาน: {item.hireDate}</span>
                                                </div>
                                              )}
                                              <div className={`p-1.5 rounded-lg text-[10.5px] font-extrabold flex items-center justify-between border ${
                                                isArrived
                                                  ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/70 dark:text-emerald-100 border-emerald-300 dark:border-emerald-700 shadow-2xs"
                                                  : "bg-amber-100 text-amber-800 dark:bg-amber-900/70 dark:text-amber-200 border-amber-300 dark:border-amber-700 animate-pulse"
                                              }`}>
                                                <span className="flex items-center gap-1">
                                                  {isArrived ? "✅ มาเริ่มงานแล้ว (Closed)" : "⏳ รอถึงวันเริ่มงาน (ยังไม่มา)"}
                                                </span>
                                              </div>
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <div className="mt-2 text-[10px] font-medium text-slate-400 italic bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md inline-block">
                                          👤 ว่าง (Unassigned)
                                        </div>
                                      )}

                                      {/* Quick Confirm Arrival Button on Card for Pending Arrival */}
                                      {isPendingArrival && (
                                        <button
                                          type="button"
                                          onClick={(e) => {
                                            e.stopPropagation();
                                            handleConfirmFirstDayTraining(item.slotId);
                                          }}
                                          className="w-full mt-2 py-1.5 px-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-[11px] shadow-sm transition flex items-center justify-center gap-1.5 cursor-pointer"
                                          title="คลิกเมื่อพนักงานมารายงานตัวและเริ่มงานแล้ว"
                                        >
                                          <span>✓ กดยืนยันมาเริ่มงานแล้ว</span>
                                        </button>
                                      )}

                                      {item.rejectionReason && (
                                        <div className="mt-2 p-1.5 rounded-lg bg-rose-100/70 dark:bg-rose-950/70 border border-rose-300 dark:border-rose-900 text-[10px] text-rose-800 dark:text-rose-200 font-semibold">
                                          ❌ เหตุผล: {item.rejectionReason}
                                        </div>
                                      )}

                                      {/* Interview Evaluation Action for Admin Kanban Card (Strictly only in Interview Stage) */}
                                      {item.stage === "interview" ? (
                                        <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-1.5">
                                          <button
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              handleOpenBlindEvaluationModal(item);
                                            }}
                                            className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-600 hover:text-brand-700 dark:text-brand-400 bg-brand-50 hover:bg-brand-100 dark:bg-brand-950/60 dark:hover:bg-brand-900 px-2.5 py-1 rounded-lg border border-brand-200 dark:border-brand-800/80 transition shadow-2xs active:scale-95"
                                            title="เปิดแบบฟอร์มประเมินสัมภาษณ์"
                                          >
                                            <Icon name="clipboardCheck" className="w-3 h-3 text-brand-600" />
                                            <span>+ ประเมินสัมภาษณ์</span>
                                          </button>
                                          {item.evaluationsCount > 0 ? (
                                            <button
                                              type="button"
                                              onClick={(e) => {
                                                e.stopPropagation();
                                                setAdminAuditSlot(item);
                                              }}
                                              className="text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 underline truncate ml-auto"
                                              title="คลิกเพื่อดู Audit Breakdown คะแนนประเมิน"
                                            >
                                              ⭐ {item.interviewScore}/5 ({item.evaluationsCount} ท่าน)
                                            </button>
                                          ) : (
                                            <span className="text-[10px] text-slate-400 italic">รอผลประเมิน</span>
                                          )}
                                        </div>
                                      ) : item.evaluationsCount > 0 && item.stage !== "onboarded" && item.stage !== "cancelled" ? (
                                        <div className="mt-2 pt-1.5 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-end">
                                          <button
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              setAdminAuditSlot(item);
                                            }}
                                            className="text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:text-brand-600 dark:hover:text-brand-400 underline truncate"
                                            title="คลิกเพื่อดู Audit Breakdown คะแนนประเมิน"
                                          >
                                            ⭐ {item.interviewScore}/5 ({item.evaluationsCount} ท่าน)
                                          </button>
                                        </div>
                                      ) : null}

                                      {(item.stage === "onboarded" || item.stage === "cancelled") && (
                                        <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                                          <button
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              handleArchiveSlotFromKanban(item.slotId);
                                            }}
                                            className="inline-flex items-center gap-1 text-[10px] font-bold text-slate-500 hover:text-rose-600 dark:text-slate-400 dark:hover:text-rose-300 bg-slate-100 hover:bg-rose-50 dark:bg-slate-800/80 dark:hover:bg-rose-950/50 px-2 py-1 rounded-lg border border-slate-200 dark:border-slate-700 transition"
                                            title="ล้างการ์ดนี้ออกจากหน้ากระดาน Kanban (ข้อมูลยังคงถูกบันทึกใน Manpower Request)"
                                          >
                                            <Icon name="x" className="w-3 h-3 text-slate-400 group-hover:text-rose-500" />
                                            <span>ล้างการ์ดออกจาก Kanban</span>
                                          </button>
                                          <span className="text-[9px] text-slate-400 italic">บันทึกใน Closed แล้ว</span>
                                        </div>
                                      )}

                                      <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700 flex items-center justify-between">
                                        <select
                                          value={item.stage}
                                          onChange={(e) => handleInitiateStageChange(item.slotId, e.target.value)}
                                          className="text-[10px] font-semibold px-2 py-1 rounded bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                                        >
                                          {STAGES.map(st => (
                                            <option key={st.id} value={st.id}>{st.label}</option>
                                          ))}
                                        </select>

                                        <button 
                                          onClick={() => setSelectedDetailSlot(item)}
                                          className="text-[10px] font-bold text-brand-600 hover:underline"
                                        >
                                          ดูคำขอ &rarr;
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>

                    {/* Headcount Demand by Department (Admin View) */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="building" className="w-5 h-5 text-brand-600" />
                            Demand by Department
                          </h2>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[440px] overflow-y-auto pr-1">
                        {departmentStats.map((item, idx) => (
                          <div 
                            key={item.department} 
                            onClick={() => setSelectedDepartmentDetail(item.department)}
                            className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:bg-white dark:hover:bg-slate-800 hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                          >
                            <div className="flex items-start justify-between gap-2 mb-2">
                              <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 transition">
                                <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                                {item.department}
                              </span>
                              <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                                <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                                <span className="text-amber-600">Open: {item.open}</span>
                                <span className="text-emerald-600">Filled: {item.filled}</span>
                              </div>
                            </div>
                            <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                              <div 
                                className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full"
                                style={{ width: `${item.total > 0 ? (item.total / (departmentStats[0]?.total || 1)) * 100 : 0}%` }}
                              ></div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  </div>
                )}

                {/* SUB-TAB 3: CANDIDATE POOL & MANPOWER REQUEST */}
                {adminSubTab === "candidates" && (
                  <div className="flex flex-col w-full space-y-8">
                    {/* SECTION 1: Manpower Request (Top - Full Width) */}
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="shieldCheck" className="w-5 h-5 text-emerald-600" />
                            Manpower Requests
                          </h2>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={exportToCSV}
                            className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md flex items-center gap-1.5 transition"
                          >
                            <Icon name="download" className="w-3.5 h-3.5 text-white" />
                            <span>Export CSV</span>
                          </button>
                        </div>
                      </div>

                      {/* Tab Selection: In Process vs Closed */}
                      <div className="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
                        <button
                          onClick={() => setManpowerTableTab("in_process")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "in_process"
                              ? "bg-amber-500 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>In Progress</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{inProcessSlots.length}</span>
                        </button>

                        <button
                          onClick={() => setManpowerTableTab("closed")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "closed"
                              ? "bg-emerald-600 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>Closed</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{closedSlots.length}</span>
                        </button>
                      </div>

                      {/* Manpower Request Data Table */}
                      <div className="overflow-x-auto max-h-[380px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-500 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5">Slot ID</th>
                              <th className="px-3 py-2.5">Status</th>
                              <th className="px-3 py-2.5">Position</th>
                              <th className="px-3 py-2.5">Department</th>
                              <th className="px-3 py-2.5">Stage</th>
                              <th className="px-3 py-2.5">Lead Time</th>
                              <th className="px-3 py-2.5">Candidate &amp; Schedule</th>
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Hire Date &amp; Arrival</th>}
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Total Duration</th>}
                              <th className="px-3 py-2.5">Evaluation</th>
                              <th className="px-3 py-2.5 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {(manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).length === 0 ? (
                              <tr>
                                <td colSpan={manpowerTableTab === "closed" ? "11" : "9"} className="text-center py-6 text-slate-400 italic">
                                  ไม่มีรายการในหมวดนี้
                                </td>
                              </tr>
                            ) : (
                              (manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).map(s => {
                                const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                                const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
                                const hasEvaluation = s.evaluationsCount > 0;
                                const isPassingScore = s.interviewScorePercent >= 70;
                                const isArrivedSuccess = s.onboardingArrivalStatus === "arrived_reported";
                                const isDeclinedOrCancelled = s.stage === "cancelled" || s.onboardingArrivalStatus === "declined_noshow";

                                const rowHighlightClass = isDeclinedOrCancelled
                                  ? "bg-rose-50/70 dark:bg-rose-950/40 hover:bg-rose-100/80 transition"
                                  : isArrivedSuccess
                                  ? "bg-emerald-50/70 dark:bg-emerald-950/40 hover:bg-emerald-100/80 transition"
                                  : "hover:bg-slate-50/80 dark:hover:bg-slate-800/40";

                                return (
                                  <tr key={s.slotId} className={rowHighlightClass}>
                                    <td className="px-3 py-2.5 font-semibold text-slate-900 dark:text-white">
                                      <span className="text-brand-600 font-bold">{s.slotId}</span>
                                      <div className="text-[10px] text-slate-400">{s.requestDate}</div>
                                    </td>

                                    <td className="px-3 py-2.5">
                                      {s.slotStatus === "PENDING_ADMIN" ? (
                                        <button
                                          onClick={() => {
                                            setSelectedAdminReviewSlot(s);
                                            setShowAdminReviewModal(true);
                                          }}
                                          className="inline-flex items-center gap-1 px-2.5 py-1 rounded-lg text-[10.5px] font-extrabold bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 dark:bg-amber-950 dark:text-amber-200 dark:border-amber-700 shadow-2xs transition active:scale-95"
                                          title="คลิกเพื่อตรวจสอบและกดยืนยันคำขอ"
                                        >
                                          <span>⏳ PENDING_ADMIN</span>
                                          <span className="text-amber-700 dark:text-amber-300 font-bold underline ml-1">ตรวจ &rarr;</span>
                                        </button>
                                      ) : s.slotStatus === "PENDING_APPROVER" ? (
                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg text-[10.5px] font-bold bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-300 border border-sky-300 dark:border-sky-800">
                                          📧 PENDING_APPROVER
                                        </span>
                                      ) : s.slotStatus === "PENDING_IT" ? (
                                        <span className="inline-flex items-center px-2 py-0.5 rounded-lg text-[10.5px] font-bold bg-purple-100 text-purple-800 dark:bg-purple-950 dark:text-purple-300 border border-purple-300 dark:border-purple-800">
                                          💻 PENDING_IT
                                        </span>
                                      ) : s.slotStatus === "READY_FOR_RECRUITMENT" ? (
                                        <span className="inline-flex items-center px-2.5 py-0.5 rounded-lg text-[10.5px] font-extrabold bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border border-emerald-400 ring-2 ring-emerald-500/20">
                                          ✅ READY_FOR_RECRUITMENT
                                        </span>
                                      ) : (
                                        <select
                                          value={s.slotStatus || "Recruiting"}
                                          onChange={(e) => handleUpdateSlotStatus(s.slotId, e.target.value)}
                                          className={`text-[11px] font-bold px-2 py-1 rounded-lg border ${
                                            s.slotStatus === "Closed"
                                              ? "bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                              : "bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-800"
                                          }`}
                                        >
                                          {REQUISITION_STATUSES.map(st => (
                                            <option key={st.id} value={st.id}>{st.label}</option>
                                          ))}
                                        </select>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5 font-bold text-slate-900 dark:text-white">
                                      <div>{s.jobTitle}</div>
                                      <div className="text-[10px] font-normal text-slate-400">
                                        {s.positionType}
                                        {s.positionType === "Replacement" && s.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1 font-semibold">(แทน: {s.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>

                                    <td className="px-3 py-2.5">{s.department}</td>

                                    <td className="px-3 py-2.5">
                                      <select
                                        value={s.stage}
                                        onChange={(e) => handleInitiateStageChange(s.slotId, e.target.value)}
                                        className="text-[11px] p-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                                      >
                                        {STAGES.map(stg => (
                                          <option key={stg.id} value={stg.id}>{stg.label}</option>
                                        ))}
                                      </select>
                                    </td>

                                    <td className="px-3 py-2.5">
                                      {s.stage === "offer" ? (
                                        <span className="px-2 py-1 rounded-lg bg-purple-100 text-purple-900 dark:bg-purple-950 dark:text-purple-200 font-bold text-[11px]">
                                          🎯 สรรหาได้ใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                        </span>
                                      ) : (
                                        <span className="text-slate-500 text-[11px]">
                                          ⏱️ {sla.workingDaysElapsed} วันทำการ ({sla.isCompleted ? "Closed" : `เหลือ ${sla.workingDaysRemaining} วัน`})
                                        </span>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5">
                                      {s.candidateName ? (
                                        <div className="flex flex-col space-y-0.5">
                                          <div className="flex items-center gap-2">
                                            <span className="font-semibold text-slate-900 dark:text-white">{s.candidateName}</span>
                                            {s.candidateNickname && <span className="text-[10px] text-slate-400">({s.candidateNickname})</span>}
                                            <button
                                              onClick={() => setUnassignConfirmTarget(s)}
                                              className="p-1 rounded-md text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-[10px] font-bold"
                                              title="ถอดผู้สมัคร"
                                            >
                                              ✕ ถอด
                                            </button>
                                          </div>
                                          {s.interviewSchedule && (() => {
                                            const relTime = getInterviewRelativeTimeInfo(s.interviewSchedule);
                                            return (
                                              <div className="flex flex-wrap items-center gap-1.5 text-[10px]">
                                                <span className="text-amber-700 dark:text-amber-300 font-medium">
                                                  📅 {s.interviewSchedule}
                                                </span>
                                                {relTime && s.stage === "interview" && (
                                                  <span className={`inline-flex items-center gap-1 px-2 py-0.2 rounded-full text-[9.5px] border ${relTime.badge}`}>
                                                    {relTime.ping && (
                                                      <span className="relative flex h-1.5 w-1.5">
                                                        <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                                        <span className={`relative inline-flex rounded-full h-1.5 w-1.5 ${relTime.dotBg}`}></span>
                                                      </span>
                                                    )}
                                                    <span>{relTime.text}</span>
                                                  </span>
                                                )}
                                              </div>
                                            );
                                          })()}
                                          {s.rejectionReason && (
                                            <div className="text-[10px] text-rose-700 dark:text-rose-300 font-bold bg-rose-100 dark:bg-rose-950/80 px-2 py-0.5 rounded-md border border-rose-300 dark:border-rose-900 truncate max-w-[200px]" title={s.rejectionReason}>
                                              ❌ เหตุผล: {s.rejectionReason}
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 text-[11px] italic">ว่าง (Unassigned)</span>
                                      )}
                                    </td>

                                    {/* Closed-Tab Specific: Hire Date & Arrival Status with Locking */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="space-y-1">
                                          {isDeclinedOrCancelled ? (
                                            <div className="text-[11px] font-extrabold text-rose-600 dark:text-rose-400 flex items-center gap-1">
                                              <span>❌ ยกเลิก / สละสิทธิ์</span>
                                            </div>
                                          ) : s.hireDate ? (
                                            <div className="text-[11px] font-extrabold text-emerald-800 dark:text-emerald-300 flex items-center gap-1">
                                              <Icon name="calendar" className="w-3 h-3 text-emerald-600" />
                                              <span>วันเริ่มงาน: {s.hireDate}</span>
                                            </div>
                                          ) : (
                                            <div className="text-[10px] text-slate-400 italic">ไม่ระบุวันเริ่มงาน</div>
                                          )}
                                          
                                          <div className="flex items-center gap-1">
                                            <select
                                              disabled={s.onboardingArrivalStatus === "declined_noshow"}
                                              value={s.onboardingArrivalStatus || "pending_arrival"}
                                              onChange={(e) => handleUpdateOnboardingArrivalStatus(s.slotId, e.target.value)}
                                              className={`text-[10px] font-extrabold px-2.5 py-1 rounded-lg border transition ${
                                                s.onboardingArrivalStatus === "declined_noshow"
                                                  ? "bg-rose-600 text-white border-rose-700 shadow-sm ring-2 ring-rose-500/30 cursor-not-allowed opacity-95"
                                                  : s.onboardingArrivalStatus === "arrived_reported"
                                                  ? "bg-emerald-600 text-white border-emerald-700 shadow-sm ring-2 ring-emerald-500/20"
                                                  : "bg-amber-100 text-amber-800 border-amber-300"
                                              }`}
                                            >
                                              {ONBOARDING_ARRIVAL_STATUSES.map(arr => (
                                                <option key={arr.id} value={arr.id}>{arr.label}</option>
                                              ))}
                                            </select>
                                            {s.onboardingArrivalStatus === "declined_noshow" && (
                                              <span className="text-[10px] text-rose-600 font-bold" title="สถานะนี้ถูกล็อกแล้ว">🔒</span>
                                            )}
                                          </div>
                                        </div>
                                      </td>
                                    )}

                                    {/* Closed-Tab Specific: Total Recruitment Duration */}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5">
                                        <div className="space-y-0.5">
                                          <div className="text-[11px] font-extrabold text-slate-900 dark:text-white flex items-center gap-1">
                                            <span className="px-2 py-0.5 rounded-md bg-sky-100 dark:bg-sky-950 text-sky-800 dark:text-sky-300 font-bold">
                                              ⏱️ รวม {duration.totalDays} วัน
                                            </span>
                                          </div>
                                          <div className="text-[10px] text-slate-500 dark:text-slate-400 font-medium pl-1">
                                            ({duration.workingDays} วันทำการ)
                                          </div>
