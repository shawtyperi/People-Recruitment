    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ value, onChange, options, placeholder = "-- Select or type to search --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      const normalizedOptions = useMemo(() => {
        return options.map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์ (No matching options)</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

    const STANDARD_SLA_DAYS = 30;

    const getSLAInfo = (requestDate, stage) => {
      const start = new Date(requestDate);
      const today = new Date();
      const diffTime = today - start;
      const daysElapsed = Math.max(0, Math.floor(diffTime / (1000 * 60 * 60 * 24)));
      const daysRemaining = STANDARD_SLA_DAYS - daysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && daysElapsed > STANDARD_SLA_DAYS;

      return {
        daysElapsed,
        daysRemaining,
        isOverdue,
        isCompleted
      };
    };

    function App() {

        personnelList.forEach(p => {
          if (p.department && p.department !== "-" && p.department.trim()) {
            set.add(p.department.trim());

        });
        return Array.from(set);
      }, [personnelList]);

      const DEFAULT_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwfdg3PLNPbtKDaWEZ7aeU9MRur3jr7AeJ8wc/exec";

        return localStorage.getItem("hr_google_script_url") || DEFAULT_SCRIPT_URL;
      });

      const [isSyncingPersonnel, setIsSyncingPersonnel] = useState(false);
      const [isSyncingCandidates, setIsSyncingCandidates] = useState(false);
      const [toastMessage, setToastMessage] = useState("");

      const triggerToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(""), 3500);
      };

      const syncPersonnelFromGoogleSheet = async (showToast = false) => {
        setIsSyncingPersonnel(true);
        try {
          const res = await fetch(GOOGLE_SHEET_DIRECTORY_CSV_URL);
          if (!res.ok) throw new Error("Network response was not ok");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const header = rows[0].map(h => (h || '').toLowerCase().trim().replace(/\uFEFF/g, ''));
            
            let nameIdx = header.findIndex(h => (h.includes('ชื่อ') || h.includes('name') || h.includes('personnel') || h.includes('requester')) && !h.includes('เล่น') && !h.includes('nick'));
            let deptIdx = header.findIndex(h => h.includes('ฝ่ายงาน'));
            if (deptIdx === -1) {
              deptIdx = header.findIndex(h => h.includes('ฝ่าย') || h.includes('แผนก') || h.includes('สังกัด') || h.includes('department') || h.includes('dept'));
            }
            let posIdx = header.findIndex(h => h.includes('ตำแหน่ง') || h.includes('position') || h.includes('role') || h.includes('title'));
            let emailIdx = header.findIndex(h => h.includes('email') || h.includes('อีเมล') || h.includes('อีเมลล์') || h.includes('mail'));

            if (nameIdx === -1) nameIdx = 0;

            const loadedList = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length <= 1) continue;

              const nameVal = (r[nameIdx] || r[0])?.trim();
              if (!nameVal || nameVal.toLowerCase().includes("ชื่อ") || nameVal.toLowerCase().includes("name") || nameVal === "C") continue;

              let emailVal = (emailIdx !== -1 ? r[emailIdx] : r.find(c => c && c.includes("@")))?.trim() || "";
              let deptVal = (deptIdx !== -1 && r[deptIdx]) ? r[deptIdx].trim() : "-";
              let posVal = (posIdx !== -1 ? r[posIdx] : r[1])?.trim() || "Staff";

              loadedList.push({
                name: nameVal,
                email: emailVal,
                position: posVal,
                department: deptVal || "-"
              });
            }

            if (loadedList.length > 0) {
              setPersonnelList(loadedList);
              localStorage.setItem("hr_personnel_list_v16", JSON.stringify(loadedList));
              if (showToast) triggerToast(lang === 'th' ? `ซิงค์รายชื่อบุคลากรสำเร็จ! (${loadedList.length} รายชื่อ)` : `Synced ${loadedList.length} personnel records!`);
            }
          }
        } catch (err) {
          if (showToast) triggerToast(lang === 'th' ? "ใช้ออฟไลน์ข้อมูลแคชเดิม" : "Using cached personnel directory");
        } finally {
          setIsSyncingPersonnel(false);
        }
      };

      const syncCandidatesFromGoogleSheet = async (showToast = false) => {
        setIsSyncingCandidates(true);
        try {
          const res = await fetch(GOOGLE_SHEET_CANDIDATES_CSV_URL);
          if (!res.ok) throw new Error("Network response was not ok");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const header = rows[0].map(h => (h || '').toLowerCase().trim());
            
            let nameIdx = header.findIndex(h => (h.includes('ชื่อ') || h.includes('name')) && !h.includes('เล่น') && !h.includes('nick'));
            let nickIdx = header.findIndex(h => h.includes('เล่น') || h.includes('nick'));
            let phoneIdx = header.findIndex(h => h.includes('เบอร์') || h.includes('phone') || h.includes('tel'));
            let emailIdx = header.findIndex(h => h.includes('email') || h.includes('อีเมล') || h.includes('อีเมลล์'));
            let sourceIdx = header.findIndex(h => h.includes('source') || h.includes('channel') || h.includes('ช่องทาง') || h.includes('รับสมัคร'));
            let posIdx = header.findIndex(h => h.includes('ตำแหน่ง') || h.includes('position') || h.includes('title') || h.includes('role'));
            let locIdx = header.findIndex(h => h.includes('location') || h.includes('สถานที่') || h.includes('site'));
            let statusIdx = header.findIndex(h => h.includes('status') || h.includes('สถานะ'));
            let cvIdx = header.findIndex(h => h.includes('cv') || h.includes('resume') || h.includes('drive') || h.includes('link'));

            if (nameIdx === -1) nameIdx = 2;
            if (nickIdx === -1) nickIdx = 3;
            if (phoneIdx === -1) phoneIdx = 4;
            if (emailIdx === -1) emailIdx = 5;
            if (sourceIdx === -1) sourceIdx = 6;
            if (posIdx === -1) posIdx = 7;
            if (locIdx === -1) locIdx = 8;
            if (statusIdx === -1) statusIdx = 9;
            if (cvIdx === -1) cvIdx = 10;

            const loadedCandidates = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length < 2) continue;

              const fullName = r[nameIdx]?.trim();
              if (!fullName || fullName.toLowerCase().includes("ชื่อ") || fullName.toLowerCase().includes("name")) continue;

              let candidateId = r[0]?.trim() || "";
              if (!candidateId || candidateId.includes("2025") || candidateId.includes("2507") || !candidateId.startsWith("CAND")) {
                candidateId = `CAND-2026-${String(i).padStart(3, '0')}`;
              }

              const nickname = r[nickIdx]?.trim() || "";
              let phone = r[phoneIdx]?.trim() || "";
              let email = r[emailIdx]?.trim() || "";
              
              if (email && !email.includes('@') && (email.startsWith('0') || email.includes('-'))) {
                const realEmail = r.find(col => col && col.includes('@')) || "";
                if (realEmail) {
                  phone = email;
                  email = realEmail;
                }
              }
              if (!email && r.find(col => col && col.includes('@'))) {
                email = r.find(col => col && col.includes('@')) || "";
              }

              const source = r[sourceIdx]?.trim() || "LinkedIn";
              const targetJobTitle = r[posIdx]?.trim() || "General Application";
              const location = r[locIdx]?.trim() || "-";
              const status = r[statusIdx]?.trim() || "In Review";
              const resumeUrl = r[cvIdx]?.trim() || "";

              loadedCandidates.push({
                candidateId,
                fullName,
                nickname,
                phone,
                email,
                source,
                resumeUrl,
                status: CANDIDATE_STATUSES.includes(status) ? status : "In Review",
                targetJobTitle: targetJobTitle || "General Application",
                location: location || "-",
                assignedSlotId: ""
              });
            }

            if (loadedCandidates.length > 0) {
              setCandidatePool(loadedCandidates);
              localStorage.setItem("hr_candidate_pool_v16", JSON.stringify(loadedCandidates));
              if (showToast) triggerToast(lang === 'th' ? `ซิงค์คลังผู้สมัครสำเร็จ! (${loadedCandidates.length} รายชื่อ)` : `Synced ${loadedCandidates.length} candidate profiles!`);
            }
          }
        } catch (err) {
          if (showToast) triggerToast(lang === 'th' ? "ใช้ออฟไลน์ข้อมูลแคชผู้สมัครเดิม" : "Using cached candidate pool");
        } finally {
          setIsSyncingCandidates(false);
        }
      };

        syncPersonnelFromGoogleSheet(false);
        syncCandidatesFromGoogleSheet(false);

      const initialForm = {
        requesterName: "",
        requesterPosition: "",
        requesterEmail: "",
        department: "",
        approverName: "",
        approverEmail: "",
        forwardTo: "",
        forwardEmail: "",
        forwardToPeopleDept: "ศรัณย์ภัทธ อุบล",
        peopleEmail: "sarunpat.ub@valuesourcing.co",
        jobTitle: "",
        headcountRequired: 1,
        positionType: "Replacement",
        targetDate: "",
        buddy: "",
        jobDescription: "",
        detailsForPeople: "",
        approverNote1: "",
        approvalStatusL1: "Approved",
        approvalStatusL2: "Pending",
        docStatus: "Pending",
        gender: "Any",
        age: "25 - 40 ปี",
        education: "ปริญญาตรี (Bachelor's Degree)",
        major: "",
        experience: "1 - 2 ปี (1 - 2 Years)",
        requiredSkills: "",
        equipment: { laptop: false, simCard: false, email: false, netsuite: false }
      };

      const [formInput, setFormInput] = useState(initialForm);

      const [showCandidateModal, setShowCandidateModal] = useState(false);
      const [mappingCandidate, setMappingCandidate] = useState(null);
      const [assignConfirmData, setAssignConfirmData] = useState(null);
      const [selectedDetailSlot, setSelectedDetailSlot] = useState(null);
      const [selectedCandidateDetail, setSelectedCandidateDetail] = useState(null);
      const [selectedDepartmentDetail, setSelectedDepartmentDetail] = useState(null);
      const [cancelModalSlot, setCancelModalSlot] = useState(null);
      const [cancelReasonInput, setCancelReasonInput] = useState("");

      const [activeKpiModalType, setActiveKpiModalType] = useState(null);
      const [isEditingCandidate, setIsEditingCandidate] = useState(false);
      const [candidateNameInput, setCandidateNameInput] = useState("");
      const [resumeUrlInput, setResumeUrlInput] = useState("");
      const [draggedSlotId, setDraggedSlotId] = useState(null);

      const [isEditingCandProfile, setIsEditingCandProfile] = useState(false);
      const [editCandData, setEditCandData] = useState(null);

      const [newCandName, setNewCandName] = useState("");
      const [newCandNick, setNewCandNick] = useState("");
      const [newCandPhone, setNewCandPhone] = useState("");
      const [newCandEmail, setNewCandEmail] = useState("");
      const [newCandSource, setNewCandSource] = useState(APPLICATION_SOURCES[0]);
      const [newCandUrl, setNewCandUrl] = useState("");
      const [newCandRole, setNewCandRole] = useState("");
      const [newCandLocation, setNewCandLocation] = useState("");
      const [newCandStatus, setNewCandStatus] = useState("In Review");

      const allPositionSlots = useMemo(() => {
        return requests.flatMap(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          const slots = (r.slots && r.slots.length === headcount) 
            ? r.slots 
            : Array.from({ length: headcount }, (_, i) => ({
                slotId: `${r.id}-${i + 1}`,
                slotIndex: i + 1,
                candidateName: "",
                candidatePhone: "",
                candidateNickname: "",
                resumeUrl: "",
                stage: r.stage || "received",
                cancellationReason: ""
              }));

          return slots.map(slot => ({
            ...r,
            slotId: slot.slotId,
            slotIndex: slot.slotIndex,
            totalSlots: headcount,
            candidateName: slot.candidateName || "",
            candidatePhone: slot.candidatePhone || "",
            candidateNickname: slot.candidateNickname || "",
            resumeUrl: slot.resumeUrl || "",
            stage: slot.stage || r.stage || "received",
            cancellationReason: slot.cancellationReason || ""
          }));
        });
      }, [requests]);

      const filteredPositionSlots = useMemo(() => {
        return allPositionSlots.filter(s => {
          const matchesQuery = !searchQuery.trim() || 
            s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.slotId?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.id?.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());

          const reqDate = new Date(s.requestDate);
          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchesMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchesYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          return matchesQuery && matchesMonth && matchesYear;
        });
      }, [allPositionSlots, searchQuery, selectedMonthFilter, selectedYearFilter]);

      const filteredCandidates = useMemo(() => {
        return candidatePool.filter(c => {
          const matchesQuery = !candidateSearchQuery.trim() ||
            c.fullName?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.nickname?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.email?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.phone?.includes(candidateSearchQuery) ||
            c.targetJobTitle?.toLowerCase().includes(candidateSearchQuery.toLowerCase()) ||
            c.location?.toLowerCase().includes(candidateSearchQuery.toLowerCase());

          const matchesSource = selectedSourceFilter === "ALL" || c.source === selectedSourceFilter;
          const matchesStage = selectedCandidateStageFilter === "ALL" || c.status === selectedCandidateStageFilter;

          return matchesQuery && matchesSource && matchesStage;
        });
      }, [candidatePool, candidateSearchQuery, selectedSourceFilter, selectedCandidateStageFilter]);

      const handleAddCandidateSubmit = (e) => {
        e.preventDefault();
        if (!newCandName.trim()) return;

        const newId = `CAND-2026-${String(candidatePool.length + 1).padStart(3, '0')}`;
        const newCand = {
          candidateId: newId,
          fullName: newCandName.trim(),
          nickname: newCandNick.trim(),
          phone: newCandPhone.trim(),
          email: newCandEmail.trim(),
          source: newCandSource,
          resumeUrl: newCandUrl.trim(),
          status: newCandStatus,
          targetJobTitle: newCandRole.trim() || "General Application",
          location: newCandLocation.trim() || "-",
          assignedSlotId: ""
        };

        setCandidatePool([newCand, ...candidatePool]);
        setShowCandidateModal(false);
        setNewCandName("");
        setNewCandNick("");
        setNewCandPhone("");
        setNewCandEmail("");
        setNewCandUrl("");
        setNewCandRole("");
        setNewCandLocation("");
        triggerToast(lang === 'th' ? "เพิ่มผู้สมัครเข้าคลังเรียบร้อยแล้ว!" : "Candidate added to pool!");
      };

      const handleAssignCandidateToSlot = (candidate, slotId) => {
        setCandidatePool(prev => prev.map(c => c.candidateId === candidate.candidateId ? {
          ...c,
          status: "Pass",
          assignedSlotId: slotId
        } : c));

        setRequests(prev => prev.map(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          let slots = r.slots && r.slots.length === headcount ? [...r.slots] : Array.from({ length: headcount }, (_, i) => ({
            slotId: `${r.id}-${i + 1}`,
            slotIndex: i + 1,
            candidateName: "",
            resumeUrl: "",
            stage: r.stage || "received",
            cancellationReason: ""
          }));

          let updated = false;
          slots = slots.map(s => {
            if (s.slotId === slotId) {
              updated = true;
              return {
                ...s,
                candidateName: candidate.fullName,
                candidateNickname: candidate.nickname,
                candidatePhone: candidate.phone,
                resumeUrl: candidate.resumeUrl
              };
            }
            return s;
          });

          if (updated) {
            return { ...r, slots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) };
          }
          return r;
        }));

        setMappingCandidate(null);
        setAssignConfirmData(null);
        setSelectedCandidateDetail(null);
        triggerToast(lang === 'th' ? `แมปผู้สมัครลงตำแหน่ง Slot #${slotId} เรียบร้อยแล้ว!` : `Assigned candidate to slot #${slotId}!`);
      };

      const handleUpdateCandidateStatus = (candidateId, newStatus) => {
        setCandidatePool(prev => prev.map(c => c.candidateId === candidateId ? { ...c, status: newStatus } : c));
        triggerToast(lang === 'th' ? `อัปเดตสถานะผู้สมัครเป็น ${newStatus}` : `Updated candidate status to ${newStatus}`);
      };

      const handleSaveEditedCandidateProfile = () => {
        if (!editCandData || !editCandData.fullName.trim()) return;

        setCandidatePool(prev => prev.map(c => c.candidateId === editCandData.candidateId ? { ...editCandData } : c));

        if (editCandData.assignedSlotId) {
          setRequests(prev => prev.map(r => {
            if (!r.slots) return r;
            let updated = false;
            const updatedSlots = r.slots.map(s => {
              if (s.slotId === editCandData.assignedSlotId) {
                updated = true;
                return {
                  ...s,
                  candidateName: editCandData.fullName,
                  candidateNickname: editCandData.nickname,
                  candidatePhone: editCandData.phone,
                  resumeUrl: editCandData.resumeUrl
                };
              }
              return s;
            });
            return updated ? { ...r, slots: updatedSlots, lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19) } : r;
          }));
        }

        setSelectedCandidateDetail(editCandData);
        setIsEditingCandProfile(false);
        triggerToast(lang === 'th' ? "อัปเดตข้อมูลผู้สมัครเรียบร้อยแล้ว!" : "Candidate profile updated successfully!");
      };

      const handleCopyShareLink = () => {
        const baseUrl = window.location.href.split('?')[0];
        const shareUrl = `${baseUrl}?openRequest=true`;
        
        const textArea = document.createElement("textarea");
        textArea.value = shareUrl;
        document.body.appendChild(textArea);
        textArea.select();
        try {
          document.execCommand('copy');
          triggerToast(lang === 'th' ? "คัดลอกลิงก์ฟอร์มเรียบร้อยแล้ว! 🔗" : "Form link copied to clipboard! 🔗");
        } catch (err) {
          triggerToast("Share Link: " + shareUrl);
        }
        document.body.removeChild(textArea);
      };

      const departmentStats = useMemo(() => {
        const statsMap = {};
        DEPARTMENTS.forEach(dept => {
          statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
        });

        filteredPositionSlots.forEach(s => {
          const dept = s.department;
          if (!statsMap[dept]) {
            statsMap[dept] = { total: 0, open: 0, filled: 0, cancelled: 0 };
          }
          statsMap[dept].total += 1;
          if (s.stage === "onboarded") {
            statsMap[dept].filled += 1;
          } else if (s.stage === "cancelled") {
            statsMap[dept].cancelled += 1;
          } else {
            statsMap[dept].open += 1;
          }
        });

        return Object.entries(statsMap)
          .map(([department, counts]) => ({ department, ...counts }))
          .sort((a, b) => b.total - a.total);
      }, [filteredPositionSlots]);

      const departmentModalRequests = useMemo(() => {
        if (!selectedDepartmentDetail) return [];
        return filteredPositionSlots.filter(s => s.department === selectedDepartmentDetail);
      }, [filteredPositionSlots, selectedDepartmentDetail]);

      const departmentModalStats = useMemo(() => {
        if (!selectedDepartmentDetail) return { total: 0, open: 0, filled: 0, cancelled: 0 };
        let total = 0, open = 0, filled = 0, cancelled = 0;
        departmentModalRequests.forEach(s => {
          total += 1;
          if (s.stage === "onboarded") filled += 1;
          else if (s.stage === "cancelled") cancelled += 1;
          else open += 1;
        });
        return { total, open, filled, cancelled };
      }, [departmentModalRequests, selectedDepartmentDetail]);

      const kpis = useMemo(() => {
        const totalReq = filteredPositionSlots.length;
        const openReq = filteredPositionSlots.filter(s => s.stage !== "onboarded" && s.stage !== "cancelled").length;
        const filledReq = filteredPositionSlots.filter(s => s.stage === "onboarded").length;
        const cancelledReq = filteredPositionSlots.filter(s => s.stage === "cancelled").length;
        return { totalReq, openReq, filledReq, cancelledReq };
      }, [filteredPositionSlots]);

      const activeKpiItems = useMemo(() => {
        if (!activeKpiModalType) return [];
        if (activeKpiModalType === "total") return filteredPositionSlots;
        if (activeKpiModalType === "open") return filteredPositionSlots.filter(s => s.stage !== "onboarded" && s.stage !== "cancelled");
        if (activeKpiModalType === "filled") return filteredPositionSlots.filter(s => s.stage === "onboarded");
        if (activeKpiModalType === "cancelled") return filteredPositionSlots.filter(s => s.stage === "cancelled");
        return [];
      }, [filteredPositionSlots, activeKpiModalType]);

      const activeKpiTitle = useMemo(() => {
        if (activeKpiModalType === "total") return t("totalPositions");
        if (activeKpiModalType === "open") return t("openPipeline");
        if (activeKpiModalType === "filled") return t("filled");
        if (activeKpiModalType === "cancelled") return t("cancelled");
        return "";
      }, [activeKpiModalType, lang]);

      const handleAdminLoginSubmit = (e) => {
        e.preventDefault();
        if (adminPasscode === "admin123" || adminPasscode === "hr2025") {
          setIsAdminAuthenticated(true);
          setShowLoginModal(false);
          setCurrentView("admin");
          setAdminPasscode("");
          setLoginError("");
          triggerToast(lang === 'th' ? "เข้าสู่ระบบผู้ดูแลระบบสำเร็จ" : "Authenticated as HR Admin");
        } else {
          setLoginError(lang === 'th' ? "รหัสผ่านไม่ถูกต้อง (ทดสอบ: admin123)" : "Invalid passcode. Try 'admin123'");
        }
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        const now = new Date();
        const dateStr = now.toISOString().split('T')[0];
        const timeStr = now.toTimeString().split(' ')[0];

        const newId = `REQ-${now.getFullYear()}-${String(requests.length + 1).padStart(3, '0')}`;
        const headcount = Math.max(1, Number(formInput.headcountRequired) || 1);

        const newSlots = Array.from({ length: headcount }, (_, i) => ({
          slotId: `${newId}-${i + 1}`,
          slotIndex: i + 1,
          candidateName: "",
          candidatePhone: "",
          candidateNickname: "",
          resumeUrl: "",
          stage: "received",
          cancellationReason: ""
        }));

        const newReq = {
          ...formInput,
          id: newId,
          headcountRequired: headcount,
          requestDate: dateStr,
          lastUpdated: `${dateStr} ${timeStr}`,
          approvalStatusL1: formInput.approvalStatusL1 || "Approved",
          approvalStatusL2: formInput.approvalStatusL2 || "Pending",
          docStatus: formInput.docStatus || "Pending",
          stage: "received",
          cancellationReason: "",
          slots: newSlots
        };

        setRequests([newReq, ...requests]);
        setShowRequestModal(false);
        setFormInput(initialForm);
        setFormStep(1);

        if (googleScriptUrl) {
          try {
            fetch(googleScriptUrl, {
              method: "POST",
              mode: "no-cors",
              headers: { "Content-Type": "text/plain" },
              body: JSON.stringify(newReq)
            });
            triggerToast(lang === 'th' ? "บันทึกสำเร็จ & ซิงค์ข้อมูลลง Google Sheet เรียบร้อยแล้ว!" : "Submitted & synced to Google Sheet!");
          } catch (err) {
            triggerToast(lang === 'th' ? "บันทึกสำเร็จ (ซิงค์ Google Sheet ขัดข้อง)" : "Submitted locally");
          }
        } else {
          triggerToast(lang === 'th' ? "บันทึกสำเร็จ!" : "Requisition submitted!");
        }
      };

      const handleSaveCandidateInfoForSlot = (targetSlotId) => {
        setRequests(prev => prev.map(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          let slots = r.slots && r.slots.length === headcount ? [...r.slots] : Array.from({ length: headcount }, (_, i) => ({
            slotId: `${r.id}-${i + 1}`,
            slotIndex: i + 1,
            candidateName: "",
            resumeUrl: "",
            stage: r.stage || "received",
            cancellationReason: ""
          }));

          let slotUpdated = false;
          slots = slots.map(s => {
            if (s.slotId === targetSlotId) {
              slotUpdated = true;
              return { ...s, candidateName: candidateNameInput, resumeUrl: resumeUrlInput };
            }
            return s;
          });

          if (slotUpdated) {
            return {
              ...r,
              slots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        setSelectedDetailSlot(prev => prev && prev.slotId === targetSlotId ? {
          ...prev,
          candidateName: candidateNameInput,
          resumeUrl: resumeUrlInput
        } : prev);

        setIsEditingCandidate(false);
        triggerToast(lang === 'th' ? "อัปเดตข้อมูลผู้สมัครสำหรับตำแหน่งนี้แล้ว" : "Saved candidate info for this position slot!");
      };

      const updateSlotStageDirectly = (targetSlotId, targetStage, reason = "") => {
        setRequests(prev => prev.map(r => {
          const headcount = Math.max(1, Number(r.headcountRequired) || 1);
          let slots = r.slots && r.slots.length === headcount ? [...r.slots] : Array.from({ length: headcount }, (_, i) => ({
            slotId: `${r.id}-${i + 1}`,
            slotIndex: i + 1,
            candidateName: "",
            resumeUrl: "",
            stage: r.stage || "received",
            cancellationReason: ""
          }));

          let slotUpdated = false;
          slots = slots.map(s => {
            if (s.slotId === targetSlotId) {
              slotUpdated = true;
              return { ...s, stage: targetStage, cancellationReason: reason || s.cancellationReason };
            }
            return s;
          });

          if (slotUpdated) {
            const allOnboarded = slots.every(s => s.stage === "onboarded");
            const allCancelled = slots.every(s => s.stage === "cancelled");
            const summaryStage = allOnboarded ? "onboarded" : (allCancelled ? "cancelled" : slots[0].stage);

            return {
              ...r,
              stage: summaryStage,
              slots,
              lastUpdated: new Date().toISOString().replace('T', ' ').substring(0, 19)
            };
          }
          return r;
        }));

        triggerToast(lang === 'th' ? `อัปเดตสถานะตำแหน่งเป็น ${targetStage}` : `Updated slot stage to ${targetStage}`);
      };

      const handleDragStart = (e, slotId) => {
        setDraggedSlotId(slotId);
        e.dataTransfer.setData("text/plain", slotId);
      };

      const handleDragOver = (e) => {
        e.preventDefault();
      };

      const handleDrop = (e, targetStage) => {
        e.preventDefault();
        const slotId = draggedSlotId || e.dataTransfer.getData("text/plain");
        if (!slotId) return;

        if (targetStage === "cancelled") {
          setCancelModalSlot({ slotId, targetStage });
          setCancelReasonInput("");
        } else {
          updateSlotStageDirectly(slotId, targetStage);
        }
        setDraggedSlotId(null);
      };

      const exportToCSV = () => {
        const headers = [
          "Slot ID", "Request ID", "Slot Index", "Total Slots", "Date", "Days Elapsed", "SLA Status (30 Days)",
          "Requester", "Requester Title", "Requester Email", "Department", "Job Title", "Position Type",
          "Slot Stage", "Candidate Name", "Candidate Phone", "CV / Resume Drive Link", "Approver L1", "Approver Email",
          "Forward To", "Forward Email", "Forward People", "Buddy", "Target Date", "Laptop", "Sim Card",
          "Email Account", "NetSuite ERP", "Cancel Reason", "Last Updated"
        ];

        const rows = filteredPositionSlots.map(s => {
          const sla = getSLAInfo(s.requestDate, s.stage);
          const slaLabel = sla.isCompleted ? "Closed" : (sla.isOverdue ? `Overdue (${sla.daysElapsed}d)` : `Within SLA (${sla.daysElapsed}d)`);

          return [
            s.slotId,
            s.id,
            s.slotIndex,
            s.totalSlots,
            s.requestDate,
            sla.daysElapsed,
            slaLabel,
            `"${s.requesterName || ''}"`,
            `"${s.requesterPosition || ''}"`,
            s.requesterEmail || '',
            `"${s.department || ''}"`,
            `"${s.jobTitle || ''}"`,
            `"${s.positionType || ''}"`,
            s.stage,
            `"${s.candidateName || ''}"`,
            `"${s.candidatePhone || ''}"`,
            `"${s.resumeUrl || ''}"`,
            `"${s.approverName || ''}"`,
            s.approverEmail || '',
            `"${s.forwardTo || ''}"`,
            s.forwardEmail || '',
            `"${s.forwardToPeopleDept || ''}"`,
            `"${s.buddy || ''}"`,
            s.targetDate || '',
            s.equipment?.laptop ? "Yes" : "No",
            s.equipment?.simCard ? "Yes" : "No",
            s.equipment?.email ? "Yes" : "No",
            s.equipment?.netsuite ? "Yes" : "No",
            `"${(s.cancellationReason || '').replace(/"/g, '""')}"`,
            s.lastUpdated
          ];
        });

        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `HR_Headcount_Slots_Export_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-normal mt-0.5">ระบบติดตามการสรรหาบุคลากร & อัตรากำลังคน (เป้าหมาย SLA: 30 วัน)</p>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  
                  <button
                    onClick={() => setLang(lang === "th" ? "en" : "th")}
                    title="Switch Language / เปลี่ยนภาษา"
                    className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-bold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 border border-slate-200 dark:border-slate-700 transition"
                  >
                    <Icon name="globe" className="w-4 h-4 text-brand-500" />
                    <span>{lang === "th" ? "🇬🇧 EN" : "🇹🇭 TH"}</span>
                  </button>

                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    title="Toggle Light/Dark Theme"
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {

                              </label>

                                type="button"
                                onClick={() => syncPersonnelFromGoogleSheet(true)}
                                disabled={isSyncingPersonnel}
                                className="text-[10px] font-semibold text-brand-600 dark:text-brand-400 hover:underline flex items-center gap-1"
                              >
                                <Icon name="refresh" className={`w-3 h-3 ${isSyncingPersonnel ? 'animate-spin' : ''}`} />
                                {isSyncingPersonnel ? "..." : "ซิงค์จาก Sheet"}
                              </button>
                            </div>
                            <SearchableSelect
                              value={formInput.requesterName}
                              placeholder="-- พิมพ์เพื่อค้นหาหรือเลือกผู้ขอ --"
                              options={personnelList.map(p => ({ 
                                value: p.name, 
                                label: p.name 
                              }))}
                              onChange={(selectedName) => {
                                const person = personnelList.find(p => p.name.trim().toLowerCase() === selectedName.trim().toLowerCase()) || personnelList.find(p => p.name === selectedName);
                                const matchedDept = (person && person.department && person.department.trim()) ? person.department.trim() : "-";
                                setFormInput(prev => ({
                                  ...prev,
                                  requesterName: selectedName,
                                  requesterEmail: person && person.email ? person.email : prev.requesterEmail,
                                  requesterPosition: person && person.position ? person.position : prev.requesterPosition,
                                  department: matchedDept
                                }));
                              }}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            <input
                              type="text"
                              required
                              placeholder="ตำแหน่งของผู้ขอ"
                              value={formInput.requesterPosition}
                              onChange={(e) => setFormInput({ ...formInput, requesterPosition: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"

                            <input
                              type="email"
                              required
                              placeholder="email@valuesourcing.co"
                              value={formInput.requesterEmail}
                              onChange={(e) => setFormInput({ ...formInput, requesterEmail: e.target.value })}

                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            </label>
                            <SearchableSelect
                              value={formInput.department}
                              placeholder="-- พิมพ์เพื่อค้นหาแผนกสังกัด --"
                              options={departmentOptions.map(d => ({ value: d, label: d }))}
                              onChange={(selectedDept) => setFormInput({ ...formInput, department: selectedDept })}
                            />

                        </div>

                            <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                            ผู้อนุมัติ & การส่งต่อเอกสาร
                          </h4>
                        </div>

                              value={formInput.approverName}

                                value: p.name, 
                                label: p.department && p.department !== "-" ? `${p.name} — [${p.department}]` : p.name 
                              }))}
                              onChange={(selectedName) => {
                                const person = personnelList.find(p => p.name === selectedName);
                                setFormInput(prev => ({
                                  ...prev,
                                  approverName: selectedName,
                                  approverEmail: person ? person.email : prev.approverEmail
                                }));
                              }}
                            />
                          </div>

                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            </label>
                            <input
                              type="email"
                              required
                              placeholder="approver@valuesourcing.co"
                              value={formInput.approverEmail}
                              onChange={(e) => setFormInput({ ...formInput, approverEmail: e.target.value })}

                            />

                              options={personnelList.map(p => ({ 
                                value: p.name, 
                                label: p.department && p.department !== "-" ? `${p.name} — [${p.department}]` : p.name 
                              }))}
                              onChange={(selectedName) => {
                                const person = personnelList.find(p => p.name === selectedName);
                                setFormInput(prev => ({
                                  ...prev,
                                  forwardTo: selectedName,
                                  forwardEmail: person ? person.email : prev.forwardEmail

                            <input
                              type="email"
                              placeholder="forward@valuesourcing.co"
                              value={formInput.forwardEmail}
                              onChange={(e) => setFormInput({ ...formInput, forwardEmail: e.target.value })}

                            />
                          </div>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2 border-t border-slate-200/60 dark:border-slate-700/60">

                            <input
                              type="text"
                              readOnly

                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">Email People 🔒</label>
                            <input
                              type="email"
                              readOnly
                              value={formInput.peopleEmail}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-brand-600 dark:text-brand-400 font-bold cursor-not-allowed"
                            />
                          </div>
                        </div>
                      </div>

                    </div>
                  )}

                  {formStep === 2 && (
                    <div className="space-y-4 animate-fadeIn">
                      
                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">
                        <div className="flex items-center justify-between border-b border-slate-200/60 dark:border-slate-700/60 pb-2">
                          <h4 className="font-bold text-slate-900 dark:text-white flex items-center gap-1.5 text-xs">
                            <span className="w-2 h-2 rounded-full bg-amber-500"></span>
                            รายละเอียดตำแหน่งงานที่เปิดรับ (Position Details)
                          </h4>
                        </div>

                        <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                          <div className="sm:col-span-2">
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              ชื่อตำแหน่งที่ต้องการรับ (Job Title) <span className="text-rose-500">*</span>
                            </label>
                            <input
                              type="text"
                              required
                              placeholder="e.g. Factory Housekeeper Staff"
                              value={formInput.jobTitle}
                              onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                              className="w-full px-3.5 py-2.5 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold"
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            </label>
                            <div className="flex items-center space-x-1.5">
                              <button
                                type="button"
                                onClick={() => setFormInput(prev => ({ ...prev, headcountRequired: Math.max(1, (Number(prev.headcountRequired) || 1) - 1) }))}
                                className="w-10 h-10 rounded-xl bg-slate-200 dark:bg-slate-700 hover:bg-slate-300 dark:hover:bg-slate-600 text-slate-800 dark:text-slate-100 font-extrabold text-base flex items-center justify-center transition active:scale-95 shrink-0"
                              >
                                -
                              </button>
                              <input
                                type="number"
                                min="1"
                                max="100"
                                required
                                value={formInput.headcountRequired}
                                onChange={(e) => {
                                  const val = e.target.value;
                                  setFormInput(prev => ({
                                    ...prev,
                                    headcountRequired: val === "" ? "" : Math.max(1, parseInt(val) || 1)
                                  }));
                                }}
                                onBlur={() => {
                                  if (!formInput.headcountRequired || Number(formInput.headcountRequired) < 1) {
                                    setFormInput(prev => ({ ...prev, headcountRequired: 1 }));
                                  }
                                }}
                                className="w-full text-center px-3 py-2 text-xs sm:text-sm rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 font-bold text-brand-600 dark:text-brand-400"
                              />
                              <button
                                type="button"
                                onClick={() => setFormInput(prev => ({ ...prev, headcountRequired: (Number(prev.headcountRequired) || 1) + 1 }))}

                              >
                                +
                              </button>
                            </div>
                          </div>
                        </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            </label>
                            <SearchableSelect
                              value={formInput.positionType}
                              options={[
                                { value: "Replacement", label: "ทดแทนตำแหน่งเดิม (Replacement)" },
                                { value: "New Headcount", label: "เปิดตำแหน่งใหม่ (New Headcount)" }

                              onChange={(selectedType) => setFormInput({ ...formInput, positionType: selectedType })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            </label>
                            <input
                              type="date"
                              required
                              value={formInput.targetDate}
                              onChange={(e) => setFormInput({ ...formInput, targetDate: e.target.value })}

                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">
                              Buddy (พี่เลี้ยง)
                            </label>
                            <SearchableSelect
                              value={formInput.buddy}
                              placeholder="-- เลือกหรือพิมพ์ชื่อ Buddy --"
                              options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                              onChange={(selectedBuddy) => setFormInput({ ...formInput, buddy: selectedBuddy })}
                            />
                          </div>
                        </div>

                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            rows="3"
                            required
                            placeholder="สรุปหน้าที่ความรับผิดชอบหลักของตำแหน่งงาน..."

                            onChange={(e) => setFormInput({ ...formInput, jobDescription: e.target.value })}

                          ></textarea>
                        </div>

                        <div>
                          <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                          </label>
                          <textarea
                            rows="2"
                            placeholder="ข้อมูลเพิ่มเติมเฉพาะสำหรับทีม People / HR..."

                            onChange={(e) => setFormInput({ ...formInput, detailsForPeople: e.target.value })}

                            type="text"
                            placeholder="ข้อความหรือหมายเหตุเพิ่มเติม..."
                            value={formInput.approverNote1}
                            onChange={(e) => setFormInput({ ...formInput, approverNote1: e.target.value })}
                            className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500"
                          />
                        </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สถานะอนุมัติ L1</label>
                            <SearchableSelect
                              value={formInput.approvalStatusL1}
                              options={["Approved", "Pending", "Rejected"]}
                              onChange={(val) => setFormInput({ ...formInput, approvalStatusL1: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สถานะอนุมัติ L2</label>
                            <SearchableSelect
                              value={formInput.approvalStatusL2}
                              options={["Pending", "Approved", "Rejected"]}
                              onChange={(val) => setFormInput({ ...formInput, approvalStatusL2: val })}
                            />
                          </div>

                          <div>
                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สถานะปัจจุบันของเอกสาร</label>
                            <SearchableSelect
                              value={formInput.docStatus}
                              options={["Pending", "Approved", "In Progress", "Cancelled"]}
                              onChange={(val) => setFormInput({ ...formInput, docStatus: val })}
                            />
                          </div>
                        </div>

                      </div>

                    </div>
                  )}

                      <div className="p-4 rounded-2xl bg-slate-50/80 dark:bg-slate-800/40 border border-slate-200/80 dark:border-slate-800 space-y-3">

                                { value: "Any", label: "ไม่จำกัดเพศ (Any)" },
                                { value: "Male", label: "ชาย (Male)" },
                                { value: "Female", label: "หญิง (Female)" }
                              ]}
                              onChange={(val) => setFormInput({ ...formInput, gender: val })}
                            />
                          </div>

                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">ช่วงอายุ (Age)</label>

                              placeholder="-- เลือกช่วงอายุ --"
                              options={AGE_OPTIONS.map(a => ({ value: a, label: a }))}
                              onChange={(val) => setFormInput({ ...formInput, age: val })}
                            />
                          </div>

                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">

                            <SearchableSelect
                              value={formInput.education}
                              placeholder="-- เลือกหรือพิมพ์ระดับการศึกษา --"
                              options={EDUCATION_OPTIONS.map(e => ({ value: e, label: e }))}
                              onChange={(val) => setFormInput({ ...formInput, education: val })}
                            />
                          </div>

                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">สาขาวิชา (Major)</label>

                              placeholder="e.g. วิทยาการคอมพิวเตอร์"
                              value={formInput.major}
                              onChange={(e) => setFormInput({ ...formInput, major: e.target.value })}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            />

                              value={formInput.experience}

                              onChange={(val) => setFormInput({ ...formInput, experience: val })}
                            />

                            <label className="block text-[11px] font-semibold text-slate-700 dark:text-slate-300 mb-1">คุณสมบัติที่จำเป็น / ทักษะ</label>
                            <input
                              type="text"
                              placeholder="e.g. ใบรับรองคนพิการ, React, Excel"
                              value={formInput.requiredSkills}
                              onChange={(e) => setFormInput({ ...formInput, requiredSkills: e.target.value })}
                              className="w-full px-3 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                            />
                          </div>
                        </div>
                      </div>

                            <span className="w-2 h-2 rounded-full bg-sky-500"></span>
                            อุปกรณ์ IT & สิทธิ์การใช้งานที่ต้องจัดเตรียม
                          </h4>
                        </div>

                        <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5">
                          {[
                            { key: 'laptop', label: 'Laptop / PC', desc: 'เครื่องคอมพิวเตอร์' },
                            { key: 'simCard', label: 'Sim Card', desc: 'ซิมการ์ดโทรศัพท์' },
                            { key: 'email', label: 'Email Account', desc: 'อีเมลองค์กร' },
                            { key: 'netsuite', label: 'ERP NetSuite', desc: 'สิทธิ์ระบบ ERP' }
                          ].map(item => (
                            <label
                              key={item.key}
                              className={`p-3 rounded-xl border transition cursor-pointer flex flex-col justify-between ${
                                formInput.equipment[item.key]
                                  ? "bg-brand-50/90 dark:bg-brand-950/60 border-brand-300 dark:border-brand-700 text-brand-900 dark:text-brand-200 shadow-2xs"
                                  : "bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-400 hover:border-slate-300"
                              }`}
                            >
                              <div className="flex items-center justify-between mb-1">
                                <span className="font-bold text-xs">{item.label}</span>
                                <input
                                  type="checkbox"
                                  checked={formInput.equipment[item.key]}
                                  onChange={(e) => setFormInput({
                                    ...formInput,
                                    equipment: { ...formInput.equipment, [item.key]: e.target.checked }
                                  })}
                                  className="w-4 h-4 rounded-md text-brand-600 focus:ring-brand-500 border-slate-300"
                                />
                              </div>
                              <span className="text-[10px] text-slate-400">{item.desc}</span>
                            </label>
                          ))}
                        </div>
                      </div>

                    </div>
                  )}

                </form>

                <div className="px-6 py-4 bg-slate-50/90 dark:bg-slate-800/80 border-t border-slate-200/80 dark:border-slate-800 flex items-center justify-between shrink-0">

                    <button
                      type="button"
                      onClick={() => setFormStep(formStep - 1)}
                      className="px-4 py-2.5 rounded-xl text-xs font-semibold bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 shadow-2xs transition active:scale-95 flex items-center gap-1.5"
                    >
                      <span>{t("prevStep")}</span>
                    </button>
                  ) : <div />}

                  {formStep < 3 ? (
                    <button
                      type="button"
                      onClick={() => setFormStep(formStep + 1)}
                      className="px-5 py-2.5 rounded-xl text-xs font-bold text-white bg-brand-600 hover:bg-brand-700 shadow-md shadow-brand-500/20 transition active:scale-95 flex items-center gap-1.5 ml-auto"
                    >
                      <span>{t("nextStep")}</span>
                    </button>
                  ) : (
                    <button
                      type="button"
                      onClick={handleFormSubmit}
                      className="px-6 py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-emerald-600 to-teal-500 hover:from-emerald-700 hover:to-teal-600 shadow-md shadow-emerald-500/20 transition active:scale-95 flex items-center gap-1.5 ml-auto"
                    >
                      <span>{t("submitForm")}</span>
                    </button>
                  )}
                </div>

              </div>
            </div>
          )}

          {}
          {selectedDetailSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 my-8">
                <div className="flex items-start justify-between pb-4 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-brand-100 dark:bg-brand-950 text-brand-700 dark:text-brand-300">

                      </span>
                      <span className="text-[10px] font-bold px-2 py-0.5 rounded-md bg-sky-100 dark:bg-sky-950 text-sky-700 dark:text-sky-300">

                      </span>
                    </div>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-1">
                      {selectedDetailSlot.jobTitle}
                    </h3>
                    <p className="text-xs text-slate-500">{selectedDetailSlot.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailSlot(null)} className="p-2 text-slate-400 hover:text-slate-600">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-4 max-h-[60vh] overflow-y-auto text-xs">

                    const sla = getSLAInfo(selectedDetailSlot.requestDate, selectedDetailSlot.stage);

                      <div className={`p-3 rounded-xl flex items-center justify-between text-xs font-semibold ${
                        sla.isCompleted 
                          ? "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300"
                          : sla.isOverdue
                            ? "bg-rose-50 text-rose-700 dark:bg-rose-950/60 dark:text-rose-300 border border-rose-200 dark:border-rose-900"
                            : "bg-sky-50 text-sky-700 dark:bg-sky-950/60 dark:text-sky-300 border border-sky-200 dark:border-sky-900"
                      }`}>
                        <div className="flex items-center gap-2">
                          <Icon name="clock" className="w-4 h-4" />
                          <span>Request Date: {selectedDetailSlot.requestDate} ({sla.daysElapsed} days elapsed)</span>
                        </div>
                        <div>
                          {sla.isCompleted ? (
                            <span>Closed</span>
                          ) : sla.isOverdue ? (
                            <span className="font-bold text-rose-600 dark:text-rose-400">SLA Overdue</span>
                          ) : (
                            <span>{sla.daysRemaining} days remaining (30d SLA)</span>
                          )}
                        </div>
                      </div>
                    );
                  })()}

                    <div>
                      <p className="text-[10px] text-slate-400">Slot Position</p>
                      <p className="font-bold text-brand-600">Slot #{selectedDetailSlot.slotIndex} / {selectedDetailSlot.totalSlots}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Target Date</p>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{selectedDetailSlot.targetDate}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Position Type</p>
                      <p className="font-bold text-emerald-600">{selectedDetailSlot.positionType}</p>
                    </div>
                    <div>
                      <p className="text-[10px] text-slate-400">Current Stage</p>
                      <p className="font-bold text-amber-600">{selectedDetailSlot.stage}</p>
                    </div>
                  </div>

                    <h4 className="font-bold text-slate-900 dark:text-white mb-1">Job Summary</h4>
                    <p className="p-3 rounded-xl bg-slate-50 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                      {selectedDetailSlot.jobDescription || 'ไม่มีข้อมูลลักษณะงานโดยย่อ'}
                    </p>
                  </div>

                      <div className="flex items-center justify-between">
                        <span className="text-[10px] font-bold uppercase tracking-wider text-purple-600 dark:text-purple-400 flex items-center gap-1">
                          <Icon name="shieldCheck" className="w-3.5 h-3.5" />
                          Admin Candidate Details for Slot #{selectedDetailSlot.slotIndex}
                        </span>
                        <span className="text-[10px] px-2 py-0.5 rounded bg-purple-100 dark:bg-purple-950 text-purple-700 dark:text-purple-300 font-bold">
                          Admin Mode
                        </span>
                      </div>

                      <div className="p-4 rounded-2xl bg-brand-50/50 dark:bg-brand-950/30 border border-brand-200 dark:border-brand-900 space-y-3">
                        <div className="flex items-center justify-between">
                          <h4 className="font-bold text-brand-900 dark:text-brand-200 flex items-center gap-1.5 text-xs">
                            <Icon name="users" className="w-4 h-4 text-brand-600" />
                            Candidate Info & CV Link (Slot #{selectedDetailSlot.slotIndex} of {selectedDetailSlot.totalSlots})
                          </h4>
                          <span className="text-[10px] text-purple-600 font-semibold bg-purple-100 dark:bg-purple-950 px-2 py-0.5 rounded-md">

                          </span>
                        </div>

                        <div className="text-xs space-y-2">
                          <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div>
                              <span className="text-[11px] text-slate-500">Candidate Name (Slot #{selectedDetailSlot.slotIndex}): </span>
                              <span className="font-bold text-slate-900 dark:text-white">
                                {selectedDetailSlot.candidateName || "No candidate assigned yet for this slot"}
                              </span>
                            </div>
                            {selectedDetailSlot.resumeUrl ? (
                              <a
                                href={selectedDetailSlot.resumeUrl}
                                target="_blank"
                                rel="noreferrer"
                                className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-emerald-600 text-white font-semibold text-[11px] hover:bg-emerald-700 shadow-xs transition shrink-0"
                              >
                                Open CV (Google Drive) <Icon name="externalLink" className="w-3.5 h-3.5 text-white" />
                              </a>
                            ) : (
                              <span className="text-[11px] italic text-slate-400">No CV Drive Link Attached</span>
                            )}
                          </div>
                        </div>
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                          <p className="font-bold text-slate-900 dark:text-white mb-1">Requester Info</p>
                          <p>{selectedDetailSlot.requesterName} ({selectedDetailSlot.requesterPosition})</p>
                          <p className="text-brand-600">{selectedDetailSlot.requesterEmail}</p>
                        </div>
                        <div className="p-3 rounded-xl border border-slate-200 dark:border-slate-800">
                          <p className="font-bold text-slate-900 dark:text-white mb-1">Approver Info</p>
                          <p>{selectedDetailSlot.approverName}</p>
                          <p className="text-brand-600">{selectedDetailSlot.approverEmail}</p>
                        </div>
                      </div>

                        <p><strong>Education:</strong> {selectedDetailSlot.education || '-'}</p>
                        <p><strong>Experience:</strong> {selectedDetailSlot.experience || '-'}</p>
                        <p><strong>Forward To:</strong> {selectedDetailSlot.forwardTo || '-'} ({selectedDetailSlot.forwardEmail || '-'})</p>
                        <p><strong>Forward to People:</strong> {selectedDetailSlot.forwardToPeopleDept || '-'} ({selectedDetailSlot.peopleEmail || '-'})</p>
                        <p><strong>Buddy / Mentor:</strong> {selectedDetailSlot.buddy || '-'}</p>
                        <p><strong>Last Updated:</strong> {selectedDetailSlot.lastUpdated || '-'}</p>
                      </div>
