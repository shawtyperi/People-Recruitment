    // Working Days Calculation: strictly excludes Saturdays and Sundays
    function calculateWorkingDays(startDateStr, endDateStr) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;
      
      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    // Calculate overall average from an array of blind evaluations
    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    // Robust CSV parser supporting quotes and multilingual text
    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ 
      value, 
      onChange, 
      options, 
      placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", 
      required = false, 
      disabled = false, 
      className = "",
      allowCustom = true 
    }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return options.map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      const handleInputChange = (e) => {
        const val = e.target.value;
        setSearchTerm(val);
        if (allowCustom) onChange(val);
        if (!isOpen) setIsOpen(true);
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={handleInputChange}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">
                  {allowCustom ? `ใช้ชื่อที่พิมพ์: "${searchTerm}"` : "ไม่พบข้อมูลที่พิมพ์"}
                </div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>
                ))
              )}
            </div>
          )}
        </div>
      );
    }

      // Two-Way Sync: Automated "Hiring / Offer" Status Logic
      // When a mapped candidate's assigned requisition is marked as "Closed", candidate status automatically updates to "Hiring / Offer".
      // If the position is still Recruiting (In Process), it is NOT automatically updated.
      useEffect(() => {
        let hasChanges = false;
        const updatedPool = candidatePool.map(cand => {
          if (!cand.assignedSlotId) return cand;

          // Find the linked requisition slot
          let linkedReq = null;
          let linkedSlot = null;
          for (const req of requests) {
            if (req.slots) {
              const sl = req.slots.find(s => s.slotId === cand.assignedSlotId);
              if (sl) {
                linkedReq = req;
                linkedSlot = sl;
                break;
              }
            }
          }

          if (linkedReq) {
            const isRequisitionClosed = linkedReq.requestStatus === "Closed" || linkedSlot?.stage === "onboarded";
            if (isRequisitionClosed && cand.status !== "Hiring / Offer") {
              hasChanges = true;
              return { ...cand, status: "Hiring / Offer" };
            }
          }
          return cand;
        });

        if (hasChanges) {
          setCandidatePool(updatedPool);
          localStorage.setItem("hr_candidate_pool_v46", JSON.stringify(updatedPool));
        }
      }, [requests]);

      const syncPersonnelFromGoogleSheet = async (showToast = false) => {
        try {
          const res = await fetch(GOOGLE_SHEET_DIRECTORY_CSV_URL);
          if (!res.ok) throw new Error("Network error");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const header = rows[0].map(h => (h || '').toLowerCase().trim().replace(/\uFEFF/g, ''));
            let nameIdx = header.findIndex(h => (h.includes('ชื่อ') || h.includes('name')) && !h.includes('เล่น'));
            let deptIdx = header.findIndex(h => h.includes('ฝ่ายงาน') || h.includes('ฝ่าย') || h.includes('แผนก') || h.includes('department'));
            let posIdx = header.findIndex(h => h.includes('ตำแหน่ง') || h.includes('position'));
            let emailIdx = header.findIndex(h => h.includes('email') || h.includes('อีเมล'));

            if (nameIdx === -1) nameIdx = 0;

            const loaded = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length <= 1) continue;
              const nameVal = (r[nameIdx] || r[0])?.trim();
              if (!nameVal || nameVal.includes("ชื่อ")) continue;

              loaded.push({
                name: nameVal,
                email: (emailIdx !== -1 ? r[emailIdx] : r.find(c => c && c.includes("@")))?.trim() || "",
                position: (posIdx !== -1 ? r[posIdx] : r[1])?.trim() || "Staff",
                department: (deptIdx !== -1 && r[deptIdx]) ? r[deptIdx].trim() : "-"
              });
            }

            if (loaded.length > 0) {
              setPersonnelList(loaded);
              localStorage.setItem("hr_personnel_list_v46", JSON.stringify(loaded));
              if (showToast) triggerToast(`ซิงค์รายชื่อบุคลากรสำเร็จ (${loaded.length} คน)`);
            }
          }
        } catch (err) {
          if (showToast) triggerToast("ใช้ออฟไลน์ข้อมูลแคชเดิม");
        }
      };

      const syncCandidatesFromGoogleSheet = async (showToast = false) => {
        try {
          const res = await fetch(GOOGLE_SHEET_CANDIDATES_CSV_URL);
          if (!res.ok) throw new Error("Network error");
          const csvText = await res.text();
          const rows = parseCSVText(csvText);

          if (rows.length > 1) {
            const header = rows[0].map(h => (h || '').toLowerCase().trim());
            let noIdx = header.findIndex(h => h.includes('no') || h.includes('ลำดับ'));
            let yearIdx = header.findIndex(h => h.includes('year') || h.includes('ปี'));
            let monthIdx = header.findIndex(h => h.includes('month') || h.includes('เดือน'));
            let nameIdx = header.findIndex(h => (h.includes('ชื่อ') || h.includes('name')) && !h.includes('เล่น'));
            let nickIdx = header.findIndex(h => h.includes('เล่น') || h.includes('nick'));
            let phoneIdx = header.findIndex(h => h.includes('เบอร์') || h.includes('phone') || h.includes('tel'));
            let posIdx = header.findIndex(h => h.includes('ตำแหน่ง') || h.includes('position'));
            let levelIdx = header.findIndex(h => h.includes('level') || h.includes('ระดับ'));
            let branchIdx = header.findIndex(h => h.includes('branch') || h.includes('สาขา'));
            let typeIdx = header.findIndex(h => h.includes('type') || h.includes('ประเภท'));
            let mbtiIdx = header.findIndex(h => h.includes('mbti'));
            let prescreenIdx = header.findIndex(h => h.includes('prescreen'));
            let resumeConfirmIdx = header.findIndex(h => h.includes('confirm'));
            let interviewDateIdx = header.findIndex(h => h.includes('interview') || h.includes('สัมภาษณ์'));
            let hireDateIdx = header.findIndex(h => h.includes('hire') || h.includes('เริ่มงาน'));
            let statusIdx = header.findIndex(h => h.includes('status') || h.includes('สถานะ'));
            let channelIdx = header.findIndex(h => h.includes('channel') || h.includes('source') || h.includes('ช่องทาง'));
            let remarkIdx = header.findIndex(h => h.includes('remark') || h.includes('หมายเหตุ'));

            const loaded = [];
            for (let i = 1; i < rows.length; i++) {
              const r = rows[i];
              if (!r || r.length < 2) continue;

              const fullName = (nameIdx !== -1 && r[nameIdx]) ? r[nameIdx].trim() : (r[3] || '').trim();
              if (!fullName || fullName.includes("ชื่อ")) continue;

              const rawStatus = (statusIdx !== -1 && r[statusIdx]) ? r[statusIdx].trim() : "Pending";
              const matchedStatus = CANDIDATE_STATUS_CONFIG.find(c => c.id.toLowerCase() === rawStatus.toLowerCase())?.id || "Pending";

        return filteredPositionSlots.filter(s => (s.requestStatus || "Recruiting") === "Recruiting");
      }, [filteredPositionSlots]);

      const closedSlots = useMemo(() => {
        return filteredPositionSlots.filter(s => s.requestStatus === "Closed");
      }, [filteredPositionSlots]);

      const exportToCSV = () => {
        const headers = [
          "Slot ID", "Request ID", "Date", "Status", "Job Title", "Position Type", "Replaced Name",
          "Department", "Stage", "Working Days Elapsed", "SLA Status (30 Working Days)",
          "Candidate", "Interview Schedule", "Evaluations Count", "Combined Score (1-5)", "Score %", "Evaluation Result"
        ];
        const rows = filteredPositionSlots.map(s => {
          const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
          return [
            s.slotId, s.id, s.requestDate, s.requestStatus, `"${s.jobTitle}"`, s.positionType,
            `"${s.replacedEmployeeName || ''}"`, `"${s.department}"`, s.stage,
            sla.offerLeadTimeWorkingDays !== null ? sla.offerLeadTimeWorkingDays : sla.workingDaysElapsed,
            sla.isCompleted ? "Closed" : (sla.isOverdue ? "Overdue" : "Within SLA"),
            `"${s.candidateName || ''}"`, `"${s.interviewSchedule || ''}"`,
            s.evaluationsCount || 0,
            s.interviewScore || "", s.interviewScorePercent ? `${s.interviewScorePercent}%` : "", s.interviewResult || ""
          ];
        });
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Manpower_Recruitment_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          {/* Header Bar */}
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                    <p className="text-xs sm:text-sm text-slate-500 dark:text-slate-400 font-normal mt-0.5">
                      ระบบติดตามการสรรหา & SLA Lead Time (เป้าหมาย 30 วันทำการ - Exclude Weekends)
                    </p>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {
                        if (isAdminAuthenticated) setCurrentView("admin");
                        else setShowLoginModal(true);
                      }}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Admin Portal</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <button
                        onClick={() => setCurrentView("public")}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition"
                      >
                        <Icon name="grid" className="w-3.5 h-3.5" />
                        <span>Public View</span>
                      </button>
                      <button
                        onClick={() => {
                          setIsAdminAuthenticated(false);
                          setCurrentView("public");
                          triggerToast("ออกจากระบบผู้ดูแลระบบแล้ว");
                        }}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 transition"
                      >
                        <span className="hidden sm:inline">Logout</span>
                      </button>
                    </div>
                  )}

                  <button
                    onClick={() => setShowRequestModal(true)}
                    className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition"
                  >
                    <Icon name="plus" className="w-4 h-4 text-white" />
                    <span>+ ขอกำลังคน</span>
                  </button>

                  <button
                    onClick={handleCopyShareLink}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                    title="คัดลอกลิงก์"
                  >
                    <Icon name="link" className="w-4 h-4" />
                  </button>
                </div>

              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            {/* KPI Cards Row */}
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">อัตราตำแหน่งทั้งหมด</p>
                  <p className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{kpis.totalReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">กำลังดำเนินการ (Working Days)</p>
                  <p className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{kpis.openReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">รับเข้าทำงานแล้ว</p>
                  <p className="text-xl sm:text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{kpis.filledReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ยกเลิก / ชะลอ</p>
                  <p className="text-xl sm:text-2xl font-bold text-rose-600 dark:text-rose-400 mt-1">{kpis.cancelledReq}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-rose-50 dark:bg-rose-950 text-rose-600 flex items-center justify-center">
                  <Icon name="x" className="w-5 h-5 text-rose-600" />
                </div>
              </div>
            </div>

            {currentView === "public" && (
              <div className="space-y-8">
                {/* 5-Stage Tracker with Public Assessment Access & Blind Averaged Score */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="grid" className="w-5 h-5 text-amber-600" />
                        Recruitment Stage Tracker
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                        ติดตามสถานะการสรรหาแยกตาม 5 ขั้นตอนหลัก (SLA 30 วันทำการ ไม่รวมเสาร์-อาทิตย์) &bull; กรรมการสามารถกดร่วมประเมินสัมภาษณ์ได้ทันที
                      </p>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        placeholder="ค้นหาตำแหน่ง, รหัส, ฝ่ายงาน, ผู้สมัคร..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = filteredPositionSlots.filter(s => s.stage === stage.id);
                      return (
                        <div key={stage.id} className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border border-slate-200/60 dark:border-slate-800">
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{stage.label}</span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px]">
                            {stageItems.map(item => {
                              const sla = getSLAInfo(item.requestDate, item.stage, item.offerSentDate);
                              const hasEvaluation = item.evaluationsCount > 0;
                              const isPassingScore = item.interviewScorePercent >= 70;

                              return (
                                <div key={item.slotId} className="p-3.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 shadow-xs hover:border-brand-500 transition group">
                                  <div className="flex items-center justify-between text-[10px] mb-1.5">
                                    <span className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded-md">
                                      Slot #{item.slotIndex}/{item.totalSlots}
                                    </span>
                                    <span className="text-slate-400 text-[10px]">{item.requestDate}</span>
                                  </div>
                                  <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                    {item.jobTitle}
                                  </h4>
                                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 truncate">
                                    {item.department}
                                  </p>

                                  {item.candidateName && (
                                    <div className="mt-2 p-1.5 rounded-lg bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/60 text-[11px] text-emerald-800 dark:text-emerald-300 font-semibold truncate">
                                      👤 {item.candidateName}
                                    </div>
                                  )}

                                  {/* Public View Score Display: Summary Average and Pass/Fail Only */}
                                  {hasEvaluation ? (
                                    <div className="mt-2 p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 text-[10px] flex items-center justify-between">
                                      <span className="font-bold text-slate-700 dark:text-slate-200">
                                        ⭐ คะแนนเฉลี่ย: {item.interviewScore}/5 ({item.interviewScorePercent}%)
                                      </span>
                                      <span className={`px-1.5 py-0.5 rounded font-extrabold text-[9px] ${
                                        isPassingScore ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300" : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300"
                                      }`}>
                                        {isPassingScore ? "ผ่าน (Pass)" : "ไม่ผ่าน"}
                                      </span>
                                    </div>
                                  ) : null}

                                  {/* Working Days SLA Lead Time */}
                                  <div className="mt-2 text-[10px] font-semibold">
                                    {item.stage === "offer" ? (
                                      <span className="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300">
                                        ⏱️ สรรหาเสร็จใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                      </span>
                                    ) : sla.isCompleted ? (
                                      <span className="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                        ⏱️ ปิดตำแหน่งใน: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : sla.isOverdue ? (
                                      <span className="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 animate-pulse">
                                        ⚠️ เกิน SLA: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : (
                                      <span className="px-2 py-0.5 rounded-md bg-sky-50 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">
                                        ⏱️ {sla.workingDaysElapsed} วันทำการ (เหลือ {sla.workingDaysRemaining} วัน)
                                      </span>
                                    )}
                                  </div>

                                  {/* Public Blind Evaluation Button for Interview Stage */}
                                  {(item.candidateName || item.stage === "interview") && (
                                    <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                                      <button
                                        onClick={() => handleOpenBlindEvaluationModal(item)}
                                        className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-600 hover:text-brand-700 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/60 px-2 py-1 rounded-lg border border-brand-200 dark:border-brand-800/80 transition"
                                      >
                                        <Icon name="clipboardCheck" className="w-3 h-3 text-brand-600" />
                                        <span>+ ร่วมประเมินสัมภาษณ์</span>
                                      </button>
                                      <span className="text-[10px] text-slate-400">
                                        {item.evaluationsCount > 0 ? `(${item.evaluationsCount} ท่านประเมินแล้ว)` : "รอประเมิน"}
                                      </span>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                {/* Headcount Demand by Department */}
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="chart" className="w-5 h-5 text-brand-600" />
                        Headcount Demand by Department
                      </h2>
                      <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">สรุปภาพรวมจำนวนอัตรากำลังคนที่เปิดรับสมัครจำแนกตามฝ่ายงาน</p>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[420px] overflow-y-auto pr-1">
                    {departmentStats.map((item, idx) => {
                      const maxTotal = departmentStats[0]?.total || 1;
                      const percent = Math.min(100, Math.round((item.total / maxTotal) * 100));

                      return (
                        <div key={item.department} onClick={() => setSelectedDepartmentDetail(item.department)} className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 hover:bg-white dark:hover:bg-slate-800 transition cursor-pointer flex flex-col justify-between group">
                          <div className="flex items-start justify-between gap-2 mb-2">
                            <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 transition">
                              <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                              {item.department}
                            </span>
                            <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                              <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                              <span className="text-amber-600">Open: {item.open}</span>
                              <span className="text-emerald-600">Filled: {item.filled}</span>
                            </div>
                          </div>
                          <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                            <div className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full transition-all duration-500" style={{ width: `${item.total > 0 ? percent : 0}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {currentView === "admin" && (
              <div className="space-y-6">
                
                {/* Admin Sub-Tabs Navigation */}
                <div className="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                  <button
                    onClick={() => setAdminSubTab("kanban")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                      adminSubTab === "kanban"
                        ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                        : "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    1. Kanban Pipeline
                  </button>

                  <button
                    onClick={() => setAdminSubTab("candidates")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                      adminSubTab === "candidates"
                        ? "bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md"
                        : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <Icon name="userSearch" className="w-3.5 h-3.5" />
                    <span>2. Candidate Pool & Manpower Request</span>
                  </button>
                </div>

                {/* SubTab 1: Interactive Kanban Pipeline */}
                {adminSubTab === "kanban" ? (
                  <div className="space-y-8">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="grid" className="w-5 h-5 text-brand-600" />
                            Interactive Kanban Pipeline (Drag & Drop)
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                            ลากการ์ดเปลี่ยนด่านการสรรหา - ใน Interview Stage จะแสดงข้อมูลนัดหมายและให้ร่วมประเมินสัมภาษณ์ได้ทันที
                          </p>
                        </div>

                        <div className="relative w-full sm:w-72">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-4 h-4" />
                          </div>
                          <input
                            type="text"
                            placeholder="ค้นหาตำแหน่ง, รหัส, ฝ่ายงาน, ผู้สมัคร..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      {/* Kanban Columns */}
                      <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                        {STAGES.map(stage => {
                          const stageItems = filteredPositionSlots.filter(s => s.stage === stage.id);
                          return (
                            <div 
                              key={stage.id} 
                              onDragOver={handleDragOver}
                              onDrop={(e) => handleDrop(e, stage.id)}
                              className="w-72 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border-2 border-dashed border-slate-200 dark:border-slate-800 transition hover:border-brand-400"
                            >
                              <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                                <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{stage.label}</span>
                                <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                                  {stageItems.length}
                                </span>
                              </div>

                              <div className="space-y-3 flex-1 overflow-y-auto max-h-[540px] pr-0.5">
                                {stageItems.map(item => {
                                  const sla = getSLAInfo(item.requestDate, item.stage, item.offerSentDate);
                                  const hasEvaluation = item.evaluationsCount > 0;
                                  const isPassingScore = item.interviewScorePercent >= 70;

                                  return (
                                    <div
                                      key={item.slotId}
                                      draggable
                                      onDragStart={(e) => handleDragStart(e, item.slotId)}
                                      className="p-3.5 rounded-xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 shadow-sm hover:shadow-md hover:border-brand-500 transition cursor-grab active:cursor-grabbing group"
                                    >
                                      <div className="flex items-center justify-between text-[10px] mb-1.5">
                                        <span className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded-md">
                                          Slot #{item.slotIndex}/{item.totalSlots}
                                        </span>
                                        <span className="text-slate-400 text-[10px]">{item.requestDate}</span>
                                      </div>

                                      <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                        {item.jobTitle}
                                      </h4>

                                      <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-0.5 truncate">
                                        {item.department}
                                      </p>

                                      {/* Candidate Display on Card with Live Interview Appointment */}
                                      {item.candidateName ? (
                                        <div className="mt-2 p-2 rounded-lg bg-emerald-50/80 dark:bg-emerald-950/40 border border-emerald-100 dark:border-emerald-900/60 text-xs">
                                          <div className="font-bold text-emerald-800 dark:text-emerald-300 flex items-center justify-between">
                                            <span className="truncate">👤 {item.candidateName}</span>
                                            <button 
                                              onClick={(e) => { e.stopPropagation(); setUnassignConfirmTarget(item); }}
                                              className="text-[10px] text-rose-500 hover:text-rose-700 underline font-semibold ml-1 shrink-0"
                                            >
                                              ถอด
                                            </button>
                                          </div>

                                          {/* Interview Stage Card Details */}
                                          {item.stage === "interview" && (
                                            <div className="mt-1.5 pt-1.5 border-t border-emerald-200/60 dark:border-emerald-800/60 text-[11px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1.5">
                                              <Icon name="calendar" className="w-3.5 h-3.5 text-amber-600 shrink-0" />
                                              <span className="truncate">
                                                นัดสัมภาษณ์: {item.interviewSchedule || "รอระบุเวลานัดหมาย"}
                                              </span>
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <div className="mt-2 flex items-center justify-between">
                                          <span className="text-[10px] font-medium text-slate-400 italic bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md">
                                            👤 Unassigned
                                          </span>
                                          <button
                                            onClick={() => setAdminSubTab("candidates")}
                                            className="text-[10px] font-bold text-brand-600 hover:text-brand-700 bg-brand-50 dark:bg-brand-950/60 px-2 py-0.5 rounded-md"
                                          >
                                            + เลือกคน
                                          </button>
                                        </div>
                                      )}

                                      {/* Evaluation Score Status */}
                                      {hasEvaluation && (
                                        <div className="mt-2 p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-[10px] flex items-center justify-between">
                                          <span className="font-bold text-slate-700 dark:text-slate-200">
                                            เฉลี่ย: {item.interviewScore}/5 ({item.interviewScorePercent}%)
                                          </span>
                                          <span className={`px-1.5 py-0.5 rounded font-extrabold text-[9px] ${
                                            isPassingScore ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-300" : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-300"
                                          }`}>
                                            {isPassingScore ? "ผ่าน (Pass)" : "ไม่ผ่าน"}
                                          </span>
                                        </div>
                                      )}

                                      {/* Working Days SLA Lead Time */}
                                      <div className="mt-2 text-[10px] font-semibold">
                                        {item.stage === "offer" ? (
                                          <span className="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300 inline-block">
                                            🎯 สรรหาได้ใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                          </span>
                                        ) : sla.isCompleted ? (
                                          <span className="text-slate-400">⏱️ ปิดงานใน: {sla.workingDaysElapsed} วันทำการ</span>
                                        ) : sla.isOverdue ? (
                                          <span className="text-rose-600 font-bold">⚠️ เกิน SLA: {sla.workingDaysElapsed} วันทำการ</span>
                                        ) : (
                                          <span className="text-sky-600">⏱️ {sla.workingDaysElapsed} วันทำการ (เหลือ {sla.workingDaysRemaining} วัน)</span>
                                        )}
                                      </div>

                                      {/* Evaluate button & Details */}
                                      <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between text-[10px]">
                                        {(item.candidateName || item.stage === "interview") ? (
                                          <button 
                                            onClick={() => handleOpenBlindEvaluationModal(item)}
                                            className="font-bold text-brand-600 hover:underline flex items-center gap-1"
                                          >
                                            <Icon name="clipboardCheck" className="w-3 h-3" />
                                            <span>+ ประเมินสัมภาษณ์</span>
                                          </button>
                                        ) : <span></span>}

                                        <button onClick={() => setSelectedDetailSlot(item)} className="text-slate-500 font-semibold hover:underline">
                                          รายละเอียด &rarr;
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-6">
                    
                    {/* Top Half: Manpower Request with Tab Split (In Process vs Closed) */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="shieldCheck" className="w-5 h-5 text-emerald-600" />
                            Manpower Request
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400">
                            ตารางสรุปคำขอกำลังคน แยกสถานะ In Process (กำลังสรรหา) และ Closed (ปิดแล้ว) พร้อมระบบ Audit ตรวจสอบผลประเมินสัมภาษณ์ทุกราย
                          </p>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={exportToCSV}
                            className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md flex items-center gap-1.5 transition"
                          >
                            <Icon name="download" className="w-3.5 h-3.5 text-white" />
                            <span>Export CSV</span>
                          </button>
                        </div>
                      </div>

                      {/* Tab Split: In Process vs Closed */}
                      <div className="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
                        <button
                          onClick={() => setManpowerTableTab("in_process")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "in_process"
                              ? "bg-amber-500 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>⏳ In Process (กำลังสรรหา)</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{inProcessSlots.length}</span>
                        </button>

                        <button
                          onClick={() => setManpowerTableTab("closed")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "closed"
                              ? "bg-emerald-600 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>✅ Closed (ปิดการสรรหาแล้ว)</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{closedSlots.length}</span>
                        </button>
                      </div>

                      {/* Manpower Request Data Table */}
                      <div className="overflow-x-auto max-h-[380px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-500 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5">Slot / Req</th>
                              <th className="px-3 py-2.5">Status คำขอ</th>
                              <th className="px-3 py-2.5">ตำแหน่ง & ประเภท</th>
                              <th className="px-3 py-2.5">ฝ่ายงาน</th>
                              <th className="px-3 py-2.5">Recruitment Stage</th>
                              <th className="px-3 py-2.5">Lead Time (วันทำการ)</th>
                              <th className="px-3 py-2.5">ผู้สมัคร & นัดสัมภาษณ์</th>
                              <th className="px-3 py-2.5">ผลประเมินสัมภาษณ์ (Audit)</th>
                              <th className="px-3 py-2.5 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {(manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).length === 0 ? (
                              <tr>
                                <td colSpan="9" className="text-center py-6 text-slate-400 italic">
                                  ไม่มีรายการในหมวดนี้
                                </td>
                              </tr>
                            ) : (
                              (manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).map(s => {
                                const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                                const hasEvaluation = s.evaluationsCount > 0;
                                const isPassingScore = s.interviewScorePercent >= 70;

                                return (
                                  <tr key={s.slotId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40">
                                    <td className="px-3 py-2.5 font-semibold text-slate-900 dark:text-white">
                                      <span className="text-brand-600 font-bold">{s.slotId}</span>
                                      <div className="text-[10px] text-slate-400">{s.requestDate}</div>
                                    </td>

                                    {/* Requisition Status Dropdown with Auto-Move */}
                                    <td className="px-3 py-2.5">
                                      <select
                                        value={s.requestStatus || "Recruiting"}
                                        onChange={(e) => handleUpdateRequisitionStatus(s.id, e.target.value)}
                                        className={`text-[11px] font-bold px-2 py-1 rounded-lg border ${
                                          s.requestStatus === "Closed"
                                            ? "bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                            : "bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-800"
                                        }`}
                                      >
                                        {REQUISITION_STATUSES.map(st => (
                                          <option key={st.id} value={st.id}>{st.label}</option>
                                        ))}
                                      </select>
                                    </td>

                                    {/* Position & Replacement Info */}
                                    <td className="px-3 py-2.5 font-bold text-slate-900 dark:text-white">
                                      <div>{s.jobTitle}</div>
                                      <div className="text-[10px] font-normal text-slate-400">
                                        {s.positionType}
                                        {s.positionType === "Replacement" && s.replacedEmployeeName && (
                                          <span className="text-amber-600 ml-1 font-semibold">(แทน: {s.replacedEmployeeName})</span>
                                        )}
                                      </div>
                                    </td>

                                    <td className="px-3 py-2.5">{s.department}</td>

                                    {/* Recruitment Stage */}
                                    <td className="px-3 py-2.5">
                                      <select
                                        value={s.stage}
                                        onChange={(e) => updateSlotStageDirectly(s.slotId, e.target.value)}
                                        className="text-[11px] p-1 rounded-lg bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold"
                                      >
                                        {STAGES.map(stg => (
                                          <option key={stg.id} value={stg.id}>{stg.label}</option>
                                        ))}
                                      </select>
                                    </td>

                                    {/* Working Days SLA */}
                                    <td className="px-3 py-2.5">
                                      {s.stage === "offer" ? (
                                        <span className="px-2 py-1 rounded-lg bg-purple-100 text-purple-900 dark:bg-purple-950 dark:text-purple-200 font-bold text-[11px]">
                                          🎯 สรรหาได้ใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                        </span>
                                      ) : (
                                        <span className="text-slate-500 text-[11px]">
                                          ⏱️ {sla.workingDaysElapsed} วันทำการ ({sla.isCompleted ? "Closed" : `เหลือ ${sla.workingDaysRemaining} วัน`})
                                        </span>
                                      )}
                                    </td>

                                    {/* Candidate & Interview Schedule */}
                                    <td className="px-3 py-2.5">
                                      {s.candidateName ? (
                                        <div className="flex items-center gap-2">
                                          <div>
                                            <span className="font-semibold text-slate-900 dark:text-white">{s.candidateName}</span>
                                            {s.candidateNickname && <span className="text-[10px] text-slate-400 ml-1">({s.candidateNickname})</span>}
                                            {s.interviewSchedule && (
                                              <div className="text-[10px] text-amber-700 dark:text-amber-300 font-medium">
                                                📅 {s.interviewSchedule}
                                              </div>
                                            )}
                                          </div>
                                          <button
                                            onClick={() => setUnassignConfirmTarget(s)}
                                            className="p-1 rounded-md text-rose-500 hover:bg-rose-50 dark:hover:bg-rose-950/50 text-[10px] font-bold"
                                            title="Unassign Candidate"
                                          >
                                            ✕ ถอด
                                          </button>
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 text-[11px] italic">ว่าง (Unassigned)</span>
                                      )}
                                    </td>

                                    {/* Evaluation Summary & Admin Audit Breakdown */}
                                    <td className="px-3 py-2.5">
                                      {s.candidateName || s.stage === "interview" ? (
                                        <div className="flex items-center gap-2">
                                          <button
                                            onClick={() => handleOpenBlindEvaluationModal(s)}
                                            className="px-2.5 py-1 rounded-lg bg-brand-50 hover:bg-brand-100 dark:bg-brand-950 dark:hover:bg-brand-900 text-brand-700 dark:text-brand-300 font-bold text-[11px] flex items-center gap-1 transition"
                                          >
                                            <Icon name="clipboardCheck" className="w-3.5 h-3.5 text-brand-600" />
                                            <span>+ ประเมินเพิ่ม</span>
                                          </button>

                                          {hasEvaluation ? (
                                            <button
                                              onClick={() => setAdminAuditSlot(s)}
                                              className={`px-2.5 py-1 rounded-md text-[10px] font-extrabold flex items-center gap-1 border transition hover:opacity-90 ${
                                                isPassingScore
                                                  ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300 dark:border-emerald-800"
                                                  : "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border border-rose-300 dark:border-rose-800"
                                              }`}
                                              title="คลิกเพื่อดู Audit Breakdown คะแนนและกรรมการทุกคน"
                                            >
                                              <span>⭐ {s.interviewScore}/5 ({s.interviewScorePercent}%) - {s.evaluationsCount} ท่าน ({isPassingScore ? "ผ่าน" : "ตก"})</span>
                                              <span className="underline ml-0.5">Audit 🔍</span>
                                            </button>
                                          ) : (
                                            <span className="text-[10px] text-slate-400 italic">รอผลประเมิน</span>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 text-[10px] italic">-</span>
                                      )}
                                    </td>

                                    <td className="px-3 py-2.5 text-center">
                                      <button
                                        onClick={() => setSelectedDetailSlot(s)}
                                        className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:bg-brand-50 hover:text-brand-600 text-slate-600 transition"
                                        title="ดูรายละเอียดคำขอ"
                                      >
                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    {/* Bottom Half: Candidate Pool Directory with Two-Way Sheet Sync and Hide Mapping Rules */}
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                            Candidate Pool Directory (18 คอลัมน์ A-R &amp; Sheet GID 2139534023)
                          </h2>
                          <p className="text-xs text-slate-500 dark:text-slate-400 mt-0.5">
                            ข้อมูลผู้สมัครงานทั้งหมด ซิงค์สองทางกับ Google Sheet &bull; ซ่อนปุ่มแมปสำหรับ not suitable, cancel และ Hiring / Offer
                          </p>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={() => setShowAddCandidateModal(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-brand-500/20 transition active:scale-95"
                          >
                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                            <span>+ เพิ่มผู้สมัครใหม่</span>
                          </button>

                          <button
                            onClick={() => syncCandidatesFromGoogleSheet(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200 transition"
                          >
                            <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                            <span>ซิงค์จาก Sheet</span>
                          </button>

                          <a
                            href={CANDIDATE_SHEET_EDIT_URL}
                            target="_blank"
                            rel="noreferrer"
                            className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200 transition"
                            title="เปิด Google Sheet ผู้สมัคร"
                          >
                            <Icon name="link" className="w-3.5 h-3.5" />
                            <span>เปิด Sheet</span>
                          </a>
                        </div>
                      </div>

                      {/* Filter Controls: Position Filter + Status Filters */}
                      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-2 text-xs">
                          {/* Position Filter Dropdown */}
                          <div className="flex items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">ตำแหน่ง:</span>
                            <select
                              value={candidatePositionFilter}
                              onChange={(e) => setCandidatePositionFilter(e.target.value)}
                              className="px-2.5 py-1 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold max-w-[200px] truncate"
                            >
                              <option value="ALL">ทุกตำแหน่ง (All Positions)</option>
                              {candidatePositionOptions.map(pos => (
                                <option key={pos} value={pos}>{pos}</option>
                              ))}
                            </select>
                          </div>

                          {/* Status Filter */}
                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">สถานะ:</span>
                            <button
                              onClick={() => setSelectedStatusFilter("ALL")}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold transition ${
                                selectedStatusFilter === "ALL"
                                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-xs"
                                  : "bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                              }`}
                            >
                              All ({candidatePool.length})
                            </button>
                            {CANDIDATE_STATUS_CONFIG.map(st => {
                              const count = candidatePool.filter(c => c.status === st.id).length;
                              return (
                                <button
                                  key={st.id}
                                  onClick={() => setSelectedStatusFilter(st.id)}
                                  className={`px-2 py-1 rounded-xl text-xs font-bold transition border ${st.bg} ${st.text} ${st.border} ${
                                    selectedStatusFilter === st.id ? "ring-2 ring-slate-800 dark:ring-slate-200 shadow-xs" : "opacity-80 hover:opacity-100"
                                  }`}
                                >
                                  <span>{st.label}</span>
                                  <span className="ml-1 px-1.5 py-0.2 rounded-full bg-black/10 text-[10px]">{count}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        {/* Mapping Filter */}
                        <div className="flex items-center gap-1 text-xs">
                          <span className="text-[11px] font-bold text-slate-400 uppercase">การแมป:</span>
                          <button
                            onClick={() => setSelectedMappingFilter("ALL")}
                            className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${selectedMappingFilter === "ALL" ? "bg-brand-600 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"}`}
                          >
                            ทั้งหมด
                          </button>
                          <button
                            onClick={() => setSelectedMappingFilter("ASSIGNED")}
                            className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${selectedMappingFilter === "ASSIGNED" ? "bg-emerald-600 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"}`}
                          >
                            📌 แมปแล้ว
                          </button>
                          <button
                            onClick={() => setSelectedMappingFilter("AVAILABLE")}
                            className={`px-2.5 py-1 rounded-lg text-xs font-semibold ${selectedMappingFilter === "AVAILABLE" ? "bg-amber-600 text-white" : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"}`}
                          >
                            ✨ ว่างอยู่
                          </button>
                        </div>
                      </div>

                      {/* Full 18 Columns Table (A to R) with Strict Hide-Mapping Rules for not suitable, cancel & Hiring / Offer */}
                      <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5 font-bold">2-Way Assignment</th>
                              <th className="px-3 py-2.5 font-bold">A: No.</th>
                              <th className="px-3 py-2.5 font-bold">B: Year</th>
                              <th className="px-3 py-2.5 font-bold">C: Month</th>
                              <th className="px-3 py-2.5 font-bold">D: Name (ชื่อ-นามสกุล)</th>
                              <th className="px-3 py-2.5 font-bold">E: Nick (ชื่อเล่น)</th>
                              <th className="px-3 py-2.5 font-bold">F: Phone</th>
                              <th className="px-3 py-2.5 font-bold">G: Position (ตำแหน่ง)</th>
                              <th className="px-3 py-2.5 font-bold">H: Level</th>
                              <th className="px-3 py-2.5 font-bold">I: Branch</th>
                              <th className="px-3 py-2.5 font-bold">J: Type</th>
                              <th className="px-3 py-2.5 font-bold">K: MBTI</th>
                              <th className="px-3 py-2.5 font-bold">L: Prescreen date</th>
                              <th className="px-3 py-2.5 font-bold">M: Resume Confirmation</th>
                              <th className="px-3 py-2.5 font-bold">N: Interview Date &amp; Time</th>
                              <th className="px-3 py-2.5 font-bold">O: Hire date</th>
                              <th className="px-3 py-2.5 font-bold">P: Status</th>
                              <th className="px-3 py-2.5 font-bold">Q: Recruit Channel</th>
                              <th className="px-3 py-2.5 font-bold">R: Remark (หมายเหตุ)</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {filteredCandidates.map((cand, idx) => {
                              const statusCfg = CANDIDATE_STATUS_CONFIG.find(c => c.id === cand.status) || CANDIDATE_STATUS_CONFIG[3];
                              // Rule: Hide mapping for not suitable, cancel by candidate AND Hiring / Offer
                              const shouldHideMapping = statusCfg.hideMapping || cand.status === "not suitable" || cand.status === "cancel by candidate" || cand.status === "Hiring / Offer";

                              return (
                                <tr key={cand.candidateId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40">
                                  
                                  {/* Compact 2-Way Mapping Button / Unassign / Hidden when Inactive or Hiring / Offer */}
                                  <td className="px-3 py-2">
                                    {cand.assignedSlotId ? (
                                      <div className="flex items-center gap-1.5">
                                        <span className="px-2 py-0.5 rounded-md bg-emerald-100 dark:bg-emerald-950 text-emerald-800 dark:text-emerald-200 font-extrabold text-[10px] border border-emerald-300">
                                          ✓ Selected ({cand.assignedSlotId})
                                        </span>
                                        <button
                                          onClick={() => handleUnassignCandidate(cand.assignedSlotId, cand.fullName)}
                                          className="text-[10px] text-rose-600 hover:text-rose-800 underline font-semibold"
                                          title="Unassign"
                                        >
                                          ถอด
                                        </button>
                                      </div>
                                    ) : shouldHideMapping ? (
                                      <span className={`text-[10px] font-bold px-2 py-0.5 rounded-md italic ${
                                        cand.status === "Hiring / Offer" 
                                          ? "text-emerald-700 dark:text-emerald-300 bg-emerald-50 dark:bg-emerald-950/40" 
                                          : "text-rose-600/90 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40"
