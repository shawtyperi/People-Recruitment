    const EVALUATION_CRITERIA = [

    const EVALUATOR_ROLES = [

      "Technical Specialist (ผู้เชี่ยวชาญเฉพาะทาง)",
      "HR Interviewer (ฝ่ายทรัพยากรบุคคล)",

    function calculateWorkingDays(startDateStr, endDateStr = null) {
      if (!startDateStr) return 0;
      const start = new Date(startDateStr);
      const end = endDateStr ? new Date(endDateStr) : new Date();
      if (isNaN(start.getTime()) || isNaN(end.getTime())) return 0;

      start.setHours(0, 0, 0, 0);
      end.setHours(0, 0, 0, 0);
      if (start > end) return 0;

      let count = 0;
      let cur = new Date(start);
      while (cur < end) {
        cur.setDate(cur.getDate() + 1);
        const day = cur.getDay();
        if (day !== 0 && day !== 6) {
          count++;
        }
      }
      return count;
    }

    const STANDARD_SLA_WORKING_DAYS = 30;

    const getSLAInfo = (requestDate, stage, offerSentDate = null) => {
      const workingDaysElapsed = calculateWorkingDays(requestDate, null);
      const workingDaysRemaining = STANDARD_SLA_WORKING_DAYS - workingDaysElapsed;
      const isCompleted = stage === "onboarded" || stage === "cancelled";
      const isOverdue = !isCompleted && workingDaysElapsed > STANDARD_SLA_WORKING_DAYS;

      let offerLeadTimeWorkingDays = null;
      if (offerSentDate) {
        offerLeadTimeWorkingDays = calculateWorkingDays(requestDate, offerSentDate);
      } else if (stage === "offer") {
        offerLeadTimeWorkingDays = workingDaysElapsed;
      }

      return { workingDaysElapsed, workingDaysRemaining, isOverdue, isCompleted, offerLeadTimeWorkingDays };
    };

    const getPositionPriorityInfo = (slot) => {
      const explicit = slot.priority;
      const sla = getSLAInfo(slot.requestDate, slot.stage, slot.offerSentDate);

      if (explicit === "URGENT" || sla.isOverdue || (!sla.isCompleted && sla.workingDaysRemaining <= 5)) {
        return {
          id: "URGENT",
          label: "ด่วนมาก",
          badge: "bg-rose-50 text-rose-700 border-rose-300 dark:bg-rose-950/80 dark:text-rose-300 dark:border-rose-800",
          dotBg: "bg-rose-500",
          ping: true,
          icon: "🔥"
        };
      }
      if (explicit === "HIGH" || (!sla.isCompleted && sla.workingDaysRemaining <= 12)) {
        return {
          id: "HIGH",
          label: "ด่วน",
          badge: "bg-amber-50 text-amber-700 border-amber-300 dark:bg-amber-950/80 dark:text-amber-300 dark:border-amber-800",
          dotBg: "bg-amber-500",
          ping: true,
          icon: "⚡"
        };
      }
      return {
        id: "NORMAL",
        label: "ปกติ",
        badge: "bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-800 dark:text-slate-300 dark:border-slate-700",
        dotBg: "bg-emerald-500",
        ping: false,
        icon: "🟢"
      };
    };

    const getRecruitmentDurationInfo = (requestDate, hireDate, lastUpdated) => {
      if (!requestDate) return { rangeText: "-", totalDays: 0, workingDays: 0, closeDateStr: "-" };
      const closeDateStr = (hireDate && hireDate.trim())
        ? hireDate
        : (lastUpdated ? lastUpdated.split(' ')[0] : new Date().toISOString().split('T')[0]);

      const start = new Date(requestDate);
      const end = new Date(closeDateStr);
      let totalDays = 0;
      if (!isNaN(start.getTime()) && !isNaN(end.getTime())) {
        const diffTime = Math.max(0, end.getTime() - start.getTime());
        totalDays = Math.round(diffTime / (1000 * 60 * 60 * 24));
      }
      const workingDays = calculateWorkingDays(requestDate, closeDateStr);
      const rangeText = `${requestDate} ถึง ${closeDateStr}`;
      return { rangeText, totalDays, workingDays, closeDateStr };
    };

    // คำนวณสถานะกำหนดการสัมภาษณ์เทียบกับวันปัจจุบัน (วันนี้, พรุ่งนี้, อีก 2-3 วันข้างหน้า)
    const getInterviewRelativeTimeInfo = (scheduleStr) => {
      if (!scheduleStr) return null;
      const match = String(scheduleStr).match(/(\d{4})-(\d{2})-(\d{2})/);
      if (!match) return null;
      const [_, y, m, d] = match;
      const interviewDate = new Date(parseInt(y, 10), parseInt(m, 10) - 1, parseInt(d, 10));
      interviewDate.setHours(0, 0, 0, 0);
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      const diffTime = interviewDate.getTime() - today.getTime();
      const diffDays = Math.round(diffTime / (1000 * 60 * 60 * 24));

      if (diffDays < 0) {
        const absDays = Math.abs(diffDays);
        return {
          text: absDays === 1 ? "ผ่านมาเมื่อวาน" : `ผ่านมา ${absDays} วันแล้ว`,
          badge: "bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-400 border-slate-300 dark:border-slate-700",
          dotBg: "bg-slate-400",
          ping: false
        };
      } else if (diffDays === 0) {
        return {
          text: "⚡ วันนี้ (Today)",
          badge: "bg-rose-100 text-rose-800 dark:bg-rose-950 dark:text-rose-200 border-rose-300 dark:border-rose-700 font-extrabold ring-1 ring-rose-500/30",
          dotBg: "bg-rose-500",
          ping: true
        };
      } else if (diffDays === 1) {
        return {
          text: "🔔 พรุ่งนี้ (Tomorrow)",
          badge: "bg-amber-100 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300 dark:border-amber-700 font-bold",
          dotBg: "bg-amber-500",
          ping: true
        };
      } else if (diffDays === 2) {
        return {
          text: "🗓️ อีก 2 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays === 3) {
        return {
          text: "🗓️ อีก 3 วันข้างหน้า",
          badge: "bg-sky-100 text-sky-800 dark:bg-sky-950 dark:text-sky-200 border-sky-300 dark:border-sky-700 font-bold",
          dotBg: "bg-sky-500",
          ping: false
        };
      } else if (diffDays <= 7) {
        return {
          text: `🗓️ อีก ${diffDays} วันข้างหน้า`,
          badge: "bg-blue-50 text-blue-700 dark:bg-blue-950/80 dark:text-blue-300 border-blue-200 dark:border-blue-800 font-semibold",
          dotBg: "bg-blue-500",
          ping: false
        };
      } else {
        return {
          text: `🗓️ อีก ${diffDays} วัน`,
          badge: "bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-300 border-slate-200 dark:border-slate-700 font-medium",
          dotBg: "bg-slate-400",
          ping: false
        };
      }
    };

    const calculateOverallScore = (evaluations = []) => {
      if (!evaluations || evaluations.length === 0) {
        return { count: 0, combinedAvg: 0, combinedPct: 0, result: "" };
      }
      const sumAvg = evaluations.reduce((acc, ev) => acc + (Number(ev.avg) || 0), 0);
      const combinedAvg = parseFloat((sumAvg / evaluations.length).toFixed(1));
      const combinedPct = Math.round((combinedAvg / 5) * 100);
      const isPass = combinedPct >= 70;
      return {
        count: evaluations.length,
        combinedAvg,
        combinedPct,
        result: isPass ? "Pass" : "Fail"
      };
    };

    function parseCSVText(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let current = '';

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const next = text[i + 1];

        if (char === '"') {
          if (inQuotes && next === '"') {
            current += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(current.trim());
          current = '';
        } else if ((char === '\r' || char === '\n') && !inQuotes) {
          if (char === '\r' && next === '\n') i++;
          row.push(current.trim());
          if (row.some(c => c !== '')) lines.push(row);
          row = [];
          current = '';
        } else {
          current += char;
        }
      }
      if (current || row.length > 0) {
        row.push(current.trim());
        if (row.some(c => c !== '')) lines.push(row);
      }
      return lines;
    }

    function SearchableSelect({ value, onChange, options, placeholder = "-- เลือกหรือพิมพ์เพื่อค้นหา --", required = false, disabled = false, className = "" }) {
      const [isOpen, setIsOpen] = useState(false);
      const [searchTerm, setSearchTerm] = useState("");
      const dropdownRef = useRef(null);

      useEffect(() => {
        setSearchTerm(value || "");
      }, [value]);

      const normalizedOptions = useMemo(() => {
        return (options || []).map(opt => typeof opt === 'object' ? opt : { value: opt, label: opt });
      }, [options]);

      const selectedOption = normalizedOptions.find(o => String(o.value) === String(value));

      useEffect(() => {
        const handleClickOutside = (e) => {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        };
        document.addEventListener("mousedown", handleClickOutside);
        document.addEventListener("touchstart", handleClickOutside);
        return () => {
          document.removeEventListener("mousedown", handleClickOutside);
          document.removeEventListener("touchstart", handleClickOutside);
        };
      }, []);

      const filteredOptions = useMemo(() => {
        if (!searchTerm.trim()) return normalizedOptions;
        const term = searchTerm.toLowerCase();
        return normalizedOptions.filter(o => 
          String(o.label).toLowerCase().includes(term) || String(o.value).toLowerCase().includes(term)
        );
      }, [normalizedOptions, searchTerm]);

      const handleSelect = (optVal) => {
        onChange(optVal);
        setIsOpen(false);
        setSearchTerm("");
      };

      return (
        <div ref={dropdownRef} className={`relative ${className}`}>
          <div className="relative">
            <input
              type="text"
              disabled={disabled}
              required={required && !value}
              placeholder={placeholder}
              value={isOpen ? searchTerm : (selectedOption ? selectedOption.label : value || "")}
              onFocus={() => {
                if (!disabled) {
                  setIsOpen(true);
                  setSearchTerm("");
                }
              }}
              onChange={(e) => {
                if (!disabled) {
                  setSearchTerm(e.target.value);
                  if (!isOpen) setIsOpen(true);
                }
              }}
              className="w-full px-3.5 py-2 text-xs rounded-xl bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500/20 focus:border-brand-500 transition shadow-2xs font-semibold pr-8 cursor-pointer text-slate-800 dark:text-slate-100 placeholder-slate-400"
            />
            <div 
              onClick={() => !disabled && setIsOpen(!isOpen)}
              className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 cursor-pointer pointer-events-auto"
            >
              <svg className={`w-3.5 h-3.5 transition-transform duration-200 ${isOpen ? 'rotate-180' : ''}`} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                <path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" />
              </svg>
            </div>
          </div>

          {isOpen && !disabled && (
            <div className="absolute z-50 w-full mt-1.5 max-h-52 overflow-y-auto bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl shadow-xl py-1 text-xs">
              {filteredOptions.length === 0 ? (
                <div className="px-3.5 py-2 text-slate-400 italic text-[11px]">ไม่พบข้อมูลที่พิมพ์</div>
              ) : (
                filteredOptions.map((opt, idx) => (
                  <div
                    key={`${opt.value}-${idx}`}
                    onClick={() => handleSelect(opt.value)}
                    className={`px-3.5 py-2 hover:bg-brand-50 dark:hover:bg-brand-950/70 hover:text-brand-600 dark:hover:text-brand-300 cursor-pointer transition flex items-center justify-between ${
                      String(value) === String(opt.value) ? 'bg-brand-50/90 dark:bg-brand-900/50 text-brand-600 dark:text-brand-400 font-bold' : 'text-slate-700 dark:text-slate-200'
                    }`}
                  >
                    <span className="truncate">{opt.label}</span>
                    {String(value) === String(opt.value) && <span className="text-brand-600 dark:text-brand-400 text-xs shrink-0 ml-2">✓</span>}
                  </div>

            cache: "no-store",
            headers: { "Pragma": "no-cache", "Cache-Control": "no-cache" }
          });
          const resJson = await res.json();

          if (resJson && resJson.status === "success" && resJson.data) {
            const serverStatuses = resJson.data;

            setRequests(prevRequests => {
              return prevRequests.map(r => {
                const mainId = r.id;
                const cleanId = String(mainId).replace(/-\d+$/, "");

                  }));

                    ...r,
                    requestStatus: newStatus === "READY_FOR_RECRUITMENT" ? "Recruiting" : newStatus,

                    isItNotified: isItConfirmed ? true : r.isItNotified,
                    stage: newStatus === "READY_FOR_RECRUITMENT" && r.stage === "received" ? "manpower" : r.stage,

                  };

          const monthStr = String(reqDate.getMonth() + 1).padStart(2, '0');
          const yearStr = String(reqDate.getFullYear());

          const matchesMonth = selectedMonthFilter === "ALL" || monthStr === selectedMonthFilter;
          const matchesYear = selectedYearFilter === "ALL" || yearStr === selectedYearFilter;

          if (matchesMonth && matchesYear) {
            statsMap[dept].total += 1;
            if (s.stage === "onboarded") {
              statsMap[dept].filled += 1;

              statsMap[dept].cancelled += 1;
            } else {
              statsMap[dept].open += 1;
            }
          }
        });

          .map(([department, counts]) => ({ department, ...counts }))

      const sortedAdminRequisitions = useMemo(() => {

          "Closed": 5

          const statusMatch = reqQueueFilter === "ALL" || (r.requestStatus || r.workflowStatus || "PENDING_ADMIN") === reqQueueFilter;
          const query = reqQueueSearch.toLowerCase().trim();
          const queryMatch = !query ||
            r.id?.toLowerCase().includes(query) ||
            r.jobTitle?.toLowerCase().includes(query) ||
            r.requesterName?.toLowerCase().includes(query) ||
            r.department?.toLowerCase().includes(query);
          return statusMatch && queryMatch;
        });

        return filtered.sort((a, b) => {
          const statusA = a.requestStatus || a.workflowStatus || "PENDING_ADMIN";
          const statusB = b.requestStatus || b.workflowStatus || "PENDING_ADMIN";
          const weightA = priorityWeight[statusA] || 99;
          const weightB = priorityWeight[statusB] || 99;

            duration.totalDays,
            `"${s.candidateName || ''}"`, `"${s.interviewSchedule || ''}"`,
            s.evaluationsCount || 0,
            s.interviewScore || "", s.interviewScorePercent ? `${s.interviewScorePercent}%` : "", s.interviewResult || "",
            `"${s.hireDate || ''}"`, `"${s.onboardingArrivalStatus || ''}"`, `"${s.rejectionReason || ''}"`
          ];
        });
        const csvContent = "\uFEFF" + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
        const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `Manpower_Report_${new Date().toISOString().split('T')[0]}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 transition-colors duration-300">
          
          <header className="sticky top-0 z-30 border-b border-slate-200 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 glass-effect">
            <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
              <div className="flex items-center justify-between h-16 sm:h-20">
                
                <div className="flex items-center space-x-3">
                  <div className="w-11 h-11 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-400 flex items-center justify-center text-white shadow-md shadow-sky-400/30 shrink-0">
                    <Icon name="users" className="w-5 h-5 text-white" />
                  </div>
                  <div>
                    <h1 className="text-lg sm:text-xl font-extrabold text-slate-900 dark:text-white flex items-center gap-2.5 tracking-tight">
                      <span>HR Recruitment Dashboard</span>
                      <span className="text-xs px-3 py-1 rounded-full bg-sky-100 dark:bg-sky-950/80 text-sky-700 dark:text-sky-300 font-semibold tracking-normal">
                        {currentView === "admin" ? "Admin Portal" : "Public View"}
                      </span>
                    </h1>
                  </div>
                </div>

                <div className="flex items-center space-x-2 sm:space-x-3">
                  <button 
                    onClick={() => setDarkMode(!darkMode)}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                  >
                    <Icon name={darkMode ? "sun" : "moon"} className="w-4 h-4" />
                  </button>

                  {currentView === "public" ? (
                    <button
                      onClick={() => {
                        if (isAdminAuthenticated) setCurrentView("admin");
                        else setShowLoginModal(true);
                      }}
                      className="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 border border-slate-200 dark:border-slate-700 transition"
                    >
                      <Icon name="lock" className="w-3.5 h-3.5 text-slate-500" />
                      <span>Admin Portal</span>
                    </button>
                  ) : (
                    <div className="flex items-center gap-2">
                      <div className="hidden sm:flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-brand-50 dark:bg-brand-950/60 border border-brand-200 dark:border-brand-800 text-[11px] font-semibold text-brand-700 dark:text-brand-300">
                        <span className="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span className="truncate max-w-[180px]">{adminEmail}</span>
                      </div>
                      <button
                        onClick={() => setCurrentView("public")}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-slate-700 dark:text-slate-200 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 transition"
                      >
                        <Icon name="grid" className="w-3.5 h-3.5" />
                        <span>Public View</span>
                      </button>
                      <button
                        onClick={() => {
                          setIsAdminAuthenticated(false);
                          setAdminEmail("");
                          localStorage.removeItem("hr_admin_email");
                          setCurrentView("public");
                          triggerToast("ออกจากระบบ Admin เรียบร้อย");
                        }}
                        className="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold text-rose-600 bg-rose-50 dark:bg-rose-950/40 hover:bg-rose-100 transition"
                      >
                        <span>Logout</span>
                      </button>
                    </div>
                  )}

                  <button
                    onClick={() => setShowRequestModal(true)}
                    className="inline-flex items-center gap-1.5 px-4 py-2 sm:px-4 sm:py-2.5 rounded-xl text-xs font-bold text-white bg-gradient-to-r from-brand-600 to-sky-500 hover:from-brand-700 hover:to-sky-600 shadow-md shadow-brand-500/20 transition"
                  >
                    <Icon name="plus" className="w-4 h-4 text-white" />
                    <span>+ ขอกำลังคน</span>
                  </button>

                  <button
                    onClick={handleCopyShareLink}
                    className="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 border border-slate-200 dark:border-slate-800 transition"
                    title="คัดลอกลิงก์"
                  >
                    <Icon name="link" className="w-4 h-4" />
                  </button>
                </div>

              </div>
            </div>
          </header>

          <main className="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
            
            <div className="grid grid-cols-2 sm:grid-cols-4 gap-4">
              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">อัตราทั้งหมด</p>
                  <p className="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mt-1">{allPositionSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-brand-50 dark:bg-brand-950 text-brand-600 flex items-center justify-center">
                  <Icon name="users" className="w-5 h-5 text-brand-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">กำลังดำเนินการ</p>
                  <p className="text-xl sm:text-2xl font-bold text-amber-600 dark:text-amber-400 mt-1">{inProcessSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-amber-50 dark:bg-amber-950 text-amber-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-amber-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ปิดการสรรหาแล้ว</p>
                  <p className="text-xl sm:text-2xl font-bold text-emerald-600 dark:text-emerald-400 mt-1">{closedSlots.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-emerald-50 dark:bg-emerald-950 text-emerald-600 flex items-center justify-center">
                  <Icon name="checkCircle" className="w-5 h-5 text-emerald-600" />
                </div>
              </div>

              <div className="p-4 rounded-2xl bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs flex items-center justify-between">
                <div>
                  <p className="text-[11px] text-slate-400 font-medium uppercase tracking-wider">ผู้สมัครในคลัง</p>
                  <p className="text-xl sm:text-2xl font-bold text-sky-600 dark:text-sky-400 mt-1">{candidatePool.length}</p>
                </div>
                <div className="w-10 h-10 rounded-xl bg-sky-50 dark:bg-sky-950 text-sky-600 flex items-center justify-center">
                  <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                </div>
              </div>
            </div>

            {currentView === "public" && (
              <div className="space-y-8">
                
                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="grid" className="w-5 h-5 text-amber-600" />
                        Recruitment Stage Tracker
                      </h2>
                    </div>

                    <div className="relative w-full sm:w-72">
                      <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                        <Icon name="search" className="w-4 h-4" />
                      </div>
                      <input
                        type="text"
                        placeholder="ค้นหาตำแหน่ง, รหัส, ฝ่ายงาน, ผู้สมัคร..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-brand-500"
                      />
                    </div>
                  </div>

                  <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                    {STAGES.map(stage => {
                      const stageItems = allPositionSlots.filter(s => {
                        const matchesQuery = !searchQuery.trim() || 
                          s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                          s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                        return s.stage === stage.id && !s.isArchivedFromKanban && matchesQuery;
                      });

                      return (
                        <div key={stage.id} className="w-64 shrink-0 snap-start flex flex-col rounded-2xl bg-slate-50 dark:bg-slate-800/40 p-3 border border-slate-200/60 dark:border-slate-800">
                          <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                            <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{stage.label}</span>
                            <span className="text-[11px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                              {stageItems.length}
                            </span>
                          </div>

                          <div className="space-y-3 flex-1 overflow-y-auto max-h-[500px]">
                            {stageItems.map(item => {
                              const sla = getSLAInfo(item.requestDate, item.stage, item.offerSentDate);
                              const priorityInfo = getPositionPriorityInfo(item);
                              const isArrived = item.stage === "onboarded" && (item.hasAttendedFirstDayTraining || item.onboardingArrivalStatus === "arrived_reported");
                              const isPendingArrival = item.stage === "onboarded" && !isArrived;

                              return (
                                <div 
                                  key={item.slotId} 
                                  className={`p-3.5 rounded-xl border shadow-xs transition group ${
                                    isArrived
                                      ? "bg-emerald-50/90 dark:bg-emerald-950/50 border-emerald-400 dark:border-emerald-600 ring-2 ring-emerald-500/25 shadow-emerald-500/10"
                                      : isPendingArrival
                                      ? "bg-amber-50/70 dark:bg-amber-950/30 border-amber-300 dark:border-amber-700 ring-1 ring-amber-400/30"
                                      : "bg-white dark:bg-slate-800 border-slate-200/80 dark:border-slate-700 hover:border-brand-500"
                                  }`}
                                >
                                  <div className="flex items-center justify-between text-[10px] mb-2 pb-1.5 border-b border-slate-100 dark:border-slate-700/60">
                                    <div className="flex items-center gap-1.5">
                                      <span className="relative flex h-2.5 w-2.5">
                                        {priorityInfo.ping && (
                                          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${priorityInfo.dotBg} opacity-75`}></span>
                                        )}
                                        <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${priorityInfo.dotBg}`}></span>
                                      </span>
                                      <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded border ${priorityInfo.badge}`}>
                                        {priorityInfo.icon} {priorityInfo.label}
                                      </span>
                                    </div>
                                    <span className="text-brand-600 dark:text-brand-400 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded-md">
                                      Slot #{item.slotIndex}/{item.totalSlots}
                                    </span>
                                  </div>

                                  <div className="flex items-center justify-between text-[10px] mb-1">
                                    <span className="font-mono text-slate-400">{item.slotId}</span>
                                    <span className="text-slate-400 text-[10px]">{item.requestDate}</span>
                                  </div>
                                  <h4 className="text-xs font-bold text-slate-900 dark:text-white group-hover:text-brand-600 transition line-clamp-2">
                                    {item.jobTitle}
                                  </h4>
                                  <p className="text-[11px] text-slate-500 dark:text-slate-400 mt-1 truncate">
                                    {item.department}
                                  </p>

                                  {item.stage === "received" && (
                                    <div className="mt-2">
                                      <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-amber-100 text-amber-800 dark:bg-amber-950/80 dark:text-amber-300 border border-amber-300 dark:border-amber-700">
                                        <span className="w-1.5 h-1.5 rounded-full bg-amber-500 animate-ping"></span>
                                        ⏳ รอ Admin ตรวจสอบ
                                      </span>
                                    </div>
                                  )}

                                  {item.stage === "manpower" && (
                                    <div className="mt-2">
                                      <span className="inline-flex items-center gap-1 text-[10px] font-extrabold px-2 py-0.5 rounded-md bg-emerald-100 text-emerald-800 dark:bg-emerald-950/80 dark:text-emerald-300 border border-emerald-400 font-bold ring-1 ring-emerald-500/20">
                                        ✅ พร้อมสรรหา
                                      </span>
                                    </div>
                                  )}

                                  {item.candidateName && (
                                    <div className={`mt-2 p-1.5 rounded-lg border text-[11px] font-semibold truncate ${
                                      isArrived 
                                        ? "bg-emerald-100 dark:bg-emerald-900/60 border-emerald-300 dark:border-emerald-700 text-emerald-900 dark:text-emerald-100" 
                                        : "bg-emerald-50 dark:bg-emerald-950/40 border-emerald-100 dark:border-emerald-900/60 text-emerald-800 dark:text-emerald-300"
                                    }`}>
                                      👤 {item.candidateName}
                                    </div>
                                  )}

                                  {item.stage === "interview" && item.interviewSchedule && (() => {
                                    const relTime = getInterviewRelativeTimeInfo(item.interviewSchedule);
                                    return (
                                      <div className="mt-1.5 space-y-1">
                                        <div className="text-[10px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1">
                                          <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                          <span className="truncate">นัดหมาย: {item.interviewSchedule}</span>
                                        </div>
                                        {relTime && (
                                          <div className="flex items-center gap-1.5">
                                            <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>
                                              {relTime.ping && (
                                                <span className="relative flex h-2 w-2">
                                                  <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                                  <span className={`relative inline-flex rounded-full h-2 w-2 ${relTime.dotBg}`}></span>
                                                </span>
                                              )}
                                              <span>{relTime.text}</span>
                                            </span>
                                          </div>
                                        )}
                                      </div>
                                    );
                                  })()}

                                  {item.stage === "onboarded" && (
                                    <div className="mt-1.5 space-y-1">
                                      {item.hireDate && (
                                        <div className="text-[10px] text-slate-600 dark:text-slate-300 font-semibold flex items-center gap-1">
                                          <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                          <span>วันเริ่มงาน: {item.hireDate}</span>
                                        </div>
                                      )}
                                      <div className={`p-1.5 rounded-lg text-[10px] font-extrabold flex items-center justify-between border ${
                                        isArrived
                                          ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/60 dark:text-emerald-100 border-emerald-300 dark:border-emerald-700 shadow-2xs"
                                          : "bg-amber-100 text-amber-800 dark:bg-amber-900/60 dark:text-amber-200 border-amber-300 dark:border-amber-700 animate-pulse"
                                      }`}>
                                        <span>{isArrived ? "✅ มาเริ่มงานเรียบร้อยแล้ว" : "⏳ รอถึงวันเริ่มงาน (ยังไม่มา)"}</span>
                                      </div>
                                    </div>
                                  )}

                                  {item.rejectionReason && (
                                    <div className="mt-1.5 p-1.5 rounded-lg bg-rose-50 dark:bg-rose-950/50 border border-rose-200 dark:border-rose-900 text-[10px] text-rose-700 dark:text-rose-300 font-medium">
                                      ❌ เหตุผล: {item.rejectionReason}
                                    </div>
                                  )}

                                  <div className="mt-2 text-[10px] font-semibold">
                                    {item.stage === "offer" ? (
                                      <span className="px-2 py-0.5 rounded-md bg-purple-100 text-purple-800 dark:bg-purple-950/80 dark:text-purple-300">
                                        ⏱️ สรรหาเสร็จใน: {sla.offerLeadTimeWorkingDays} วันทำการ
                                      </span>
                                    ) : sla.isCompleted ? (
                                      <span className="px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 dark:bg-slate-800 dark:text-slate-300">
                                        ⏱️ ปิดตำแหน่งใน: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : sla.isOverdue ? (
                                      <span className="px-2 py-0.5 rounded-md bg-rose-100 text-rose-700 dark:bg-rose-950/80 dark:text-rose-300 animate-pulse">
                                        ⚠️ เกิน SLA: {sla.workingDaysElapsed} วันทำการ
                                      </span>
                                    ) : (
                                      <span className="px-2 py-0.5 rounded-md bg-sky-50 text-sky-700 dark:bg-sky-950/80 dark:text-sky-300">
                                        ⏱️ {sla.workingDaysElapsed} วันทำการ (เหลือ {sla.workingDaysRemaining} วัน)
                                      </span>
                                    )}
                                  </div>

                                  {item.stage === "interview" && (
                                    <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between">
                                      <button
                                        onClick={() => handleOpenBlindEvaluationModal(item)}
                                        className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-600 hover:text-brand-700 dark:text-brand-400 bg-brand-50 dark:bg-brand-950/60 px-2 py-1 rounded-lg border border-brand-200 dark:border-brand-800/80 transition"
                                      >
                                        <Icon name="clipboardCheck" className="w-3 h-3 text-brand-600" />
                                        <span>+ ร่วมประเมินสัมภาษณ์</span>
                                      </button>
                                      <span className="text-[10px] text-slate-400">
                                        {item.evaluationsCount > 0 ? `(${item.evaluationsCount} ท่านประเมินแล้ว)` : "รอประเมิน"}
                                      </span>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>

                <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                    <div>
                      <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                        <Icon name="building" className="w-5 h-5 text-brand-600" />
                        Headcount Demand by Department
                      </h2>
                    </div>

                    <div className="flex items-center gap-2 text-xs">
                      <select
                        value={selectedMonthFilter}
                        onChange={(e) => setSelectedMonthFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Months</option>
                        <option value="08">August</option>
                        <option value="09">September</option>
                        <option value="10">October</option>
                      </select>
                      <select
                        value={selectedYearFilter}
                        onChange={(e) => setSelectedYearFilter(e.target.value)}
                        className="px-3 py-1.5 rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                      >
                        <option value="ALL">All Years</option>
                        <option value="2026">2026</option>
                        <option value="2025">2025</option>
                      </select>
                    </div>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 gap-3 max-h-[440px] overflow-y-auto pr-1">
                    {departmentStats.map((item, idx) => (
                      <div 
                        key={item.department} 
                        onClick={() => setSelectedDepartmentDetail(item.department)}
                        className="p-3.5 rounded-2xl bg-slate-50/70 dark:bg-slate-800/40 border border-slate-200/60 dark:border-slate-800 hover:border-brand-400 dark:hover:border-brand-500 hover:bg-white dark:hover:bg-slate-800 hover:shadow-md transition cursor-pointer flex flex-col justify-between group"
                      >
                        <div className="flex items-start justify-between gap-2 mb-2">
                          <span className="text-xs font-bold text-slate-800 dark:text-slate-200 line-clamp-1 group-hover:text-brand-600 transition">
                            <span className="text-brand-500 font-semibold mr-1.5">#{idx + 1}</span>
                            {item.department}
                          </span>
                          <div className="flex items-center gap-1.5 text-[11px] font-bold shrink-0">
                            <span className="text-slate-700 dark:text-slate-300">Total: {item.total}</span>
                            <span className="text-amber-600">Open: {item.open}</span>
                            <span className="text-emerald-600">Filled: {item.filled}</span>
                          </div>
                        </div>
                        <div className="w-full h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                          <div 
                            className="h-full bg-gradient-to-r from-brand-500 to-sky-400 rounded-full"
                            style={{ width: `${item.total > 0 ? (item.total / (departmentStats[0]?.total || 1)) * 100 : 0}%` }}
                          ></div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {currentView === "admin" && (
              <div className="space-y-6">
                
                <div className="flex flex-wrap items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-3">
                  <button
                    onClick={() => setAdminSubTab("requisitions")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-2 ${
                      adminSubTab === "requisitions"
                        ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                        : "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <Icon name="clipboardCheck" className="w-4 h-4" />
                    <span>Requisition Queue</span>
                    {pendingAdminCount > 0 && (
                      <span className="px-1.5 py-0.5 rounded-full text-[10px] font-extrabold bg-rose-500 text-white animate-pulse">
                        {pendingAdminCount}
                      </span>
                    )}
                  </button>

                  <button
                    onClick={() => setAdminSubTab("kanban")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                      adminSubTab === "kanban"
                        ? "bg-brand-600 text-white shadow-md shadow-brand-500/20"
                        : "bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    Kanban Pipeline
                  </button>

                  <button
                    onClick={() => setAdminSubTab("candidates")}
                    className={`px-4 py-2 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                      adminSubTab === "candidates"
                        ? "bg-slate-900 dark:bg-white text-white dark:text-slate-900 shadow-md"
                        : "bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-300 border border-slate-200 dark:border-slate-700 hover:bg-slate-100"
                    }`}
                  >
                    <Icon name="userSearch" className="w-3.5 h-3.5" />
                    <span>Candidate Pool & Requests</span>
                  </button>
                </div>

                {adminSubTab === "requisitions" && (
                  <div className="space-y-6">
                    <div className="grid grid-cols-1 sm:grid-cols-3 gap-3.5">
                      <div 
                        onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "PENDING_ADMIN"
                            ? "bg-amber-50/80 dark:bg-amber-950/30 border-amber-300 ring-2 ring-amber-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-medium text-slate-500">รอแอดมินตรวจ</span>
                          <span className="w-2 h-2 rounded-full bg-amber-500 animate-pulse"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length}
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "READY_FOR_RECRUITMENT"
                            ? "bg-emerald-50/80 dark:bg-emerald-950/30 border-emerald-300 ring-2 ring-emerald-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-medium text-slate-500">พร้อมเริ่มสรรหา</span>
                          <span className="w-2 h-2 rounded-full bg-emerald-500"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length}
                        </div>
                      </div>

                      <div 
                        onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                        className={`p-4 rounded-2xl border transition-all cursor-pointer ${
                          reqQueueFilter === "REJECTED_BY_ADMIN"
                            ? "bg-rose-50/80 dark:bg-rose-950/30 border-rose-300 ring-2 ring-rose-500/10 shadow-sm"
                            : "bg-white dark:bg-[#0F172A] border-slate-200/70 dark:border-slate-800 hover:border-slate-300"
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className="text-xs font-medium text-slate-500">ตีกลับ / ปฏิเสธ</span>
                          <span className="w-2 h-2 rounded-full bg-rose-400"></span>
                        </div>
                        <div className="text-2xl font-bold text-slate-900 dark:text-white mt-1.5">
                          {requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length}
                        </div>
                      </div>
                    </div>

                    <div className="bg-white dark:bg-[#0F172A] rounded-2xl border border-slate-200/70 dark:border-slate-800 p-3 sm:p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                      <div className="flex flex-wrap items-center gap-1.5 text-xs">
                        <button
                          onClick={() => setReqQueueFilter("ALL")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition ${
                            reqQueueFilter === "ALL"
                              ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300"
                          }`}
                        >
                          All ({requests.length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("PENDING_ADMIN")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition border ${
                            reqQueueFilter === "PENDING_ADMIN"
                              ? "bg-amber-50 text-amber-900 border-amber-300 dark:bg-amber-950/50 dark:text-amber-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700"
                          }`}
                        >
                          Pending ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "PENDING_ADMIN").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("READY_FOR_RECRUITMENT")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition border ${
                            reqQueueFilter === "READY_FOR_RECRUITMENT"
                              ? "bg-emerald-50 text-emerald-900 border-emerald-300 dark:bg-emerald-950/50 dark:text-emerald-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700"
                          }`}
                        >
                          Ready ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "READY_FOR_RECRUITMENT" || (r.requestStatus || r.workflowStatus) === "Recruiting").length})
                        </button>
                        <button
                          onClick={() => setReqQueueFilter("REJECTED_BY_ADMIN")}
                          className={`px-3 py-1.5 rounded-xl font-medium transition border ${
                            reqQueueFilter === "REJECTED_BY_ADMIN"
                              ? "bg-rose-50 text-rose-900 border-rose-300 dark:bg-rose-950/50 dark:text-rose-200"
                              : "bg-transparent text-slate-600 border-slate-200 dark:border-slate-700"
                          }`}
                        >
                          Rejected ({requests.filter(r => (r.requestStatus || r.workflowStatus) === "REJECTED_BY_ADMIN").length})
                        </button>
                      </div>

                      <div className="relative w-full md:w-64">
                        <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                          <Icon name="search" className="w-3.5 h-3.5" />
                        </div>
                        <input
                          type="text"
                          placeholder="Search requisitions..."
                          value={reqQueueSearch}
                          onChange={(e) => setReqQueueSearch(e.target.value)}
                          className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 focus:outline-none focus:ring-2 focus:ring-sky-500/20"
                        />
                      </div>
                    </div>

                    <div className="bg-white dark:bg-[#0F172A] rounded-2xl border border-slate-200/70 dark:border-slate-800 overflow-hidden">
                      <div className="overflow-x-auto">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50/80 dark:bg-slate-800/40 text-[11px] font-semibold text-slate-400 uppercase tracking-wider border-b border-slate-100 dark:border-slate-800">
                            <tr>
                              <th className="px-4 py-3">Date</th>
                              <th className="px-4 py-3">ID</th>
                              <th className="px-4 py-3">Requester</th>
                              <th className="px-4 py-3">Position</th>
                              <th className="px-4 py-3">Department</th>
                              <th className="px-4 py-3 text-center">Headcount</th>
                              <th className="px-4 py-3">Status</th>
                              <th className="px-4 py-3 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800/60">
                            {sortedAdminRequisitions.length === 0 ? (
                              <tr>
                                <td colSpan="8" className="text-center py-10 text-slate-400 italic">
                                  No requisitions match the selected criteria
                                </td>
                              </tr>
                            ) : (
                              sortedAdminRequisitions.map((req) => {
                                const currentStatus = req.requestStatus || req.workflowStatus || "PENDING_ADMIN";
                                const isPendingAdmin = currentStatus === "PENDING_ADMIN";
                                const statusCfg = REQUISITION_STATUSES.find(s => s.id === currentStatus) || REQUISITION_STATUSES[0];

                                return (
                                  <tr 
                                    key={req.id}
                                    onClick={() => setSelectedRequisitionDetail(req)}
                                    className={`cursor-pointer transition-colors ${
                                      isPendingAdmin
                                        ? "bg-amber-50/40 hover:bg-amber-50/70 dark:bg-amber-950/10 dark:hover:bg-amber-950/30"
                                        : "hover:bg-slate-50/60 dark:hover:bg-slate-800/30"
                                    }`}
                                  >
                                    <td className="px-4 py-3 text-slate-500 font-normal">{req.requestDate}</td>
                                    <td className="px-4 py-3 font-mono font-medium text-sky-600 dark:text-sky-400">{req.id}</td>
                                    <td className="px-4 py-3 font-medium text-slate-900 dark:text-white">
                                      <div>{req.requesterName}</div>
                                      <div className="text-[10px] text-slate-400 font-normal">{req.requesterPosition || "-"}</div>
                                    </td>
                                    <td className="px-4 py-3 font-semibold text-slate-900 dark:text-white">
                                      <div>{req.jobTitle}</div>
                                      <div className="text-[10px] text-slate-400 font-normal">{req.positionType}</div>
                                    </td>
                                    <td className="px-4 py-3 text-slate-600 dark:text-slate-300 font-normal">{req.department}</td>
                                    <td className="px-4 py-3 text-center font-medium">{req.headcountRequired || 1}</td>
                                    <td className="px-4 py-3">
                                      <span className={`inline-flex items-center px-2 py-0.5 rounded-lg text-[11px] font-medium border ${statusCfg.badge}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>
                                    <td className="px-4 py-3 text-center" onClick={(e) => e.stopPropagation()}>
                                      {isPendingAdmin ? (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="px-2.5 py-1 rounded-lg text-xs font-semibold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200 transition"
                                        >
                                          ตรวจคำขอ
                                        </button>
                                      ) : (
                                        <button
                                          type="button"
                                          onClick={() => setSelectedRequisitionDetail(req)}
                                          className="p-1.5 rounded-lg text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>
                                      )}
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}

                {adminSubTab === "kanban" && (
                  <div className="space-y-8">
                    <div className="bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-4 border-b border-slate-200 dark:border-slate-800 mb-6">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="grid" className="w-5 h-5 text-brand-600" />
                            Kanban Pipeline
                          </h2>
                        </div>

                        <div className="relative w-full sm:w-64">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-4 h-4" />
                          </div>
                          <input
                            type="text"
                            placeholder="Search..."
                            value={searchQuery}
                            onChange={(e) => setSearchQuery(e.target.value)}
                            className="w-full pl-9 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="flex gap-4 overflow-x-auto pb-4 snap-x min-w-full">
                        {STAGES.map(stage => {
                          const stageItems = allPositionSlots.filter(s => {
                            const matches = !searchQuery.trim() ||
                              s.jobTitle?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.department?.toLowerCase().includes(searchQuery.toLowerCase()) ||
                              s.candidateName?.toLowerCase().includes(searchQuery.toLowerCase());
                            return s.stage === stage.id && !s.isArchivedFromKanban && matches;
                          });

                          return (
                            <div
                              key={stage.id}
                              onDragOver={(e) => { e.preventDefault(); setDragOverStage(stage.id); }}
                              onDragLeave={() => setDragOverStage(null)}
                              onDrop={(e) => {
                                e.preventDefault();
                                const slotId = draggedSlotId || e.dataTransfer.getData("text/plain");
                                setDragOverStage(null);
                                setDraggedSlotId(null);
                                if (!slotId) return;
                                
                                const targetSlot = allPositionSlots.find(s => s.slotId === slotId);
                                if (stage.id === "interview" && (!targetSlot?.candidateName || !targetSlot.candidateName.trim())) {
                                  triggerToast("⚠️ ต้องระบุหรือผูกผู้สมัครก่อนย้ายเข้าสู่ขั้นตอนสัมภาษณ์");
                                  return;
                                }
                                
                                setRequests(prev => prev.map(r => {
                                  if (!r.slots) return r;
                                  const slots = r.slots.map(s => s.slotId === slotId ? { ...s, stage: stage.id } : s);
                                  return { ...r, slots };
                                }));
                                triggerToast(`ย้าย Slot #${slotId} ไปยัง ${stage.label}`);
                              }}
                              className={`w-72 shrink-0 snap-start flex flex-col rounded-2xl p-3 border-2 transition-all duration-150 ${
                                dragOverStage === stage.id
                                  ? 'border-brand-500 bg-brand-50/70 dark:bg-brand-950/50'
                                  : 'border-slate-200 dark:border-slate-800 bg-slate-50 dark:bg-slate-800/40'
                              }`}
                            >
                              <div className="flex items-center justify-between pb-2 mb-3 border-b border-slate-200 dark:border-slate-700">
                                <span className="text-xs font-bold text-slate-700 dark:text-slate-300">{stage.label}</span>
                                <span className="text-[10px] font-semibold px-2 py-0.5 rounded-full bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400">
                                  {stageItems.length}
                                </span>
                              </div>

                              <div className="space-y-3 flex-1 overflow-y-auto max-h-[540px]">
                                {stageItems.map(item => {
                                  const priorityInfo = getPositionPriorityInfo(item);
                                  const isArrived = item.stage === "onboarded" && (item.hasAttendedFirstDayTraining || item.onboardingArrivalStatus === "arrived_reported");
                                  const isPendingArrival = item.stage === "onboarded" && !isArrived;

                                  return (
                                    <div
                                      key={item.slotId}
                                      draggable={true}
                                      onDragStart={(e) => {
                                        setDraggedSlotId(item.slotId);
                                        e.dataTransfer.setData("text/plain", item.slotId);
                                      }}
                                      onDragEnd={() => { setDraggedSlotId(null); setDragOverStage(null); }}
                                      className={`p-3.5 rounded-xl border shadow-xs transition-all cursor-grab active:cursor-grabbing select-none group ${
                                        isArrived
                                          ? 'border-emerald-400 dark:border-emerald-600 bg-emerald-50/90 dark:bg-emerald-950/50 ring-2 ring-emerald-500/25'
                                          : isPendingArrival
                                          ? 'border-amber-300 dark:border-amber-700 bg-amber-50/60 dark:bg-amber-950/30 ring-1 ring-amber-400/30'
                                          : 'border-slate-200/80 dark:border-slate-700 hover:border-brand-400 hover:shadow-md bg-white dark:bg-slate-800'
                                      }`}
                                    >
                                      <div className="flex items-center justify-between text-[10px] mb-2 pb-1.5 border-b border-slate-100 dark:border-slate-700/60">
                                        <div className="flex items-center gap-1.5">
                                          <span className="relative flex h-2.5 w-2.5">
                                            {priorityInfo.ping && (
                                              <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${priorityInfo.dotBg} opacity-75`}></span>
                                            )}
                                            <span className={`relative inline-flex rounded-full h-2.5 w-2.5 ${priorityInfo.dotBg}`}></span>
                                          </span>
                                          <span className={`text-[10px] font-extrabold px-1.5 py-0.5 rounded border ${priorityInfo.badge}`}>
                                            {priorityInfo.icon} {priorityInfo.label}
                                          </span>
                                        </div>
                                        <span className="text-slate-400">{item.requestDate}</span>
                                      </div>

                                      <div className="flex items-center justify-between text-[10px] mb-1.5">
                                        <span className="text-brand-600 font-bold bg-brand-50 dark:bg-brand-950 px-2 py-0.5 rounded">
                                          Slot #{item.slotIndex}/{item.totalSlots}
                                        </span>
                                        <span className="text-slate-400 font-mono">{item.slotId}</span>
                                      </div>
                                      <h4 className="text-xs font-bold text-slate-900 dark:text-white line-clamp-2">
                                        {item.jobTitle}
                                      </h4>
                                      <p className="text-[11px] text-slate-500 truncate mt-0.5">{item.department}</p>

                                      {item.candidateName ? (
                                        <div className={`mt-2 p-2 rounded-lg border text-xs ${
                                          isArrived
                                            ? "bg-emerald-100/80 dark:bg-emerald-900/50 border-emerald-300 dark:border-emerald-700"
                                            : "bg-emerald-50/80 dark:bg-emerald-950/40 border-emerald-100 dark:border-emerald-900/60"
                                        }`}>
                                          <div className="font-bold text-emerald-800 dark:text-emerald-200 flex items-center justify-between">
                                            <span className="truncate">👤 {item.candidateName}</span>
                                            <button 
                                              onClick={() => setUnassignConfirmTarget(item)}
                                              className="text-[10px] text-rose-500 hover:text-rose-700 underline font-semibold ml-1 shrink-0"
                                            >
                                              ถอด
                                            </button>
                                          </div>

                                          {item.stage === "interview" && item.interviewSchedule && (() => {
                                            const relTime = getInterviewRelativeTimeInfo(item.interviewSchedule);
                                            return (
                                              <div className="mt-1.5 pt-1.5 border-t border-emerald-200/60 dark:border-emerald-800/60 space-y-1">
                                                <div className="text-[11px] text-amber-700 dark:text-amber-300 font-semibold flex items-center gap-1">
                                                  <Icon name="calendar" className="w-3.5 h-3.5 shrink-0" />
                                                  <span className="truncate">นัดหมาย: {item.interviewSchedule}</span>
                                                </div>
                                                {relTime && (
                                                  <div className="flex items-center gap-1.5">
                                                    <span className={`inline-flex items-center gap-1 px-2 py-0.5 rounded-full text-[10px] border ${relTime.badge}`}>
                                                      {relTime.ping && (
                                                        <span className="relative flex h-2 w-2">
                                                          <span className={`animate-ping absolute inline-flex h-full w-full rounded-full ${relTime.dotBg} opacity-75`}></span>
                                                          <span className={`relative inline-flex rounded-full h-2 w-2 ${relTime.dotBg}`}></span>
                                                        </span>
                                                      )}
                                                      <span>{relTime.text}</span>
                                                    </span>
                                                  </div>
                                                )}
                                              </div>
                                            );
                                          })()}

                                          {item.stage === "onboarded" && (
                                            <div className="mt-1.5 pt-1.5 border-t border-slate-200/60 dark:border-slate-700/60 space-y-1">
                                              {item.hireDate && (
                                                <div className="text-[11px] font-semibold text-slate-700 dark:text-slate-200 flex items-center gap-1">
                                                  <Icon name="calendar" className="w-3.5 h-3.5 shrink-0 text-brand-600" />
                                                  <span>เริ่มงาน: {item.hireDate}</span>
                                                </div>
                                              )}
                                              <div className={`p-1.5 rounded-lg text-[10.5px] font-extrabold flex items-center justify-between border ${
                                                isArrived
                                                  ? "bg-emerald-100 text-emerald-800 dark:bg-emerald-900/70 dark:text-emerald-100 border-emerald-300 dark:border-emerald-700 shadow-2xs"
                                                  : "bg-amber-100 text-amber-800 dark:bg-amber-900/70 dark:text-amber-200 border-amber-300 dark:border-amber-700 animate-pulse"
                                              }`}>
                                                <span>{isArrived ? "✅ มาเริ่มงานแล้ว (Closed)" : "⏳ รอถึงวันเริ่มงาน (ยังไม่มา)"}</span>
                                              </div>
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <div className="mt-2 text-[10px] font-medium text-slate-400 italic bg-slate-100 dark:bg-slate-800 px-2 py-0.5 rounded-md inline-block">
                                          👤 ว่าง (Unassigned)
                                        </div>
                                      )}

                                      {isPendingArrival && (
                                        <button
                                          type="button"
                                          onClick={(e) => {
                                            e.stopPropagation();
                                            handleConfirmFirstDayTraining(item.slotId);
                                          }}
                                          className="w-full mt-2 py-1.5 px-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold text-[11px] shadow-sm transition flex items-center justify-center gap-1.5"
                                        >
                                          <span>✓ กดยืนยันมาเริ่มงานแล้ว</span>
                                        </button>
                                      )}

                                      {item.stage === "interview" && (
                                        <div className="mt-2.5 pt-2 border-t border-slate-100 dark:border-slate-700/60 flex items-center justify-between gap-1.5">
                                          <button
                                            type="button"
                                            onClick={(e) => {
                                              e.stopPropagation();
                                              handleOpenBlindEvaluationModal(item);
                                            }}
                                            className="inline-flex items-center gap-1 text-[10px] font-bold text-brand-600 hover:text-brand-700 dark:text-brand-400 bg-brand-50 hover:bg-brand-100 dark:bg-brand-950/60 px-2.5 py-1 rounded-lg border border-brand-200 dark:border-brand-800/80 transition"
                                          >
                                            <Icon name="clipboardCheck" className="w-3 h-3 text-brand-600" />
                                            <span>+ ประเมินสัมภาษณ์</span>
                                          </button>
                                          {item.evaluationsCount > 0 ? (
                                            <button
                                              type="button"
                                              onClick={(e) => {
                                                e.stopPropagation();
                                                setAdminAuditSlot(item);

                                              className="text-[10px] font-bold text-slate-600 dark:text-slate-300 hover:text-brand-600 underline ml-auto"

                                              ⭐ {item.interviewScore}/5 ({item.evaluationsCount} ท่าน)
                                            </button>
                                          ) : (
                                            <span className="text-[10px] text-slate-400 italic">รอผลประเมิน</span>
                                          )}
                                        </div>
                                      )}
