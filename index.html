                                        <span className="text-[10px] font-semibold text-slate-400">สถานะ: {item.stage}</span>
                                        <button 
                                          onClick={() => setSelectedDetailSlot(item)}
                                          className="text-[10px] font-bold text-brand-600 hover:underline"
                                        >
                                          ดูคำขอ &rarr;
                                        </button>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                )}

                {adminSubTab === "candidates" && (
                  <div className="flex flex-col w-full space-y-8">
                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="shieldCheck" className="w-5 h-5 text-emerald-600" />
                            Manpower Requests
                          </h2>
                        </div>

                        <div className="flex items-center gap-2">
                          <button
                            onClick={exportToCSV}
                            className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs shadow-md flex items-center gap-1.5 transition"
                          >
                            <Icon name="download" className="w-3.5 h-3.5 text-white" />
                            <span>Export CSV</span>
                          </button>
                        </div>
                      </div>

                      <div className="flex items-center gap-2 border-b border-slate-200 dark:border-slate-800 pb-2">
                        <button
                          onClick={() => setManpowerTableTab("in_process")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "in_process"
                              ? "bg-amber-500 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>In Progress</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{inProcessSlots.length}</span>
                        </button>

                        <button
                          onClick={() => setManpowerTableTab("closed")}
                          className={`px-3.5 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1.5 ${
                            manpowerTableTab === "closed"
                              ? "bg-emerald-600 text-white shadow-sm"
                              : "bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-200"
                          }`}
                        >
                          <span>Closed</span>
                          <span className="px-1.5 py-0.2 rounded-full bg-black/20 text-[10px]">{closedSlots.length}</span>
                        </button>
                      </div>

                      <div className="overflow-x-auto max-h-[380px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-50 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-500 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5">Slot ID</th>
                              <th className="px-3 py-2.5">Status</th>
                              <th className="px-3 py-2.5">Position</th>
                              <th className="px-3 py-2.5">Department</th>
                              <th className="px-3 py-2.5">Stage</th>
                              <th className="px-3 py-2.5">Lead Time</th>
                              <th className="px-3 py-2.5">Candidate &amp; Schedule</th>
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Hire Date &amp; Arrival</th>}
                              {manpowerTableTab === "closed" && <th className="px-3 py-2.5">Total Duration</th>}
                              <th className="px-3 py-2.5">Evaluation</th>
                              <th className="px-3 py-2.5 text-center">Action</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {(manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).length === 0 ? (
                              <tr>
                                <td colSpan={manpowerTableTab === "closed" ? "11" : "9"} className="text-center py-6 text-slate-400 italic">
                                  ไม่มีรายการในหมวดนี้
                                </td>
                              </tr>
                            ) : (
                              (manpowerTableTab === "in_process" ? inProcessSlots : closedSlots).map(s => {
                                const sla = getSLAInfo(s.requestDate, s.stage, s.offerSentDate);
                                const duration = getRecruitmentDurationInfo(s.requestDate, s.hireDate, s.lastUpdated);
                                const hasEvaluation = s.evaluationsCount > 0;

                                return (
                                  <tr key={s.slotId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40">
                                    <td className="px-3 py-2.5 font-semibold text-slate-900 dark:text-white">
                                      <span className="text-brand-600 font-bold">{s.slotId}</span>
                                      <div className="text-[10px] text-slate-400">{s.requestDate}</div>
                                    </td>
                                    <td className="px-3 py-2.5">
                                      <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-lg border ${
                                        s.slotStatus === "Closed"
                                          ? "bg-emerald-50 text-emerald-800 dark:bg-emerald-950 dark:text-emerald-200 border-emerald-300"
                                          : "bg-amber-50 text-amber-800 dark:bg-amber-950 dark:text-amber-200 border-amber-300"
                                      }`}>
                                        {s.slotStatus}
                                      </span>
                                    </td>
                                    <td className="px-3 py-2.5 font-bold text-slate-900 dark:text-white">
                                      <div>{s.jobTitle}</div>
                                      <div className="text-[10px] font-normal text-slate-400">{s.positionType}</div>
                                    </td>
                                    <td className="px-3 py-2.5">{s.department}</td>
                                    <td className="px-3 py-2.5 font-medium">{s.stage}</td>
                                    <td className="px-3 py-2.5 text-[11px] text-slate-500">
                                      ⏱️ {sla.workingDaysElapsed} วันทำการ
                                    </td>
                                    <td className="px-3 py-2.5">
                                      {s.candidateName ? (
                                        <div>
                                          <span className="font-semibold text-slate-900 dark:text-white">{s.candidateName}</span>
                                          {s.interviewSchedule && (
                                            <div className="text-[10px] text-amber-700 dark:text-amber-300 mt-0.5">
                                              📅 {s.interviewSchedule}
                                            </div>
                                          )}
                                        </div>
                                      ) : (
                                        <span className="text-slate-400 italic">ว่าง (Unassigned)</span>
                                      )}
                                    </td>
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5 font-semibold text-emerald-700 dark:text-emerald-300">
                                        {s.hireDate || "-"}
                                      </td>
                                    )}
                                    {manpowerTableTab === "closed" && (
                                      <td className="px-3 py-2.5 text-[11px] font-bold text-sky-700 dark:text-sky-300">
                                        รวม {duration.totalDays} วัน
                                      </td>
                                    )}
                                    <td className="px-3 py-2.5">
                                      {s.stage === "interview" ? (
                                        <button
                                          onClick={() => handleOpenBlindEvaluationModal(s)}
                                          className="px-2.5 py-1 rounded-lg bg-brand-50 hover:bg-brand-100 text-brand-700 font-bold text-[11px] flex items-center gap-1"
                                        >
                                          <Icon name="clipboardCheck" className="w-3.5 h-3.5" />
                                          <span>+ ประเมินสัมภาษณ์</span>
                                        </button>
                                      ) : hasEvaluation ? (
                                        <span className="text-[10px] font-bold text-slate-700 dark:text-slate-300">
                                          ⭐ {s.interviewScore}/5 ({s.evaluationsCount} ท่าน)
                                        </span>
                                      ) : (
                                        <span className="text-slate-400 text-[10px] italic">-</span>
                                      )}
                                    </td>
                                    <td className="px-3 py-2.5 text-center">
                                      <button
                                        onClick={() => setSelectedDetailSlot(s)}
                                        className="p-1.5 rounded-lg bg-slate-100 dark:bg-slate-800 hover:text-brand-600 text-slate-600"
                                      >
                                        <Icon name="eye" className="w-3.5 h-3.5" />
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>

                    <div className="w-full bg-white dark:bg-slate-900 rounded-3xl border border-slate-200/80 dark:border-slate-800 shadow-sm p-6 space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-3 border-b border-slate-200 dark:border-slate-800">
                        <div>
                          <h2 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white flex items-center gap-2">
                            <Icon name="userSearch" className="w-5 h-5 text-sky-600" />
                            Candidate Pool
                          </h2>
                        </div>

                        <div className="flex flex-wrap items-center gap-2">
                          <button
                            onClick={() => setShowAddCandidateModal(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs flex items-center gap-1.5 shadow-md shadow-brand-500/20"
                          >
                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                            <span>+ Add Candidate</span>
                          </button>

                          <button
                            onClick={() => syncCandidatesFromGoogleSheet(true)}
                            className="px-3.5 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs flex items-center gap-1.5 hover:bg-slate-200"
                          >
                            <Icon name="refresh" className="w-3.5 h-3.5 text-brand-600" />
                            <span>Sync Sheet</span>
                          </button>

                          <button
                            onClick={() => {
                              setScriptUrlInput(googleScriptUrl);
                              setShowSheetsModal(true);
                            }}
                            className="px-3 py-1.5 rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-200 border border-slate-200 dark:border-slate-700 font-semibold text-xs"
                          >
                            <span>⚙️ Settings</span>
                          </button>

                          <a
                            href={CANDIDATES_SHEET_EDIT_URL}
                            target="_blank"
                            rel="noreferrer"
                            className="px-3 py-1.5 rounded-xl bg-sky-50 dark:bg-sky-950/40 text-sky-700 dark:text-sky-300 border border-sky-200 dark:border-sky-800 font-bold text-xs flex items-center gap-1 hover:underline"
                          >
                            <span>Open Sheet</span>
                            <Icon name="link" className="w-3 h-3 text-sky-600" />
                          </a>
                        </div>
                      </div>

                      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3">
                        <div className="flex flex-wrap items-center gap-2 text-xs">
                          <div className="flex items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">Position:</span>
                            <select
                              value={candidatePositionFilter}
                              onChange={(e) => setCandidatePositionFilter(e.target.value)}
                              className="px-2.5 py-1 text-xs rounded-xl bg-slate-100 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 font-semibold max-w-[200px] truncate"
                            >
                              <option value="ALL">All Positions</option>
                              {positionFilterOptions.map(pos => (
                                <option key={pos} value={pos}>{pos}</option>
                              ))}
                            </select>
                          </div>

                          <div className="flex flex-wrap items-center gap-1.5">
                            <span className="text-[11px] font-bold text-slate-400 uppercase">Status:</span>
                            <button
                              onClick={() => setSelectedStatusFilter("ALL")}
                              className={`px-2.5 py-1 rounded-xl text-xs font-bold transition ${
                                selectedStatusFilter === "ALL"
                                  ? "bg-slate-900 text-white dark:bg-white dark:text-slate-900"
                                  : "bg-slate-100 text-slate-600 hover:bg-slate-200 dark:bg-slate-800 dark:text-slate-300"
                              }`}
                            >
                              All ({candidatePool.length})
                            </button>
                            {CANDIDATE_STATUS_CONFIG.map(st => {
                              const count = candidatePool.filter(c => c.status === st.id).length;
                              return (
                                <button
                                  key={st.id}
                                  onClick={() => setSelectedStatusFilter(st.id)}
                                  className={`px-2 py-1 rounded-xl text-xs font-bold transition border ${st.bg} ${st.text} ${st.border} ${
                                    selectedStatusFilter === st.id ? "ring-2 ring-slate-800 dark:ring-slate-200" : "opacity-80"
                                  }`}
                                >
                                  <span>{st.label}</span>
                                  <span className="ml-1 px-1.5 py-0.2 rounded-full bg-black/10 text-[10px]">{count}</span>
                                </button>
                              );
                            })}
                          </div>
                        </div>

                        <div className="relative w-full md:w-64">
                          <div className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400">
                            <Icon name="search" className="w-3.5 h-3.5" />
                          </div>
                          <input
                            type="text"
                            placeholder="Search candidates..."
                            value={candidateSearchQuery}
                            onChange={(e) => setCandidateSearchQuery(e.target.value)}
                            className="w-full pl-8 pr-3 py-1.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                          />
                        </div>
                      </div>

                      <div className="overflow-x-auto max-h-[520px] overflow-y-auto border border-slate-200 dark:border-slate-800 rounded-2xl w-full">
                        <table className="w-full text-left text-xs text-slate-600 dark:text-slate-300 whitespace-nowrap">
                          <thead className="bg-slate-100 dark:bg-slate-800 text-[10px] uppercase tracking-wider text-slate-600 dark:text-slate-400 sticky top-0 z-10 border-b border-slate-200 dark:border-slate-700">
                            <tr>
                              <th className="px-3 py-2.5 font-bold">Action</th>
                              <th className="px-3 py-2.5 font-bold">No.</th>
                              <th className="px-3 py-2.5 font-bold">Full Name</th>
                              <th className="px-3 py-2.5 font-bold">Nickname</th>
                              <th className="px-3 py-2.5 font-bold">Phone</th>
                              <th className="px-3 py-2.5 font-bold">Position</th>
                              <th className="px-3 py-2.5 font-bold">Level</th>
                              <th className="px-3 py-2.5 font-bold">Status</th>
                              <th className="px-3 py-2.5 font-bold text-center">Manage</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-100 dark:divide-slate-800">
                            {filteredCandidates.length === 0 ? (
                              <tr>
                                <td colSpan="9" className="text-center py-8 text-slate-400 italic">
                                  ไม่พบข้อมูลผู้สมัครตามเงื่อนไขที่ค้นหา
                                </td>
                              </tr>
                            ) : (
                              filteredCandidates.map((cand, idx) => {
                                const statusCfg = CANDIDATE_STATUS_CONFIG.find(c => c.id === cand.status) || CANDIDATE_STATUS_CONFIG[0];
                                return (
                                  <tr key={cand.candidateId} className="hover:bg-slate-50/80 dark:hover:bg-slate-800/40 transition">
                                    <td className="px-3 py-2">
                                      <div className="flex items-center gap-1.5">
                                        <button
                                          type="button"
                                          onClick={() => {
                                            setSelectedCandidateDetail(cand);
                                            setCandidateEditForm({ ...cand });
                                            setIsEditingCandidate(false);
                                          }}
                                          className="p-1.5 rounded-lg bg-sky-50 hover:bg-sky-100 text-sky-700 border border-sky-200"
                                        >
                                          <Icon name="eye" className="w-3.5 h-3.5" />
                                        </button>

                                        {cand.assignedSlotId ? (
                                          <span className="px-1.5 py-0.5 rounded-md bg-emerald-100 text-emerald-800 font-extrabold text-[10px] border border-emerald-300">
                                            ✓ {cand.assignedSlotId}
                                          </span>
                                        ) : (
                                          <button
                                            onClick={() => setSlotPickerCandidate(cand)}
                                            className="p-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white"
                                          >
                                            <Icon name="plus" className="w-3.5 h-3.5 text-white" />
                                          </button>
                                        )}
                                      </div>
                                    </td>
                                    <td className="px-3 py-2 font-bold text-slate-800 dark:text-slate-200">{cand.no || idx + 1}</td>
                                    <td className="px-3 py-2 font-bold text-slate-900 dark:text-white">{cand.fullName}</td>
                                    <td className="px-3 py-2">{cand.nickname || "-"}</td>
                                    <td className="px-3 py-2">{cand.phone || "-"}</td>
                                    <td className="px-3 py-2 font-semibold text-brand-600 dark:text-brand-400">{cand.targetJobTitle}</td>
                                    <td className="px-3 py-2">{cand.level || "-"}</td>
                                    <td className="px-3 py-2">
                                      <span className={`inline-block text-[11px] font-bold px-2 py-0.5 rounded-lg border ${statusCfg.bg} ${statusCfg.text} ${statusCfg.border}`}>
                                        {statusCfg.label}
                                      </span>
                                    </td>
                                    <td className="px-3 py-2 text-center">
                                      <button
                                        type="button"
                                        onClick={() => setCandidateToDelete(cand)}
                                        className="p-1.5 rounded-lg bg-rose-50 hover:bg-rose-100 text-rose-700 font-bold text-[11px] border border-rose-200"
                                      >
                                        <span>🗑️ ลบ</span>
                                      </button>
                                    </td>
                                  </tr>
                                );
                              })
                            )}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  </div>
                )}
              </div>
            )}
          </main>

          {blindEvalModalSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 max-h-[90vh] overflow-y-auto">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold text-brand-600 uppercase">Evaluation Form</span>
                    <h3 className="text-base font-bold text-slate-900 dark:text-white mt-0.5">
                      แบบประเมินผลการสัมภาษณ์: {blindEvalModalSlot.candidateName}
                    </h3>
                  </div>
                  <button onClick={() => setBlindEvalModalSlot(null)} className="p-1 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  if (!blindEvalForm.evaluatorName.trim()) {
                    triggerToast("⚠️ กรุณาระบุชื่อผู้ประเมิน");
                    return;
                  }
                  const sc = blindEvalForm.scores;
                  const total = Number(sc.c1) + Number(sc.c2) + Number(sc.c3) + Number(sc.c4) + Number(sc.c5);
                  const avg = parseFloat((total / 5).toFixed(1));
                  const pct = Math.round((total / 25) * 100);

                  const newSubmission = {
                    id: `eval-${Date.now()}`,
                    evaluatorName: blindEvalForm.evaluatorName.trim(),
                    evaluatorRole: blindEvalForm.evaluatorRole,
                    date: blindEvalForm.date,
                    scores: { ...sc },
                    total,
                    avg,
                    pct,
                    strengths: blindEvalForm.strengths,
                    improvements: blindEvalForm.improvements,
                    recommendation: blindEvalForm.recommendation
                  };

                  setRequests(prev => prev.map(r => {
                    if (!r.slots) return r;
                    const slots = r.slots.map(s => {
                      if (s.slotId === blindEvalModalSlot.slotId) {
                        const updatedEvals = [...(s.evaluations || []), newSubmission];
                        const overall = calculateOverallScore(updatedEvals);
                        return {
                          ...s,
                          interviewScore: overall.combinedAvg,
                          interviewScorePercent: overall.combinedPct,
                          interviewResult: overall.result,
                          evaluations: updatedEvals
                        };
                      }
                      return s;
                    });
                    return { ...r, slots };
                  }));

                  setBlindEvalModalSlot(null);
                  triggerToast(`บันทึกผลการประเมินของคุณ ${newSubmission.evaluatorName} สำเร็จ!`);
                }} className="space-y-3 py-4 text-xs">
                  <div>
                    <label className="block text-[11px] font-semibold mb-1">ชื่อผู้ประเมิน *</label>
                    <SearchableSelect
                      value={blindEvalForm.evaluatorName}
                      options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                      onChange={(name) => setBlindEvalForm({ ...blindEvalForm, evaluatorName: name })}
                    />
                  </div>

                  <div className="space-y-2 pt-2 border-t border-slate-200 dark:border-slate-800">
                    <span className="font-bold text-[11px] text-slate-800 dark:text-slate-200 block">เกณฑ์การประเมิน (1-5 คะแนน):</span>
                    {EVALUATION_CRITERIA.map(crit => (
                      <div key={crit.id} className="p-2.5 rounded-xl bg-slate-50 dark:bg-slate-800 flex items-center justify-between">
                        <span className="text-[11px] font-medium text-slate-700 dark:text-slate-300 pr-2">{crit.label}</span>
                        <select
                          value={blindEvalForm.scores[crit.id]}
                          onChange={(e) => setBlindEvalForm({
                            ...blindEvalForm,
                            scores: { ...blindEvalForm.scores, [crit.id]: Number(e.target.value) }
                          })}
                          className="px-2 py-1 rounded-lg bg-white dark:bg-slate-700 font-bold border border-slate-200 dark:border-slate-600"
                        >
                          <option value="1">1 - ต่ำกว่ามาตรฐาน</option>
                          <option value="2">2 - พอใช้</option>
                          <option value="3">3 - ปานกลาง</option>
                          <option value="4">4 - ดีมาก</option>
                          <option value="5">5 - ยอดเยี่ยม</option>
                        </select>
                      </div>
                    ))}
                  </div>

                  <div className="pt-2 flex justify-end gap-2">
                    <button type="button" onClick={() => setBlindEvalModalSlot(null)} className="px-4 py-2 rounded-xl bg-slate-100 dark:bg-slate-800">ยกเลิก</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-brand-600 text-white font-bold">บันทึกผลการประเมิน</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {selectedDetailSlot && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 my-8 max-h-[85vh] overflow-y-auto">
                <div className="flex items-start justify-between pb-3 border-b border-slate-200 dark:border-slate-800">
                  <div>
                    <span className="text-[10px] font-bold text-brand-600 uppercase">{selectedDetailSlot.slotId}</span>
                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mt-0.5">{selectedDetailSlot.jobTitle}</h3>
                    <p className="text-xs text-slate-500">{selectedDetailSlot.department}</p>
                  </div>
                  <button onClick={() => setSelectedDetailSlot(null)} className="p-1.5 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <div className="py-4 space-y-3.5 text-xs">
                  <div className="grid grid-cols-2 gap-3 p-3 rounded-xl bg-slate-50 dark:bg-slate-800/60">
                    <div>
                      <span className="text-[10px] text-slate-400">Position Type:</span>
                      <p className="font-bold text-slate-800 dark:text-slate-200">{selectedDetailSlot.positionType}</p>
                    </div>
                    <div>
                      <span className="text-[10px] text-slate-400">Status ของ Slot:</span>
                      <p className="font-bold text-emerald-600">{selectedDetailSlot.slotStatus || "Recruiting"}</p>
                    </div>
                  </div>

                  {selectedDetailSlot.stage === "onboarded" && (
                    <div className="p-4 rounded-2xl bg-purple-50/70 dark:bg-purple-950/40 border-2 border-purple-200 dark:border-purple-800 space-y-3">
                      <div className="flex items-center justify-between">
                        <span className="text-xs font-bold text-purple-900 dark:text-purple-200">
                          🎯 กระบวนการ Onboarding &amp; ส่งมอบอุปกรณ์ IT
                        </span>
                        <span className="text-[10px] font-bold text-rose-600 bg-rose-50 dark:bg-rose-950/50 px-2 py-0.5 rounded border border-rose-200">
                          วันเริ่มงาน: {selectedDetailSlot.hireDate || "ยังไม่ระบุ"}
                        </span>
                      </div>

                      <button
                        type="button"
                        onClick={() => handleSendITNotification(selectedDetailSlot)}
                        className="w-full py-2 px-3 rounded-xl bg-purple-600 hover:bg-purple-700 text-white font-bold text-xs shadow-md transition flex items-center justify-center gap-1.5"
                      >
                        <Icon name="send" className="w-3.5 h-3.5 text-white" />
                        <span>{selectedDetailSlot.isItNotified ? "ส่งอีเมลแจ้งทีม IT ซ้ำอีกครั้ง" : "ส่ง Email ข้อมูลไปให้ทางทีม IT (people@valuesourcing.co)"}</span>
                      </button>

                      <div className="pt-2 border-t border-purple-200/60 flex items-center justify-between">
                        <span className="text-[11px] font-medium text-slate-600 dark:text-slate-300">
                          การมารายงานตัวเริ่มงานวันแรก:
                        </span>
                        {selectedDetailSlot.hasAttendedFirstDayTraining || selectedDetailSlot.onboardingArrivalStatus === "arrived_reported" ? (
                          <span className="px-2.5 py-1 rounded-lg bg-emerald-600 text-white font-bold text-xs">
                            ✅ มาเริ่มงานแล้ว (Closed)
                          </span>
                        ) : (
                          <button
                            type="button"
                            onClick={() => handleConfirmFirstDayTraining(selectedDetailSlot.slotId)}
                            className="px-3.5 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs"
                          >
                            ✓ ยืนยันมาเริ่มงาน &amp; ปิดจบตำแหน่ง (Closed)
                          </button>
                        )}
                      </div>
                    </div>
                  )}

                  {selectedDetailSlot.candidateName && (
                    <div className="p-3 rounded-xl bg-emerald-50 dark:bg-emerald-950/40 border border-emerald-200 dark:border-emerald-800">
                      <p className="font-bold text-emerald-800 dark:text-emerald-200">👤 แคนดิเดต: {selectedDetailSlot.candidateName}</p>
                      <p className="text-emerald-700 dark:text-emerald-300 text-[11px]">📞 {selectedDetailSlot.candidatePhone || "-"}</p>
                    </div>
                  )}
                </div>

                <div className="pt-3 border-t border-slate-200 dark:border-slate-800 flex justify-end">
                  <button onClick={() => setSelectedDetailSlot(null)} className="px-4 py-2 rounded-xl text-xs font-semibold bg-slate-100 text-slate-700 dark:bg-slate-800 dark:text-slate-200">
                    ปิด
                  </button>
                </div>
              </div>
            </div>
          )}

          {showLoginModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-xs animate-fadeIn">
              <div className="relative w-full max-w-md bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 p-6 text-center">
                {loginStep === "credentials" ? (
                  <>
                    <div className="w-12 h-12 rounded-2xl bg-brand-50 dark:bg-brand-950/60 text-brand-600 flex items-center justify-center mx-auto mb-3">
                      <Icon name="shieldCheck" className="w-6 h-6 text-brand-600" />
                    </div>
                    <h3 className="text-base sm:text-lg font-bold text-slate-900 dark:text-white">Admin Authentication</h3>
                    <p className="text-xs text-slate-500 mt-1 mb-4">เข้าสู่ระบบด้วย 3 อีเมลที่กำหนด พร้อมรับรหัสยืนยัน OTP</p>

                    <form onSubmit={handleAdminLoginSubmit} className="space-y-3.5 text-left">
                      <div>
                        <label className="block text-[11px] font-bold mb-1">อีเมลผู้ดูแลระบบ *</label>
                        <input
                          type="email"
                          required
                          value={adminEmailInput}
                          onChange={(e) => setAdminEmailInput(e.target.value)}
                          placeholder="sarunpat.ub@valuesourcing.co"
                          className="w-full p-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                        />
                      </div>

                      <div>
                        <label className="block text-[11px] font-bold mb-1">รหัสผ่าน *</label>
                        <input
                          type={showPassword ? "text" : "password"}
                          required
                          value={adminPasswordInput}
                          onChange={(e) => setAdminPasswordInput(e.target.value)}
                          placeholder="admin2026 หรือ people2026"
                          className="w-full p-2.5 text-xs rounded-xl bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700"
                        />
                      </div>

                      {loginError && <p className="text-rose-600 text-xs font-semibold">{loginError}</p>}

                      <div className="flex gap-2 pt-2">
                        <button type="button" onClick={() => setShowLoginModal(false)} className="w-1/3 py-2 rounded-xl text-xs bg-slate-100">ยกเลิก</button>
                        <button type="submit" disabled={isSendingOtp} className="w-2/3 py-2 rounded-xl text-xs bg-brand-600 text-white font-bold">
                          {isSendingOtp ? "กำลังส่ง OTP..." : "รับรหัส OTP ทางอีเมล"}
                        </button>
                      </div>
                    </form>
                  </>
                ) : (
                  <>
                    <h3 className="text-base font-bold text-slate-900 dark:text-white">ยืนยันรหัส OTP จากอีเมล</h3>
                    <p className="text-xs text-slate-500 mt-1 mb-4">ส่งรหัสไปที่ {adminEmailInput} แล้ว</p>
                    <form onSubmit={handleVerifyOtpSubmit} className="space-y-4">
                      <input
                        type="text"
                        maxLength="6"
                        required
                        value={otpInput}
                        onChange={(e) => setOtpInput(e.target.value)}
                        placeholder="______"
                        className="w-full text-center text-2xl font-bold tracking-[8px] py-2.5 rounded-xl border-2 border-brand-500"
                      />
                      {loginError && <p className="text-rose-600 text-xs font-semibold">{loginError}</p>}
                      <div className="flex gap-2">
                        <button type="button" onClick={() => setLoginStep("credentials")} className="w-1/3 py-2 rounded-xl text-xs bg-slate-100">ย้อนกลับ</button>
                        <button type="submit" className="w-2/3 py-2 rounded-xl text-xs bg-emerald-600 text-white font-bold">ยืนยันเข้าสู่ระบบ</button>
                      </div>
                    </form>
                  </>
                )}
              </div>
            </div>
          )}

          {showRequestModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-4 bg-slate-950/70 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-2xl bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-slate-200 dark:border-slate-800 overflow-hidden max-h-[92vh] flex flex-col">
                <div className="px-6 py-5 bg-slate-50 dark:bg-slate-800 border-b border-slate-200 dark:border-slate-800 flex items-center justify-between">
                  <h3 className="text-base sm:text-lg font-extrabold text-slate-900 dark:text-white flex items-center gap-2">
                    <Icon name="plus" className="w-5 h-5 text-brand-600" />
                    แบบฟอร์มขอกำลังคน (Manpower Requisition)
                  </h3>
                  <button onClick={() => setShowRequestModal(false)} className="p-2 text-slate-400">
                    <Icon name="x" className="w-5 h-5" />
                  </button>
                </div>

                <form onSubmit={(e) => {
                  e.preventDefault();
                  setPendingConfirmationForm({ ...formInput });
                  setShowConfirmModal(true);
                }} className="p-6 space-y-4 overflow-y-auto flex-1 text-xs">
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-semibold mb-1">ผู้ขอ *</label>
                      <SearchableSelect
                        value={formInput.requesterName}
                        options={personnelList.map(p => ({ value: p.name, label: p.name }))}
                        onChange={(name) => {
                          const person = personnelList.find(p => p.name === name);
                          setFormInput(prev => ({
                            ...prev,
                            requesterName: name,
                            requesterEmail: person?.email || prev.requesterEmail,
                            requesterPosition: person?.position || prev.requesterPosition,
                            department: person?.department || prev.department
                          }));
                        }}
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold mb-1">ฝ่ายงาน *</label>
                      <SearchableSelect
                        value={formInput.department}
                        options={departmentOptions.map(d => ({ value: d, label: d }))}
                        onChange={(dept) => setFormInput({ ...formInput, department: dept })}
                      />
                    </div>
                  </div>

                  <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div className="sm:col-span-2">
                      <label className="block text-[11px] font-semibold mb-1">ชื่อตำแหน่ง *</label>
                      <input
                        type="text"
                        required
                        value={formInput.jobTitle}
                        onChange={(e) => setFormInput({ ...formInput, jobTitle: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 font-bold"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold mb-1">จำนวนอัตรา *</label>
                      <input
                        type="number"
                        min="1"
                        required
                        value={formInput.headcountRequired}
                        onChange={(e) => setFormInput({ ...formInput, headcountRequired: e.target.value })}
                        className="w-full p-2.5 rounded-xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 text-center font-bold"
                      />
                    </div>
                  </div>

                  <div className="pt-3 border-t border-slate-200 flex justify-end gap-2">
                    <button type="button" onClick={() => setShowRequestModal(false)} className="px-4 py-2 rounded-xl bg-slate-100">ยกเลิก</button>
                    <button type="submit" className="px-6 py-2 rounded-xl bg-brand-600 text-white font-bold">ตรวจสอบและส่งคำขอ</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {showConfirmModal && pendingConfirmationForm && (
            <div className="fixed inset-0 z-[70] flex items-center justify-center p-3 sm:p-4 bg-slate-950/80 backdrop-blur-md animate-fadeIn">
              <div className="relative w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl shadow-2xl border border-brand-200 p-6 space-y-4 text-xs">
                <h3 className="text-base font-bold text-slate-900 dark:text-white">ยืนยันการส่งคำขอกำลังคน</h3>
                <p>ตำแหน่ง: <strong>{pendingConfirmationForm.jobTitle}</strong> ({pendingConfirmationForm.headcountRequired} อัตรา)</p>
                <p>ผู้ยื่น: {pendingConfirmationForm.requesterName} ({pendingConfirmationForm.department})</p>
                <div className="flex justify-end gap-2 pt-2 border-t">
                  <button onClick={() => setShowConfirmModal(false)} className="px-4 py-2 rounded-xl bg-slate-100">ย้อนกลับ</button>
                  <button onClick={handleConfirmFinalSubmit} className="px-5 py-2 rounded-xl bg-emerald-600 text-white font-bold">ยืนยันส่งคำขอ</button>
                </div>
              </div>
            </div>
          )}

          {toastMessage && (
            <div className="fixed bottom-6 right-6 z-50 px-4 py-3 rounded-2xl bg-slate-900 text-white dark:bg-white dark:text-slate-900 shadow-2xl text-xs font-semibold flex items-center gap-2 animate-bounce">
              <Icon name="checkCircle" className="w-4 h-4 text-emerald-400" />
              <span>{toastMessage}</span>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
